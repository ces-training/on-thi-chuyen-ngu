<title>Chuyên Anh 14 Ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Mali:wght@600;700&family=Patrick+Hand&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/*__BRAND_CSS__*/
/* Trang học sinh: thanh xanh dính trên cùng mang các tab; dưới là một cột bài làm; 14 ô buổi học là điểm nhấn duy nhất. */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:1.4rem;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.brand span{font-size:.84rem;color:var(--bar-ink-2)}
.hello{font-size:.9rem;color:var(--bar-ink-2);text-align:right}
.hello strong{color:var(--bar-ink)}
.hq .sync,.hq .sync.ok{color:var(--bar-ink-2)}.hq .sync.bad{color:var(--gold)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-inline:-6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:8px 11px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--bar-ink-2);cursor:pointer;white-space:nowrap;min-height:40px}
nav.tabs button svg{width:18px;height:18px;flex:none}
nav.tabs button:hover{color:var(--bar-ink);background:rgba(255,255,255,.12)}
nav.tabs button[aria-selected="true"]{background:var(--bar-on);color:var(--bar-on-ink);font-weight:700}
nav.tabs button:focus-visible{outline-color:var(--gold)}
@media (max-width:600px){.topbar{padding-block:8px 6px;gap:10px}.brand span{display:none}.brand b{font-size:1.15rem;white-space:nowrap}.hq .sync{display:none}.logo svg{width:36px;height:36px}.hello{font-size:.82rem}nav.tabs{padding-bottom:8px}nav.tabs button{padding:7px 10px;min-height:38px;font-size:.88rem}}
main{padding-block:24px 72px}
#dayBody{display:flex;flex-direction:column;gap:20px}
section.view{display:flex;flex-direction:column;gap:20px}
.lead{font-size:1.05rem;color:var(--ink-2);max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.86rem;font-weight:700;color:var(--agent)}
.steps{display:grid;gap:14px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#151521;border:2px solid #151521;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
input[type=text],input[type=password],textarea{width:100%;border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--r-ctl);padding:10px 12px;min-height:44px}
input[type=text]:focus,textarea:focus{border-color:var(--agent);outline:none;box-shadow:0 0 0 3px var(--agent-tint)}
textarea{min-height:110px;font-family:var(--f-mono);font-size:.82rem}
/* hồ sơ ở trang đầu */
.spiral-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:20px}
.spiral-wrap svg{width:240px;max-width:100%;height:auto;flex:none;margin-inline:auto}
.spiral-legend{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 280px}
.spiral-legend h2{font-size:2rem}
/* câu hỏi */
.q{border-top:2px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:0;padding-top:0}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qnum{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--agent-tint);color:var(--agent);font-family:var(--f-mono);font-size:.82rem;font-weight:700}
.qtext{font-weight:500;font-size:1.04rem;white-space:pre-wrap}
.opts{display:grid;gap:8px;counter-reset:opt}
.opt{counter-increment:opt;position:relative;display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;background:var(--surface);min-height:48px;transition:border-color .12s,background-color .12s}
.opt::before{content:counter(opt,upper-alpha);flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);font-weight:700;font-size:.85rem;color:var(--ink-2)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt:hover{border-color:var(--agent)}
.opt:has(input:focus-visible){outline:3px solid var(--agent);outline-offset:2px}
.opt.sel{border-color:var(--agent);background:var(--agent-tint)}
.opt.sel::before{background:var(--agent);border-color:var(--agent);color:var(--on-agent)}
.opt.right{border-color:var(--good-edge);background:var(--good-bg)}
.opt.right::before{content:"✓";background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong::before{content:"✗";background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:has(input:disabled){cursor:default}
.fb{font-size:.92rem;border-radius:10px;padding:10px 14px;border-left:5px solid currentColor}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.good::before{content:"✓ ";font-weight:800}.fb.bad::before{content:"✗ ";font-weight:800}
.fb .ex{color:var(--ink);display:block;margin-top:2px}
.passage{background:var(--surface2);border-left:5px solid var(--agent);border-radius:10px;padding:14px 16px;white-space:pre-wrap;max-width:68ch;line-height:1.7}
.tagline{font-size:.78rem;color:var(--ink-2)}
.review-mark{background:var(--signal-tint);color:var(--signal-text);border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:700}
/* 14 ô buổi học: điểm nhấn của trang */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 8px;padding-bottom:4px}
.day{position:relative;border:2px solid var(--t-none-edge);border-radius:12px;padding:9px 6px 7px;background:var(--t-none);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;
  box-shadow:0 4px 0 var(--t-none-edge);transition:transform .12s ease-out,box-shadow .12s ease-out}
.day b{font-family:var(--f-display);font-size:1.45rem;font-weight:800;line-height:1}
.day small{font-size:.68rem;color:var(--ink-2);text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.day:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--t-none-edge)}
.day.part{background:var(--t-part);border-color:var(--t-part-edge);box-shadow:0 4px 0 var(--t-part-edge)}
.day.done{background:var(--t-done);border-color:var(--t-done-edge);box-shadow:0 4px 0 var(--t-done-edge)}
.day.done::after{content:"✓";position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--surface);font-size:.72rem;font-weight:800;display:grid;place-items:center}
.day.review::before{content:"★";position:absolute;top:-9px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#151521;border:1.5px solid #151521;font-size:.7rem;display:grid;place-items:center}
.day[aria-pressed="true"]{outline:3px solid var(--agent);outline-offset:3px;transform:translateY(-2px)}
@media (max-width:520px){.days{gap:10px 5px}.day{padding:7px 2px 5px}.day b{font-size:1.2rem}.day small{display:none}}
/* chữa bài giấy */
.key-section{display:flex;flex-direction:column;gap:6px}
.key-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.key-item input{width:22px;height:22px;accent-color:var(--good-edge);margin-top:2px}
.key-ans{font-weight:700;color:var(--good)}
/* tiến bộ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--ink-2)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.bar .fill{height:100%;background:var(--agent);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
td,th{white-space:nowrap}
/* đồng bộ, tin nhắn, chấm ảnh */
.sync{display:inline-block;margin-left:10px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.sync.ok{color:var(--good)}.sync.bad{color:var(--bad)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:2px;border-radius:999px;background:var(--signal);color:#151521;font-size:.74rem;font-weight:800;line-height:20px;text-align:center}
.hi-card{border-color:var(--gold-deep);background:var(--gold-tint)}
.up-box h3{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
.ai-res{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ai-res h4{margin:6px 0 0;font-size:1rem;font-family:var(--f-display)}
.ai-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ai-item{border-left:5px solid var(--line-strong);padding:8px 12px;background:var(--surface2);border-radius:8px}
.ai-item.bad{border-left-color:var(--bad)}.ai-item.unk{border-left-color:var(--t-part-edge)}.ai-item.ok{border-left-color:var(--good-edge)}
.linkbtn{background:none;border:0;padding:0;margin-top:4px;color:var(--agent);font:inherit;font-size:.86rem;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.thread{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.msg{max-width:85%;padding:9px 13px;border-radius:14px;background:var(--surface2)}
.msg.from-s{align-self:flex-end;background:var(--agent-tint);border-bottom-right-radius:4px}
.msg.from-t{align-self:flex-start;background:var(--gold-tint);color:var(--gold-ink);border-bottom-left-radius:4px}
.t-note{background:var(--gold-tint);color:var(--gold-ink);border-radius:10px;padding:10px 14px}
.up-row{border-top:2px dashed var(--line);padding:10px 0}.up-row summary{cursor:pointer}
.selfkey{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}.selfkey summary{cursor:pointer;font-weight:700}
textarea{width:100%;font:inherit;padding:10px 12px;color:var(--ink)}
/* chọn trường */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:8px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
.fld input,.fld select{font:inherit;font-weight:500;padding:9px 11px;min-height:44px;border:2px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--agent);box-shadow:0 0 0 3px var(--agent-tint)}
.fld input::placeholder{color:var(--ink-2);opacity:1}
.fld .hint{font-weight:400;font-size:.8rem;color:var(--ink-2)}
.fld .hint.sug{color:var(--gold-ink);background:var(--gold-tint);border-radius:6px;padding:2px 6px}
.langs{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:10px}
.langs p{flex-basis:100%;margin:0}
.chk{display:inline-flex;gap:6px;align-items:center;font-weight:600;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--agent)}
.slist{display:grid;gap:0;margin:6px 0 10px}
.srow{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:14px 0;border-top:2px dashed var(--line);align-items:start}
.srow:first-child{border-top:0}
.srow .sp{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.srow .pc{font-family:var(--f-display);font-size:1.5rem;font-weight:800;line-height:1}
.sfacts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px;font-size:.88rem;color:var(--ink-2)}
.sfacts b{color:var(--ink);font-family:var(--f-mono)}
@media (max-width:520px){.srow{grid-template-columns:1fr;gap:6px}.srow .sp{flex-direction:row;align-items:center;gap:10px}}
/* lộ trình */
.sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.slider{display:flex;flex-direction:column;gap:4px}
.slider label{display:flex;justify-content:space-between;font-weight:600}
.slider label output{font-family:var(--f-mono);font-weight:700;color:var(--agent)}
input[type=range]{width:100%;accent-color:var(--agent);min-height:32px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
.verdict{border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line);background:var(--surface)}
.verdict.good{border-color:var(--good-edge);background:var(--good-bg)}
.verdict.warn{border-color:var(--t-part-edge);background:var(--warn-bg)}
.verdict.bad{border-color:var(--bad);background:var(--bad-bg)}
.verdict h3{font-size:1.5rem}
.verdict ul{margin:0;padding-left:20px;display:grid;gap:4px}
.cando{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.cando li{display:grid;grid-template-columns:24px 1fr;gap:8px}
.cando li::before{content:"○";color:var(--ink-2);font-weight:700}
.cando li.ok::before{content:"✓";color:var(--good);font-weight:800}
.code{font-family:var(--f-mono);font-size:.78rem;word-break:break-all;background:var(--surface2);padding:12px;border-radius:10px;max-height:160px;overflow:auto}
details>summary{cursor:pointer;font-weight:700}
.sticky-submit{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:2px solid var(--line);padding:12px 0 8px;margin-top:4px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
.dayhead{display:flex;gap:16px;align-items:center}
.dayhead .dh-t{flex:1;min-width:0}
.dh-ic{width:80px;height:80px;flex:none;filter:drop-shadow(0 4px 0 rgba(21,21,33,.12))}
.day .di{width:34px;height:34px;margin-bottom:2px}
.ih{display:flex;align-items:center;gap:10px}.ih img{width:36px;height:36px;flex:none}
.score{display:flex;align-items:center;gap:10px;font-size:1.05rem}.score img{width:40px;height:40px}
.stat .si{width:40px;height:40px;margin-bottom:6px}
.card.next{flex-direction:row;align-items:center;gap:20px;border-color:var(--agent);background:linear-gradient(135deg,var(--agent-tint),var(--surface) 70%)}
.next-ic img{width:96px;height:96px;display:block;filter:drop-shadow(0 6px 0 rgba(21,21,33,.12))}
@media (prefers-reduced-motion:no-preference){.next-ic img{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}}
.next-t{display:flex;flex-direction:column;gap:6px;min-width:0}
/* hình minh hoạ đầu mỗi tab */
#main[data-v] .view>div:first-child:not([class]){position:relative;padding-right:100px;min-height:84px}
#main[data-v] .view>div:first-child:not([class])::after{content:"";position:absolute;right:0;top:0;width:84px;height:84px;background:var(--ic) center/contain no-repeat;filter:drop-shadow(0 5px 0 rgba(21,21,33,.12))}
#main[data-v="diag"]{--ic:url(../assets/emoji/bullseye.webp)}
#main[data-v="progress"]{--ic:url(../assets/emoji/chart-increasing.webp)}
#main[data-v="plan"]{--ic:url(../assets/emoji/world-map.webp)}
#main[data-v="school"]{--ic:url(../assets/emoji/classical-building.webp)}
#main[data-v="share"]{--ic:url(../assets/emoji/woman-teacher.webp)}
@media (max-width:520px){.day .di{width:24px;height:24px}.dh-ic{width:60px;height:60px}.card.next{gap:14px}.next-ic img{width:64px;height:64px}
  #main[data-v] .view>div:first-child:not([class]){padding-right:72px}#main[data-v] .view>div:first-child:not([class])::after{width:60px;height:60px}}
/* ===== video ===== */
.yt{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;max-width:720px}
.yt-btn{all:unset;cursor:pointer;display:block;width:100%;height:100%;position:relative}
.yt-btn img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.yt-play{position:absolute;inset:0;margin:auto;width:76px;height:54px;border-radius:14px;background:#e62117;color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 4px 0 #9b120c}
.yt-btn:hover .yt-play{transform:scale(1.06)}.yt-btn:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.yt iframe{width:100%;height:100%;border:0;display:block}
.gsum ul{margin:6px 0;padding-left:20px}.gsum li{margin:3px 0}
/* ===== game ===== */
.g-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.g-tab{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--line);min-height:56px}
.g-tab img{width:30px;height:30px;flex:none}.g-tab .g-tt{display:flex;flex-direction:column;min-width:0;flex:1}.g-tab small{color:var(--ink-2);font-size:.76rem;line-height:1.25}
.g-tab[aria-selected="true"]{border-color:var(--agent);background:var(--agent-tint);box-shadow:0 3px 0 var(--agent-deep)}
.g-stars{white-space:nowrap;font-size:.95rem;letter-spacing:1px}.g-stars b{color:var(--line-strong)}.g-stars b.on{color:var(--gold);text-shadow:0 1px 0 var(--gold-deep)}
.g-box{border:2px solid var(--agent);border-radius:16px;background:linear-gradient(180deg,var(--agent-tint),var(--surface) 140px);padding:14px;min-height:320px;display:flex;flex-direction:column;gap:8px}
.g-head{display:flex;align-items:center;gap:10px}.g-name{font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--agent)}
.g-meta{margin-left:auto;font-family:var(--f-mono);font-size:.85rem;font-weight:700;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 10px}
.g-mute{border:0;background:none;font-size:1.1rem;cursor:pointer;min-width:36px;min-height:36px}
.g-stage{flex:1;display:flex;flex-direction:column;justify-content:center}
.g-prog{font-size:.82rem;font-weight:700;color:var(--ink-2);text-align:center;margin-bottom:6px}
.g-q{font-size:1.15rem;font-weight:600;text-align:center;margin:6px 0 12px;white-space:pre-wrap}
.g-bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:6px}.g-bar i{display:block;height:100%;background:var(--signal);transition:width .25s linear}
.g-fb{text-align:center;min-height:1.5em;margin-top:8px}
.g-match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g-col{display:flex;flex-direction:column;gap:8px}
.g-tile,.g-opt,.g-bin,.g-let,.g-word,.g-card,.g-yes,.g-no,.x-line{font:inherit;color:var(--ink);cursor:pointer;border:2px solid var(--line-strong);background:var(--surface);border-radius:12px;box-shadow:0 3px 0 var(--line-strong);transition:transform .1s,background-color .15s,border-color .15s}
.g-tile{padding:10px 12px;min-height:48px;text-align:left;font-weight:600;font-size:.95rem}
.g-tile.alt{font-weight:500;font-size:.9rem}
.g-tile.sel,.g-word:hover,.g-opt:hover,.g-bin:hover{border-color:var(--agent);background:var(--agent-tint)}

<script>
(function(){
"use strict";
const C = JSON.parse(document.getElementById('content').textContent);
const DAYS = C.days; // array indexed 0..13
const TESTS = {diag:C.tests.diagnostic, final:C.tests.final};
const KEY = 'chuyenAnh14_v1';
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* giải thích có đánh dấu: ==dấu hiệu== → nền vàng, **đáp án/quy tắc** → in đậm, __mẹo__ → gạch chân */
function fmtVi(t){return esc(t).replace(/==([^=]+?)==/g,'<mark class="ev">$1</mark>').replace(/\*\*([^*]+?)\*\*/g,'<b>$1</b>').replace(/__([^_]+?)__/g,'<u class="tip">$1</u>')}

/* ---------- state ---------- */
function blank(){return {name:'',code:'',student:null,diag:null,final:null,days:{},queue:{},mastered:{},plan:{min:40,dpw:6},created:Date.now()}}
let S = blank();
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(blank(),JSON.parse(raw));}}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.savedAt=Date.now();saveLocal();scheduleSync()}

/* ---------- item index ---------- */
const ITEM = {};
/* hình 3D (Microsoft Fluent Emoji, giấy phép MIT) */
const IMG='../assets/emoji/';
const DAY_ICON=['school','video-game','seedling','laptop','red-apple','airplane','glowing-star','newspaper','steaming-bowl','briefcase','handshake','microscope','performing-arts','trophy'];
const em=(n,c='',sz=36)=>`<img src="${IMG}${n}.webp" alt="" class="${c}" width="${sz}" height="${sz}" loading="lazy" decoding="async">`;
const dayIcon=(d,c,sz)=>em(DAY_ICON[d-1]||'books',c,sz);
DAYS.forEach(d=>(d.web_check||[]).forEach(it=>{ITEM[it.id]=Object.assign({day:d.day},it)}));

/* ---------- levels & hours model ----------
   Cumulative guided learning hours (Cambridge English approximations):
   A2 ≈ 180–200h, B1 ≈ 350–400h, B2 ≈ 500–600h, C1 ≈ 700–800h. */
const LEVELS=[
  {k:'preA2',name:'Dưới A2',h:0},{k:'A2',name:'A2',h:190},{k:'A2+',name:'A2+',h:280},
  {k:'B1',name:'B1',h:375},{k:'B1+',name:'B1+',h:460},{k:'B2',name:'B2',h:550},
  {k:'B2+',name:'B2+',h:650},{k:'C1',name:'C1',h:750}];
const ENTRY_H={'preA2':140,'A2':220,'A2+':300,'B1':400,'B1+':490,'B2':580};
function levelOfHours(h){let L=LEVELS[0];for(const l of LEVELS){if(h>=l.h)L=l}return L}
/* ----- mức học theo bài đầu vào ----- */
const TRACKS={nen:{name:'Nền tảng',desc:'game chậm hơn, có gợi ý; bài dạng đề mức A2; bài giấy kèm trang gợi ý'},chuan:{name:'Chuẩn',desc:'nội dung A2+–B1 như thiết kế gốc'},nang:{name:'Nâng cao',desc:'game nhanh hơn, ít gợi ý; bài dạng đề mức B1+–B2; bài giấy thêm phần thử thách H'}};
function trackFromLevel(l){if(!l)return 'chuan';if(l==='preA2'||l==='A2')return 'nen';if(l==='A2+'||l==='B1')return 'chuan';return 'nang'}
function curTrack(){return S.track||trackFromLevel(S.diag&&S.diag.level)}
function examFor(n){const W=(C.web&&C.web[n])||{};const t=curTrack();return (t==='nen'&&W.exam_easy&&W.exam_easy.length?W.exam_easy:t==='nang'&&W.exam_plus&&W.exam_plus.length?W.exam_plus:W.exam)||[]}
function trackBar(){const t=curTrack();const L=S.diag&&LEVELS.find(l=>l.k===S.diag.level);
  return `<div class="trackbar"><span>Mức của em: <b>${TRACKS[t].name}</b>${S.track?' (em tự chọn)':L?' (theo bài đầu vào: '+esc(L.name)+')':' (chưa làm bài đầu vào)'}</span><label class="small">Đổi mức <select id="trackSel">${Object.entries(TRACKS).map(([k,v])=>`<option value="${k}" ${k===t?'selected':''}>${v.name}</option>`).join('')}</select></label><span class="small muted">${esc(TRACKS[t].desc)}</span></div>`}
function wireTrack(after){const sel=$('#trackSel');if(sel)sel.onchange=()=>{const v=sel.value;S.track=v===trackFromLevel(S.diag&&S.diag.level)?null:v;save();after()}}
function levelFromBands(a,b,c){
  if(a<5) return 'preA2';
  if(b<4) return 'A2';
  if(b<7) return 'A2+';
  if(c<4) return 'B1';
  if(c<7) return 'B1+';
  return 'B2';
}
const MILESTONES=[
  {date:new Date(2027,4,31),label:'Hết lớp 7',target:'B1',h:375},
  {date:new Date(2028,4,31),label:'Hết lớp 8',target:'B2',h:550},
  {date:new Date(2029,5,1),label:'Thi vào 10',target:'C1',h:750}];
const STUDY_FACTOR=0.85; // nghỉ lễ, ôn thi học kỳ, ốm…
const CONV=0.6; // 1 giờ tự học/học thêm ≈ 0,6 giờ học chuẩn có hướng dẫn (ước tính thận trọng)
function weeksUntil(d){return Math.max(0,(d-Date.now())/(7*864e5))}

/* ---------- grading ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,;:]+$/,'').replace(/\s+/g,' ').trim()}
function isCorrect(it,val){
  if(it.type==='mcq') return Number(val)===Number(it.answer);
  if(val==null||String(val).trim()==='') return false;
  const v=norm(val); const ok=[it.answer].concat(it.accept||[]).map(norm);
  return ok.includes(v);
}
function answerText(it){return it.type==='mcq'?it.options[it.answer]:it.answer}

/* ---------- question rendering ---------- */
function renderQ(it,idx,opts={}){
  const name='q_'+it.id;
  const head=`<div class="qhead"><span class="qnum">${idx}</span>${opts.review?'<span class="review-mark">Ôn lại câu em từng sai</span>':''}${it.from_day&&!opts.review?`<span class="review-mark">Ôn xoắn ốc · buổi ${it.from_day}</span>`:''}</div>`;
  let body='';
  if(it.type==='mcq'){
    body='<div class="opts">'+it.options.map((o,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="${name}" value="${i}"><span>${esc(o)}</span></label>`).join('')+'</div>';
  }else{
    body=`<input type="text" name="${name}" id="${name}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời">`;
  }
  return `<div class="q" data-id="${it.id}">${head}<div class="qtext">${esc(it.q)}</div>${body}<div class="fbslot"></div></div>`;
}
function readAnswer(form,it){
  const name='q_'+it.id;
  if(it.type==='mcq'){const r=form.querySelector(`input[name="${name}"]:checked`);return r?r.value:null}
  const t=form.querySelector(`input[name="${name}"]`);return t?t.value:null;
}
function showFeedback(form,it,val){
  const q=form.querySelector(`.q[data-id="${it.id}"]`); if(!q)return;
  const ok=isCorrect(it,val);
  if(it.type==='mcq'){

/* ---------- spiral SVG ---------- */
function spiralSVG(size=240){
  const cx=size/2,cy=size/2; const pts=[];
  for(let i=0;i<14;i++){const t=0.9+i*0.86; const r=16+t*8; pts.push([cx+r*Math.cos(t-1.6),cy+r*Math.sin(t-1.6)])}
  let path='';for(let s=0;s<=400;s++){const t=0.9+s*(13*0.86)/400;const r=16+t*8;path+=(s?'L':'M')+(cx+r*Math.cos(t-1.6)).toFixed(1)+' '+(cy+r*Math.sin(t-1.6)).toFixed(1)}
  const dots=pts.map((p,i)=>{
    const st=dayStatus(i+1); const rev=DAYS[i].type==='review';
    const fill=st==='done'?'var(--t-done)':st==='part'?'var(--t-part)':'var(--surface)';
    const stroke=st==='done'?'var(--t-done-edge)':st==='part'?'var(--t-part-edge)':'var(--t-none-edge)';
    const txt='var(--ink)';
    return `<g><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${rev?12:10}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" ${rev?'stroke-dasharray="3 2"':''}/><text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="${txt}" font-family="Bricolage Grotesque, Plus Jakarta Sans, sans-serif">${i+1}</text></g>`}).join('');
  return `<svg viewBox="-12 -12 ${size+24} ${size+24}" role="img" aria-label="Vòng xoắn 14 buổi học"><path d="${path}" fill="none" stroke="var(--agent-tint)" stroke-width="8" stroke-linecap="round"/>${dots}</svg>`;
}

function testScore(test,ans){
  const bands={A2:[0,0],B1:[0,0],B2:[0,0]};const skills={};
  test.items.forEach(it=>{const ok=isCorrect(it,ans[it.id]);bands[it.level][1]++;if(ok)bands[it.level][0]++;
    skills[it.skill]=skills[it.skill]||[0,0];skills[it.skill][1]++;if(ok)skills[it.skill][0]++});
  const total=Object.values(bands).reduce((a,b)=>a+b[0],0);
  const lv=levelFromBands(bands.A2[0],bands.B1[0],bands.B2[0]);
  return {bands,skills,total,of:test.items.length,level:lv,hours:ENTRY_H[lv],at:Date.now()};
}

  const test=TESTS[kind]; const done=S[kind];

function pill(x,label){return x?`<span class="pill good">✓ ${label}</span>`:`<span class="pill">${label}: chưa làm</span>`}
function updateQueue(it,ok,day,isReview){
  const id=it.id;const qd=S.queue[id];
  const gaps=[1,3,6];
  if(qd){ if(ok){qd.stage++; if(qd.stage>=3){delete S.queue[id];S.mastered[id]=day}else qd.due=day+gaps[qd.stage]} else {qd.stage=0;qd.due=day+1;qd.wrong=(qd.wrong||0)+1} }
  else if(!ok){S.queue[id]={stage:0,due:day+1,wrong:1}}
  S.stats=S.stats||{retry:[0,0],spiral:[0,0]};
  if(isReview){S.stats.retry[1]++;if(ok)S.stats.retry[0]++}
  if(it.skill==='review'||it.from_day){S.stats.spiral[1]++;if(ok)S.stats.spiral[0]++}
}

/* ----- aggregate ----- */
function agg(){
  const done=[],web=[0,0],paper=[0,0],skills={};const dates=[];
  for(let i=1;i<=14;i++){const r=S.days[i];if(!r)continue;
    if(r.web){web[0]+=r.web.correct;web[1]+=r.web.total;dates.push(r.web.at);Object.entries(r.web.bySkill||{}).forEach(([k,v])=>{skills[k]=skills[k]||[0,0];skills[k][0]+=v[0];skills[k][1]+=v[1]})}
    if(r.paper){paper[0]+=r.paper.correct;paper[1]+=r.paper.total;if(!r.web)dates.push(r.paper.at)}
    if(dayStatus(i)==='done')done.push(i)}
  dates.sort();
  const span=dates.length>1?Math.max(1,Math.round((dates[dates.length-1]-dates[0])/864e5)+1):dates.length;
  const studyDays=new Set(dates.map(t=>new Date(t).toDateString())).size;
  const st=S.stats||{retry:[0,0],spiral:[0,0]};
  return {done,web,paper,skills,span,studyDays,retry:st.retry,spiral:st.spiral,queue:Object.keys(S.queue).length,mastered:Object.keys(S.mastered).length};
}

/* ----- plan & feasibility ----- */
function efficiency(A){
  if(A.done.length<3)return {f:1,from:false};
  const acc=pct(A.web)||0.6;const ret=pct(A.retry)!=null&&A.retry[1]>=3?pct(A.retry):acc;
  const comp=Math.min(1,A.studyDays/Math.max(1,Math.min(14,A.span)));
  let f=0.55+0.45*acc+0.15*ret+0.1*comp;f=Math.max(0.7,Math.min(1.25,f));
  return {f:Math.round(f*100)/100,from:true,acc,ret,comp};
}
function project(entryH,hpw,eff,date){return entryH+hpw*eff*CONV*weeksUntil(date)*STUDY_FACTOR}
function requiredMin(entryH,targetH,eff,date,dpw){const w=weeksUntil(date)*STUDY_FACTOR;if(w<=0)return Infinity;const hpw=(targetH-entryH)/(eff*CONV*w);return Math.max(0,hpw*60/dpw)}
function chartSVG(entryH,hpw,eff){
  const W=720,H=300,pl=58,pr=16,pt=18,pb=40;const t0=Date.now(),t1=MILESTONES[2].date.getTime()+30*864e5;
  const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr);const hMax=850,hMin=0;const Y=h=>pt+(1-(Math.min(h,hMax)-hMin)/(hMax-hMin))*(H-pt-pb);
  const bands=[['Dưới A2',0,190],['A2',190,375],['B1',375,550],['B2',550,750],['C1',750,850]];
  let g='';
  bands.forEach((b,i)=>{g+=`<rect x="${pl}" y="${Y(b[2])}" width="${W-pl-pr}" height="${Y(b[1])-Y(b[2])}" fill="${i%2?'var(--surface2)':'var(--surface)'}"/><text x="${pl-8}" y="${(Y(b[1])+Y(b[2]))/2+4}" text-anchor="end" font-size="12" font-weight="600" fill="var(--muted)">${b[0]}</text>`});
  MILESTONES.forEach(m=>{const x=X(m.date.getTime());g+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${x}" y="${H-pb+16}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${m.label}</text><text x="${x}" y="${H-pb+30}" text-anchor="middle" font-size="11" fill="var(--muted)">${String(m.date.getMonth()+1).padStart(2,'0')}/${m.date.getFullYear()}</text><circle cx="${x}" cy="${Y(m.h)}" r="6" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="${x-9}" y="${Y(m.h)-9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">cần ${m.target}</text>`});
  let d='';const N=60;for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N;const h=entryH+hpw*eff*CONV*((t-t0)/(7*864e5))*STUDY_FACTOR;d+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(h).toFixed(1)}
  g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/><circle cx="${X(t0)}" cy="${Y(entryH)}" r="5" fill="var(--accent)"/><text x="${X(t0)+8}" y="${Y(entryH)-8}" font-size="11.5" font-weight="700" fill="var(--accent)">Bây giờ</text>`;
  MILESTONES.forEach(m=>{const h=project(entryH,hpw,eff,m.date);const ok=h>=m.h;g+=`<circle cx="${X(m.date.getTime())}" cy="${Y(h)}" r="5.5" fill="${ok?'var(--good)':'var(--bad)'}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dự báo trình độ theo thời gian">${g}</svg>`;
}
function verdict(entryH,eff,A){
  const dpw=S.plan.dpw, min=S.plan.min;
  const req=requiredMin(entryH,750,eff.f,MILESTONES[2].date,dpw);

  const need=Math.ceil(Math.max(req,req8)/5)*5;
  const notes=[];
  if(A.done.length>=7){
    const acc=pct(A.web);notes.push(`Trong ${A.done.length} buổi đã học, em đúng ${Math.round(acc*100)}% câu kiểm tra web${acc>=0.75?': nền tiếp thu tốt.':acc>=0.55?': ổn, cần ôn kỹ hơn phần sai.':': còn hổng nhiều, nên học chậm và chắc hơn.'}`);
    if(A.retry[1]>=3)notes.push(`Câu từng sai làm lại đúng ${Math.round(100*pct(A.retry))}%: ${pct(A.retry)>=0.6?'trí nhớ dài hạn đang hoạt động tốt.':'cần ôn đều hơn, đừng dồn bài.'}`);
    notes.push(`Em học ${A.studyDays} ngày trong ${A.span} ngày: ${A.studyDays/Math.max(1,A.span)>=0.8?'giữ nhịp rất tốt.':'nhịp học còn ngắt quãng, đây là yếu tố quan trọng nhất cần sửa.'}`);
  }
  let cls,head,msg;
  if(need<=45){cls='good';head='Khả thi';msg=`Với điểm xuất phát hiện tại, em cần khoảng ${need} phút/ngày, ${dpw} ngày/tuần để đạt B2 cuối lớp 8 và C1 trước kỳ thi. Mức này vừa sức nếu em giữ đều.`}
  else if(need<=80){cls='warn';head='Khả thi nếu tăng và giữ nhịp học';msg=`Em cần khoảng ${need} phút/ngày, ${dpw} ngày/tuần trong suốt lớp 7–9. Đây là mức nhiều học sinh đỗ chuyên Anh đã làm, nhưng đòi hỏi kỷ luật và lịch học cố định.`}
  else{cls='bad';head='Thử thách lớn với lịch học hiện tại';msg=`Để kịp mốc thi, em cần hơn ${need} phút/ngày. Con đường vẫn mở, nhưng nên đặt mốc đánh giá lại sau 3 tháng: nếu lên được một bậc, tiếp tục theo chuyên Anh; nếu chưa, cân nhắc giữ tiếng Anh mạnh để thi lớp chọn hoặc chuyên khác.`}
  if(min<need&&cls!=='bad')notes.push(`Lịch em đang chọn (${min} phút × ${dpw} ngày) thấp hơn mức cần (${need} phút). Kéo thanh trượt lên để xem đường dự báo thay đổi.`);
  return {cls,head,msg,notes,need};
}

async function pack(obj){
  const json=JSON.stringify(obj);
  try{ if(typeof CompressionStream!=='undefined'){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let s='';buf.forEach(b=>s+=String.fromCharCode(b));return 'Z'+btoa(s)} }catch(e){}
  return 'J'+btoa(unescape(encodeURIComponent(json)));
}
async function unpack(code){
  code=code.trim().replace(/\s+/g,'');const t=code[0],b=code.slice(1);
  if(t==='Z'){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(ds).text())}
  if(t==='J')return JSON.parse(decodeURIComponent(escape(atob(b))));
  throw new Error('bad');
}
function summary(){
  const A=agg();const eff=efficiency(A);const entry=S.diag;
  const days={};for(let i=1;i<=14;i++){const r=S.days[i];if(r){const g=Object.values(r.games||{}),x=Object.values(r.exam||{});days[i]=[r.web?r.web.correct:null,r.web?r.web.total:null,r.paper?r.paper.correct:null,r.paper?r.paper.total:null,r.web?r.web.at:(r.paper?r.paper.at:(g.length?Math.max(...g.map(y=>y.at)):null)),g.reduce((t,y)=>t+(y.stars||0),0),g.length,x.length?x.reduce((t,y)=>t+y.correct,0):null,x.length?x.reduce((t,y)=>t+y.total,0):null,...(()=>{const l=Object.values(r.listen||{});return l.length?[l.reduce((t,y)=>t+y.correct,0),l.reduce((t,y)=>t+y.total,0)]:[null,null]})()]}}
  const wrong=Object.entries(S.queue).map(([id,q])=>[id,q.wrong||1]);
  return {v:1,n:S.name,d:S.diag&&{t:S.diag.total,o:S.diag.of,l:S.diag.level,b:S.diag.bands},f:S.final&&{t:S.final.total,o:S.final.of,l:S.final.level,b:S.final.bands},days,sk:A.skills,rt:A.retry,mq:A.mastered,q:wrong,p:S.plan,e:eff.f,sd:A.studyDays,sp:A.span,tr:curTrack(),at:Date.now()};
}
function vShare(){

  <div class="card"><div class="row"><button class="btn hi" id="mk">Tạo mã kết quả</button><button class="btn ghost" id="cp" disabled>Sao chép mã</button><span class="small muted" id="cpMsg"></span></div><div class="code" id="codeBox" hidden></div></div>
  <details class="card" id="teacher"><summary>Dành cho cô và bố mẹ: xem kết quả từ mã</summary>
   <p class="small muted">Dán mã em gửi vào ô dưới đây.</p><textarea id="codeIn" placeholder="Dán mã kết quả"></textarea><div class="row"><button class="btn" id="rd">Xem báo cáo</button><span class="small muted" id="rdMsg"></span></div><div id="report"></div></details>
  ${resetCardHTML()}
  </section>`;
  let code='';

  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#cpMsg').textContent='Đã sao chép.'}catch(e){const r=document.createRange();r.selectNodeContents($('#codeBox'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#cpMsg').textContent='Đã bôi đen mã, em bấm sao chép trên máy nhé.'}};
  $('#rd').onclick=async()=>{try{const o=await unpack($('#codeIn').value);$('#report').innerHTML=reportHTML(o);$('#rdMsg').textContent=''}catch(e){$('#rdMsg').textContent='Mã không đọc được. Kiểm tra em đã sao chép đủ mã chưa.'}};
  wireReset();
}
function resetCardHTML(){return `<div class="card"><h3>Làm lại từ đầu</h3><p class="small muted">Xóa toàn bộ kết quả trên máy này. Chỉ dùng khi đổi sang một học sinh khác.${cloudOn()?' Kết quả đã gửi cho cô vẫn được giữ.':''}</p><div class="row"><button class="btn ghost" id="rs1">Xóa kết quả</button><button class="btn" id="rs2" hidden>Chắc chắn xóa</button></div></div>`}
function wireReset(){$('#rs1').onclick=()=>{$('#rs2').hidden=false};$('#rs2').onclick=()=>{S=blank();saveLocal();go('start')}}
function reportHTML(o){
  const lv=k=>(LEVELS.find(l=>l.k===k)||{name:'—'}).name;
  const rows=Object.entries(o.days||{}).map(([d,r])=>`<tr><td>${d}</td><td>${esc(DAYS[d-1].theme_vi)}</td><td>${r[0]!=null?r[0]+'/'+r[1]:'—'}</td><td>${r[2]!=null?r[2]+'/'+r[3]:'—'}</td><td>${r[4]?new Date(r[4]).toLocaleDateString('vi-VN'):'—'}</td></tr>`).join('');
  const sk=Object.entries(o.sk||{}).map(([k,v])=>bar(SKILL_VI[k]||k,v[0],v[1])).join('');
  const weak=(o.q||[]).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,w])=>{const it=ITEM[id];return it?`<li>Buổi ${it.day} · ${esc(it.q)} <span class="muted">(sai ${w} lần, đáp án: ${esc(answerText(it))})</span></li>`:''}).join('');
  const entryH=o.d?ENTRY_H[o.d.l]:null;
  let need='';if(entryH){const r=requiredMin(entryH,750,o.e||1,MILESTONES[2].date,(o.p&&o.p.dpw)||6);need=`Ước tính cần khoảng ${Math.ceil(r/5)*5} phút/ngày × ${(o.p&&o.p.dpw)||6} ngày/tuần để đạt C1 trước kỳ thi.`}
  return `<div class="card" style="margin-top:12px"><h3>${esc(o.n||'Học sinh')}</h3>
   <p>Đầu vào: <b>${o.d?o.d.t+'/'+o.d.o+' · '+lv(o.d.l):'chưa làm'}</b> · Sau 2 tuần: <b>${o.f?o.f.t+'/'+o.f.o+' · '+lv(o.f.l):'chưa làm'}</b></p>
   <p class="small">Học ${o.sd||0} ngày trong ${o.sp||0} ngày · Câu từng sai làm lại đúng ${o.rt&&o.rt[1]?Math.round(100*o.rt[0]/o.rt[1])+'%':'—'} · Đã nhớ chắc ${o.mq||0} câu · Hệ số hiệu quả ${o.e||1} · Lịch đang chọn ${o.p?o.p.min+' phút × '+o.p.dpw+' ngày':'—'}</p>
   <p class="small">${need}</p>
   <div class="bars">${sk}</div>
   <div class="tbl-wrap"><table><thead><tr><th>Buổi</th><th>Chủ đề</th><th>Web</th><th>Giấy</th><th>Ngày</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Chưa có buổi nào.</td></tr>'}</tbody></table></div>
   ${weak?`<h3 style="font-size:1.05rem">Câu còn trong vòng ôn (sai nhiều nhất)</h3><ul class="small">${weak}</ul>`:''}
   <p class="small muted">Mã tạo lúc ${new Date(o.at).toLocaleString('vi-VN')}.</p></div>`;
}

go(S.diag?(dayStatus(1)==='none'?'start':'days'):'start');
