<style>
/* Layout: a study notebook — sticky header carrying the 14-day spiral, tabbed workspace below, one column on phones */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface2:#e9eff3; --ink:#11314a; --muted:#566c7e; --line:#d3dde5;
  --hi:#ffc83d; --hi-soft:#fff1c7; --hi-ink:#4a3500; --accent:#16618b; --accent-soft:#dcebf4;
  --good:#1b8556; --good-bg:#e1f3e9; --bad:#bf4129; --bad-bg:#fbe6e0; --warn:#a86b10; --warn-bg:#fcefd6;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a24; --surface:#152634; --surface2:#1c3142; --ink:#e4edf4; --muted:#9db0c0; --line:#2a4256;
  --hi:#ffcf55; --hi-soft:#3a3115; --hi-ink:#ffe7a6; --accent:#6fb6e0; --accent-soft:#1d3a50;
  --good:#5cc993; --good-bg:#16352a; --bad:#f08a72; --bad-bg:#3d1f19; --warn:#f0b65a; --warn-bg:#3a2c13;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a24; --surface:#152634; --surface2:#1c3142; --ink:#e4edf4; --muted:#9db0c0; --line:#2a4256;
  --hi:#ffcf55; --hi-soft:#3a3115; --hi-ink:#ffe7a6; --accent:#6fb6e0; --accent-soft:#1d3a50;
  --good:#5cc993; --good-bg:#16352a; --bad:#f08a72; --bad-bg:#3d1f19; --warn:#f0b65a; --warn-bg:#3a2c13;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.7rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;letter-spacing:.2px}
.brand span{font-size:.85rem;color:var(--muted)}
.hello{font-size:.9rem;color:var(--muted)}
.hello strong{color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
main{padding-block:24px 64px}
section.view{display:flex;flex-direction:column;gap:20px}
.lead{font-size:1.05rem;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface);text-decoration:none}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--ink)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.hi{background:var(--hi-soft);color:var(--hi-ink)}
.steps{display:grid;gap:12px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--hi);color:var(--hi-ink);font-family:var(--f-display);font-weight:800;font-size:1.1rem}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;font-family:var(--f-mono);font-size:.8rem}
/* spiral */
.spiral-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.spiral-wrap svg{width:220px;max-width:100%;height:auto;flex:none}
.spiral-legend{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
/* questions */
.q{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.q:first-child{border-top:0;padding-top:0}
.qhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.qtext{font-weight:500;white-space:pre-wrap}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:.9rem;border-radius:8px;padding:8px 12px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .ex{color:var(--ink);display:block;margin-top:2px}
.passage{background:var(--surface2);border-radius:10px;padding:14px 16px;white-space:pre-wrap;max-width:68ch}
.tagline{font-size:.78rem;color:var(--muted)}
.review-mark{background:var(--hi-soft);color:var(--hi-ink);border-radius:6px;padding:1px 8px;font-size:.75rem;font-weight:700}
/* days strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day b{font-family:var(--f-display);font-size:1.25rem;line-height:1}
.day small{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.day.done{background:var(--good-bg);border-color:var(--good)}
.day.part{background:var(--hi-soft);border-color:var(--hi)}
.day.review{border-style:dashed}
.day[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
@media (max-width:520px){.days{grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:6px 2px}.day small{display:none}}
/* paper key */
.key-section{display:flex;flex-direction:column;gap:6px}
.key-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.key-item input{width:20px;height:20px;accent-color:var(--good);margin-top:3px}
.key-ans{font-weight:700;color:var(--good)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.sync{display:inline-block;margin-left:10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.sync.ok{color:var(--good)}.sync.bad{color:var(--bad)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;line-height:18px;text-align:center}
.mono{font-family:var(--f-mono)}
.hi-card{border-color:var(--hi);background:var(--hi-soft)}
.up-box h3{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ai-res{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ai-res h4{margin:6px 0 0;font-size:1rem}
.ai-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ai-item{border-left:4px solid var(--line);padding:6px 10px;background:var(--surface2);border-radius:6px}
.ai-item.bad{border-left-color:var(--bad)}.ai-item.unk{border-left-color:var(--warn)}.ai-item.ok{border-left-color:var(--good)}
.linkbtn{background:none;border:0;padding:0;margin-top:4px;color:var(--accent);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:underline}
.thread{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--surface2)}
.msg.from-s{align-self:flex-end;background:var(--accent-soft)}
.msg.from-t{align-self:flex-start;background:var(--hi-soft);color:var(--hi-ink)}
.t-note{background:var(--hi-soft);color:var(--hi-ink);border-radius:10px;padding:8px 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.up-row{border-top:1px solid var(--line);padding:10px 0}.up-row summary{cursor:pointer}
.selfkey{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}.selfkey summary{cursor:pointer;font-weight:600}
textarea{width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:8px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
.fld input,.fld select{font:inherit;font-weight:500;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld input::placeholder{color:var(--muted);opacity:1}
.fld .hint{font-weight:400;font-size:.8rem;color:var(--muted)}
.fld .hint.sug{color:var(--hi-ink);background:var(--hi-soft);border-radius:6px;padding:2px 6px}
.langs{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:10px}
.langs p{flex-basis:100%;margin:0}
.chk{display:inline-flex;gap:6px;align-items:center;font-weight:600}
.slist{display:grid;gap:0;margin:6px 0 10px}
.srow{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.srow:first-child{border-top:0}
.srow .sp{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.srow .pc{font-family:var(--f-mono);font-size:1.15rem;font-weight:700}
.sfacts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px;font-size:.88rem;color:var(--muted)}
.sfacts b{color:var(--ink);font-family:var(--f-mono)}
@media (max-width:520px){.srow{grid-template-columns:1fr;gap:6px}.srow .sp{flex-direction:row;align-items:center;gap:10px}}

table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
/* simulator */
.sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.slider{display:flex;flex-direction:column;gap:4px}
.slider label{display:flex;justify-content:space-between;font-weight:600}
.slider label output{font-family:var(--f-mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
.verdict{border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.verdict.good{border-color:var(--good);background:var(--good-bg)}
.verdict.warn{border-color:var(--warn);background:var(--warn-bg)}
.verdict.bad{border-color:var(--bad);background:var(--bad-bg)}
.verdict h3{font-size:1.45rem}
.verdict ul{margin:0;padding-left:20px;display:grid;gap:4px}
.cando{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.cando li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.cando li::before{content:"○";color:var(--muted);font-weight:700}
.cando li.ok::before{content:"✓";color:var(--good)}
.code{font-family:var(--f-mono);font-size:.78rem;word-break:break-all;background:var(--surface2);padding:12px;border-radius:10px;max-height:160px;overflow:auto}
.notice{background:var(--hi-soft);color:var(--hi-ink);border-radius:10px;padding:12px 14px;font-size:.92rem}
details>summary{cursor:pointer;font-weight:700}
.sticky-submit{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);padding:12px 0;margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
</style>

<script id="content" type="application/json">__CONTENT__</script>
<script>
(function(){
"use strict";
const C = JSON.parse(document.getElementById('content').textContent);
const DAYS = C.days; // array indexed 0..13
const TESTS = {diag:C.tests.diagnostic, final:C.tests.final};
const KEY = 'chuyenAnh14_v1';
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
function blank(){return {name:'',code:'',student:null,diag:null,final:null,days:{},queue:{},mastered:{},plan:{min:40,dpw:6},created:Date.now()}}
let S = blank();
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(blank(),JSON.parse(raw));}}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.savedAt=Date.now();saveLocal();scheduleSync()}

/* ---------- item index ---------- */
const ITEM = {};
DAYS.forEach(d=>(d.web_check||[]).forEach(it=>{ITEM[it.id]=Object.assign({day:d.day},it)}));

/* ---------- levels & hours model ----------
   Cumulative guided learning hours (Cambridge English approximations):
   A2 ≈ 180–200h, B1 ≈ 350–400h, B2 ≈ 500–600h, C1 ≈ 700–800h. */
const LEVELS=[
  {k:'preA2',name:'Dưới A2',h:0},{k:'A2',name:'A2',h:190},{k:'A2+',name:'A2+',h:280},
  {k:'B1',name:'B1',h:375},{k:'B1+',name:'B1+',h:460},{k:'B2',name:'B2',h:550},
  {k:'B2+',name:'B2+',h:650},{k:'C1',name:'C1',h:750}];
const ENTRY_H={'preA2':140,'A2':220,'A2+':300,'B1':400,'B1+':490,'B2':580};
function levelOfHours(h){let L=LEVELS[0];for(const l of LEVELS){if(h>=l.h)L=l}return L}
function levelFromBands(a,b,c){
  if(a<5) return 'preA2';
  if(b<4) return 'A2';
  if(b<7) return 'A2+';
  if(c<4) return 'B1';
  if(c<7) return 'B1+';
  return 'B2';
}
const MILESTONES=[
  {date:new Date(2027,4,31),label:'Hết lớp 7',target:'B1',h:375},
  {date:new Date(2028,4,31),label:'Hết lớp 8',target:'B2',h:550},
  {date:new Date(2029,5,1),label:'Thi vào 10',target:'C1',h:750}];
const STUDY_FACTOR=0.85; // nghỉ lễ, ôn thi học kỳ, ốm…
const CONV=0.6; // 1 giờ tự học/học thêm ≈ 0,6 giờ học chuẩn có hướng dẫn (ước tính thận trọng)
function weeksUntil(d){return Math.max(0,(d-Date.now())/(7*864e5))}

/* ---------- grading ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,;:]+$/,'').replace(/\s+/g,' ').trim()}
function isCorrect(it,val){
  if(it.type==='mcq') return Number(val)===Number(it.answer);
  if(val==null||String(val).trim()==='') return false;
  const v=norm(val); const ok=[it.answer].concat(it.accept||[]).map(norm);
  return ok.includes(v);
}
function answerText(it){return it.type==='mcq'?it.options[it.answer]:it.answer}

/* ---------- question rendering ---------- */
function renderQ(it,idx,opts={}){
  const name='q_'+it.id;
  const head=`<div class="qhead"><span class="qnum">${idx}</span>${opts.review?'<span class="review-mark">Ôn lại câu em từng sai</span>':''}${it.from_day&&!opts.review?`<span class="review-mark">Ôn xoắn ốc · buổi ${it.from_day}</span>`:''}</div>`;
  let body='';
  if(it.type==='mcq'){
    body='<div class="opts">'+it.options.map((o,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="${name}" value="${i}"><span>${esc(o)}</span></label>`).join('')+'</div>';
  }else{
    body=`<input type="text" name="${name}" id="${name}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời">`;
  }
  return `<div class="q" data-id="${it.id}">${head}<div class="qtext">${esc(it.q)}</div>${body}<div class="fbslot"></div></div>`;
}
function readAnswer(form,it){
  const name='q_'+it.id;
  if(it.type==='mcq'){const r=form.querySelector(`input[name="${name}"]:checked`);return r?r.value:null}
  const t=form.querySelector(`input[name="${name}"]`);return t?t.value:null;
}
function showFeedback(form,it,val){
  const q=form.querySelector(`.q[data-id="${it.id}"]`); if(!q)return;
  const ok=isCorrect(it,val);
  if(it.type==='mcq'){
    q.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;o.classList.remove('sel');if(i===+it.answer)o.classList.add('right');else if(String(i)===String(val))o.classList.add('wrong')});
  }
  q.querySelectorAll('input').forEach(i=>i.disabled=true);

/* ---------- spiral SVG ---------- */
function spiralSVG(size=220){
  const cx=size/2,cy=size/2; const pts=[];
  for(let i=0;i<14;i++){const t=0.9+i*0.86; const r=14+t*11.5; pts.push([cx+r*Math.cos(t-1.6),cy+r*Math.sin(t-1.6)])}
  let path='';for(let s=0;s<=400;s++){const t=0.9+s*(13*0.86)/400;const r=14+t*11.5;path+=(s?'L':'M')+(cx+r*Math.cos(t-1.6)).toFixed(1)+' '+(cy+r*Math.sin(t-1.6)).toFixed(1)}
  const dots=pts.map((p,i)=>{
    const st=dayStatus(i+1); const rev=DAYS[i].type==='review';
    const fill=st==='done'?'var(--good)':st==='part'?'var(--hi)':'var(--surface)';
    const stroke=st==='done'?'var(--good)':st==='part'?'var(--warn)':'var(--muted)';
    const txt=st==='done'?'var(--surface)':'var(--ink)';
    return `<g><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${rev?12:10}" fill="${fill}" stroke="${stroke}" stroke-width="2" ${rev?'stroke-dasharray="3 2"':''}/><text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${txt}" font-family="Be Vietnam Pro, sans-serif">${i+1}</text></g>`}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Vòng xoắn 14 buổi học"><path d="${path}" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>${dots}</svg>`;
}
function dayStatus(n){const d=S.days[n];if(!d)return'none';if(d.web&&d.paper)return'done';if(d.web||d.paper)return'part';return'none'}

function testScore(test,ans){
  const bands={A2:[0,0],B1:[0,0],B2:[0,0]};const skills={};
  test.items.forEach(it=>{const ok=isCorrect(it,ans[it.id]);bands[it.level][1]++;if(ok)bands[it.level][0]++;
    skills[it.skill]=skills[it.skill]||[0,0];skills[it.skill][1]++;if(ok)skills[it.skill][0]++});
  const total=Object.values(bands).reduce((a,b)=>a+b[0],0);
  const lv=levelFromBands(bands.A2[0],bands.B1[0],bands.B2[0]);
  return {bands,skills,total,of:test.items.length,level:lv,hours:ENTRY_H[lv],at:Date.now()};
}

function pill(x,label){return x?`<span class="pill good">✓ ${label}</span>`:`<span class="pill">${label}: chưa làm</span>`}
function updateQueue(it,ok,day,isReview){
  const id=it.id;const qd=S.queue[id];
  const gaps=[1,3,6];
  if(qd){ if(ok){qd.stage++; if(qd.stage>=3){delete S.queue[id];S.mastered[id]=day}else qd.due=day+gaps[qd.stage]} else {qd.stage=0;qd.due=day+1;qd.wrong=(qd.wrong||0)+1} }
  else if(!ok){S.queue[id]={stage:0,due:day+1,wrong:1}}
  S.stats=S.stats||{retry:[0,0],spiral:[0,0]};
  if(isReview){S.stats.retry[1]++;if(ok)S.stats.retry[0]++}
  if(it.skill==='review'||it.from_day){S.stats.spiral[1]++;if(ok)S.stats.spiral[0]++}
}

function efficiency(A){
  if(A.done.length<3)return {f:1,from:false};
  const acc=pct(A.web)||0.6;const ret=pct(A.retry)!=null&&A.retry[1]>=3?pct(A.retry):acc;
  const comp=Math.min(1,A.studyDays/Math.max(1,Math.min(14,A.span)));
  let f=0.55+0.45*acc+0.15*ret+0.1*comp;f=Math.max(0.7,Math.min(1.25,f));
  return {f:Math.round(f*100)/100,from:true,acc,ret,comp};
}
function project(entryH,hpw,eff,date){return entryH+hpw*eff*CONV*weeksUntil(date)*STUDY_FACTOR}

async function pack(obj){
  const json=JSON.stringify(obj);
  try{ if(typeof CompressionStream!=='undefined'){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let s='';buf.forEach(b=>s+=String.fromCharCode(b));return 'Z'+btoa(s)} }catch(e){}
  return 'J'+btoa(unescape(encodeURIComponent(json)));
}
async function unpack(code){
  code=code.trim().replace(/\s+/g,'');const t=code[0],b=code.slice(1);
  if(t==='Z'){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(ds).text())}
  if(t==='J')return JSON.parse(decodeURIComponent(escape(atob(b))));
  throw new Error('bad');
}

}

  <div class="card"><div class="row"><button class="btn hi" id="mk">Tạo mã kết quả</button><button class="btn ghost" id="cp" disabled>Sao chép mã</button><span class="small muted" id="cpMsg"></span></div><div class="code" id="codeBox" hidden></div></div>
  <details class="card" id="teacher"><summary>Dành cho cô và bố mẹ: xem kết quả từ mã</summary>
   <p class="small muted">Dán mã em gửi vào ô dưới đây.</p><textarea id="codeIn" placeholder="Dán mã kết quả"></textarea><div class="row"><button class="btn" id="rd">Xem báo cáo</button><span class="small muted" id="rdMsg"></span></div><div id="report"></div></details>
  ${resetCardHTML()}
  </section>`;
  let code='';
  $('#mk').onclick=async()=>{code=await pack(summary());$('#codeBox').hidden=false;$('#codeBox').textContent=code;$('#cp').disabled=false};
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#cpMsg').textContent='Đã sao chép.'}catch(e){const r=document.createRange();r.selectNodeContents($('#codeBox'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#cpMsg').textContent='Đã bôi đen mã, em bấm sao chép trên máy nhé.'}};
  $('#rd').onclick=async()=>{try{const o=await unpack($('#codeIn').value);$('#report').innerHTML=reportHTML(o);$('#rdMsg').textContent=''}catch(e){$('#rdMsg').textContent='Mã không đọc được. Kiểm tra em đã sao chép đủ mã chưa.'}};
  wireReset();
}
function resetCardHTML(){return `<div class="card"><h3>Làm lại từ đầu</h3><p class="small muted">Xóa toàn bộ kết quả trên máy này. Chỉ dùng khi đổi sang một học sinh khác.${cloudOn()?' Kết quả đã gửi cho cô vẫn được giữ.':''}</p><div class="row"><button class="btn ghost" id="rs1">Xóa kết quả</button><button class="btn" id="rs2" hidden>Chắc chắn xóa</button></div></div>`}
function wireReset(){$('#rs1').onclick=()=>{$('#rs2').hidden=false};$('#rs2').onclick=()=>{S=blank();saveLocal();go('start')}}
function reportHTML(o){
  const lv=k=>(LEVELS.find(l=>l.k===k)||{name:'—'}).name;
  const rows=Object.entries(o.days||{}).map(([d,r])=>`<tr><td>${d}</td><td>${esc(DAYS[d-1].theme_vi)}</td><td>${r[0]!=null?r[0]+'/'+r[1]:'—'}</td><td>${r[2]!=null?r[2]+'/'+r[3]:'—'}</td><td>${r[4]?new Date(r[4]).toLocaleDateString('vi-VN'):'—'}</td></tr>`).join('');
  const sk=Object.entries(o.sk||{}).map(([k,v])=>bar(SKILL_VI[k]||k,v[0],v[1])).join('');
  const weak=(o.q||[]).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,w])=>{const it=ITEM[id];return it?`<li>Buổi ${it.day} · ${esc(it.q)} <span class="muted">(sai ${w} lần, đáp án: ${esc(answerText(it))})</span></li>`:''}).join('');
  const entryH=o.d?ENTRY_H[o.d.l]:null;
  let need='';if(entryH){const r=requiredMin(entryH,750,o.e||1,MILESTONES[2].date,(o.p&&o.p.dpw)||6);need=`Ước tính cần khoảng ${Math.ceil(r/5)*5} phút/ngày × ${(o.p&&o.p.dpw)||6} ngày/tuần để đạt C1 trước kỳ thi.`}
  return `<div class="card" style="margin-top:12px"><h3>${esc(o.n||'Học sinh')}</h3>
   <p>Đầu vào: <b>${o.d?o.d.t+'/'+o.d.o+' · '+lv(o.d.l):'chưa làm'}</b> · Sau 2 tuần: <b>${o.f?o.f.t+'/'+o.f.o+' · '+lv(o.f.l):'chưa làm'}</b></p>
   <p class="small">Học ${o.sd||0} ngày trong ${o.sp||0} ngày · Câu từng sai làm lại đúng ${o.rt&&o.rt[1]?Math.round(100*o.rt[0]/o.rt[1])+'%':'—'} · Đã nhớ chắc ${o.mq||0} câu · Hệ số hiệu quả ${o.e||1} · Lịch đang chọn ${o.p?o.p.min+' phút × '+o.p.dpw+' ngày':'—'}</p>
   <p class="small">${need}</p>
   <div class="bars">${sk}</div>
   <div class="tbl-wrap"><table><thead><tr><th>Buổi</th><th>Chủ đề</th><th>Web</th><th>Giấy</th><th>Ngày</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Chưa có buổi nào.</td></tr>'}</tbody></table></div>
   ${weak?`<h3 style="font-size:1.05rem">Câu còn trong vòng ôn (sai nhiều nhất)</h3><ul class="small">${weak}</ul>`:''}
   <p class="small muted">Mã tạo lúc ${new Date(o.at).toLocaleString('vi-VN')}.</p></div>`;
}

/* ---------- boot ---------- */
go(S.diag?(dayStatus(1)==='none'?'start':'days'):'start');
if(cloudOn()){loadMy().catch(()=>{});if(!S.syncedAt||(S.savedAt||0)>S.syncedAt)doSync()}
})();
</script>
