<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyên Anh 34 tỉnh, thành</title>
<meta name="description" content="Tuyển sinh lớp 10 chuyên Anh theo 34 tỉnh, thành mới: trường, công thức xét tuyển, điểm chuẩn 2022–2026, cấu trúc và độ khó đề, kinh nghiệm ôn thi, nguồn dẫn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/*__BRAND_CSS__*/
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;line-height:1.6}
a{color:var(--agent)}
.top{background:var(--bar);color:var(--bar-ink);padding:14px 16px}
.top .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.top b{font-family:var(--f-display);font-size:1.35rem}
.top a{color:var(--bar-ink-2);font-size:.9rem;margin-left:auto}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
nav.side{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:10px}
@media (max-width:860px){nav.side{position:static;max-height:none}}
nav.side input{width:100%;font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink)}
nav.side h4{margin:12px 6px 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
nav.side button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.93rem}
nav.side button:hover{background:var(--surface2)}
nav.side button[aria-current="true"]{background:var(--agent);color:var(--on-agent);font-weight:700}
nav.side button small{opacity:.7;font-size:.72rem}
nav.side button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none}
.dot.high{background:var(--good-edge)}.dot.medium{background:var(--gold-deep)}.dot.low{background:var(--signal)}.dot.none{background:var(--line-strong)}
main{min-width:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-family:var(--f-display);font-size:1.15rem}
h2{font-family:var(--f-display);font-size:1.8rem;margin:0}
.sub{color:var(--ink-2);margin:.2em 0 .6em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.chip.high{background:var(--good-bg);color:var(--good)}.chip.medium{background:var(--warn-bg);color:var(--warn)}.chip.low{background:var(--signal-tint);color:var(--signal-text)}
.btn{display:inline-block;font:inherit;font-weight:700;text-decoration:none;border:2px solid var(--ink);border-radius:var(--r-ctl);padding:8px 14px;background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:.8rem;color:var(--ink-2);background:var(--surface2)}
td:first-child{min-width:170px}
td.n,th.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;margin:0}
.kv dt{font-weight:700;color:var(--ink-2);font-size:.9rem}.kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.story{border-left:4px solid var(--agent);padding:4px 0 4px 12px;margin:10px 0}
.story b{display:block}
.story .who{font-size:.8rem;color:var(--ink-2)}
.story ul{margin:4px 0 0;padding-left:1.2em}
.muted{color:var(--ink-2)}.small{font-size:.86rem}
.note{background:var(--gold-tint);color:var(--gold-ink);border-radius:10px;padding:8px 12px}
ol.src{padding-left:1.4em;font-size:.86rem;word-break:break-word}
.uni{border-top:2px dashed var(--line);margin-top:12px;padding-top:12px}
.empty{padding:30px;text-align:center}
@media print{nav.side,.top a,.btn{display:none}.wrap{display:block}body{background:#fff}}
</style>
</head>
<body>
<header class="top"><div class="in"><b>Chuyên Anh 34 tỉnh, thành</b><span>Tuyển sinh lớp 10 chuyên Anh theo địa giới mới (từ 1/7/2025)</span><a href="../">← Ôn thi chuyên ngữ</a></div></header>
<div class="wrap">
 <nav class="side" aria-label="Chọn tỉnh, thành"><input type="search" id="q" placeholder="Tìm tỉnh, thành hoặc trường…" aria-label="Tìm tỉnh, thành hoặc trường"><div id="list"></div>
  <p class="small muted" style="margin:10px 6px 0"><span class="dot high"></span> đủ số liệu · <span class="dot medium"></span> tương đối · <span class="dot low"></span> thiếu nhiều</p></nav>
 <main id="main"></main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const LIST=D.list,R=D.regions,FMT=D.fmt;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=x=>x==null?'—':(Math.round(x*100)/100).toLocaleString('vi-VN');
const VUNG=[['Miền Bắc',['ha-noi','hai-phong','quang-ninh','bac-ninh','hung-yen','ninh-binh','phu-tho','thai-nguyen','tuyen-quang','lao-cai','cao-bang','lang-son','dien-bien','lai-chau','son-la']],
 ['Miền Trung và Tây Nguyên',['thanh-hoa','nghe-an','ha-tinh','quang-tri','hue','da-nang','quang-ngai','gia-lai','dak-lak','khanh-hoa','lam-dong']],
 ['Miền Nam',['tp-ho-chi-minh','dong-nai','tay-ninh','can-tho','vinh-long','dong-thap','an-giang','ca-mau']]];
const byS=Object.fromEntries(LIST.map(x=>[x.slug,x]));
let cur=(location.hash||'').slice(1);if(!byS[cur])cur='ha-noi';
function nav(filter){const f=(filter||'').toLowerCase();
  document.getElementById('list').innerHTML=VUNG.map(([v,ks])=>{const items=ks.map(k=>byS[k]).filter(Boolean).filter(x=>{if(!f)return true;const r=R[x.slug];return (x.name+' '+(x.merged_from||[]).join(' ')+' '+(r?(r.schools_raw||[]).map(s=>s.name).join(' '):'')).toLowerCase().includes(f)});
    return items.length?`<h4>${v}</h4>`+items.map(x=>{const r=R[x.slug];return `<button type="button" data-s="${x.slug}" aria-current="${x.slug===cur}"><span>${esc(x.name)}${x.merged_from&&x.merged_from.length?`<br><small>${esc(x.merged_from.slice(1).map(m=>'+ '+m).join(' '))}</small>`:''}</span><span class="dot ${x.slug==='ha-noi'?'high':r?(r.confidence||'medium'):'none'}"></span></button>`}).join(''):''}).join('')||'<p class="small muted">Không tìm thấy.</p>'}
function cutTable(schools){
  const ys=[...new Set(schools.flatMap(s=>(s.classes||[]).flatMap(c=>Object.keys(c.cut||{}))))].sort();
  const rows=schools.flatMap(s=>(s.classes||[]).map(c=>({s,c})));
  if(!rows.length)return '<p class="muted">Chưa có dữ liệu trường.</p>';
  return `<div class="tw"><table><thead><tr><th>Trường</th><th>Lớp</th>${ys.map(y=>`<th class="n">${y}</th>`).join('')}<th class="n">Chỉ tiêu</th></tr></thead><tbody>${rows.map(({s,c})=>{const q=c.quota||{};const qy=Object.keys(q).sort().pop();
    return `<tr><td><b>${esc(s.name)}</b>${s.old_province?`<br><span class="small muted">${esc(s.old_province)}${s.city?' · '+esc(s.city):''}</span>`:''}</td><td>${esc(c.lang)}${c.admit_by_english?' <span class="small muted">(xét bằng điểm Anh)</span>':''}</td>${ys.map(y=>{const v=(c.cut||{})[y],sc=(c.scale||{})[y];return `<td class="n">${v==null?'—':fmtN(v)+(sc?`<span class="small muted">/${sc}</span>`:'')}</td>`}).join('')}<td class="n">${qy&&q[qy]!=null?q[qy]+` <span class="small muted">(${qy})</span>`:'—'}</td></tr>${c.note?`<tr><td></td><td colspan="${ys.length+2}" class="small muted"><details><summary>Ghi chú về số liệu</summary>${esc(c.note)}</details></td></tr>`:''}`}).join('')}</tbody></table></div>`}
function paperHTML(P){if(!P)return '';const sec=P.sections||[];
  return `<dl class="kv"><dt>Thời gian</dt><dd>${P.minutes?P.minutes+' phút':'—'}${P.scale?` · thang ${P.scale}`:''}</dd><dt>Phần nghe</dt><dd>${P.has_listening==null?'—':P.has_listening?'Có':'Không'}</dd><dt>Bài viết</dt><dd>${P.essay_words?'khoảng '+P.essay_words+' từ':'—'}</dd><dt>Độ khó ước tính</dt><dd><b>${esc(P.difficulty||'—')}</b>${P.difficulty_evidence?`<br><span class="small">${esc(P.difficulty_evidence)}</span>`:''}</dd></dl>
   ${sec.length?`<div class="tw" style="margin-top:10px"><table><thead><tr><th>Dạng bài</th><th class="n">Số câu</th><th class="n">Điểm</th><th>Ghi chú</th></tr></thead><tbody>${sec.map(x=>`<tr><td>${esc(FMT[x.format]||x.format)}</td><td class="n">${x.items==null?'—':x.items}</td><td class="n">${x.points==null?'—':fmtN(x.points)}</td><td class="small">${esc(x.note||'')}</td></tr>`).join('')}</tbody></table></div>`:''}
   ${(P.sample_links||[]).length?`<p class="small"><b>Đề và đáp án các năm:</b> ${P.sample_links.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">đề ${i+1}</a>`).join(' · ')}</p>`:''}`}
function storiesHTML(st){if(!st||!st.length)return '<p class="muted">Chưa tìm được chia sẻ có nguồn.</p>';
  return st.map(s=>`<div class="story"><b>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)}</b><span class="who">${esc([s.who,s.school,s.year].filter(Boolean).join(' · '))}</span><div>${esc(s.summary||'')}</div>${(s.takeaways||[]).length?`<ul>${s.takeaways.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`).join('')}
function formulaHTML(F,nv){if(!F)return '';
  return `<p><b>${esc(F.text||'')}</b></p>${F.conditions?`<p class="small">${esc(F.conditions)}</p>`:''}${F.formula_by_year&&Object.keys(F.formula_by_year).length?`<details><summary class="small">Công thức từng năm</summary><ul class="small">${Object.entries(F.formula_by_year).map(([y,t])=>`<li><b>${esc(y)}:</b> ${esc(t)}</li>`).join('')}</ul></details>`:''}${nv?`<p class="small"><b>Nguyện vọng:</b> ${esc(nv)}</p>`:''}`}
function show(slug){cur=slug;history.replaceState(null,'','#'+slug);nav(document.getElementById('q').value);
  const meta=byS[slug],r=R[slug];const M=document.getElementById('main');
  const head=`<div class="card"><p class="small muted" style="margin:0">Sở GD&amp;ĐT</p><h2>${esc(meta.name)}</h2>${meta.merged_from&&meta.merged_from.length?`<p class="sub">Gồm các tỉnh, thành cũ: ${esc(meta.merged_from.join(', '))}</p>`:'<p class="sub">Không sáp nhập</p>'}
   <div class="chips">${r?`<span class="chip ${esc(r.confidence||'medium')}">Độ đầy đủ số liệu: ${({high:'cao',medium:'vừa',low:'thấp'})[r.confidence]||'vừa'}</span>`:''}${r&&r.paper&&r.paper.difficulty?`<span class="chip">Đề chuyên Anh khoảng ${esc(r.paper.difficulty)}</span>`:''}${r&&r.exam_2026&&r.exam_2026.dates?`<span class="chip">Thi 2026: ${esc(String(r.exam_2026.dates).slice(0,40))}${String(r.exam_2026.dates).length>40?'…':''}</span>`:''}</div>
   <div class="row">${slug==='ha-noi'||r?`<a class="btn" href="../chuyen-anh-14-ngay/?so=${slug}">Mở bộ ôn 14 buổi cho ${esc(meta.name)}</a>`:''}${slug==='ha-noi'?'<a class="btn ghost" href="../tuyen-sinh/">Trang tuyển sinh chuyên ngữ Hà Nội</a>':''}</div></div>`;
  if(slug==='ha-noi'){M.innerHTML=head+`<div class="card"><h3>Bản Hà Nội</h3><p>Bộ ôn đầu tiên của trang được làm cho Hà Nội: kỳ thi của Sở (Amsterdam, Chu Văn An, Nguyễn Huệ, Sơn Tây), Chuyên Ngoại ngữ và Chuyên Sư phạm. Công thức, điểm chuẩn 2022–2026, bảng điểm học sinh đỗ và kinh nghiệm ôn nằm ở trang Tuyển sinh chuyên ngữ Hà Nội.</p></div>`;return}
  if(!r){M.innerHTML=head+`<div class="card empty"><p>Dữ liệu của ${esc(meta.name)} đang được cập nhật.</p></div>`;return}
  const ex=r.exam_2026||{};
  M.innerHTML=head+
   `<div class="card"><h3>Kỳ thi</h3><dl class="kv"><dt>Năm 2026</dt><dd>${esc(ex.dates||'—')}</dd><dt>Cách tổ chức</dt><dd>${esc(ex.organisation||'—')}</dd><dt>Môn thi chung</dt><dd>${esc((ex.common_subjects||[]).join(', ')||'—')}</dd>${ex.notes?`<dt>Ghi chú</dt><dd class="small">${esc(ex.notes)}</dd>`:''}<dt>Năm 2027</dt><dd>${esc(r.plan_2027||'Sở chưa công bố (đến 10/2026).')}</dd></dl></div>`+
   `<div class="card"><h3>Công thức xét tuyển lớp chuyên Anh</h3>${formulaHTML(r.formula_raw,r.nv_rule)}</div>`+
   `<div class="card"><h3>Trường và điểm chuẩn</h3>${cutTable(r.schools_raw||[])}<p class="small muted">Điểm chuẩn ghi theo thang của từng năm; năm đổi công thức thì không so trực tiếp được.</p></div>`+
   `<div class="card"><h3>Đề chuyên Anh</h3>${paperHTML(r.paper)}</div>`+
   ((r.prep_tips||[]).length?`<div class="card"><h3>Ôn sát đề của ${esc(meta.name)}</h3><ul>${r.prep_tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:'')+
   `<div class="card"><h3>Chia sẻ và kinh nghiệm</h3>${storiesHTML(r.stories)}</div>`+
   (r.uni||[]).map(u=>`<div class="card"><p class="small muted" style="margin:0">Trường chuyên thuộc đại học, thi riêng</p><h3>${esc(u.name)}</h3>${formulaHTML(u.formula_raw,'')}${cutTable(u.schools_raw||[])}<div class="uni"><b>Đề chuyên Anh</b>${paperHTML(u.paper)}</div>${(u.stories||[]).length?`<div class="uni"><b>Chia sẻ</b>${storiesHTML(u.stories)}</div>`:''}</div>`).join('')+
   `<div class="card"><h3>Còn thiếu</h3>${(r.gaps||[]).length?`<ul class="small">${r.gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>`:'<p class="small muted">Không có.</p>'}<p class="note small">Số liệu tổng hợp từ báo chí, website sở và trường, cập nhật ${esc(D.updated)}. Trước khi đăng ký, cả nhà nên đọc văn bản tuyển sinh chính thức của sở trong năm thi.</p></div>`+
   `<div class="card"><h3>Nguồn</h3><ol class="src">${(r.sources||[]).concat(...(r.uni||[]).map(u=>u.sources||[])).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join('')}</ol></div>`;
  window.scrollTo({top:0})}
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(b)show(b.dataset.s)});
document.getElementById('q').addEventListener('input',e=>nav(e.target.value));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(byS[h]&&h!==cur)show(h)});
show(cur);
})();
</script>
</body>
</html>
