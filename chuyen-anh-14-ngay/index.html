y", "accept": ["that the results of the experiment would be announced the following day", "the results of the experiment would be announced the next day", "the results of the experiment would be announced the following day"], "explain_vi": "Bị động tương lai will be announced → would be announced; tomorrow → the next day / the following day."}, {"q": "'I'm not going to give up until I come up with a solution,' said Nam.", "start": "Nam said", "answer": "that he wasn't going to give up until he came up with a solution", "accept": ["that he wasn't going to give up until he had come up with a solution", "that he wasn't going to give up until he'd come up with a solution", "that he was not going to give up until he came up with a solution", "that he was not going to give up until he had come up with a solution", "that he was not going to give up until he'd come up with a solution", "he wasn't going to give up until he came up with a solution", "he wasn't going to give up until he had come up with a solution", "he wasn't going to give up until he'd come up with a solution", "he was not going to give up until he came up with a solution", "he was not going to give up until he had come up with a solution", "he was not going to give up until he'd come up with a solution"], "explain_vi": "am not going to → was not going to; come → came (hoặc had come); I → he. Mệnh đề sau until cũng phải lùi thì."}]}, {"format": "reading_mcq", "title_vi": "Đọc hiểu", "intro_vi": "Bài đọc ở đề Chuyên Ngoại ngữ có những câu phân loại: hỏi nghĩa của từ trong ngữ cảnh, ý chính của một đoạn, điều tác giả ngụ ý. Bài hôm nay khoảng 250 từ, từ vựng mức B2.", "tip_vi": "Mẹo: phương án sai thường lấy từ trong bài nhưng nói quá lên (most, always, rarely) hoặc ngược ý. Đối chiếu từng chữ với câu gốc trong bài.", "kind": "mcq", "passage": "Many people imagine that great inventions are always the result of careful planning. In reality, some of the most useful breakthroughs happened almost by accident.\n\nIn 1945, an American engineer named Percy Spencer was carrying out tests on radar equipment when he noticed that the chocolate bar in his pocket had melted. Instead of simply complaining about his ruined snack, Spencer became curious. He placed some popcorn kernels near the machine and watched them pop all over the laboratory. This observation eventually led to the microwave oven. The first models, however, were nearly two metres tall and far too expensive for ordinary families, so it was many years before microwaves became a common sight in kitchens.\n\nA similar story took place in 1968, when a chemist called Spencer Silver was trying to develop an extremely strong glue. What he produced instead was so weak that paper stuck with it could be removed easily without leaving a mark. For years, nobody could think of a use for it. Then a colleague, Art Fry, came up with the idea of using it to make bookmarks that would not fall out of his songbook. The result was the sticky note, which can now be found in offices all over the world.\n\nThese stories suggest that luck alone is not enough. Both men turned their accidents into inventions because they paid attention to unexpected results rather than dismissing them as failures.", "items": [{"q": "What does the writer suggest in the first paragraph?", "options": ["Most great inventions are the result of luck.", "Not every important invention is carefully planned.", "Careful planning is a waste of time for inventors.", "Accidental discoveries are rarely useful."], "answer": 1, "explain_vi": "'some of the most useful breakthroughs happened almost by accident' → không phải phát minh nào cũng được lên kế hoạch. A nói quá (most)."}, {"q": "According to the passage, why did it take a long time for microwave ovens to become common in homes?", "options": ["People believed they were dangerous.", "They could only be used to make popcorn.", "The early models were too large and costly.", "Spencer refused to sell his invention."], "answer": 2, "explain_vi": "'nearly two metres tall and far too expensive for ordinary families' = quá to và quá đắt (costly). A, D bài không nhắc."}, {"q": "What was surprising about the glue that Spencer Silver produced?", "options": ["It was much stronger than he had planned.", "It left marks on everything it touched.", "It held paper only lightly and could be removed cleanly.", "It was invented by his colleague, Art Fry."], "answer": 2, "explain_vi": "'so weak that paper ... could be removed easily without leaving a mark' – keo dính nhẹ, gỡ ra không để lại vết. A, B ngược ý bài."}, {"q": "The word 'dismissing' in the last paragraph is closest in meaning to", "options": ["refusing to take them seriously", "explaining them in detail", "reporting them to others", "repeating them carefully"], "answer": 0, "explain_vi": "dismiss sth as… = gạt bỏ, coi là không đáng quan tâm. Đối lập với 'paid attention to' ngay trước đó."}, {"q": "What is the main point of the last paragraph?", "options": ["Luck is the most important quality an inventor can have.", "Both inventors became rich because of their mistakes.", "Scientists should try hard to avoid failures.", "Inventors succeed when they pay attention to unexpected results."], "answer": 3, "explain_vi": "'luck alone is not enough… they paid attention to unexpected results'. A trái ý bài; B bài không nhắc; C ngược thông điệp."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Dành cho mức Nâng cao. Câu 1–2: viết dạng đúng của từ in hoa (có thể phải thêm cả tiền tố lẫn hậu tố). Câu 3–4: viết lại câu sao cho nghĩa không đổi, bắt đầu bằng phần cho sẵn. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d12H1", "q": "The first results turned out to be ______, so the team had to repeat the whole experiment. (RELY)", "answer": "unreliable", "accept": []}, {"id": "d12H2", "q": "So far, the new theory has not been tested ______; it exists only on paper. (EXPERIMENT)", "answer": "experimentally", "accept": []}, {"id": "d12H3", "q": "'We haven't found any evidence yet,' the detectives told the journalist. → The detectives told the journalist ______", "answer": "that they hadn't found any evidence yet", "accept": ["that they had not found any evidence yet", "they hadn't found any evidence yet", "they had not found any evidence yet"]}, {"id": "d12H4", "q": "This is the cleverest solution that anyone has ever come up with. → Nobody has ever ______", "answer": "come up with a cleverer solution than this", "accept": ["come up with a cleverer solution than this one", "come up with such a clever solution", "come up with such a clever solution before"]}, {"id": "d12H5", "q": "After months of failure, the team finally ______ a breakthrough in their search for a cure.", "options": ["did", "made", "took", "got"], "answer": "B"}, {"id": "d12H6", "q": "The idea seemed crazy at first, but in the end it ______ to be a brilliant invention.", "options": ["turned out", "carried out", "found out", "came out"], "answer": "A"}]}}, "13": {"grammar_games": {"sort": {"title_vi": "Động từ/cụm từ nào đi với V-ing, cái nào đi với to V?", "groups": [{"name": "+ V-ing", "items": ["enjoy", "avoid", "practise", "can't stand", "be interested in"]}, {"name": "+ to V", "items": ["decide", "hope", "refuse", "manage", "promise"]}]}, "unjumble": [{"sentence": "My little brother enjoys drawing cartoon characters after school.", "hint_vi": "enjoy + V-ing"}, {"sentence": "We hope to visit the art exhibition this weekend.", "hint_vi": "hope + to V"}, {"sentence": "She is really good at playing the đàn tranh.", "hint_vi": "Sau giới từ (at) dùng V-ing"}, {"sentence": "We stopped to take photos of the colourful lanterns.", "hint_vi": "stop + to V = dừng lại để làm việc khác"}, {"sentence": "My parents agreed to take me to the concert.", "hint_vi": "agree + to V"}], "truefalse": [{"s": "I enjoy to paint landscapes in my free time.", "ok": false, "fix": "I enjoy painting landscapes in my free time.", "why_vi": "enjoy luôn đi với V-ing: enjoy painting."}, {"s": "Linh has decided to enter the poetry competition.", "ok": true, "fix": "Linh has decided to enter the poetry competition.", "why_vi": "decide + to V: decided to enter. Câu đúng."}, {"s": "We are looking forward to see the new musical.", "ok": false, "fix": "We are looking forward to seeing the new musical.", "why_vi": "'to' trong look forward to là giới từ, nên sau nó dùng V-ing."}, {"s": "Would you mind turning the music down a little?", "ok": true, "fix": "Would you mind turning the music down a little?", "why_vi": "mind + V-ing: Would you mind turning…? Câu đúng."}, {"s": "The band refused playing without their drummer.", "ok": false, "fix": "The band refused to play without their drummer.", "why_vi": "refuse + to V: refused to play."}, {"s": "Mai stopped to admire a painting near the door.", "ok": true, "fix": "Mai stopped to admire a painting near the door.", "why_vi": "stop to do = dừng lại ĐỂ làm việc khác (ngắm bức tranh). Câu đúng."}, {"s": "Remember locking the door before you go to the concert.", "ok": false, "fix": "Remember to lock the door before you go to the concert.", "why_vi": "Việc chưa làm, phải nhớ để làm → remember to do."}, {"s": "My sister is interested in designing costumes for the theatre.", "ok": true, "fix": "My sister is interested in designing costumes for the theatre.", "why_vi": "Sau giới từ in dùng V-ing: interested in designing. Câu đúng."}]}, "exam": [{"format": "cloze", "title_vi": "Điền từ vào đoạn văn", "intro_vi": "Đề chuyên Chuyên Ngoại ngữ có 8 câu điền từ vào đoạn văn: mỗi chỗ trống chọn A, B, C hoặc D. Các câu kiểm tra cả từ vựng, cụm động từ và ngữ pháp.", "tip_vi": "Mẹo: đọc cả câu và từ ngay trước, ngay sau chỗ trống (giới từ 'to', 'at'…) để biết cần V-ing, to V hay một từ hợp nghĩa.", "kind": "cloze_mcq", "text": "My cousin Hân has always enjoyed [1] to traditional Vietnamese music. Two years ago, she started lessons on the đàn bầu, an instrument with only one string. At first, it was so difficult that she wanted to give up, but her teacher kept encouraging her. After six months, she managed [2] some simple folk songs, and everyone in her family was amazed. Last spring, Hân even played a short piece of her own. She had [3] it for her grandmother's birthday. Then, in December, her music club [4] a concert at the city theatre to raise money for poor children. Hân was nervous, but the audience stood up and clapped for a long time. After the show, several teenagers told her that she had inspired them to learn a traditional instrument too. Now Hân is looking forward to [5] at a music festival in Huế next summer.", "items": [{"options": ["listen", "to listen", "listening", "listened"], "answer": 2, "explain_vi": "enjoy + V-ing → enjoyed listening."}, {"options": ["playing", "to play", "play", "played"], "answer": 1, "explain_vi": "manage + to V (xoay xở làm được) → managed to play."}, {"options": ["exhibited", "composed", "admired", "inspired"], "answer": 1, "explain_vi": "'a piece of her own' = bản nhạc của chính Hân → cô ấy đã sáng tác (composed) nó."}, {"options": ["took part", "gave up", "turned down", "put on"], "answer": 3, "explain_vi": "put on a concert = tổ chức một buổi hoà nhạc. 'took part' phải có 'in' mới đúng."}, {"options": ["performing", "perform", "to perform", "performed"], "answer": 0, "explain_vi": "'to' trong look forward to là giới từ → sau nó dùng V-ing: performing."}]}, {"format": "dialogue_order", "title_vi": "Sắp xếp hội thoại", "intro_vi": "Đề thi chung vào lớp 10 Chuyên Ngoại ngữ có bài 5 câu sắp xếp các lượt lời thành đoạn hội thoại hợp lý. Hôm nay em sắp xếp 6 lượt lời; lượt đầu tiên đã cho sẵn.", "tip_vi": "Mẹo: tìm cặp hỏi – đáp (câu hỏi đuôi → Yes, I do), và từ nối như Well, Great, Sure để biết lượt nào đi sau lượt nào.", "kind": "order", "lines": ["A: Hi Minh! Our English club is putting on a short musical for the school open day. Do you want to take part?", "B: I'd love to, but I'm not very good at acting. What else can I do?", "A: Well, we still need someone to compose a few songs for the show. You play the guitar, don't you?", "B: Yes, I do. I really enjoy writing my own songs, so I'd be happy to try.", "A: Great! We're going to rehearse every Thursday after school. Can you come this week?", "B: Sure. I'll remember to bring my guitar. See you on Thursday!"], "explain_vi": "B từ chối diễn và hỏi việc khác → A đề nghị sáng tác nhạc, hỏi 'You play the guitar, don't you?' → B 'Yes, I do' → A hẹn lịch tập → B nhận lời."}], "exam_easy": [{"format": "cloze", "title_vi": "Điền từ vào đoạn văn", "intro_vi": "Đề chuyên có bài đọc đoạn văn và chọn A, B, C hoặc D cho mỗi chỗ trống. Đoạn văn hôm nay ngắn, từ quen thuộc, có 5 chỗ trống về từ vựng và V-ing / to V.", "tip_vi": "Mẹo: nhìn từ ngay TRƯỚC chỗ trống: enjoy → V-ing; want → to V; stopped to … = dừng lại để làm gì. Rồi đọc lại cả câu.", "kind": "cloze_mcq", "text": "My name is Nga, and I love art. Every Saturday, I go to a drawing club near my house. I really enjoy [1] pictures of animals and flowers there. Our teacher, Mr Long, is very [2]. He can draw a beautiful horse in only two minutes!\n\nLast month, our club [3] an exhibition at the town library. Each student chose three pictures for it. I chose a picture of my cat, a picture of the sea and a picture of my grandmother. On the first day, a lot of people came, and many visitors stopped to [4] our pictures. My parents were very proud of me.\n\nNext month, I want [5] part in a drawing competition for students in our city. I am a bit nervous, but I am also very excited!", "items": [{"options": ["drawing", "draw", "drew", "draws"], "answer": 0, "explain_vi": "Sau 'enjoy' luôn dùng V-ing: enjoy drawing (thích vẽ)."}, {"options": ["lazy", "talented", "hungry", "bored"], "answer": 1, "explain_vi": "Câu sau nói thầy vẽ một con ngựa đẹp chỉ trong hai phút → thầy rất tài năng (talented)."}, {"options": ["got up", "turned off", "put on", "sat down"], "answer": 2, "explain_vi": "put on an exhibition = tổ chức một cuộc triển lãm. Các cụm khác: thức dậy, tắt, ngồi xuống – không hợp nghĩa."}, {"options": ["cook", "wash", "sell", "admire"], "answer": 3, "explain_vi": "stopped to admire = dừng lại để ngắm nhìn (stop + to V: dừng lại để làm việc khác). Khách xem tranh, không nấu, giặt hay bán."}, {"options": ["take", "to take", "taking", "took"], "answer": 1, "explain_vi": "Sau 'want' dùng to V: want to take part in = muốn tham gia."}]}, {"format": "dialogue_order", "title_vi": "Sắp xếp hội thoại", "intro_vi": "Đề thi chung vào lớp 10 Chuyên Ngoại ngữ có bài sắp xếp các lượt lời thành đoạn hội thoại. Hôm nay em xếp 6 lượt lời ngắn; lượt đầu tiên đã cho sẵn.", "tip_vi": "Mẹo: tìm câu hỏi rồi tìm câu trả lời của nó. Ví dụ: 'Are you free?' → 'Yes, I am.'; 'What time…?' → 'At seven o'clock.'", "kind": "order", "lines": ["A: Hi Lan! Are you free on Saturday evening?", "B: Yes, I am. Why?", "A: My brother is singing in a music show at school. Do you want to come?", "B: I'd love to! What time does it start?", "A: At seven o'clock. Let's meet at the school gate at half past six.", "B: OK. See you there!"], "explain_vi": "Hỏi có rảnh không → 'Yes, I am. Why?' → nói lý do, mời đi xem → nhận lời, hỏi giờ → nói giờ, hẹn chỗ gặp → chào."}], "exam_plus": [{"format": "cloze", "title_vi": "Điền từ vào đoạn văn", "intro_vi": "Trong 8 câu điền từ của đề Chuyên Ngoại ngữ, câu phân loại thường hỏi cụm động từ gần nghĩa (take up / take on), kết hợp từ cố định và nghĩa khác nhau của V-ing / to V.", "tip_vi": "Mẹo: với forget/remember/stop, hỏi: việc đó đã xảy ra chưa? Với kết hợp từ, chỉ một phương án đi được với từ đứng cạnh, đừng dịch từng chữ.", "kind": "cloze_mcq", "text": "When Bảo Anh first [1] the cello at the age of eleven, few people expected her to stick with it. The instrument was almost as tall as she was, and her fingers hurt after every lesson. However, she was determined, and she rarely missed a chance to practise. Her teacher, who had played in an orchestra for thirty years, kept reminding her that talent meant nothing without hard work.\n\nAt fifteen, she [2] in a national competition for young musicians. On the day, she was so nervous that she couldn't stop her hands [3], but as soon as she started playing, her fear disappeared. When she finished, the audience gave her a standing [4] that lasted almost two minutes. Since then, she has been invited to perform at concerts all over the country. Yet she says she will never forget [5] on that stage for the first time, with her heart beating faster than the music.", "items": [{"options": ["took on", "took over", "took up", "took after"], "answer": 2, "explain_vi": "take up = bắt đầu học/chơi (sở thích, nhạc cụ). take on = nhận việc; take over = tiếp quản; take after = giống (người thân)."}, {"options": ["entered", "competed", "attended", "applied"], "answer": 1, "explain_vi": "compete in a competition = thi đấu trong cuộc thi. entered/attended không cần 'in' (entered a competition); apply phải đi với 'for'."}, {"options": ["shaking", "to shake", "shake", "shaken"], "answer": 0, "explain_vi": "stop sb/sth (from) doing = ngăn ai/cái gì làm gì: couldn't stop her hands shaking = không ngăn được tay mình run."}, {"options": ["applause", "praise", "admiration", "ovation"], "answer": 3, "explain_vi": "Kết hợp cố định: a standing ovation = khán giả đứng dậy vỗ tay. Không nói 'standing applause/praise'."}, {"options": ["to stand", "standing", "stand", "stood"], "answer": 1, "explain_vi": "Việc đứng trên sân khấu đã xảy ra rồi → forget doing (quên việc đã làm). forget to do = quên việc phải làm."}]}, {"format": "dialogue_order", "title_vi": "Sắp xếp hội thoại", "intro_vi": "Ở đề chung vào 10 Chuyên Ngoại ngữ, bài sắp xếp hội thoại khó thường không có cặp hỏi – đáp rõ ràng; em phải dựa vào từ quy chiếu (that, this one, then, in that case).", "tip_vi": "Mẹo: tìm từ trỏ ngược về lượt trước: 'That's exactly why…', 'this one', 'Then…'. Lượt chứa từ đó phải đứng ngay sau lượt nói về điều được nhắc tới.", "kind": "order", "lines": ["A: Did you know the city theatre is putting on a new version of 'Romeo and Juliet' next month?", "B: I did, but to be honest, I'm not really into Shakespeare. I find the language really hard to follow.", "A: That's exactly why you should see this one. The director has set the story in modern Hà Nội, and the actors speak everyday Vietnamese.", "B: Really? In that case, it might be worth seeing. Are the tickets expensive?", "A: Not at all – student tickets are only 80,000 đồng. But apparently they're selling out fast.", "B: Then we'd better not wait. Remind me to book two seats when I get home tonight."], "explain_vi": "'I did' đáp 'Did you know' → 'That's exactly why' nối 'hard to follow' → 'Not at all' đáp câu hỏi giá vé → 'Then…' nối 'selling out fast'."}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Dành cho mức Nâng cao. Câu 1–2: viết dạng đúng của từ in hoa (có thể phải thêm cả tiền tố lẫn hậu tố). Câu 3–4: viết lại câu sao cho nghĩa không đổi, bắt đầu bằng phần cho sẵn. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d13H1", "q": "The concert was cancelled after the sudden ______ of the lead singer, who was found two days later at his parents' house. (APPEAR)", "answer": "disappearance", "accept": []}, {"id": "d13H2", "q": "The stage design was rather ______; the director had simply copied it from an old production. (IMAGINE)", "answer": "unimaginative", "accept": []}, {"id": "d13H3", "q": "I told Hoa the ending of the film, and now I wish I hadn't. → I regret ______", "answer": "telling Hoa the ending of the film", "accept": ["having told Hoa the ending of the film", "telling her the ending of the film", "having told her the ending of the film"]}, {"id": "d13H4", "q": "'Why don't we put on a play for Teachers' Day?' said Minh. → Minh suggested ______", "answer": "putting on a play for Teachers' Day", "accept": ["that we put on a play for Teachers' Day", "that we should put on a play for Teachers' Day", "we put on a play for Teachers' Day", "we should put on a play for Teachers' Day", "that they put on a play for Teachers' Day", "that they should put on a play for Teachers' Day", "they put on a play for Teachers' Day", "they should put on a play for Teachers' Day", "putting a play on for Teachers' Day"]}, {"id": "d13H5", "q": "Unfortunately, the band's new album didn't ______ their fans' high expectations.", "options": ["live up to", "come up with", "put up with", "catch up with"], "answer": "A"}, {"id": "d13H6", "q": "Lan was so nervous before her first performance that she had ______ in her stomach.", "options": ["bees", "birds", "butterflies", "frogs"], "answer": "C"}]}}, "14": {"grammar_games": {"sort": {"title_vi": "Xếp mỗi câu vào đúng chủ điểm ngữ pháp đã học", "groups": [{"name": "Passive voice", "items": ["Mooncakes are sold everywhere before the Mid-Autumn Festival.", "The exhibition was opened by the mayor.", "These songs were composed by a teenager."]}, {"name": "Conditionals", "items": ["If I were taller, I'd play basketball.", "If it's sunny tomorrow, we'll have a picnic.", "Water boils if you heat it to 100°C."]}, {"name": "Relative clauses", "items": ["The girl who won the prize is my cousin.", "Huế, which was the old capital, is beautiful.", "That's the café where we first met."]}]}, "unjumble": [{"sentence": "She told us that she was going to the museum.", "hint_vi": "Câu tường thuật (buổi 12): told + người nghe + that, lùi thì."}, {"sentence": "Nam decided to take part in the singing contest.", "hint_vi": "decide + to V (buổi 13); take part in = tham gia."}, {"sentence": "Have you ever been to an art exhibition?", "hint_vi": "Hiện tại hoàn thành với ever (buổi 3)."}, {"sentence": "The man whose car was stolen called the police.", "hint_vi": "whose + danh từ = của người đó (buổi 11)."}, {"sentence": "We were having dinner when the lights went out.", "hint_vi": "Quá khứ tiếp diễn bị quá khứ đơn cắt ngang (buổi 2)."}], "truefalse": [{"s": "The Mid-Autumn Festival is celebrated in September or October.", "ok": true, "fix": "The Mid-Autumn Festival is celebrated in September or October.", "why_vi": "Đúng: bị động hiện tại đơn (buổi 8), is + V3."}, {"s": "She said me that she was tired.", "ok": false, "fix": "She told me that she was tired.", "why_vi": "Có người nghe (me) thì dùng told, không dùng said (buổi 12)."}, {"s": "The singer whose songs I love is coming to Hà Nội.", "ok": true, "fix": "The singer whose songs I love is coming to Hà Nội.", "why_vi": "Đúng: whose + danh từ chỉ sở hữu (buổi 11)."}, {"s": "Đà Nẵng, that is in central Việt Nam, has beautiful beaches.", "ok": false, "fix": "Đà Nẵng, which is in central Việt Nam, has beautiful beaches.", "why_vi": "Mệnh đề có dấu phẩy không dùng that; nơi chốn làm chủ ngữ → which (buổi 11)."}, {"s": "If it rains this afternoon, we will stay inside.", "ok": true, "fix": "If it rains this afternoon, we will stay inside.", "why_vi": "Đúng: điều kiện loại 1, If + hiện tại đơn, will + V (buổi 10)."}, {"s": "We have lived in Hà Nội since five years.", "ok": false, "fix": "We have lived in Hà Nội for five years.", "why_vi": "Khoảng thời gian dùng for; since đi với mốc thời gian (buổi 3)."}, {"s": "There isn't much traffic on Sunday mornings.", "ok": true, "fix": "There isn't much traffic on Sunday mornings.", "why_vi": "Đúng: traffic không đếm được → much (buổi 9)."}, {"s": "He avoided to answer my question.", "ok": false, "fix": "He avoided answering my question.", "why_vi": "avoid + V-ing, không dùng to V (buổi 5 và 13)."}]}, "exam": [{"format": "mixed", "title_vi": "Đề thi thu nhỏ", "intro_vi": "10 câu trộn các dạng đã luyện: phát âm, trọng âm, hoàn thành câu, đồng nghĩa, trái nghĩa, hội thoại, tìm lỗi sai, câu gần nghĩa, nối câu – giống đề Chuyên Ngoại ngữ và đề chung vào 10.", "tip_vi": "Mẹo: đọc nhãn đầu câu để biết dạng bài, áp dụng mẹo của dạng đó. Câu nào khó thì đánh dấu, làm câu dễ trước.", "kind": "mcq", "items": [{"format": "pronunciation", "q": "[Phát âm] Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["rehears[[es]]", "compos[[es]]", "admir[[es]]", "analys[[es]]"], "answer": 2, "explain_vi": "admires đọc /z/ (kết thúc bằng âm hữu thanh); rehearses, composes, analyses đọc /ɪz/ vì kết thúc bằng âm /s/ hoặc /z/."}, {"format": "stress", "q": "[Trọng âm] Chọn từ có trọng âm khác các từ còn lại.", "options": ["respect", "support", "argue", "admire"], "answer": 2, "explain_vi": "argue nhấn âm 1 (AR-gue); respect, support, admire nhấn âm 2."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] This beautiful song ______ by a 15-year-old student last year.", "options": ["composed", "was composed", "is composed", "has composed"], "answer": 1, "explain_vi": "Bài hát được sáng tác (bị động), 'last year' → quá khứ đơn: was composed (buổi 8, 13)."}, {"format": "synonym", "q": "[Đồng nghĩa] Many young artists LOOK UP TO this famous painter.", "options": ["look after", "admire", "argue with", "look for"], "answer": 1, "explain_vi": "look up to = kính trọng, ngưỡng mộ = admire (buổi 11, 13)."}, {"format": "antonym", "q": "[Trái nghĩa] Our neighbour is very GENEROUS; he often gives us fruit from his garden.", "options": ["kind", "honest", "mean", "friendly"], "answer": 2, "explain_vi": "generous = hào phóng; trái nghĩa là mean = keo kiệt (buổi 11)."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: What would you do if you won the art competition?\nB: ______", "options": ["I'm taking part in it.", "Yes, I would.", "I won it last year.", "I would buy a new set of paints."], "answer": 3, "explain_vi": "Câu hỏi loại 2 What would you do if...? → trả lời I would + V (buổi 10)."}, {"format": "error_id", "q": "[Tìm lỗi sai] The scientists didn't have much evidences to support their theory.", "options": ["didn't have", "much", "evidences", "support"], "answer": 2, "explain_vi": "evidence không đếm được, không thêm -s → much evidence (buổi 9, 12)."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] 'I will help you with your project,' my brother said to me.", "options": ["My brother told me that he would help me with my project.", "My brother told me that I would help him with his project.", "My brother said me that he will help me with my project.", "My brother told me that he helps me with my project."], "answer": 0, "explain_vi": "Tường thuật: will → would, I → he, your → my; có người nghe thì dùng told me (buổi 12)."}, {"format": "sentence_combining", "q": "[Nối câu] I have a friend. His father is a famous composer.", "options": ["I have a friend who father is a famous composer.", "I have a friend whose father is a famous composer.", "I have a friend which father is a famous composer.", "I have a friend whose his father is a famous composer."], "answer": 1, "explain_vi": "His father → whose father (sở hữu); sau whose không dùng thêm his (buổi 11)."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] Remember ______ off the lights before you leave the classroom.", "options": ["switching", "to switch", "switch", "switched"], "answer": 1, "explain_vi": "remember to V = nhớ phải làm (việc chưa làm); switch off = tắt (buổi 4, 13)."}]}], "exam_easy": [{"format": "mixed", "title_vi": "Đề thi thu nhỏ", "intro_vi": "10 câu trộn các dạng em đã luyện trong 13 buổi: phát âm, trọng âm, hoàn thành câu, đồng nghĩa, trái nghĩa, hội thoại, tìm lỗi sai, câu gần nghĩa, nối câu. Câu ngắn, từ quen thuộc.", "tip_vi": "Mẹo: đọc nhãn trong ngoặc vuông để biết dạng bài. Gạch bỏ trước những đáp án em chắc chắn sai, rồi chọn trong các đáp án còn lại.", "kind": "mcq", "items": [{"format": "pronunciation", "q": "[Phát âm] Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["artist[[s]]", "cake[[s]]", "shop[[s]]", "song[[s]]"], "answer": 3, "explain_vi": "songs đọc /z/ vì 'song' tận cùng bằng âm hữu thanh /ŋ/. artists, cakes, shops tận cùng bằng /t/, /k/, /p/ nên -s đọc /s/ (buổi 1)."}, {"format": "stress", "q": "[Trọng âm] Chọn từ có trọng âm khác các từ còn lại.", "options": ["artist", "perform", "concert", "music"], "answer": 1, "explain_vi": "perform nhấn âm 2 (per-FORM). artist, concert, music nhấn âm 1 – phần lớn danh từ 2 âm tiết nhấn âm 1 (buổi 2)."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] This picture ______ by a ten-year-old girl last year.", "options": ["was painted", "paint", "is painting", "paints"], "answer": 0, "explain_vi": "Bức tranh được vẽ (bị động), có 'last year' → quá khứ: was + V3 → was painted (buổi 8)."}, {"format": "synonym", "q": "[Đồng nghĩa] My grandma is very HONEST; she never tells lies.", "options": ["angry", "lazy", "truthful", "funny"], "answer": 2, "explain_vi": "honest = thật thà = truthful (luôn nói thật). Vế sau 'never tells lies' là gợi ý (buổi 11)."}, {"format": "antonym", "q": "[Trái nghĩa] The museum was very CROWDED on Sunday morning.", "options": ["empty", "full", "busy", "noisy"], "answer": 0, "explain_vi": "crowded = đông đúc; trái nghĩa là empty = vắng tanh. full, busy gần nghĩa với crowded (buổi 6)."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: Thank you for helping me with my homework.\nB: ______", "options": ["Yes, please.", "Good idea!", "I'm sorry.", "You're welcome."], "answer": 3, "explain_vi": "Đáp lại lời cảm ơn: You're welcome (Không có gì). 'Yes, please' dùng để nhận lời mời (buổi 4, 10)."}, {"format": "error_id", "q": "[Tìm lỗi sai] My sister enjoys to dance in the school show.", "options": ["enjoys", "to dance", "in", "school show"], "answer": 1, "explain_vi": "enjoy + V-ing → enjoys dancing, không dùng 'to dance' (buổi 13)."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] 'I live in Huế,' said Nam.", "options": ["Nam said that he lived in Hà Nội.", "Nam said that I lived in Huế.", "Nam said that he lived in Huế.", "Nam said that he didn't live in Huế."], "answer": 2, "explain_vi": "live → lived; I → he; thành phố vẫn là Huế và câu vẫn khẳng định (buổi 12)."}, {"format": "sentence_combining", "q": "[Nối câu] This is my friend. She can sing very well.", "options": ["This is my friend who can sing very well.", "This is my friend which can sing very well.", "This is my friend where can sing very well.", "This is my friend whose can sing very well."], "answer": 0, "explain_vi": "'my friend' là người → dùng who. which cho vật, where cho nơi chốn, whose + danh từ (buổi 11)."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] If you are free on Sunday, we ______ to the cinema together.", "options": ["went", "going", "will go", "goes"], "answer": 2, "explain_vi": "Điều kiện loại 1: If + hiện tại đơn (are), will + V nguyên mẫu → will go (buổi 10)."}]}], "exam_plus": [{"format": "mixed", "title_vi": "Đề thi thu nhỏ", "intro_vi": "10 câu khó trộn các dạng của đề Chuyên Ngoại ngữ và đề Sở, mức câu phân loại: âm khó, trọng âm từ 4 âm tiết, nhiễu gần nghĩa, bẫy mệnh đề quan hệ, tường thuật, điều kiện.", "tip_vi": "Mẹo: đừng chọn ngay đáp án 'nghe quen'. Kiểm tra từng phương án: đúng ngữ pháp chưa, đúng nghĩa câu gốc chưa, có thừa hay thiếu ý nào không.", "kind": "mcq", "items": [{"format": "pronunciation", "q": "[Phát âm] Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["[[ch]]aracter", "[[ch]]emist", "[[ch]]allenge", "[[ch]]orus"], "answer": 2, "explain_vi": "challenge đọc /tʃ/. character, chemist, chorus là từ gốc Hy Lạp nên 'ch' đọc /k/."}, {"format": "stress", "q": "[Trọng âm] Chọn từ có trọng âm khác các từ còn lại.", "options": ["scientific", "experiment", "photographer", "biology"], "answer": 0, "explain_vi": "scientific nhấn âm 3 (đuôi -ic: trọng âm ngay trước -ic: scien-TIF-ic). experiment, photographer, biology nhấn âm 2."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] There is ______ evidence that this drink improves your memory, so most scientists don't trust the advert.", "options": ["a little", "little", "a few", "few"], "answer": 1, "explain_vi": "evidence không đếm được → little/a little. Vế sau 'don't trust' cho thấy nghĩa tiêu cực (gần như không có) → little (buổi 9)."}, {"format": "synonym", "q": "[Đồng nghĩa] After months of research, the team finally CAME UP WITH a solution to the problem.", "options": ["rejected", "searched for", "discussed", "devised"], "answer": 3, "explain_vi": "come up with = nghĩ ra = devise. 'searched for' chỉ là tìm kiếm, chưa chắc tìm ra; rejected = bác bỏ (buổi 12)."}, {"format": "antonym", "q": "[Trái nghĩa] Her first novel received a lot of PRAISE from the critics.", "options": ["criticism", "attention", "admiration", "support"], "answer": 0, "explain_vi": "praise = lời khen ngợi; trái nghĩa là criticism = lời chỉ trích. admiration, support gần nghĩa với praise."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: Would you mind if I borrowed your notes from the science lesson?\nB: ______", "options": ["Yes, I'd love to.", "Not at all. Here you are.", "No, I wouldn't borrow them.", "Never mind."], "answer": 1, "explain_vi": "Would you mind…? = Bạn có phiền không? Đồng ý thì đáp 'Not at all' (không phiền gì) rồi đưa vở: Here you are."}, {"format": "error_id", "q": "[Tìm lỗi sai] The museum, that was built in 1910, has recently been turned into an art gallery.", "options": ["that", "was built", "has recently been", "into"], "answer": 0, "explain_vi": "Mệnh đề không xác định (giữa hai dấu phẩy) không dùng 'that' → which was built (buổi 11). Các phần bị động đều đúng (buổi 8)."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] 'You should rehearse more before the show,' the director said to the actors.", "options": ["The director ordered the actors not to rehearse before the show.", "The director told the actors that they had rehearsed enough before the show.", "The director asked the actors whether they rehearsed more before the show.", "The director advised the actors to rehearse more before the show."], "answer": 3, "explain_vi": "should = lời khuyên → advise sb to do sth. Các câu khác sai nghĩa: cấm tập, đã tập đủ, hay hỏi (buổi 12, 13)."}, {"format": "sentence_combining", "q": "[Nối câu] The singer was born in Huế. Her songs are loved by millions of people.", "options": ["The singer, who was born in Huế, loves the songs of millions of people.", "The singer, that was born in Huế, has songs loved by millions of people.", "The singer, whose songs are loved by millions of people, was born in Huế.", "Born in Huế, millions of people love the singer's songs."], "answer": 2, "explain_vi": "Her songs → whose songs (sở hữu). A đổi nghĩa; B dùng 'that' sau dấu phẩy; D sai chủ ngữ (millions of people không sinh ở Huế) (buổi 11)."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] You won't be allowed into the exhibition ______ you show your student card.", "options": ["unless", "if", "as long as", "provided"], "answer": 0, "explain_vi": "unless = if … not: không được vào nếu KHÔNG xuất trình thẻ. if / as long as / provided làm câu thành vô lý (buổi 10)."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Dành cho mức Nâng cao. Câu 1–2: viết dạng đúng của từ in hoa (có thể phải thêm cả tiền tố lẫn hậu tố). Câu 3–4: viết lại câu sao cho nghĩa không đổi, bắt đầu bằng phần cho sẵn. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d14H1", "q": "Throwing rubbish into the river is an act of complete ______. (RESPONSIBLE)", "answer": "irresponsibility", "accept": []}, {"id": "d14H2", "q": "The audience waited ______ for the band to come on stage; the concert was already an hour late. (PATIENT)", "answer": "impatiently", "accept": []}, {"id": "d14H3", "q": "'Somebody stole my bike yesterday,' Nam told me. → Nam told me that his bike ______", "answer": "had been stolen the day before", "accept": ["had been stolen the previous day", "had been stolen the day before by somebody", "had been stolen by somebody the day before"]}, {"id": "d14H4", "q": "I don't have enough money, so I can't buy a ticket for the concert. → If I ______", "answer": "had enough money, I could buy a ticket for the concert", "accept": ["had enough money I could buy a ticket for the concert", "had enough money, I would be able to buy a ticket for the concert", "had enough money I would be able to buy a ticket for the concert", "had enough money, I'd be able to buy a ticket for the concert", "had enough money, I would buy a ticket for the concert", "had enough money, I'd buy a ticket for the concert"]}, {"id": "d14H5", "q": "It isn't always easy to ______ a balance between schoolwork and hobbies.", "options": ["make", "strike", "hit", "take"], "answer": "B"}, {"id": "d14H6", "q": "We have ______ eggs, so we can't make pancakes this morning.", "options": ["run over", "run into", "run across", "run out of"], "answer": "D"}]}}}, "media": {"1": {"video": {"id": "xFsYrTIndhI", "title": "Present Simple and Present Continuous - 6 Minute Grammar", "channel": "BBC Learning English", "why_vi": "Giải thích khi nào dùng hiện tại đơn (thói quen, sự thật) và hiện tại tiếp diễn (đang xảy ra, tạm thời); xem cả video và làm quiz cuối (khoảng phút 5); động từ trạng thái (stative verbs) được luyện thêm ở bài iSL Kung Fu Panda."}, "isl": [{"title": "Grammar Gameshow: Present Simple vs. Present Continuous", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/present-simple-vs-present-continuous/452815", "kind": "video", "note_vi": "Con xem gameshow của BBC và trả lời câu hỏi chọn hiện tại đơn hay hiện tại tiếp diễn ngay trong video."}, {"title": "Barbie - Present Simple vs. Present Continuous", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/guided-grammar-production/present-simple-vs-continuous-progressive-tense/barbie-present-simple-vs-present-continuous/869175", "kind": "video", "note_vi": "Con xem đoạn phim Barbie rồi quyết định dùng hiện tại đơn hay hiện tại tiếp diễn cho từng câu."}, {"title": "Kung Fu Panda - Stative Verbs", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/kung-fu-panda-stative-verbs/644027", "kind": "video", "note_vi": "Con xem Kung Fu Panda và chọn dạng đúng của động từ trạng thái (know, like, want...) – nhớ là chúng thường không chia tiếp diễn."}]}, "2": {"video": {"id": "uTB5I8V9Eog", "title": "Past simple and past continuous - 6 Minute Grammar", "channel": "BBC Learning English", "why_vi": "Phân biệt quá khứ đơn và quá khứ tiếp diễn (hành động đang diễn ra thì bị hành động khác xen vào, when/while); xem cả video, quiz bắt đầu khoảng 4:31; video không dạy 'used to' – phần này luyện ở bài iSL Coca Cola."}, "isl": [{"title": "Past Simple and Continuous A1/A2", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/past-simple-and-continuous-a1a2/644537", "kind": "video", "note_vi": "Con xem video và làm câu hỏi trắc nghiệm về quá khứ đơn/quá khứ tiếp diễn với when và while (mức A1/A2, dễ khởi động)."}, {"title": "Watermelon - Past Simple vs. Past Continuous", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/past-simple-or-past-continuous-tense/watermelon-past-simple-vs-past-continuous/421641", "kind": "video", "note_vi": "Con xem phim ngắn, nối hai hành động, sắp xếp lại câu và chọn thì đúng."}, {"title": "Coca Cola - Comparing Past & Present Lifestyles", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/past-tense-used/coca-cola-living-a-healthy-lifestype/156076", "kind": "video", "note_vi": "Con xem quảng cáo so sánh lối sống xưa và nay rồi làm bài tập dùng 'used to' để nói về thói quen trong quá khứ."}]}, "3": {"video": {"id": "jwmKjgwlMk8", "title": "Present perfect and past simple - 6 Minute Grammar", "channel": "BBC Learning English", "why_vi": "So sánh hiện tại hoàn thành (kinh nghiệm, kết quả đến bây giờ) với quá khứ đơn (thời điểm xác định trong quá khứ); xem cả video và làm quiz cuối; already/yet luyện thêm ở bài iSL thứ hai."}, "isl": [{"title": "Grammar Tutorial - Present Perfect vs. Past Simple", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/present-perfect-or-past-simple-tense/grammar-tutorial-present-perfect-vs-past-simple/151847", "kind": "video", "note_vi": "Con xem video giải thích sự khác nhau giữa hiện tại hoàn thành và quá khứ đơn bằng ví dụ vui, rồi trả lời câu hỏi kiểm tra."}, {"title": "Grammar Tutorial - Present Perfect Tense With Just/Already/Yet", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/present-perfect-tenses/grammar-tutorial-present-perfect-tense-with-justalreadyyet/991002", "kind": "video", "note_vi": "Con đọc từng câu và chọn just, already hay yet cho đúng vị trí và nghĩa."}]}, "4": {"video": {"id": "lGcXggbeLH8", "title": "Grammar Snacks: Future forms", "channel": "British Council | LearnEnglish Teens", "why_vi": "Video ngắn dành cho teen, giải thích khi nào dùng will (dự đoán, quyết định tức thì), be going to (dự định) và hiện tại tiếp diễn (kế hoạch đã sắp xếp); xem cả video."}, "isl": [{"title": "Grammar Practice - Future Simple / Be going to / Present Continuous", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/future-will-or-going-to/grammar-practice-future-simple-be-going-to-present-continuous/920500", "kind": "video", "note_vi": "Con xem video và chọn will, be going to hay hiện tại tiếp diễn để hoàn thành từng câu."}, {"title": "Zootopia - Talk About The Future With Present Continuous", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/zootopia-talk-about-the-future-with-present-continuous/355943", "kind": "video", "note_vi": "Con xem cảnh phim Zootopia và trả lời 'Judy sẽ làm gì?' bằng thì hiện tại tiếp diễn chỉ kế hoạch tương lai."}]}, "5": {"video": {"id": "FAhpT7BH7GE", "title": "Comparatives and superlatives - 6 Minute Grammar", "channel": "BBC Learning English", "why_vi": "Cách tạo so sánh hơn và so sánh nhất (-er/-est, more/most, dạng bất quy tắc); xem cả video, quiz từ khoảng 4:51; too/enough luyện ở bài iSL Turning Red, so/such con ôn trong bài học chính."}, "isl": [{"title": "Frozen - Comparative and Superlative Adjectives", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/comparison-comparative-and-superlative/frozen-comparative-and-superlative-adjectives/953091", "kind": "video", "note_vi": "Con xem phim Frozen, điền dạng so sánh đúng vào chỗ trống, sắp xếp câu và tìm tính từ dùng sai."}, {"title": "4*Town - Turning Red - Enough/Too", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/too-and-enough/4town-turning-red-enoughtoo/813571", "kind": "video", "note_vi": "Con xem đoạn phim Turning Red và chọn too hay enough để hoàn thành câu."}]}, "6": {"video": {"id": "HUXXgVElADg", "title": "'Have To' and 'must' - 6 Minute Grammar", "channel": "BBC Learning English", "why_vi": "Phân biệt must và have to, đặc biệt mustn't (cấm) với don't have to (không cần); xem cả video, quiz từ khoảng 4:48; can/could/be able to và should luyện ở các bài iSL."}, "isl": [{"title": "Grammar Tutorial - Expressing Ability - Can/Could/Be Able to", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/can-or-be-able-to/can-could-and-be-able-to-for-ability/160881", "kind": "video", "note_vi": "Con xem video ngắn ôn cách dùng can, could và be able to để nói về khả năng rồi làm câu hỏi kèm theo."}, {"title": "Mr. Bean - Vacation Troubles - Must & Have To", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/mr-bean-vacation-troubles-must-have-to/427476", "kind": "video", "note_vi": "Con xem Mr. Bean đi du lịch và chọn must, mustn't, have to, has to hay don't/doesn't have to cho từng chỗ trống."}, {"title": "Simon's Cat - ive.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/reported-speech/reported-speech-prediction-game/315748", "kind": "video", "note_vi": "Con xem các đoạn phim School of Rock, đoán cách tường thuật lại câu nhân vật nói, rồi xem đáp án để tự kiểm tra."}, {"title": "Sherlock - Sherlock Is Bored - Reported Speech", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/reported-speech-reporting-verbs/sherlock-sherlock-is-bored-reported-speech/40351", "kind": "video", "note_vi": "Con xem cảnh phim Sherlock và chuyển câu nói trực tiếp sang câu tường thuật (cả câu kể và câu hỏi)."}]}, "13": {"video": {"id": "S595XIgg4ss", "title": "Verb Patterns: The Grammar Gameshow Episode 7", "channel": "BBC Learning English", "why_vi": "Gameshow về mẫu động từ khi hai động từ đi liền nhau: động từ nào theo sau là V-ing, động từ nào là to + V; xem cả video và đoán đáp án cùng người chơi."}, "isl": [{"title": "Tom & Jerry - Gerund or Infinitive", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/gerunds-and-infinitives/tom-jerry-gerund-or-infinitive/895636", "kind": "video", "note_vi": "Con xem Tom & Jerry và làm bài chọn V-ing hay to + V sau mỗi động từ."}, {"title": "Raya & The Last Dragon - Gerund or Infinitive", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/gerunds-and-infinitives/raya-the-last-dragon-gerund-or-infinitive/624805", "kind": "video", "note_vi": "Con xem phim Raya, điền danh động từ hoặc to-infinitive vào chỗ trống rồi tự nêu ý kiến bằng một trong hai dạng."}]}, "14": {"video": {"id": "DsJ6bMBLUs8", "title": "Exam skills: 6 tips to help you with reading exams", "channel": "BBC Learning English", "why_vi": "Video chiến lược làm bài thi đọc: đọc kỹ yêu cầu, đọc câu hỏi trước, skim/scan tìm từ khóa và từ đồng nghĩa, quản lý thời gian, không bỏ trống câu; xem cả video trước khi làm đề ôn tổng hợp."}, "isl": [{"title": "Grammar Gameshow - Present and Past Passives", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/passive-voice-or-active-voice/grammar-gameshow-present-and-past-passives/616061", "kind": "video", "note_vi": "Con xem gameshow của BBC và làm câu trắc nghiệm, điền chỗ trống về bị động hiện tại và quá khứ để ôn ngày 8."}, {"title": "The Grammar Gameshow - Reported Speech", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/reported-speech/the-grammar-gameshow-reported-speech/260657", "kind": "video", "note_vi": "Con tham gia gameshow và giúp người chơi trả lời các câu hỏi mẹo về câu tường thuật để ôn ngày 12."}, {"title": "Conditionals Quiz", "url": "https://en.islcollective.com/english-esl-video-lessons/grammar-practice/general-grammar-practice/conditionals/conditionals-quiz/534750", "kind": "video", "note_vi": "Con xem video và nhận diện các loại câu điều kiện để ôn ngày 10 (có cả loại 3, con chỉ cần nhận ra nó khác loại 2)."}]}}, "media_vi": {"1": [{"id": "DPtvsmMW8WE", "title": "Đừng nhầm lẫn Thì hiện tại đơn với Thì hiện tại tiếp diễn! [Tổng hợp Ngữ pháp tiếng Anh]", "channel": "Elight Learning English", "minutes": 5.6, "note_vi": "Video ngắn, giảng bằng tiếng Việt cách phân biệt hiện tại đơn (thói quen, sự thật) với hiện tại tiếp diễn (đang xảy ra), rất vừa sức học sinh lớp 7."}, {"id": "wJE_mAvrNeI", "title": "[English Tenses] STATIVE VERBS - Động từ trạng thái", "channel": "Lớp tiếng Anh cô Quỳnh - MyPas", "minutes": null, "note_vi": "Video bổ sung về động từ trạng thái (like, know, want...) và vì sao thường không chia ở thì tiếp diễn."}], "2": [{"id": "WwXpGX8b_-M", "title": "Phân Biệt Thì Quá Khứ Đơn và Quá Khứ Tiếp Diễn - Bài 9 | TLH English", "channel": "TLH ENGLISH", "minutes": null, "note_vi": "Giảng tiếng Việt cách phân biệt quá khứ đơn và quá khứ tiếp diễn (hành động đang diễn ra thì hành động khác xen vào, when/while)."}, {"id": "HIfHNoj-wIA", "title": "Bài 71: Cách Dùng Used To Trong Tiếng Anh", "channel": "A To Z English", "minutes": null, "note_vi": "Bài riêng về cấu trúc used to + V để nói thói quen trong quá khứ nay không còn, kèm câu phủ định và câu hỏi."}], "3": [{"id": "rI-1l_dKNL0", "title": "Phân Biệt Thì Quá Khứ Đơn và Hiện Tại Hoàn Thành - Bài 7 | TLH English", "channel": "TLH ENGLISH", "minutes": null, "note_vi": "Cùng loạt bài với ngày 2, giải thích khi nào dùng hiện tại hoàn thành, khi nào dùng quá khứ đơn, dựa vào mốc thời gian và các dấu hiệu."}, {"id": "RGkMeGwb9Fo", "title": "[Ngữ Pháp Tiếng Anh] Bài #6: THÌ HIỆN TẠI HOÀN THÀNH - Nắm Vững Các Thì Trong Tiếng Anh", "channel": "KISS English Center", "minutes": null, "note_vi": "Cô Thủy (KISS English) ôn kỹ công thức, cách dùng và dấu hiệu của hiện tại hoàn thành (for, since, already, yet, ever, never), có bài tập."}], "4": [{"id": "05aiMybSMf0", "title": "Tự Học Ielts Grammar Cách Phân Biệt 2 Thì Tương Lai Và Hiện Tại Tiếp Diễn - Ielts Langgo", "channel": "Luyện Thi IELTS LangGo", "minutes": null, "note_vi": "Phân biệt đúng ba cách nói về tương lai của bài: will, be going to và hiện tại tiếp diễn chỉ kế hoạch đã sắp xếp."}, {"id": "Uaq2jG91fz4", "title": "Sự khác nhau giữa will và be going to: Công thức, cách dùng và bài tập", "channel": "Imax Toeic Official", "minutes": null, "note_vi": "Video phụ tập trung vào will và be going to (quyết định tức thời, dự đoán, dự định), có bài tập luyện."}], "5": [{"id": "zG69j6cTgo4", "title": "So sánh (Comparisons) - Ôn thi vào 10 môn Tiếng Anh", "channel": "Học trực tuyến OLM", "minutes": null, "note_vi": "Phần SO SÁNH: ôn so sánh hơn, so sánh nhất, so sánh bằng và so sánh kép theo chương trình THCS, hướng tới đề thi vào 10."}, {"id": "wdBKt5Ruyck", "title": "Buổi 10: Phân biệt giữa Too và Enough | Lấp hổng kiến thức-Vững bước trường chuyên | Ms Hoa Junior", "channel": "Ms Hoa Junior", "minutes": null, "note_vi": "Phần TOO/ENOUGH: phân biệt nghĩa và cấu trúc too...to và enough...to, kèm dạng bài hay gặp. Video thuộc loạt bài dành cho học sinh ôn vào trường chuyên."}], "6": [{"id": "a3kRI2wlFEI", "title": "Học 5 Modal Verbs Quan Trọng Trong Tiếng Anh Chỉ Trong 15 Phút", "channel": "FeasiBLE ENGLISH", "minutes": 12.9, "note_vi": "Giới thiệu gọn 5 động từ khuyết thiếu quan trọng (khả năng, bắt buộc, lời khuyên) với ví dụ dễ hiểu, độ dài vừa phải."}, {"id": "psU1junFZFA", "title": "Unit 11: Động từ khuyết thiếu - Modal verbs và ví dụ bài tập chi tiết có đáp án chi tiết", "channel": "IELTS Fighter", "minutes": null, "note_vi": "Bài đầy đủ hơn về can/could/be able to, must/have to, should, có bài tập và đáp án. Video có thể dài, nên xem từng phần."}], "7": [{"id": "7P5t7nw-IUI", "title": "Thuộc Lòng 12 Thì Tiếng Anh (CHỈ VỚI 23 PHÚT) Các Thì Cơ Bản Trong Tiếng Anh cho người mới bắt đầu", "channel": "KISS English Center", "minutes": null, "note_vi": "Ôn tổng hợp các thì trong khoảng 23 phút (theo tiêu đề), giúp học sinh hệ thống lại các thì đã học từ ngày 1 đến ngày 4."}, {"id": "g0KqlhYme7s", "title": "12 Thì Trong Tiếng Anh: Mẹo 3 Ngôi Nhà Nhớ Nhanh | Ms Thủy KISS English", "channel": "KISS English Center", "minutes": null, "note_vi": "Mẹo 'ba ngôi nhà' (hiện tại, quá khứ, tương lai) để nhớ nhanh cấu trúc 12 thì."}], "8": [{"id": "wGHXt79hLsw", "title": "[Ngữ Pháp Tiếng Anh] Bài #5: CÂU BỊ ĐỘNG (Passive Voice) - Làm Chủ Các Loại Câu Trong Tiếng Anh", "channel": "KISS English Center", "minutes": null, "note_vi": "Cô Thủy giảng cách chuyển câu chủ động sang bị động (be + V3/ed) và cách dùng câu bị động, phù hợp người mới."}, {"id": "QnYqFdunrh8", "title": "Câu bị động -P2- Thì quá khứ đơn với câu bị động trong tiếng Anh- Mr Minh", "channel": "Tiếng Anh Mr Minh", "minutes": null, "note_vi": "Video phụ tập trung riêng vào câu bị động thì quá khứ đơn (was/were + V3/ed), đúng phạm vi bài."}], "9": [{"id": "BFUaT9EqGig", "title": "DANH TỪ ĐẾM ĐƯỢC và KHÔNG ĐẾM ĐƯỢC Trong Tiếng Anh (Đầy Đủ Nhất) | Ms Thuỷ KISS English", "channel": "KISS English Center", "minutes": null, "note_vi": "Phân biệt danh từ đếm được và không đếm được, cách dùng chúng trong câu (nền tảng để chọn much/many, a few/a little), có bài tập cuối video."}, {"id": "L9YCf2N4Xmg", "title": "Mạo từ (Articles) - Ôn thi vào 10 môn Tiếng Anh", "channel": "Học trực tuyến OLM", "minutes": null, "note_vi": "Phần mạo từ a/an/the theo hướng ôn thi vào 10, bổ sung cho phần danh từ."}], "10": [{"id": "pYozWzbXp14", "title": "[Tổng Hợp] 4 Loại Câu Điều Kiện PHẢI THUỘC LÒNG để Làm Chủ Ngữ Pháp Tiếng Anh", "channel": "KISS English Center", "minutes": null, "note_vi": "Tổng hợp câu điều kiện loại 0, 1, 2 (và loại 3). Học sinh lớp 7 tập trung vào loại 0, 1, 2."}, {"id": "Uha9IrpZQhw", "title": "Tất cả Câu điều kiện tiếng Anh trong 10 phút", "channel": "Mất Gốc", "minutes": 10.2, "note_vi": "Bản tóm tắt ngắn, vui, đơn giản hóa các loại câu điều kiện. Hợp để xem lại nhanh."}], "11": [{"id": "l4GR6ya3Cmc", "title": "Mệnh đề quan hệ (Relative clauses) - Ôn thi vào 10 môn Tiếng Anh", "channel": "Học trực tuyến OLM", "minutes": 12.3, "note_vi": "Ôn đại từ quan hệ who/which/that/whose/where cùng mệnh đề xác định và không xác định, độ dài vừa phải, hướng tới đề thi vào 10."}, {"id": "Tn0_E8ZGEaU", "title": "MỆNH ĐỀ QUAN HỆ - Công Thức & Cách Dùng Mệnh Đề Để Quan Hệ Trong Tiếng Anh (Dễ Hiểu Nhất)", "channel": "KISS English Center", "minutes": null, "note_vi": "Cô Thủy giảng công thức và cách dùng mệnh đề quan hệ theo cách dễ hiểu cho người mới."}], "12": [{"id": "4F5urJliHIM", "title": "Câu gián tiếp (Reported speech) - Ôn thi vào 10 môn Tiếng Anh", "channel": "Học trực tuyến OLM", "minutes": null, "note_vi": "Ôn câu tường thuật theo chương trình THCS: lùi thì, đổi đại từ và trạng từ, cách dùng say/tell."}, {"id": "FTHF8uvK9bM", "title": "TẤT TẦN TẬT VỀ CÂU TƯỜNG THUẬT - P1. CÂU KỂ (STATEMENTS)", "channel": "Thuy Tip Top", "minutes": null, "note_vi": "Chỉ tập trung vào tường thuật câu kể (statements), đúng phạm vi của ngày 12."}], "13": [{"id": "Dq_8MRXvYRI", "title": "Phân biệt cách dùng động từ V-ing và To V | Học tiếng anh giao tiếp từ mất gốc", "channel": "Ms Hoa Giao Tiếp", "minutes": null, "note_vi": "Giải thích dễ hiểu khi nào động từ theo sau là V-ing, khi nào là to V, kèm ví dụ giao tiếp."}, {"id": "vxzE9WKkbzY", "title": "(Tiếng Anh Lớp 9) V, V ing, To V Học Một Lần, Nhớ Trọn Đời!", "channel": "Tiếng Anh Cấp 2 Cô Hoa", "minutes": null, "note_vi": "Video của giáo viên cấp 2, hệ thống V nguyên mẫu, V-ing và to V theo hướng làm bài thi THCS."}], "14": [{"id": "9gKv-kmT3a0", "title": "DẠNG BÀI VIẾT LẠI CÂU THƯỜNG GẶP TRONG ĐỀ THI", "channel": "Lấy Gốc Tiếng Anh Ms Hạnh", "minutes": null, "note_vi": "Ôn các dạng viết lại câu hay gặp trong đề thi, nơi bị động, câu điều kiện và mệnh đề quan hệ xuất hiện nhiều."}, {"id": "msNZzqfbXZI", "title": "Chữa đề CHUYÊN ANH 10, CHUYÊN SỞ HÀ NỘI năm 2024-2025", "channel": "Springboard Education | Lớp học nhà Xuân", "minutes": null, "note_vi": "Chữa chi tiết đề thi chuyên Anh vào 10 của Sở Hà Nội năm 2024-2025 (Amsterdam, Chu Văn An, Nguyễn Huệ, Sơn Tây). Video chữa đề có thể dài, nên xem từng phần cùng phụ huynh hoặc giáo viên."}]}}</script>
<script>
(function(){
"use strict";
const C = JSON.parse(document.getElementById('content').textContent);
const DAYS = C.days; // array indexed 0..13
const TESTS = {diag:C.tests.diagnostic, final:C.tests.final};
const KEY = 'chuyenAnh14_v1';
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
function blank(){return {name:'',code:'',student:null,diag:null,final:null,days:{},queue:{},mastered:{},plan:{min:40,dpw:6},created:Date.now()}}
let S = blank();
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(blank(),JSON.parse(raw));}}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.savedAt=Date.now();saveLocal();scheduleSync()}

/* ---------- item index ---------- */
const ITEM = {};
/* hình 3D (Microsoft Fluent Emoji, giấy phép MIT) */
const IMG='../assets/emoji/';
const DAY_ICON=['school','video-game','seedling','laptop','red-apple','airplane','glowing-star','newspaper','steaming-bowl','briefcase','handshake','microscope','performing-arts','trophy'];
const em=(n,c='',sz=36)=>`<img src="${IMG}${n}.webp" alt="" class="${c}" width="${sz}" height="${sz}" loading="lazy" decoding="async">`;
const dayIcon=(d,c,sz)=>em(DAY_ICON[d-1]||'books',c,sz);
DAYS.forEach(d=>(d.web_check||[]).forEach(it=>{ITEM[it.id]=Object.assign({day:d.day},it)}));

/* ---------- levels & hours model ----------
   Cumulative guided learning hours (Cambridge English approximations):
   A2 ≈ 180–200h, B1 ≈ 350–400h, B2 ≈ 500–600h, C1 ≈ 700–800h. */
const LEVELS=[
  {k:'preA2',name:'Dưới A2',h:0},{k:'A2',name:'A2',h:190},{k:'A2+',name:'A2+',h:280},
  {k:'B1',name:'B1',h:375},{k:'B1+',name:'B1+',h:460},{k:'B2',name:'B2',h:550},
  {k:'B2+',name:'B2+',h:650},{k:'C1',name:'C1',h:750}];
const ENTRY_H={'preA2':140,'A2':220,'A2+':300,'B1':400,'B1+':490,'B2':580};
function levelOfHours(h){let L=LEVELS[0];for(const l of LEVELS){if(h>=l.h)L=l}return L}
/* ----- mức học theo bài đầu vào ----- */
const TRACKS={nen:{name:'Nền tảng',desc:'game chậm hơn, có gợi ý; bài dạng đề mức A2; bài giấy kèm trang gợi ý'},chuan:{name:'Chuẩn',desc:'nội dung A2+–B1 như thiết kế gốc'},nang:{name:'Nâng cao',desc:'game nhanh hơn, ít gợi ý; bài dạng đề mức B1+–B2; bài giấy thêm phần thử thách H'}};
function trackFromLevel(l){if(!l)return 'chuan';if(l==='preA2'||l==='A2')return 'nen';if(l==='A2+'||l==='B1')return 'chuan';return 'nang'}
function curTrack(){return S.track||trackFromLevel(S.diag&&S.diag.level)}
function examFor(n){const W=(C.web&&C.web[n])||{};const t=curTrack();return (t==='nen'&&W.exam_easy&&W.exam_easy.length?W.exam_easy:t==='nang'&&W.exam_plus&&W.exam_plus.length?W.exam_plus:W.exam)||[]}
function trackBar(){const t=curTrack();const L=S.diag&&LEVELS.find(l=>l.k===S.diag.level);
  return `<div class="trackbar"><span>Mức của em: <b>${TRACKS[t].name}</b>${S.track?' (em tự chọn)':L?' (theo bài đầu vào: '+esc(L.name)+')':' (chưa làm bài đầu vào)'}</span><label class="small">Đổi mức <select id="trackSel">${Object.entries(TRACKS).map(([k,v])=>`<option value="${k}" ${k===t?'selected':''}>${v.name}</option>`).join('')}</select></label><span class="small muted">${esc(TRACKS[t].desc)}</span></div>`}
function wireTrack(after){const sel=$('#trackSel');if(sel)sel.onchange=()=>{const v=sel.value;S.track=v===trackFromLevel(S.diag&&S.diag.level)?null:v;save();after()}}
function levelFromBands(a,b,c){
  if(a<5) return 'preA2';
  if(b<4) return 'A2';
  if(b<7) return 'A2+';
  if(c<4) return 'B1';
  if(c<7) return 'B1+';
  return 'B2';
}
const MILESTONES=[
  {date:new Date(2027,4,31),label:'Hết lớp 7',target:'B1',h:375},
  {date:new Date(2028,4,31),label:'Hết lớp 8',target:'B2',h:550},
  {date:new Date(2029,5,1),label:'Thi vào 10',target:'C1',h:750}];
const STUDY_FACTOR=0.85; // nghỉ lễ, ôn thi học kỳ, ốm…
const CONV=0.6; // 1 giờ tự học/học thêm ≈ 0,6 giờ học chuẩn có hướng dẫn (ước tính thận trọng)
function weeksUntil(d){return Math.max(0,(d-Date.now())/(7*864e5))}

/* ---------- grading ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,;:]+$/,'').replace(/\s+/g,' ').trim()}
function isCorrect(it,val){
  if(it.type==='mcq') return Number(val)===Number(it.answer);
  if(val==null||String(val).trim()==='') return false;
  const v=norm(val); const ok=[it.answer].concat(it.accept||[]).map(norm);
  return ok.includes(v);
}
function answerText(it){return it.type==='mcq'?it.options[it.answer]:it.answer}

/* ---------- question rendering ---------- */
function renderQ(it,idx,opts={}){
  const name='q_'+it.id;
  const head=`<div class="qhead"><span class="qnum">${idx}</span>${opts.review?'<span class="review-mark">Ôn lại câu em từng sai</span>':''}${it.from_day&&!opts.review?`<span class="review-mark">Ôn xoắn ốc · buổi ${it.from_day}</span>`:''}</div>`;
  let body='';
  if(it.type==='mcq'){
    body='<div class="opts">'+it.options.map((o,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="${name}" value="${i}"><span>${esc(o)}</span></label>`).join('')+'</div>';
  }else{
    body=`<input type="text" name="${name}" id="${name}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời">`;
  }

/* ---------- spiral SVG ---------- */
function spiralSVG(size=240){
  const cx=size/2,cy=size/2; const pts=[];
  for(let i=0;i<14;i++){const t=0.9+i*0.86; const r=16+t*8; pts.push([cx+r*Math.cos(t-1.6),cy+r*Math.sin(t-1.6)])}
  let path='';for(let s=0;s<=400;s++){const t=0.9+s*(13*0.86)/400;const r=16+t*8;path+=(s?'L':'M')+(cx+r*Math.cos(t-1.6)).toFixed(1)+' '+(cy+r*Math.sin(t-1.6)).toFixed(1)}
  const dots=pts.map((p,i)=>{
    const st=dayStatus(i+1); const rev=DAYS[i].type==='review';
    const fill=st==='done'?'var(--t-done)':st==='part'?'var(--t-part)':'var(--surface)';
    const stroke=st==='done'?'var(--t-done-edge)':st==='part'?'var(--t-part-edge)':'var(--t-none-edge)';
    const txt='var(--ink)';
    return `<g><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${rev?12:10}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" ${rev?'stroke-dasharray="3 2"':''}/><text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="${txt}" font-family="Bricolage Grotesque, Plus Jakarta Sans, sans-serif">${i+1}</text></g>`}).join('');
  return `<svg viewBox="-12 -12 ${size+24} ${size+24}" role="img" aria-label="Vòng xoắn 14 buổi học"><path d="${path}" fill="none" stroke="var(--agent-tint)" stroke-width="8" stroke-linecap="round"/>${dots}</svg>`;
}

function testScore(test,ans){
  const bands={A2:[0,0],B1:[0,0],B2:[0,0]};const skills={};
  test.items.forEach(it=>{const ok=isCorrect(it,ans[it.id]);bands[it.level][1]++;if(ok)bands[it.level][0]++;
    skills[it.skill]=skills[it.skill]||[0,0];skills[it.skill][1]++;if(ok)skills[it.skill][0]++});
  const total=Object.values(bands).reduce((a,b)=>a+b[0],0);
  const lv=levelFromBands(bands.A2[0],bands.B1[0],bands.B2[0]);
  return {bands,skills,total,of:test.items.length,level:lv,hours:ENTRY_H[lv],at:Date.now()};
}

/* ----- aggregate ----- */
function agg(){
  const done=[],web=[0,0],paper=[0,0],skills={};const dates=[];
  for(let i=1;i<=14;i++){const r=S.days[i];if(!r)continue;
    if(r.web){web[0]+=r.web.correct;web[1]+=r.web.total;dates.push(r.web.at);Object.entries(r.web.bySkill||{}).forEach(([k,v])=>{skills[k]=skills[k]||[0,0];skills[k][0]+=v[0];skills[k][1]+=v[1]})}
    if(r.paper){paper[0]+=r.paper.correct;paper[1]+=r.paper.total;if(!r.web)dates.push(r.paper.at)}
    if(dayStatus(i)==='done')done.push(i)}
  dates.sort();
  const span=dates.length>1?Math.max(1,Math.round((dates[dates.length-1]-dates[0])/864e5)+1):dates.length;
  const studyDays=new Set(dates.map(t=>new Date(t).toDateString())).size;
  const st=S.stats||{retry:[0,0],spiral:[0,0]};
  return {done,web,paper,skills,span,studyDays,retry:st.retry,spiral:st.spiral,queue:Object.keys(S.queue).length,mastered:Object.keys(S.mastered).length};
}

/* ----- plan & feasibility ----- */
function efficiency(A){
  if(A.done.length<3)return {f:1,from:false};
  const acc=pct(A.web)||0.6;const ret=pct(A.retry)!=null&&A.retry[1]>=3?pct(A.retry):acc;
  const comp=Math.min(1,A.studyDays/Math.max(1,Math.min(14,A.span)));
  let f=0.55+0.45*acc+0.15*ret+0.1*comp;f=Math.max(0.7,Math.min(1.25,f));

}

function chartSVG(entryH,hpw,eff){
  const W=720,H=300,pl=58,pr=16,pt=18,pb=40;const t0=Date.now(),t1=MILESTONES[2].date.getTime()+30*864e5;
  const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr);const hMax=850,hMin=0;const Y=h=>pt+(1-(Math.min(h,hMax)-hMin)/(hMax-hMin))*(H-pt-pb);
  const bands=[['Dưới A2',0,190],['A2',190,375],['B1',375,550],['B2',550,750],['C1',750,850]];
  let g='';
  bands.forEach((b,i)=>{g+=`<rect x="${pl}" y="${Y(b[2])}" width="${W-pl-pr}" height="${Y(b[1])-Y(b[2])}" fill="${i%2?'var(--surface2)':'var(--surface)'}"/><text x="${pl-8}" y="${(Y(b[1])+Y(b[2]))/2+4}" text-anchor="end" font-size="12" font-weight="600" fill="var(--muted)">${b[0]}</text>`});
  MILESTONES.forEach(m=>{const x=X(m.date.getTime());g+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${x}" y="${H-pb+16}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${m.label}</text><text x="${x}" y="${H-pb+30}" text-anchor="middle" font-size="11" fill="var(--muted)">${String(m.date.getMonth()+1).padStart(2,'0')}/${m.date.getFullYear()}</text><circle cx="${x}" cy="${Y(m.h)}" r="6" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="${x-9}" y="${Y(m.h)-9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">cần ${m.target}</text>`});
  let d='';const N=60;for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N;const h=entryH+hpw*eff*CONV*((t-t0)/(7*864e5))*STUDY_FACTOR;d+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(h).toFixed(1)}
  g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/><circle cx="${X(t0)}" cy="${Y(entryH)}" r="5" fill="var(--accent)"/><text x="${X(t0)+8}" y="${Y(entryH)-8}" font-size="11.5" font-weight="700" fill="var(--accent)">Bây giờ</text>`;
  MILESTONES.forEach(m=>{const h=project(entryH,hpw,eff,m.date);const ok=h>=m.h;g+=`<circle cx="${X(m.date.getTime())}" cy="${Y(h)}" r="5.5" fill="${ok?'var(--good)':'var(--bad)'}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dự báo trình độ theo thời gian">${g}</svg>`;
}
function verdict(entryH,eff,A){
  const dpw=S.plan.dpw, min=S.plan.min;
  const req=requiredMin(entryH,750,eff.f,MILESTONES[2].date,dpw);
  const req8=requiredMin(entryH,550,eff.f,MILESTONES[1].date,dpw);
  const need=Math.ceil(Math.max(req,req8)/5)*5;
  const notes=[];
  if(A.done.length>=7){
    const acc=pct(A.web);notes.push(`Trong ${A.done.length} buổi đã học, em đúng ${Math.round(acc*100)}% câu kiểm tra web${acc>=0.75?': nền tiếp thu tốt.':acc>=0.55?': ổn, cần ôn kỹ hơn phần sai.':': còn hổng nhiều, nên học chậm và chắc hơn.'}`);
    if(A.retry[1]>=3)notes.push(`Câu từng sai làm lại đúng ${Math.round(100*pct(A.retry))}%: ${pct(A.retry)>=0.6?'trí nhớ dài hạn đang hoạt động tốt.':'cần ôn đều hơn, đừng dồn bài.'}`);
    notes.push(`Em học ${A.studyDays} ngày trong ${A.span} ngày: ${A.studyDays/Math.max(1,A.span)>=0.8?'giữ nhịp rất tốt.':'nhịp học còn ngắt quãng, đây là yếu tố quan trọng nhất cần sửa.'}`);
  }
  let cls,head,msg;
  if(need<=45){cls='good';head='Khả thi';msg=`Với điểm xuất phát hiện tại, em cần khoảng ${need} phút/ngày, ${dpw} ngày/tuần để đạt B2 cuối lớp 8 và C1 trước kỳ thi. Mức này vừa sức nếu em giữ đều.`}
  else if(need<=80){cls='warn';head='Khả thi nếu tăng và giữ nhịp học';msg=`Em cần khoảng ${need} phút/ngày, ${dpw} ngày/tuần trong suốt lớp 7–9. Đây là mức nhiều học sinh đỗ chuyên Anh đã làm, nhưng đòi hỏi kỷ luật và lịch học cố định.`}
  else{cls='bad';head='Thử thách lớn với lịch học hiện tại';msg=`Để kịp mốc thi, em cần hơn ${need} phút/ngày. Con đường vẫn mở, nhưng nên đặt mốc đánh giá lại sau 3 tháng: nếu lên được một bậc, tiếp tục theo chuyên Anh; nếu chưa, cân nhắc giữ tiếng Anh mạnh để thi lớp chọn hoặc chuyên khác.`}
  if(min<need&&cls!=='bad')notes.push(`Lịch em đang chọn (${min} phút × ${dpw} ngày) thấp hơn mức cần (${need} phút). Kéo thanh trượt lên để xem đường dự báo thay đổi.`);
  return {cls,head,msg,notes,need};
}
function vPlan(){

  const entry=S.final&&S.final.hours>(S.diag?S.diag.hours:0)?S.final:S.diag;
  const entryH=entry?entry.hours:220;

   <div class="sim">
     <div class="slider"><label for="minR">Phút học tiếng Anh mỗi ngày (ngoài giờ ở trường, gồm cả học thêm) <output id="minO">${S.plan.min}</output></label><input type="range" id="minR" min="15" max="120" step="5" value="${S.plan.min}"></div>
     <div class="slider"><label for="dpwR">Số ngày mỗi tuần <output id="dpwO">${S.plan.dpw}</output></label><input type="range" id="dpwR" min="1" max="7" step="1" value="${S.plan.dpw}"></div>

   <p class="small muted">Cách tính: số giờ học có hướng dẫn tích lũy theo khung Cambridge (A2 khoảng 190 giờ, B1 khoảng 375, B2 khoảng 550, C1 khoảng 750), mỗi giờ tự học hoặc học thêm tính bằng 0,6 giờ học chuẩn, trừ 15% thời gian nghỉ lễ và thi học kỳ${eff.from?`, nhân hệ số hiệu quả ${eff.f} rút từ kết quả 2 tuần của em`:''}. Đây là ước tính để định hướng, không phải cam kết.</p>
