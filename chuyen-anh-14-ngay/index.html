i": ["Em có thể dùng từ vựng về truyền thông, ẩm thực, nghề nghiệp, con người, khoa học và nghệ thuật.", "Em có thể dùng câu bị động, câu điều kiện, mệnh đề quan hệ, câu tường thuật và V-ing/to V.", "Em có thể làm 6 dạng câu hỏi trắc nghiệm hay gặp trong đề thi chuyên Anh."]}], "tests": {"diagnostic": {"title_vi": "Bài kiểm tra đầu vào", "minutes": 25, "passages": [{"id": "diagP1", "level": "A2", "text": "Hi Nam,\nI'm staying with my cousins at the beach this week. Every morning we swim before breakfast, because the sea is calm then. In the afternoon it's too hot, so we stay inside and play board games. Yesterday we went on a boat trip and saw three dolphins! I'm coming home on Saturday by train. See you at football practice on Sunday.\nMinh"}, {"id": "diagP2", "level": "B1", "text": "When Linh was twelve, she noticed that many families in her building had shelves full of books that nobody read any more. So she put a small wooden box next to the lift with a sign: 'Take a book, leave a book.' At first, only her neighbours on the third floor used it. Then a man from the ground floor built a second shelf, and children started leaving notes inside the books to say what they thought of them. Two years later, the box holds more than two hundred books. Linh says the best part is not the books themselves but the conversations people now have in the lift."}, {"id": "diagP3", "level": "B2", "text": "For years, parents have complained that teenagers are lazy because they stay in bed until noon at weekends. Scientists, however, now believe that the problem is not laziness but biology. During adolescence, the body starts to produce melatonin, the hormone that makes us sleepy, about two hours later in the evening than it did in childhood. As a result, a fourteen-year-old who goes to bed at ten may simply lie awake, unable to fall asleep. Some schools have responded by pushing back the start of lessons, and the early results are promising: students arrive more alert, and fewer of them doze off in class. Critics argue that a later start only moves the problem, since teenagers will just go to bed even later. So far, though, the figures do not support this view."}], "items": [{"id": "diag01", "level": "A2", "skill": "grammar", "type": "mcq", "q": "My sister ______ to school by bus every day.", "options": ["go", "goes", "going", "is go"], "answer": 1, "explain_vi": "Thói quen hằng ngày (every day) dùng hiện tại đơn; chủ ngữ số ít 'My sister' nên động từ thêm -es: goes."}, {"id": "diag02", "level": "A2", "skill": "grammar", "type": "mcq", "q": "We ______ at home last weekend because it was raining.", "options": ["was", "are", "were", "did"], "answer": 2, "explain_vi": "'last weekend' là quá khứ; chủ ngữ 'We' đi với 'were' (không dùng 'was')."}, {"id": "diag03", "level": "A2", "skill": "grammar", "type": "mcq", "q": "My birthday is ______ 14th May.", "options": ["in", "at", "by", "on"], "answer": 3, "explain_vi": "Trước ngày cụ thể (14th May) dùng giới từ 'on'. 'in' dùng cho tháng/năm, 'at' cho giờ."}, {"id": "diag04", "level": "A2", "skill": "grammar", "type": "mcq", "q": "This is Tom's bag, and that one is ______ too.", "options": ["his", "him", "he", "he's"], "answer": 0, "explain_vi": "Cần đại từ sở hữu đứng một mình (= của cậu ấy): 'his'. 'him' là tân ngữ, 'he's' = he is."}, {"id": "diag05", "level": "A2", "skill": "vocab", "type": "mcq", "q": "I'm hungry. Can I have a ______ of bread?", "options": ["glass", "bowl", "slice", "bottle"], "answer": 2, "explain_vi": "'a slice of bread' = một lát bánh mì. 'glass' và 'bottle' dùng cho đồ uống, 'bowl' cho cơm/súp."}, {"id": "diag06", "level": "A2", "skill": "vocab", "type": "mcq", "q": "Please ______ the door. It's cold in here.", "options": ["wear", "close", "make", "turn"], "answer": 1, "explain_vi": "Trời lạnh nên cần 'close the door' (đóng cửa). 'wear' là mặc, 'make' là làm ra."}, {"id": "diag07", "level": "A2", "skill": "vocab", "type": "mcq", "q": "My grandfather is 80, but he is still very ______. He walks five kilometres every day.", "options": ["tired", "lazy", "ill", "active"], "answer": 3, "explain_vi": "Ông vẫn đi bộ 5 km mỗi ngày nên ông rất 'active' (năng động). Ba từ còn lại trái nghĩa với ý câu."}, {"id": "diag08", "level": "A2", "skill": "wordform", "type": "text", "q": "It's very ______ today, so take your umbrella. (RAIN)", "answer": "rainy", "accept": ["rainy"], "explain_vi": "Sau 'very' cần tính từ. rain (mưa) + -y → rainy (có mưa)."}, {"id": "diag09", "level": "A2", "skill": "reading", "type": "mcq", "passage": "diagP1", "q": "Why do Minh and his cousins swim before breakfast?", "options": ["It is too hot in the morning.", "They have breakfast at the beach.", "The sea is calm at that time.", "They want to see dolphins."], "answer": 2, "explain_vi": "Bài viết: 'we swim before breakfast, because the sea is calm then'. Trời nóng là vào buổi chiều, không phải buổi sáng."}, {"id": "diag10", "level": "A2", "skill": "reading", "type": "mcq", "passage": "diagP1", "q": "What will Minh do on Sunday?", "options": ["Travel home by train", "Go on a boat trip", "Play board games", "Go to football practice"], "answer": 3, "explain_vi": "'See you at football practice on Sunday.' Về nhà bằng tàu là thứ Bảy, đi thuyền là hôm qua."}, {"id": "diag11", "level": "B1", "skill": "grammar", "type": "mcq", "q": "You've finished your homework, ______?", "options": ["didn't you", "haven't you", "don't you", "have you"], "answer": 1, "explain_vi": "Câu hỏi đuôi: vế trước khẳng định 'You've (= have) finished' → đuôi phủ định cùng trợ động từ: 'haven't you?'."}, {"id": "diag12", "level": "B1", "skill": "grammar", "type": "mcq", "q": "______ the heavy rain, the match still went ahead.", "options": ["Although", "However", "Despite", "Because"], "answer": 2, "explain_vi": "Sau chỗ trống là cụm danh từ 'the heavy rain' → dùng 'Despite'. 'Although' phải đi với một mệnh đề (S + V)."}, {"id": "diag13", "level": "B1", "skill": "grammar", "type": "mcq", "q": "A: I don't like horror films.\nB: ______ do I. They're too scary.", "options": ["Neither", "So", "Too", "Either"], "answer": 0, "explain_vi": "Đồng ý với câu phủ định dùng 'Neither + trợ động từ + S' (Neither do I = Tớ cũng không). 'So do I' chỉ dùng sau câu khẳng định."}, {"id": "diag14", "level": "B1", "skill": "grammar", "type": "mcq", "q": "By the time we arrived at the cinema, the film ______.", "options": ["has started", "started", "was starting", "had started"], "answer": 3, "explain_vi": "'By the time + quá khứ đơn' → hành động xảy ra trước đó dùng quá khứ hoàn thành: had started."}, {"id": "diag15", "level": "B1", "skill": "vocab", "type": "mcq", "q": "Please ______ attention to the instructions before you start the test.", "options": ["keep", "pay", "take", "make"], "answer": 1, "explain_vi": "Cụm cố định: 'pay attention (to)' = chú ý (đến)."}, {"id": "diag16", "level": "B1", "skill": "vocab", "type": "mcq", "q": "Could you ______ my cat while I'm on holiday next week?", "options": ["look for", "look up", "look after", "look into"], "answer": 2, "explain_vi": "'look after' = chăm sóc. 'look for' = tìm kiếm, 'look up' = tra cứu, 'look into' = điều tra."}, {"id": "diag17", "level": "B1", "skill": "vocab", "type": "mcq", "q": "I'm afraid I can't come to your party. I've got a bad ______ and I can't stop coughing.", "options": ["cold", "pain", "ache", "temperature"], "answer": 0, "explain_vi": "'have a bad cold' = bị cảm nặng, hợp với 'ho không ngừng'. 'ache' phải ghép (headache...), không nói 'a bad temperature'."}, {"id": "diag18", "level": "B1", "skill": "wordform", "type": "text", "q": "Their ______ began in Grade 1, and they are still best friends today. (FRIEND)", "answer": "friendship", "accept": ["friendship"], "explain_vi": "Sau 'Their' cần danh từ. friend + -ship → friendship (tình bạn)."}, {"id": "diag19", "level": "B1", "skill": "reading", "type": "mcq", "passage": "diagP2", "q": "Why did Linh start the book box?", "options": ["Her school asked her to do it.", "The library near her building had closed.", "She wanted to sell her old books.", "Many families had books they no longer read."], "answer": 3, "explain_vi": "Câu đầu: các gia đình có 'shelves full of books that nobody read any more' – sách không ai đọc nữa. Các ý khác không có trong bài."}, {"id": "diag20", "level": "B1", "skill": "reading", "type": "mcq", "passage": "diagP2", "q": "What does Linh like most about the project?", "options": ["The large number of books", "The way neighbours now talk to each other", "The notes that children leave in the books", "The second shelf built by a neighbour"], "answer": 1, "explain_vi": "Câu cuối: 'the best part is not the books themselves but the conversations people now have' – điều Linh thích nhất là mọi người trò chuyện với nhau."}, {"id": "diag21", "level": "B2", "skill": "grammar", "type": "mcq", "q": "Hardly ______ the house when it started to pour with rain.", "options": ["we had left", "had we left", "have we left", "we left"], "answer": 1, "explain_vi": "Đảo ngữ: 'Hardly + had + S + V3 ... when ...' (vừa mới ... thì ...). Sau 'Hardly' đứng đầu câu phải đảo trợ động từ 'had'."}, {"id": "diag22", "level": "B2", "skill": "grammar", "type": "mcq", "q": "I'd rather you ______ tell anyone about this yet.", "options": ["don't", "won't", "didn't", "wouldn't"], "answer": 2, "explain_vi": "'would rather + S + quá khứ đơn' dùng để nói mong muốn về người khác ở hiện tại/tương lai → didn't tell."}, {"id": "diag23", "level": "B2", "skill": "grammar", "type": "mcq", "q": "She ______ have seen me. She walked straight past without saying hello.", "options": ["can't", "shouldn't", "needn't", "wouldn't"], "answer": 0, "explain_vi": "Suy đoán chắc chắn KHÔNG xảy ra trong quá khứ: 'can't have + V3' (chắc hẳn đã không ...)."}, {"id": "diag24", "level": "B2", "skill": "grammar", "type": "mcq", "q": "It's high time we ______ for the airport, or we'll miss the flight.", "options": ["leave", "will leave", "are leaving", "left"], "answer": 3, "explain_vi": "'It's (high) time + S + quá khứ đơn' = đã đến lúc phải làm gì → left."}, {"id": "diag25", "level": "B2", "skill": "vocab", "type": "mcq", "q": "The concert was ______ off because the singer had lost her voice.", "options": ["called", "dropped", "given", "broken"], "answer": 0, "explain_vi": "'call off' = huỷ bỏ (sự kiện). 'drop off' = ngủ gật/cho xuống xe, 'give off' = toả ra, 'break off' = cắt đứt."}, {"id": "diag26", "level": "B2", "skill": "vocab", "type": "mcq", "q": "After months of training, the team finally ______ their goal of playing in the final.", "options": ["won", "earned", "gained", "achieved"], "answer": 3, "explain_vi": "Kết hợp từ: 'achieve a goal' = đạt được mục tiêu. Không nói 'win/earn/gain a goal' với nghĩa này."}, {"id": "diag27", "level": "B2", "skill": "vocab", "type": "mcq", "q": "Lan ______ a lot of effort into her science project, and it really showed.", "options": ["put", "made", "did", "gave"], "answer": 0, "explain_vi": "Cụm cố định: 'put effort into something' = dồn công sức vào. ('make an effort' không đi với 'into'.)"}, {"id": "diag28", "level": "B2", "skill": "wordform", "type": "text", "q": "There must be a ______. I ordered tea, not coffee. (UNDERSTAND)", "answer": "misunderstanding", "accept": ["misunderstanding"], "explain_vi": "Sau 'a' cần danh từ, nghĩa là sự hiểu lầm: mis- + understand + -ing → misunderstanding."}, {"id": "diag29", "level": "B2", "skill": "reading", "type": "mcq", "passage": "diagP3", "q": "According to the passage, why do many teenagers find it hard to fall asleep early?", "options": ["Their bodies start producing a sleep hormone later in the evening.", "They spend too long looking at their phones at night.", "Their schools start lessons too late in the morning.", "They are lazier than they were as children."], "answer": 0, "explain_vi": "Bài viết: cơ thể tiết hormone melatonin muộn hơn khoảng 2 tiếng. Bài phủ nhận ý 'lười', và không nhắc đến điện thoại."}, {"id": "diag30", "level": "B2", "skill": "reading", "type": "mcq", "passage": "diagP3", "q": "What is the writer's attitude towards later school start times?", "options": ["completely against them", "worried about how much they cost", "generally positive about them", "sure that they will fail in the long term"], "answer": 2, "explain_vi": "Tác giả gọi kết quả là 'promising' và nói số liệu 'do not support' ý kiến phản đối → thái độ nhìn chung là tích cực."}]}, "final": {"title_vi": "Bài kiểm tra sau 2 tuần", "minutes": 25, "passages": [{"id": "finP1", "level": "A2", "text": "Dear Grandma,\nThank you for the birthday present! I wear the blue jacket every day because our classroom is very cold in the morning. On Saturday, Mum took me and four friends to the zoo for my party. We saw two baby elephants and then ate pizza in the park. Next month I'm visiting you with Dad. Can we go fishing again?\nLove,\nHoa"}, {"id": "finP2", "level": "B1", "text": "Last year, Quân's class turned an empty corner of the school yard into a vegetable garden. The idea came from their science teacher, who wanted students to see where food really comes from. At first, many students thought gardening would be boring, and insects ate most of the first tomatoes. Instead of giving up, the class asked a farmer for advice and planted flowers between the vegetables to keep the insects away. This spring, they grew enough lettuce to sell at the school fair. Quân says the money was nice, but he is prouder that his classmates now argue about whose turn it is to water the plants."}, {"id": "finP3", "level": "B2", "text": "Many students believe they can do their homework while chatting with friends online, and some even claim it helps them stay calm. Psychologists are not convinced. Their studies show that the brain does not really do two things at once; instead, it switches quickly between tasks, and every switch costs a little time and attention. Over an evening, these small losses add up, so homework that should take one hour may take ninety minutes, and the work is often less accurate. Interestingly, the people who consider themselves good at multitasking tend to perform worst in tests. This does not mean phones must be banned from bedrooms. A simple rule, such as checking messages only after finishing each subject, seems to bring most of the benefits without making teenagers feel cut off from their friends."}], "items": [{"id": "fin01", "level": "A2", "skill": "grammar", "type": "mcq", "q": "______ your brother like ice cream?", "options": ["Is", "Do", "Are", "Does"], "answer": 3, "explain_vi": "Câu hỏi hiện tại đơn với động từ thường 'like', chủ ngữ số ít 'your brother' → dùng 'Does'."}, {"id": "fin02", "level": "A2", "skill": "grammar", "type": "mcq", "q": "I ______ my keys yesterday, so I couldn't open the door.", "options": ["lose", "losed", "lost", "losing"], "answer": 2, "explain_vi": "'yesterday' → quá khứ đơn. 'lose' là động từ bất quy tắc: lose – lost – lost."}, {"id": "fin03", "level": "A2", "skill": "grammar", "type": "mcq", "q": "The film starts ______ 7.30, so please don't be late.", "options": ["at", "in", "on", "by"], "answer": 0, "explain_vi": "Trước giờ cụ thể (7.30) dùng giới từ 'at'."}, {"id": "fin04", "level": "A2", "skill": "grammar", "type": "mcq", "q": "These are my sister's shoes. Please give them to ______.", "options": ["she", "her", "hers", "herself"], "answer": 1, "explain_vi": "Sau giới từ 'to' cần đại từ tân ngữ: 'her'. 'she' là chủ ngữ, 'hers' = của cô ấy."}, {"id": "fin05", "level": "A2", "skill": "vocab", "type": "mcq", "q": "I'm thirsty. Can I have a ______ of orange juice, please?", "options": ["slice", "loaf", "piece", "glass"], "answer": 3, "explain_vi": "Đồ uống dùng 'a glass of' (một cốc). 'slice/piece' dùng cho đồ ăn, 'loaf' là ổ bánh mì."}, {"id": "fin06", "level": "A2", "skill": "vocab", "type": "mcq", "q": "It's raining outside. Don't forget to take your ______.", "options": ["sunglasses", "umbrella", "scarf", "gloves"], "answer": 1, "explain_vi": "Trời mưa thì mang 'umbrella' (ô). Các đồ còn lại không dùng để che mưa."}, {"id": "fin07", "level": "A2", "skill": "vocab", "type": "mcq", "q": "My little brother is very ______. He always smiles and talks to new people.", "options": ["quiet", "shy", "friendly", "sleepy"], "answer": 2, "explain_vi": "Luôn cười và nói chuyện với người mới → 'friendly' (thân thiện). 'quiet' và 'shy' trái nghĩa với ý câu."}, {"id": "fin08", "level": "A2", "skill": "wordform", "type": "text", "q": "It's ______ today, so let's go to the park and fly a kite. (WIND)", "answer": "windy", "accept": ["windy"], "explain_vi": "Sau 'It's' cần tính từ chỉ thời tiết. wind (gió) + -y → windy (có gió)."}, {"id": "fin09", "level": "A2", "skill": "reading", "type": "mcq", "passage": "finP1", "q": "Why does Hoa wear the blue jacket every day?", "options": ["Her classroom is cold in the morning.", "Blue is her favourite colour.", "Her mum told her to wear it.", "She wants to wear it to the zoo."], "answer": 0, "explain_vi": "Bài viết: 'I wear the blue jacket every day because our classroom is very cold in the morning.'"}, {"id": "fin10", "level": "A2", "skill": "reading", "type": "mcq", "passage": "finP1", "q": "What does Hoa want to do next month?", "options": ["Visit the zoo again", "Go fishing with Grandma", "Have another party", "Eat pizza in the park"], "answer": 1, "explain_vi": "'Next month I'm visiting you ... Can we go fishing again?' Đi sở thú và ăn pizza là thứ Bảy vừa rồi."}, {"id": "fin11", "level": "B1", "skill": "grammar", "type": "mcq", "q": "Your parents haven't met my teacher yet, ______?", "options": ["have they", "haven't they", "did they", "do they"], "answer": 0, "explain_vi": "Vế trước phủ định 'haven't met' → câu hỏi đuôi khẳng định cùng trợ động từ: 'have they?'."}, {"id": "fin12", "level": "B1", "skill": "grammar", "type": "mcq", "q": "______ she was very tired, she carried on studying until midnight.", "options": ["Despite", "However", "Although", "In spite"], "answer": 2, "explain_vi": "Sau chỗ trống là mệnh đề 'she was very tired' (S + V) → dùng 'Although'. 'Despite/In spite of' đi với danh từ/V-ing."}, {"id": "fin13", "level": "B1", "skill": "grammar", "type": "mcq", "q": "A: I've never been abroad.\nB: ______ have I. I'd love to go one day.", "options": ["So", "Neither", "Either", "Also"], "answer": 1, "explain_vi": "'never' mang nghĩa phủ định → đồng ý dùng 'Neither have I' (Tớ cũng chưa từng)."}, {"id": "fin14", "level": "B1", "skill": "grammar", "type": "mcq", "q": "When I got to the station, the train ______, so I had to wait an hour for the next one.", "options": ["has already left", "already leaves", "would already leave", "had already left"], "answer": 3, "explain_vi": "Tàu rời đi TRƯỚC khi tôi đến (một hành động quá khứ khác) → quá khứ hoàn thành: had already left."}, {"id": "fin15", "level": "B1", "skill": "vocab", "type": "mcq", "q": "I always ______ a lot of mistakes when I write in a hurry.", "options": ["do", "make", "take", "have"], "answer": 1, "explain_vi": "Kết hợp từ: 'make a mistake' = mắc lỗi (không dùng 'do a mistake')."}, {"id": "fin16", "level": "B1", "skill": "vocab", "type": "mcq", "q": "We've ______ milk, so I'll go to the shop and buy some more.", "options": ["run into", "run after", "run out of", "run over"], "answer": 2, "explain_vi": "'run out of' = hết (thứ gì). 'run into' = tình cờ gặp, 'run after' = đuổi theo, 'run over' = cán qua."}, {"id": "fin17", "level": "B1", "skill": "vocab", "type": "mcq", "q": "Eating fruit, vegetables and some protein every day is part of a ______ diet.", "options": ["fair", "equal", "even", "balanced"], "answer": 3, "explain_vi": "Kết hợp từ: 'a balanced diet' = chế độ ăn cân bằng. Không nói 'fair/equal/even diet'."}, {"id": "fin18", "level": "B1", "skill": "wordform", "type": "text", "q": "To use the swimming pool, you need a ______ card. (MEMBER)", "answer": "membership", "accept": ["membership"], "explain_vi": "Cần danh từ: member + -ship → membership (tư cách hội viên); 'membership card' = thẻ hội viên."}, {"id": "fin19", "level": "B1", "skill": "reading", "type": "mcq", "passage": "finP2", "q": "Whose idea was the vegetable garden?", "options": ["The students'", "A farmer's", "Their science teacher's", "Quân's parents'"], "answer": 2, "explain_vi": "'The idea came from their science teacher'. Người nông dân chỉ cho lời khuyên sau đó."}, {"id": "fin20", "level": "B1", "skill": "reading", "type": "mcq", "passage": "finP2", "q": "What is Quân most proud of?", "options": ["The money they made at the fair", "The tomatoes they grew in the first year", "The flowers they planted between the vegetables", "How keen his classmates now are to look after the plants"], "answer": 3, "explain_vi": "Câu cuối: tiền thì vui, nhưng Quân tự hào hơn vì các bạn giờ tranh nhau tưới cây – tức là ai cũng muốn chăm vườn."}, {"id": "fin21", "level": "B2", "skill": "grammar", "type": "mcq", "q": "No sooner ______ onto the stage than the audience began to cheer.", "options": ["had she stepped", "she had stepped", "has she stepped", "she stepped"], "answer": 0, "explain_vi": "Đảo ngữ: 'No sooner + had + S + V3 ... than ...' (vừa mới ... thì ...)."}, {"id": "fin22", "level": "B2", "skill": "grammar", "type": "mcq", "q": "I'd rather you ______ your phone during dinner.", "options": ["don't use", "didn't use", "won't use", "wouldn't use"], "answer": 1, "explain_vi": "'would rather + S + quá khứ đơn' khi muốn người khác làm/không làm gì → didn't use."}, {"id": "fin23", "level": "B2", "skill": "grammar", "type": "mcq", "q": "The experiment ______ have gone wrong. The results look perfect.", "options": ["hadn't", "needn't", "can't", "wouldn't"], "answer": 2, "explain_vi": "Suy đoán chắc chắn điều gì KHÔNG xảy ra trong quá khứ: 'can't have + V3'."}, {"id": "fin24", "level": "B2", "skill": "grammar", "type": "mcq", "q": "It's about time you ______ your room. It's a complete mess!", "options": ["tidy", "will tidy", "are tidying", "tidied"], "answer": 3, "explain_vi": "'It's (about/high) time + S + quá khứ đơn' = đã đến lúc phải làm gì → tidied."}, {"id": "fin25", "level": "B2", "skill": "vocab", "type": "mcq", "q": "After weeks of failed experiments, the team finally ______ a cheaper way to clean the water.", "options": ["came across", "came up with", "came down with", "came round to"], "answer": 1, "explain_vi": "'come up with' = nghĩ ra (ý tưởng, giải pháp). 'come across' = tình cờ thấy, 'come down with' = bị ốm, 'come round to' = dần chấp nhận (ý kiến)."}, {"id": "fin26", "level": "B2", "skill": "vocab", "type": "mcq", "q": "The new school rules will ______ effect next Monday.", "options": ["make", "get", "do", "take"], "answer": 3, "explain_vi": "Cụm cố định: 'take effect' = bắt đầu có hiệu lực."}, {"id": "fin27", "level": "B2", "skill": "vocab", "type": "mcq", "q": "She ______ most of her free time to helping at the animal shelter.", "options": ["devotes", "spends", "uses", "takes"], "answer": 0, "explain_vi": "'devote time to + V-ing' = dành (hết lòng) thời gian cho việc gì. 'spend time' đi với 'on' hoặc V-ing, không đi với 'to'."}, {"id": "fin28", "level": "B2", "skill": "wordform", "type": "text", "q": "Sorry, I ______ the question, so my answer was completely wrong. (UNDERSTAND)", "answer": "misunderstood", "accept": ["misunderstood"], "explain_vi": "Cần động từ quá khứ mang nghĩa 'hiểu sai': mis- + understand → misunderstand → quá khứ: misunderstood."}, {"id": "fin29", "level": "B2", "skill": "reading", "type": "mcq", "passage": "finP3", "q": "According to psychologists, what happens when we try to do two things at the same time?", "options": ["The brain moves rapidly from one task to the other.", "The brain does both tasks equally well.", "We become calmer and more focused.", "We completely forget the first task."], "answer": 0, "explain_vi": "Bài viết: 'the brain does not really do two things at once; instead, it switches quickly between tasks'."}, {"id": "fin30", "level": "B2", "skill": "reading", "type": "mcq", "passage": "finP3", "q": "What is the writer's view on phones and homework?", "options": ["Phones should be banned from bedrooms.", "Students who multitask get the best results.", "A sensible rule works better than a total ban.", "Messages should always be answered quickly."], "answer": 2, "explain_vi": "Tác giả nói không cần cấm điện thoại; một quy tắc đơn giản (xem tin nhắn sau mỗi môn) mang lại phần lớn lợi ích."}]}}, "web": {"1": {"grammar_games": {"sort": {"title_vi": "Xếp mỗi câu vào đúng thì", "groups": [{"name": "Present simple", "items": ["Our school day starts at 7 a.m.", "I usually revise on Sunday evenings.", "Do you know the answer?", "She attends the art club every Friday.", "This old laptop belongs to my dad."]}, {"name": "Present continuous", "items": ["Be quiet! Mai is concentrating on her test.", "We are learning about rivers this month.", "Look! Nam is drawing on the board.", "My English is improving these days.", "Listen! The teacher is explaining the rule."]}]}, "unjumble": [{"sentence": "My sister is revising for her history test now.", "hint_vi": "Hiện tại tiếp diễn với now"}, {"sentence": "Our teacher often gives us a lot of homework.", "hint_vi": "Hiện tại đơn với often"}, {"sentence": "I don't understand why this answer is wrong.", "hint_vi": "understand là động từ trạng thái"}, {"sentence": "Are you having lunch in the canteen today?", "hint_vi": "Câu hỏi hiện tại tiếp diễn; have lunch là hành động"}, {"sentence": "Tuan rarely concentrates when the classroom is noisy.", "hint_vi": "Hiện tại đơn với rarely"}], "truefalse": [{"s": "I am knowing all the students in my class.", "ok": false, "fix": "I know all the students in my class.", "why_vi": "know là động từ trạng thái, không chia -ing."}, {"s": "Look! The teacher is coming into the room.", "ok": true, "fix": "Look! The teacher is coming into the room.", "why_vi": "'Look!' báo hiệu việc đang xảy ra lúc nói → hiện tại tiếp diễn."}, {"s": "My brother go to the library every Sunday.", "ok": false, "fix": "My brother goes to the library every Sunday.", "why_vi": "Thói quen → hiện tại đơn; chủ ngữ số ít nên go → goes."}, {"s": "We are studying a new topic in science this week.", "ok": true, "fix": "We are studying a new topic in science this week.", "why_vi": "'this week' chỉ việc tạm thời quanh hiện tại → hiện tại tiếp diễn."}, {"s": "She is wanting to join the English club.", "ok": false, "fix": "She wants to join the English club.", "why_vi": "want là động từ trạng thái, không chia -ing."}, {"s": "The school bus leaves at 6.45 every morning.", "ok": true, "fix": "The school bus leaves at 6.45 every morning.", "why_vi": "Lịch trình cố định, lặp lại mỗi sáng → hiện tại đơn."}, {"s": "Listen! Somebody sings in the next room.", "ok": false, "fix": "Listen! Somebody is singing in the next room.", "why_vi": "'Listen!' cho biết việc đang diễn ra ngay lúc nói → hiện tại tiếp diễn."}, {"s": "I think this exercise is too difficult for us.", "ok": true, "fix": "I think this exercise is too difficult for us.", "why_vi": "think = cho rằng (nêu ý kiến) → dùng hiện tại đơn."}]}, "exam": [{"format": "sentence_completion", "title_vi": "Hoàn thành câu", "intro_vi": "Đề Chuyên Ngoại ngữ có 10 câu hoàn thành câu (chọn A, B, C hoặc D). Đề Sở chuyên Anh cũng có dạng này trong phần kiến thức ngôn ngữ. Hôm nay em làm 5 câu.", "tip_vi": "Đọc hết câu trước khi chọn. Tìm từ dấu hiệu (now, every day, Look!) và giới từ đi sau chỗ trống.", "kind": "mcq", "items": [{"q": "I can't concentrate because my neighbours ______ a party right now.", "options": ["have", "are having", "has", "had"], "answer": 1, "explain_vi": "'right now' → hiện tại tiếp diễn. have a party (tổ chức tiệc) là hành động nên chia -ing được."}, {"q": "My grandfather has a wide ______ of Vietnamese history, so he can answer almost any question.", "options": ["knowledge", "curriculum", "assignment", "attendance"], "answer": 0, "explain_vi": "a wide knowledge of sth = hiểu biết rộng về điều gì."}, {"q": "Two players ______ of the school volleyball team after they moved to another city.", "options": ["dropped out", "caught up", "took up", "got on"], "answer": 0, "explain_vi": "drop out of sth = rời bỏ (đội, câu lạc bộ). Chỉ 'dropped out' đi được với 'of'."}, {"q": "This dictionary ______ to my sister, so please ask her before you use it.", "options": ["belongs", "is belonging", "belong", "are belonging"], "answer": 0, "explain_vi": "belong là động từ trạng thái, không chia -ing; chủ ngữ số ít → belongs."}, {"q": "What ______ of the new school uniform? Do you like it?", "options": ["do you think", "are you thinking", "you think", "think you"], "answer": 0, "explain_vi": "Hỏi ý kiến (think = cho rằng) → hiện tại đơn: What do you think of…?"}]}, {"format": "pronunciation", "title_vi": "Phát âm đuôi -s/-es", "intro_vi": "Đề chung vào lớp 10 thường mở đầu bằng câu ngữ âm: chọn từ có phần gạch chân phát âm khác. Đuôi -s/-es là chủ điểm rất hay gặp. Hôm nay em làm 5 câu.", "tip_vi": "Nhìn âm CUỐI của từ gốc: /s, z, ʃ, tʃ, dʒ/ → /ɪz/; /p, t, k, f, θ/ → /s/; các âm còn lại → /z/.", "kind": "mcq", "items": [{"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["revis[[es]]", "attend[[s]]", "improv[[es]]", "learn[[s]]"], "answer": 0, "explain_vi": "revise tận cùng bằng âm /z/ nên revises đọc /ɪz/; ba từ kia đọc /z/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["test[[s]]", "book[[s]]", "lesson[[s]]", "student[[s]]"], "answer": 2, "explain_vi": "lesson tận cùng bằng /n/ (âm hữu thanh) nên lessons đọc /z/; tests, books, students đọc /s/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["class[[es]]", "watch[[es]]", "box[[es]]", "go[[es]]"], "answer": 3, "explain_vi": "goes đọc /z/; classes, watches, boxes đọc /ɪz/ vì tận cùng bằng s, ch, x."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["chang[[es]]", "sentenc[[es]]", "encourag[[es]]", "laugh[[s]]"], "answer": 3, "explain_vi": "laugh tận cùng bằng âm /f/ (viết là gh) nên laughs đọc /s/; ba từ kia tận cùng ge, ce nên đọc /ɪz/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["subject[[s]]", "assignment[[s]]", "club[[s]]", "month[[s]]"], "answer": 2, "explain_vi": "club tận cùng bằng /b/ (hữu thanh) nên clubs đọc /z/; subjects, assignments, months đọc /s/."}]}], "exam_easy": [{"format": "sentence_completion", "title_vi": "Hoàn thành câu", "intro_vi": "Dạng hoàn thành câu: mỗi câu có một chỗ trống và 4 đáp án A, B, C, D. Em chọn MỘT đáp án đúng. Đề Chuyên Ngoại ngữ có 10 câu dạng này. Hôm nay em làm 5 câu ngắn.", "tip_vi": "Đọc cả câu, tìm từ dấu hiệu như now, Look!, every day, on Mondays. Thử đặt từng đáp án vào chỗ trống rồi đọc lại cả câu.", "kind": "mcq", "items": [{"q": "Look! Our teacher ______ into the classroom.", "options": ["comes", "is coming", "come", "came"], "answer": 1, "explain_vi": "'Look!' cho biết việc đang xảy ra ngay lúc nói → hiện tại tiếp diễn: is coming. 'came' là quá khứ, không hợp với Look!"}, {"q": "We ______ English on Mondays and Thursdays.", "options": ["have", "are having", "having", "has"], "answer": 0, "explain_vi": "Lịch học lặp lại mỗi tuần (on Mondays and Thursdays) → hiện tại đơn. Chủ ngữ We nên dùng have, không thêm -s."}, {"q": "I ______ this word. What does it mean?", "options": ["am not knowing", "not know", "don't know", "doesn't know"], "answer": 2, "explain_vi": "know là động từ trạng thái, không chia -ing. Chủ ngữ I nên dùng don't know (doesn't chỉ dùng với he, she, it)."}, {"q": "I read English stories every day to ______ my English.", "options": ["concentrate", "improve", "attend", "belong"], "answer": 1, "explain_vi": "improve my English = làm tiếng Anh của mình tốt hơn. concentrate cần 'on'; attend là 'tham dự'; belong là 'thuộc về'."}, {"q": "My cousin is 15. She ______ Chu Van An High School.", "options": ["learns", "studies", "goes", "attends"], "answer": 3, "explain_vi": "attend + tên trường = đi học ở trường đó. 'goes' phải có 'to' (goes to); learns, studies không đi thẳng với tên trường."}]}, {"format": "pronunciation", "title_vi": "Phát âm đuôi -s/-es", "intro_vi": "Dạng phát âm: em chọn từ có phần gạch chân đọc KHÁC ba từ còn lại. Hôm nay là đuôi -s/-es, có 3 cách đọc: /s/, /z/ và /ɪz/. Đề chung vào lớp 10 hay có câu này.", "tip_vi": "Đọc to từ gốc, nghe âm cuối: s, x, sh, ch → /ɪz/; p, t, k, f → /s/; các âm còn lại → /z/.", "kind": "mcq", "items": [{"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["cat[[s]]", "dog[[s]]", "pen[[s]]", "bag[[s]]"], "answer": 0, "explain_vi": "cat tận cùng bằng âm /t/ (vô thanh) nên cats đọc /s/. dogs, pens, bags tận cùng bằng âm hữu thanh nên đọc /z/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["bus[[es]]", "play[[s]]", "dish[[es]]", "match[[es]]"], "answer": 1, "explain_vi": "buses, dishes, matches tận cùng bằng s, sh, ch nên đuôi đọc /ɪz/ (thêm một âm tiết). plays chỉ đọc /z/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["desk[[s]]", "map[[s]]", "chair[[s]]", "cup[[s]]"], "answer": 2, "explain_vi": "desks, maps, cups tận cùng bằng /k/, /p/ nên đọc /s/. chair tận cùng bằng nguyên âm nên chairs đọc /z/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["read[[s]]", "wash[[es]]", "swim[[s]]", "sing[[s]]"], "answer": 1, "explain_vi": "wash tận cùng bằng sh /ʃ/ nên washes đọc /ɪz/. reads, swims, sings đọc /z/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["help[[s]]", "like[[s]]", "run[[s]]", "get[[s]]"], "answer": 2, "explain_vi": "run tận cùng bằng /n/ (hữu thanh) nên runs đọc /z/. helps, likes, gets tận cùng bằng /p/, /k/, /t/ nên đọc /s/."}]}], "exam_plus": [{"format": "sentence_completion", "title_vi": "Hoàn thành câu", "intro_vi": "Trong 10 câu hoàn thành câu của đề Chuyên Ngoại ngữ luôn có vài câu phân loại: 4 đáp án đều 'nghe quen', khác nhau ở cụm từ cố định hoặc nghĩa của động từ trạng thái. Hôm nay em làm 5 câu như vậy.", "tip_vi": "Đừng chọn vì 'nghe quen'. Kiểm tra từ đi kèm (giới từ, tân ngữ) và nghĩa cả câu; với see, think, have hãy xác định đó là nghĩa trạng thái hay hành động.", "kind": "mcq", "items": [{"q": "I ______ what you mean, but I still don't think the new rule is fair.", "options": ["see", "am seeing", "have been seeing", "was seeing"], "answer": 0, "explain_vi": "see ở đây nghĩa là 'hiểu' (I see what you mean) – nghĩa trạng thái nên không chia tiếp diễn."}, {"q": "At the moment, my friends and I ______ of setting up a study group for the final exams.", "options": ["think", "are thinking", "have thought", "thought"], "answer": 1, "explain_vi": "think of + V-ing = đang cân nhắc → nghĩa hành động nên chia -ing được; 'At the moment' → hiện tại tiếp diễn."}, {"q": "Students who don't ______ attention in class often struggle to keep up later.", "options": ["give", "take", "pay", "draw"], "answer": 2, "explain_vi": "Cụm cố định: pay attention (to) = chú ý. give, take không đi với attention theo nghĩa này; draw attention = thu hút sự chú ý."}, {"q": "Because of money problems, a few students ______ before they reached grade 9.", "options": ["turned out", "gave in", "broke down", "dropped out"], "answer": 3, "explain_vi": "drop out = bỏ học giữa chừng. turned out = hoá ra, gave in = chịu thua, broke down = hỏng hoặc suy sụp."}, {"q": "My grandfather is extremely ______ about birds and plants, so we often ask him questions on our walks.", "options": ["known", "knowledgeable", "knowing", "acknowledged"], "answer": 1, "explain_vi": "knowledgeable about sth = hiểu biết nhiều về. known (được biết đến), knowing (ra vẻ biết), acknowledged (được công nhận) sai nghĩa."}]}, {"format": "pronunciation", "title_vi": "Phát âm đuôi -s/-es", "intro_vi": "Câu phát âm khó trong đề thường đánh bẫy bằng chính tả: chữ cái cuối khác với âm cuối (ph, gh, que, e câm, f → ves). Hôm nay em làm 5 câu như vậy.", "tip_vi": "Đừng nhìn chữ cái cuối mà nghĩ ÂM cuối: paragraph tận cùng /f/, weigh tận cùng nguyên âm, breathe tận cùng /ð/.", "kind": "mcq", "items": [{"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["paragraph[[s]]", "technique[[s]]", "attempt[[s]]", "achieve[[s]]"], "answer": 3, "explain_vi": "achieve tận cùng bằng /v/ (hữu thanh) nên achieves đọc /z/. paragraphs (ph = /f/), techniques (que = /k/), attempts đọc /s/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["bridg[[es]]", "practis[[es]]", "breath[[es]]", "relax[[es]]"], "answer": 2, "explain_vi": "breathe tận cùng bằng /ð/, chữ e câm, nên breathes chỉ đọc /z/. bridges, practises, relaxes đọc /ɪz/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["chef[[s]]", "shelv[[es]]", "belief[[s]]", "cliff[[s]]"], "answer": 1, "explain_vi": "shelf → shelves: f đổi thành v (hữu thanh) nên đuôi đọc /z/. chefs, beliefs, cliffs vẫn tận cùng /f/ nên đọc /s/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["cough[[s]]", "graph[[s]]", "weigh[[s]]", "photograph[[s]]"], "answer": 2, "explain_vi": "weigh có gh câm, tận cùng bằng nguyên âm /eɪ/ nên weighs đọc /z/. coughs, graphs, photographs: gh, ph đọc /f/ nên đuôi là /s/."}, {"q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["advis[[es]]", "argu[[es]]", "continu[[es]]", "rescu[[es]]"], "answer": 0, "explain_vi": "advise tận cùng bằng /z/ nên advises đọc /ɪz/. argues, continues, rescues tận cùng nguyên âm /uː/ nên chỉ đọc /z/."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Thử thách dành cho học sinh mức Nâng cao. Câu 1–2: viết dạng đúng của từ in hoa (có thể phải đổi 2 lần hoặc thêm tiền tố). Câu 3–4: viết tiếp câu sau sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d1H1", "q": "Many students found the news that the entrance exam would be harder very ______. (COURAGE)", "answer": "discouraging", "accept": []}, {"id": "d1H2", "q": "Visiting the science museum was a highly ______ experience for the whole class. (EDUCATE)", "answer": "educational", "accept": []}, {"id": "d1H3", "q": "I find it hard to concentrate when the room is noisy. → I have difficulty ______", "answer": "concentrating when the room is noisy", "accept": ["in concentrating when the room is noisy"]}, {"id": "d1H4", "q": "What's your opinion of the new curriculum? → What do you ______?", "answer": "think of the new curriculum", "accept": ["think about the new curriculum"]}, {"id": "d1H5", "q": "Our teacher encourages us to ______ our own ideas for projects instead of copying from the Internet.", "options": ["catch up with", "put up with", "come up with", "keep up with"], "answer": "C", "accept": []}, {"id": "d1H6", "q": "We had to learn the whole poem ______ for the speaking test.", "options": ["in mind", "by heart", "at heart", "with heart"], "answer": "B", "accept": []}]}}, "2": {"grammar_games": {"sort": {"title_vi": "Xếp mỗi câu vào đúng nhóm ngữ pháp", "groups": [{"name": "Past simple", "items": ["I joined the chess club last month.", "We went camping two weeks ago.", "Hoa won the drawing contest in 2024."]}, {"name": "Past continuous", "items": ["At 8 p.m. yesterday, I was reading comics.", "They were practising the guitar all evening.", "My brother was swimming at that time."]}, {"name": "used to", "items": ["My dad used to play football.", "Did you use to have a pet?", "She didn't use to like painting."]}]}, "unjumble": [{"sentence": "I was taking photos when it started to rain.", "hint_vi": "Quá khứ tiếp diễn bị quá khứ đơn xen vào"}, {"sentence": "My grandfather used to collect old coins.", "hint_vi": "used to + V nguyên mẫu"}, {"sentence": "Did you use to play the piano as a child?", "hint_vi": "Câu hỏi: Did + S + use to + V?"}, {"sentence": "What were you doing when the teacher came in?", "hint_vi": "Câu hỏi quá khứ tiếp diễn + when + quá khứ đơn"}, {"sentence": "She didn't use to enjoy cooking, but now she does.", "hint_vi": "didn't use to + V"}], "truefalse": [{"s": "We didn't used to have a computer at home.", "ok": false, "fix": "We didn't use to have a computer at home.", "why_vi": "Sau did / didn't dùng 'use to', không có -d."}, {"s": "While I was drawing, my sister was listening to music.", "ok": true, "fix": "While I was drawing, my sister was listening to music.", "why_vi": "Hai việc cùng đang diễn ra trong quá khứ → cả hai vế dùng quá khứ tiếp diễn."}, {"s": "When the phone rang, I was taking a bath.", "ok": true, "fix": "When the phone rang, I was taking a bath.", "why_vi": "Việc đang diễn ra (was taking) bị việc ngắn (rang) xen vào."}, {"s": "I was knowing how to swim when I was six.", "ok": false, "fix": "I knew how to swim when I was six.", "why_vi": "know là động từ trạng thái, không chia tiếp diễn kể cả ở quá khứ."}, {"s": "My uncle use to play in a rock band.", "ok": false, "fix": "My uncle used to play in a rock band.", "why_vi": "Câu khẳng định dùng 'used to' (có -d)."}, {"s": "Did you use to be afraid of dogs?", "ok": true, "fix": "Did you use to be afraid of dogs?", "why_vi": "Câu hỏi: Did + S + use to + V nguyên mẫu."}, {"s": "I was reading when suddenly the lights were going out.", "ok": false, "fix": "I was reading when suddenly the lights went out.", "why_vi": "Hành động ngắn xen vào dùng quá khứ đơn: went out."}, {"s": "My mum used to knit, but she gave it up years ago.", "ok": true, "fix": "My mum used to knit, but she gave it up years ago.", "why_vi": "used to: thói quen cũ, nay không còn; 'years ago' → quá khứ đơn gave up."}]}, "exam": [{"format": "synonym", "title_vi": "Từ đồng nghĩa", "intro_vi": "Đề Chuyên Ngoại ngữ có 4 câu chọn từ/cụm từ gần nghĩa nhất với phần VIẾT HOA trong câu. Hôm nay em làm 5 câu.", "tip_vi": "Đoán nghĩa phần VIẾT HOA qua ngữ cảnh, rồi thay từng đáp án vào câu. Cẩn thận với đáp án mang nghĩa ngược lại.", "kind": "mcq", "items": [{"q": "Minh GAVE UP playing the piano last year because he found it boring.", "options": ["stopped", "started", "enjoyed", "practised"], "answer": 0, "explain_vi": "give up = từ bỏ ≈ stop. 'started' là nghĩa ngược lại (take up)."}, {"q": "Making short videos is a CREATIVE hobby for many teenagers.", "options": ["imaginative", "expensive", "popular", "difficult"], "answer": 0, "explain_vi": "creative (sáng tạo) ≈ imaginative (giàu trí tưởng tượng)."}, {"q": "Learning to play chess well was a real CHALLENGE for me.", "options": ["difficult task", "good chance", "great pleasure", "long holiday"], "answer": 0, "explain_vi": "challenge = thử thách, tức là một việc khó (difficult task)."}, {"q": "Ha is CRAZY ABOUT K-pop; she knows every song by heart.", "options": ["very keen on", "bored with", "afraid of", "tired of"], "answer": 0, "explain_vi": "crazy about = cực kỳ thích ≈ very keen on. Thuộc mọi bài hát là dấu hiệu rất thích."}, {"q": "I usually UNWIND by playing the guitar after a long day at school.", "options": ["relax", "practise", "perform", "study"], "answer": 0, "explain_vi": "unwind = thư giãn ≈ relax. 'after a long day' gợi ý nghỉ ngơi sau khi mệt."}]}, {"format": "stress", "title_vi": "Trọng âm từ 2 âm tiết", "intro_vi": "Đề chung vào lớp 10 thường có câu chọn từ có trọng âm khác ba từ còn lại. Hôm nay em làm 5 câu với từ 2 âm tiết.", "tip_vi": "Từ 2 âm tiết: danh từ, tính từ thường nhấn âm 1; động từ thường nhấn âm 2. Vẫn có ngoại lệ (practise), nên hãy học thuộc.", "kind": "mcq", "items": [{"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["hobby", "leisure", "collect", "member"], "answer": 2, "explain_vi": "collect /kəˈlekt/ nhấn âm 2; hobby, leisure, member nhấn âm 1."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["relax", "enjoy", "prefer", "picture"], "answer": 3, "explain_vi": "picture /ˈpɪktʃə/ nhấn âm 1; relax, enjoy, prefer là động từ nhấn âm 2."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["challenge", "comic", "puzzle", "guitar"], "answer": 3, "explain_vi": "guitar /ɡɪˈtɑː/ nhấn âm 2 dù là danh từ; challenge, comic, puzzle nhấn âm 1."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["garden", "camping", "painting", "compete"], "answer": 3, "explain_vi": "compete /kəmˈpiːt/ là động từ, nhấn âm 2; garden, camping, painting nhấn âm 1."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["begin", "become", "invite", "practise"], "answer": 3, "explain_vi": "practise /ˈpræktɪs/ là động từ nhưng nhấn âm 1; begin, become, invite nhấn âm 2."}]}], "exam_easy": [{"format": "synonym", "title_vi": "Từ đồng nghĩa", "intro_vi": "Dạng từ đồng nghĩa: trong câu có một từ VIẾT HOA, em chọn đáp án có nghĩa GIỐNG nó nhất. Đề Chuyên Ngoại ngữ có 4 câu dạng này. Hôm nay em làm 5 câu dễ.", "tip_vi": "Đọc cả câu, đoán nghĩa từ VIẾT HOA, rồi tìm đáp án cùng nghĩa. Cẩn thận: thường có một đáp án mang nghĩa NGƯỢC lại.", "kind": "mcq", "items": [{"q": "Nam had a lot of FREE time last weekend.", "options": ["busy", "little", "spare", "school"], "answer": 2, "explain_vi": "free time = spare time (thời gian rảnh). busy (bận) mang nghĩa ngược lại."}, {"q": "My dad STARTED yoga last year.", "options": ["gave up", "took up", "put on", "looked at"], "answer": 1, "explain_vi": "take up = bắt đầu một sở thích mới, giống start. gave up (từ bỏ) là nghĩa ngược lại."}, {"q": "Linh was HAPPY when she won the drawing contest.", "options": ["sad", "angry", "tired", "glad"], "answer": 3, "explain_vi": "glad = happy (vui). sad (buồn), angry (giận), tired (mệt) đều khác nghĩa."}, {"q": "My grandma's garden was very BEAUTIFUL in spring.", "options": ["small", "pretty", "old", "dirty"], "answer": 1, "explain_vi": "pretty = beautiful (đẹp). small (nhỏ), old (cũ), dirty (bẩn) đều khác nghĩa."}, {"q": "Tuan stopped his piano lessons because they were too DIFFICULT.", "options": ["hard", "easy", "short", "cheap"], "answer": 0, "explain_vi": "difficult = hard (khó). easy (dễ) là nghĩa ngược lại, đừng nhầm."}]}, {"format": "stress", "title_vi": "Trọng âm từ 2 âm tiết", "intro_vi": "Dạng trọng âm: em chọn từ có trọng âm (âm được đọc to, mạnh) ở vị trí khác ba từ còn lại. Hôm nay toàn là từ 2 âm tiết quen thuộc.", "tip_vi": "Đọc to từng từ, vỗ tay ở âm đọc mạnh. Nhớ: danh từ, tính từ thường nhấn âm 1; động từ thường nhấn âm 2.", "kind": "mcq", "items": [{"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["happy", "begin", "yellow", "football"], "answer": 1, "explain_vi": "begin /bɪˈɡɪn/ là động từ, nhấn âm 2. happy, yellow, football nhấn âm 1."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["enjoy", "relax", "music", "forget"], "answer": 2, "explain_vi": "music /ˈmjuːzɪk/ là danh từ, nhấn âm 1. enjoy, relax, forget là động từ, nhấn âm 2."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["teacher", "hobby", "hotel", "answer"], "answer": 2, "explain_vi": "hotel /həʊˈtel/ nhấn âm 2 (ngoại lệ, cần nhớ). teacher, hobby, answer nhấn âm 1."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["balloon", "swimming", "dancing", "reading"], "answer": 0, "explain_vi": "balloon /bəˈluːn/ nhấn âm 2. swimming, dancing, reading nhấn âm 1."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["visit", "listen", "open", "explain"], "answer": 3, "explain_vi": "explain /ɪkˈspleɪn/ nhấn âm 2. visit, listen, open là động từ nhưng nhấn âm 1."}]}], "exam_plus": [{"format": "synonym", "title_vi": "Từ đồng nghĩa", "intro_vi": "Câu đồng nghĩa phân loại trong đề Chuyên Ngoại ngữ thường dùng từ B2 hoặc cụm động từ, và có 2–3 đáp án na ná nghĩa nhau. Hôm nay em luyện 5 câu như vậy.", "tip_vi": "Thay từng đáp án vào câu: đáp án đúng phải giữ nguyên nghĩa và hợp cả cấu trúc (giới từ đi kèm). Loại đáp án chỉ 'gần gần' nghĩa.", "kind": "mcq", "items": [{"q": "After he retired, my grandfather DEVOTED most of his time to growing bonsai.", "options": ["spent", "wasted", "dedicated", "saved"], "answer": 2, "explain_vi": "devote time to sth = dành trọn thời gian cho ≈ dedicate. spent sai cấu trúc (spend time on/doing); wasted, saved sai nghĩa."}, {"q": "When he was a teenager, my dad was an AVID collector of football cards.", "options": ["occasional", "enthusiastic", "careless", "professional"], "answer": 1, "explain_vi": "avid = cực kỳ say mê ≈ enthusiastic. occasional (thỉnh thoảng) gần như ngược nghĩa; professional (chuyên nghiệp) không phải nghĩa của avid."}, {"q": "While we were hiking in Sa Pa, we CAME ACROSS a small waterfall that wasn't on our map.", "options": ["looked for", "walked past", "climbed up", "found by chance"], "answer": 3, "explain_vi": "come across = tình cờ gặp, tình cờ thấy ≈ find by chance. 'wasn't on our map' cho thấy họ không hề định tìm."}, {"q": "Fishing was my grandfather's favourite PASTIME when he lived in the countryside.", "options": ["hobby", "habit", "job", "sport"], "answer": 0, "explain_vi": "pastime = trò tiêu khiển ≈ hobby. habit là thói quen, job là công việc; sport chỉ là một loại hoạt động."}, {"q": "Linh PUT OFF her guitar lesson because she had a bad cold.", "options": ["cancelled", "postponed", "prepared", "missed"], "answer": 1, "explain_vi": "put off = hoãn lại ≈ postpone. cancelled (huỷ hẳn) là bẫy gần nghĩa: put off nghĩa là sẽ học vào lúc khác."}]}, {"format": "stress", "title_vi": "Trọng âm từ 2 âm tiết", "intro_vi": "Câu trọng âm khó trong đề thường chọn từ 'ngoại lệ': động từ nhấn âm 1, danh từ hay tính từ nhấn âm 2. Hôm nay em làm 5 câu có bẫy như vậy.", "tip_vi": "Đừng chỉ dựa vào từ loại. Ghi nhớ ngoại lệ hay gặp (offer, enter, travel, borrow; event, advice, career; polite, unique) và các từ tận cùng /uː/ như cartoon.", "kind": "mcq", "items": [{"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["canoe", "cartoon", "bamboo", "climbing"], "answer": 3, "explain_vi": "climbing /ˈklaɪmɪŋ/ nhấn âm 1. canoe, cartoon, bamboo nhấn âm 2: âm tiết cuối là /uː/ thường nhận trọng âm."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["offer", "attend", "enter", "travel"], "answer": 1, "explain_vi": "attend /əˈtend/ nhấn âm 2. offer, enter, travel là động từ nhưng nhấn âm 1 – ngoại lệ hay bị đánh bẫy."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["leisure", "event", "advice", "career"], "answer": 0, "explain_vi": "leisure /ˈleʒə/ nhấn âm 1. event, advice, career là danh từ nhưng nhấn âm 2."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["prefer", "suggest", "borrow", "admire"], "answer": 2, "explain_vi": "borrow /ˈbɒrəʊ/ nhấn âm 1. prefer, suggest, admire nhấn âm 2 như phần lớn động từ 2 âm tiết."}, {"q": "Chọn từ có trọng âm khác các từ còn lại.", "options": ["polite", "unique", "complete", "modern"], "answer": 3, "explain_vi": "modern /ˈmɒdn/ nhấn âm 1. polite, unique, complete là tính từ nhưng nhấn âm 2."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Thử thách dành cho học sinh mức Nâng cao. Câu 1–2: viết dạng đúng của từ in hoa (có thể phải đổi 2 lần hoặc thêm tiền tố). Câu 3–4: viết tiếp câu sau sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d2H1", "q": "The whole class clapped ______ when Minh finished his magic trick. (ENTHUSIASM)", "answer": "enthusiastically", "accept": []}, {"id": "d2H2", "q": "Many students found the drawing task dull and ______, so they quickly lost interest. (IMAGINE)", "answer": "unimaginative", "accept": []}, {"id": "d2H3", "q": "Tuan started playing badminton two years ago. → Tuan took ______", "answer": "up badminton two years ago", "accept": ["up playing badminton two years ago"]}, {"id": "d2H4", "q": "The phone rang in the middle of my piano practice. → I was ______", "answer": "practising the piano when the phone rang", "accept": ["practicing the piano when the phone rang", "doing my piano practice when the phone rang"]}, {"id": "d2H5", "q": "My grandmother has green ______; every plant in her garden grows beautifully.", "options": ["hands", "fingers", "feet", "eyes"], "answer": "B", "accept": []}, {"id": "d2H6", "q": "After a stressful week of exams, I just want to ______ my hair down and watch films all weekend.", "options": ["put", "take", "let", "get"], "answer": "C", "accept": []}]}}, "3": {"grammar_games": {"sort": {"title_vi": "Xếp mỗi câu vào đúng thì", "groups": [{"name": "Present perfect", "items": ["We have recycled 50 kg of paper so far.", "Have you ever planted a tree?", "They haven't cleaned the beach yet.", "I have just thrown away the old boxes.", "The river has been dirty since 2015."]}, {"name": "Past simple", "items": ["We planted trees last Sunday.", "The storm destroyed many houses in 2020.", "I visited Cuc Phuong two years ago.", "When did you start recycling?", "Lan picked up rubbish in the park yesterday."]}]}, "unjumble": [{"sentence": "Have you ever seen a sea turtle?", "hint_vi": "Câu hỏi hiện tại hoàn thành với ever"}, {"sentence": "We have used cloth bags since last year.", "hint_vi": "since + mốc thời gian"}, {"sentence": "The factory closed three years ago because of pollution.", "hint_vi": "… ago → quá khứ đơn"}, {"sentence": "We haven't recycled our old batteries yet.", "hint_vi": "yet đứng cuối câu phủ định"}, {"sentence": "Many species of frogs have disappeared from this area.", "hint_vi": "Hiện tại hoàn thành: kết quả còn đến bây giờ"}], "truefalse": [{"s": "We have cleaned the beach last weekend.", "ok": false, "fix": "We cleaned the beach last weekend.", "why_vi": "Có thời gian xác định (last weekend) → quá khứ đơn."}, {"s": "The air in Hanoi has become more polluted in recent years.", "ok": true, "fix": "The air in Hanoi has become more polluted in recent years.", "why_vi": "'in recent years' (những năm gần đây) đi với hiện tại hoàn thành."}, {"s": "My dad has worked at a recycling centre for ten years.", "ok": true, "fix": "My dad has worked at a recycling centre for ten years.", "why_vi": "for + khoảng thời gian, việc vẫn còn tiếp diễn → hiện tại hoàn thành."}, {"s": "I have lived here since five years.", "ok": false, "fix": "I have lived here for five years.", "why_vi": "five years là khoảng thời gian → dùng for, không dùng since."}, {"s": "Have you finished your science poster yet?", "ok": true, "fix": "Have you finished your science poster yet?", "why_vi": "yet đứng cuối câu hỏi hiện tại hoàn thành."}, {"s": "She hasn't already sorted the rubbish.", "ok": false, "fix": "She hasn't sorted the rubbish yet.", "why_vi": "Câu phủ định dùng yet ở cuối câu, không dùng already."}, {"s": "When have you started saving water?", "ok": false, "fix": "When did you start saving water?", "why_vi": "Câu hỏi với When hỏi thời điểm cụ thể → quá khứ đơn."}, {"s": "Look! Someone has thrown rubbish into the lake.", "ok": true, "fix": "Look! Someone has thrown rubbish into the lake.", "why_vi": "Việc vừa xảy ra, kết quả nhìn thấy ngay bây giờ → hiện tại hoàn thành."}]}, "exam": [{"format": "antonym", "title_vi": "Từ trái nghĩa", "intro_vi": "Đề Chuyên Ngoại ngữ có 4 câu chọn từ/cụm từ TRÁI nghĩa với phần VIẾT HOA trong câu. Hôm nay em làm 5 câu.", "tip_vi": "Hiểu nghĩa phần VIẾT HOA trước. Đề thường cài một đáp án ĐỒNG nghĩa làm bẫy, em loại nó ra trước.", "kind": "mcq", "items": [{"q": "Many people still THROW AWAY plastic bottles after using them only once.", "options": ["keep", "drop", "dump", "break"], "answer": 0, "explain_vi": "throw away (vứt đi) >< keep (giữ lại). 'dump' gần nghĩa với throw away nên là bẫy."}, {"q": "The flood caused SERIOUS damage to the village.", "options": ["minor", "heavy", "terrible", "natural"], "answer": 0, "explain_vi": "serious (nghiêm trọng) >< minor (nhỏ, không đáng kể). heavy, terrible gần nghĩa với serious."}, {"q": "This national park PROTECTS many rare species.", "options": ["destroys", "saves", "guards", "shelters"], "answer": 0, "explain_vi": "protect (bảo vệ) >< destroy (phá huỷ). saves, guards, shelters đều gần nghĩa với protect."}, {"q": "The number of tigers in the wild has DECREASED over the last 100 years.", "options": ["risen", "fallen", "dropped", "changed"], "answer": 0, "explain_vi": "decrease (giảm) >< rise (tăng). fallen, dropped cùng nghĩa 'giảm' nên là bẫy."}, {"q": "This kind of mushroom is HARMLESS, so you can eat it.", "options": ["poisonous", "natural", "delicious", "safe"], "answer": 0, "explain_vi": "harmless (vô hại) >< poisonous (có độc). 'safe' đồng nghĩa với harmless."}]}, {"format": "word_formation", "title_vi": "Dạng đúng của từ", "intro_vi": "Đề Sở chuyên Anh Hà Nội có câu viết dạng đúng của từ cho sẵn trong phần kiến thức ngôn ngữ, đôi khi đặt trong một đoạn văn. Hôm nay em làm 5 chỗ trống.", "tip_vi": "Xác định loại từ cần điền: trước danh từ là tính từ, sau a/an/the là danh từ. Nhớ đổi chính tả: fame → famous.", "kind": "gap_text", "text": "Our school is next to a small lake. Ten years ago, the lake was [1] for its pink lotus flowers. Then a factory was built nearby, and the water became [2] to fish and plants. Last year, our class started an [3] project to save the lake. Since then, we have collected bags and bags of rubbish, and we have asked visitors not to be [4] with their waste. Fish have come back, and a [5] newspaper has even written about our work.", "items": [{"answer": "famous", "accept": [], "base": "FAME", "explain_vi": "be famous for = nổi tiếng vì. fame bỏ -e, thêm -ous."}, {"answer": "poisonous", "accept": [], "base": "POISON", "explain_vi": "Sau 'became' cần tính từ: poison + -ous = poisonous (có độc)."}, {"answer": "environmental", "accept": [], "base": "ENVIRONMENT", "explain_vi": "Trước danh từ 'project' cần tính từ: environment + -al. Mạo từ 'an' hợp với từ bắt đầu bằng nguyên âm."}, {"answer": "careless", "accept": [], "base": "CARE", "explain_vi": "Nhắc khách đừng cẩu thả với rác: care + -less = careless (đuôi đã học ở buổi 2)."}, {"answer": "national", "accept": [], "base": "NATION", "explain_vi": "Trước danh từ 'newspaper' cần tính từ: nation + -al = national (toàn quốc)."}]}], "exam_easy": [{"format": "antonym", "title_vi": "Từ trái nghĩa", "intro_vi": "Dạng từ trái nghĩa: em chọn đáp án có nghĩa NGƯỢC LẠI với từ VIẾT HOA (ví dụ hot >< cold). Đề Chuyên Ngoại ngữ có 4 câu dạng này. Hôm nay em làm 5 câu dễ.", "tip_vi": "Dịch nhanh từ VIẾT HOA sang tiếng Việt rồi nghĩ từ ngược nghĩa. Nếu thấy đáp án CÙNG nghĩa với từ VIẾT HOA, đó là bẫy!", "kind": "mcq", "items": [{"q": "The beach was very CLEAN after the volunteers picked up all the rubbish.", "options": ["big", "dirty", "new", "quiet"], "answer": 1, "explain_vi": "clean (sạch) >< dirty (bẩn). Tình nguyện viên đã nhặt hết rác nên bãi biển sạch."}, {"q": "We have planted MANY trees in our school garden.", "options": ["big", "green", "few", "old"], "answer": 2, "explain_vi": "many (nhiều) >< few (ít). big, green, old không nói về số lượng."}, {"q": "My street has become very NOISY since the new market opened.", "options": ["busy", "dirty", "modern", "quiet"], "answer": 3, "explain_vi": "noisy (ồn ào) >< quiet (yên tĩnh). busy (đông đúc, nhộn nhịp) gần nghĩa với noisy nên là bẫy."}, {"q": "Please TURN OFF the lights when you leave the classroom.", "options": ["turn on", "switch off", "close", "clean"], "answer": 0, "explain_vi": "turn off (tắt) >< turn on (bật). switch off cùng nghĩa với turn off nên là bẫy."}, {"q": "It was very HOT in Hanoi last summer.", "options": ["warm", "sunny", "cold", "dry"], "answer": 2, "explain_vi": "hot (nóng) >< cold (lạnh). warm (ấm) chỉ là nóng ít hơn, không phải trái nghĩa."}]}, {"format": "word_formation", "title_vi": "Dạng đúng của từ", "intro_vi": "Dạng đúng của từ: em đổi từ in hoa thành từ đúng (thường là thêm đuôi) để điền vào chỗ trống trong đoạn văn. Đề Sở chuyên Anh có dạng này. Hôm nay có 5 chỗ trống.", "tip_vi": "Trước danh từ cần tính từ (a … park → national park). Sau is, are, was, were thường là tính từ. Đuôi hôm nay: -al, -ous, -ful.", "kind": "gap_text", "text": "Last month, our class visited Cuc Phuong. It is a big [1] park about 120 km from Hanoi. I have never seen so many tall trees before! The guide said, 'Some snakes here are [2], so please stay on the path.' We were very [3] and nobody touched the animals. We also learned about some [4] problems, like forest fires and rubbish. It was a [5] day!", "items": [{"answer": "national", "accept": [], "base": "NATION", "explain_vi": "Trước danh từ 'park' cần tính từ: nation + -al = national. national park = vườn quốc gia."}, {"answer": "dangerous", "accept": [], "base": "DANGER", "explain_vi": "Sau 'are' cần tính từ: danger + -ous = dangerous (nguy hiểm). Vì vậy mọi người phải đi trên đường mòn."}, {"answer": "careful", "accept": [], "base": "CARE", "explain_vi": "Sau 'were very' cần tính từ. Không ai chạm vào con vật → cẩn thận: care + -ful = careful."}, {"answer": "environmental", "accept": [], "base": "ENVIRONMENT", "explain_vi": "Trước danh từ 'problems' cần tính từ: environment + -al = environmental (thuộc về môi trường)."}, {"answer": "wonderful", "accept": [], "base": "WONDER", "explain_vi": "Sau 'a' và trước danh từ 'day' cần tính từ: wonder + -ful = wonderful (tuyệt vời)."}]}], "exam_plus": [{"format": "antonym", "title_vi": "Từ trái nghĩa", "intro_vi": "Câu trái nghĩa phân loại thường dùng từ B2 hoặc cụm động từ, và cài 2–3 đáp án ĐỒNG nghĩa với từ VIẾT HOA để bẫy. Hôm nay em làm 5 câu như vậy.", "tip_vi": "Loại hết các đáp án đồng nghĩa trước. Đáp án còn lại phải ngược nghĩa thật sự, không chỉ 'khác nghĩa'.", "kind": "mcq", "items": [{"q": "The government has introduced STRICT rules to limit air pollution in big cities.", "options": ["tough", "harsh", "lenient", "severe"], "answer": 2, "explain_vi": "strict (nghiêm ngặt) >< lenient (dễ dãi, khoan dung). tough, harsh, severe đều gần nghĩa với strict."}, {"q": "Thanks to last month's clean-up, the lake is FREE FROM plastic waste for the first time in years.", "options": ["clear of", "full of", "rid of", "short of"], "answer": 1, "explain_vi": "free from (không có) >< full of (đầy). clear of, rid of cùng nghĩa 'không còn'; short of = thiếu, không phải trái nghĩa."}, {"q": "The new factory has had a DETRIMENTAL effect on the river near our village.", "options": ["damaging", "harmful", "negative", "beneficial"], "answer": 3, "explain_vi": "detrimental (gây hại) >< beneficial (có lợi). damaging, harmful, negative đều đồng nghĩa với detrimental."}, {"q": "Our club SET UP a recycling point at the school gate last year.", "options": ["closed down", "started", "put up", "built"], "answer": 0, "explain_vi": "set up (lập ra) >< close down (đóng cửa, giải thể). started, put up, built đều gần nghĩa với set up."}, {"q": "In recent years, fresh water has become SCARCE in some parts of the Mekong Delta.", "options": ["rare", "limited", "plentiful", "precious"], "answer": 2, "explain_vi": "scarce (khan hiếm) >< plentiful (dồi dào). rare, limited gần nghĩa; precious (quý giá) không phải trái nghĩa."}]}, {"format": "word_formation", "title_vi": "Dạng đúng của từ", "intro_vi": "Câu cấu tạo từ khó trong đề Sở chuyên Anh thường bắt đổi từ 2 lần (drama → dramatic → dramatically) hoặc có chính tả đặc biệt. Hôm nay em làm 5 chỗ trống như vậy.", "tip_vi": "Xác định loại từ cần điền, rồi soát chính tả: disaster → disastrous (mất e), -ic → -ically. Nhớ cụm cố định như environmentally friendly.", "kind": "gap_text", "text": "Over the last twenty years, the beach in my hometown has changed [1]. Hotels and restaurants have appeared everywhere, and the effect on the sea has been [2]: in 2019, thousands of dead fish washed up on the sand. Since then, local people have tried to live in a more [3] friendly way. Volunteers have organised [4] clean-ups, and last year the town launched an [5] plan to ban single-use plastic by 2030.", "items": [{"answer": "dramatically", "accept": [], "base": "DRAMA", "explain_vi": "Bổ nghĩa cho động từ 'has changed' cần trạng từ: drama → dramatic → dramatically (-ic → -ically)."}, {"answer": "disastrous", "accept": [], "base": "DISASTER", "explain_vi": "Sau 'has been' cần tính từ: disaster + -ous, bỏ e → disastrous (không viết disasterous)."}, {"answer": "environmentally", "accept": [], "base": "ENVIRONMENT", "explain_vi": "Cụm cố định environmentally friendly (thân thiện với môi trường): trạng từ bổ nghĩa cho tính từ friendly."}, {"answer": "numerous", "accept": ["innumerable"], "base": "NUMBER", "explain_vi": "Trước danh từ số nhiều 'clean-ups' cần tính từ: number → numerous (rất nhiều)."}, {"answer": "ambitious", "accept": [], "base": "AMBITION", "explain_vi": "Sau 'an' và trước danh từ 'plan' cần tính từ: ambition → ambitious (đầy tham vọng)."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Thử thách dành cho học sinh mức Nâng cao. Câu 1–2: viết dạng đúng của từ in hoa (có thể phải đổi 2 lần hoặc thêm tiền tố). Câu 3–4: viết tiếp câu sau sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d3H1", "q": "The ______ of the hills around the village has led to more landslides in the rainy season. (FOREST)", "answer": "deforestation", "accept": []}, {"id": "d3H2", "q": "Most of the packaging in this shop is ______, so customers can put it in the blue recycling bins. (CYCLE)", "answer": "recyclable", "accept": []}, {"id": "d3H3", "q": "The last time I saw a firefly was five years ago. → I haven't ______", "answer": "seen a firefly for five years", "accept": ["seen a firefly in five years", "seen any fireflies for five years"]}, {"id": "d3H4", "q": "This is the first time I have visited a recycling plant. → I have never ______", "answer": "visited a recycling plant before", "accept": ["been to a recycling plant before"]}, {"id": "d3H5", "q": "Cutting down rainforests ______ a serious threat to many rare species.", "options": ["makes", "takes", "poses", "does"], "answer": "C", "accept": []}, {"id": "d3H6", "q": "The saola is a critically ______ species that lives in the Truong Son mountains.", "options": ["dangerous", "endangered", "extinct", "threatening"], "answer": "B", "accept": []}]}}, "4": {"grammar_games": {"sort": {"title_vi": "Chỗ trống cần will, be going to hay hiện tại tiếp diễn? Xếp mỗi câu vào đúng nhóm.", "groups": [{"name": "will: quyết định ngay, lời hứa, lời đề nghị", "items": ["That bag looks heavy. I ___ (carry) it for you.", "It's dark in here. I ___ (switch) on the light.", "I promise I ___ (not / forget) your birthday."]}, {"name": "be going to: dự đoán có dấu hiệu trước mắt", "items": ["Watch out! You ___ (drop) your new phone!", "My battery is at 1%. It ___ (die) soon.", "Look! That boy ___ (fall) off his bike."]}, {"name": "Hiện tại tiếp diễn: lịch hẹn đã sắp xếp", "items": ["I ___ (meet) Lan at the cinema at 7 tonight.", "I ___ (see) the dentist at 4 p.m. tomorrow.", "Our class ___ (visit) the science museum next Monday."]}]}, "unjumble": [{"sentence": "My sister is going to buy a new digital camera.", "hint_vi": "be going to: dự định đã có từ trước"}, {"sentence": "We are visiting the technology fair on Saturday morning.", "hint_vi": "Hiện tại tiếp diễn: lịch hẹn đã sắp xếp"}, {"sentence": "I promise I won't use my phone in class.", "hint_vi": "will: lời hứa (phủ định won't)"}, {"sentence": "I think people will rely on robots in the future.", "hint_vi": "will: dự đoán theo ý kiến (I think)"}, {"sentence": "Wait a minute, I'll fix your headphones for you.", "hint_vi": "will: đề nghị giúp ngay lúc nói"}], "truefalse": [{"s": "She going to buy a new laptop next week.", "ok": false, "fix": "She is going to buy a new laptop next week.", "why_vi": "be going to cần có động từ be: she is going to."}, {"s": "A: My bag is so heavy. B: I'll carry it for you.", "ok": true, "fix": "A: My bag is so heavy. B: I'll carry it for you.", "why_vi": "Đề nghị giúp ngay lúc nói → will + V."}, {"s": "I will to call you when I get home.", "ok": false, "fix": "I will call you when I get home.", "why_vi": "Sau will là động từ nguyên thể không có to."}, {"s": "We are flying to Phú Quốc on Saturday. Dad has booked the tickets.", "ok": true, "fix": "We are flying to Phú Quốc on Saturday. Dad has booked the tickets.", "why_vi": "Đã đặt vé = lịch đã sắp xếp → hiện tại tiếp diễn."}, {"s": "Look at that man! He will fall into the lake.", "ok": false, "fix": "Look at that man! He is going to fall into the lake.", "why_vi": "Có dấu hiệu nhìn thấy trước mắt (Look!) → be going to."}, {"s": "I think computers will become even smaller in the future.", "ok": true, "fix": "I think computers will become even smaller in the future.", "why_vi": "Dự đoán theo ý kiến cá nhân (I think) → will + V."}, {"s": "I meet my friends at the computer club tomorrow at 5 p.m.", "ok": false, "fix": "I'm meeting my friends at the computer club tomorrow at 5 p.m.", "why_vi": "Hẹn cụ thể với bạn, có giờ → hiện tại tiếp diễn, không dùng hiện tại đơn."}, {"s": "My cousin is going to study coding next year.", "ok": true, "fix": "My cousin is going to study coding next year.", "why_vi": "Dự định cho năm sau → be going to + V."}]}, "exam": [{"format": "dialogue_completion", "title_vi": "Hoàn thành hội thoại", "intro_vi": "Đề Chuyên Ngoại ngữ có 6 câu hoàn thành hội thoại; đề chung vào 10 cũng có câu chọn lời đáp phù hợp. Mỗi câu là một trao đổi ngắn A–B, em chọn lời đáp tự nhiên nhất.", "tip_vi": "Mẹo: xác định câu của A dùng để làm gì (mời, xin phép, gợi ý, kể sự cố…) rồi chọn lời đáp đúng chức năng, không chỉ đúng ngữ pháp.", "kind": "mcq", "items": [{"q": "A: Do you mind if I use your charger for a few minutes?\nB: ______", "options": ["Not at all. Go ahead.", "Yes, of course. Here you are.", "Never mind.", "You're welcome."], "answer": 0, "explain_vi": "'Do you mind if…?' nghĩa là 'Bạn có phiền không?'. Đồng ý thì đáp 'No / Not at all'. Đáp 'Yes' lại thành 'có, mình thấy phiền'."}, {"q": "A: Why don't we switch off our phones during dinner tonight?\nB: ______", "options": ["Because we are hungry.", "No, we don't.", "That sounds like a good idea.", "Thank you. Same to you."], "answer": 2, "explain_vi": "'Why don't we…?' là lời gợi ý, không phải hỏi lý do, nên đáp 'That sounds like a good idea.' Bẫy: 'Because…'."}, {"q": "A: Would you like to come to the robot show with us on Sunday?\nB: ______", "options": ["Yes, I would like.", "No, I don't like to.", "Sure. I watched it last Sunday.", "I'd love to, but I'm playing in a football match."], "answer": 3, "explain_vi": "Từ chối lời mời lịch sự: I'd love to, but + lý do. Lịch đã hẹn nên dùng hiện tại tiếp diễn (I'm playing)."}, {"q": "A: Do you think we'll have flying cars in twenty years?\nB: ______", "options": ["Yes, we did.", "I hope so, but I'm not sure.", "In twenty years.", "No, I'm not."], "answer": 1, "explain_vi": "A hỏi ý kiến về tương lai → đáp bằng ý kiến: 'I hope so, but I'm not sure.' Các câu kia sai thì hoặc sai trợ động từ."}, {"q": "A: Oh no! My laptop has just stopped working, and my essay is on it.\nB: ______", "options": ["Congratulations!", "That's very kind of you.", "Don't panic. I'll have a look at it.", "Yes, it has."], "answer": 2, "explain_vi": "A gặp sự cố → B trấn an và đề nghị giúp ngay lúc nói: will ('ll) + V."}]}, {"format": "listening", "title_vi": "Nghe và điền ghi chú", "intro_vi": "Đề Sở chuyên Anh Hà Nội có phần nghe 20 câu, thường có dạng nghe rồi điền ghi chú hoặc bảng (một hai từ hoặc một con số). Ở đây em làm bản rút gọn 5 chỗ trống.", "tip_vi": "Mẹo: đọc ghi chú trước khi nghe, đoán chỗ trống cần gì (nơi chốn, con số, đồ vật). Cẩn thận chi tiết bị sửa như 'not … like last year'.", "kind": "gap_text", "script": "Good morning, everyone. This is Mr Long from the computer club with some news about this year's Technology Fair. The fair is taking place next Saturday in the school library, not in the sports hall like last year. It opens at nine o'clock in the morning and finishes at half past three. This year, students from twelve schools are coming, and they are going to show 25 robots and other devices that they have invented. If you want to try the robots, you must bring your student card, so please don't forget it. There will also be a coding competition in the afternoon. Teams can have up to four members. The winning team will get a new tablet for their class, and everyone who takes part will receive a free T-shirt. If you'd like to join the competition, please write your name on the list outside Room 12 before Wednesday. I'm sure it will be a great day. See you there!", "text": "TECHNOLOGY FAIR\n• Day: next Saturday\n• Place: school [1]\n• Opening time: [2] a.m.\n• Number of robots on show: [3]\n• To try the robots, bring your [4]\n• Prize for the best coding team: a new [5] for the class\n• Sign up: list outside Room 12, before Wednesday", "items": [{"answer": "library", "accept": [], "explain_vi": "Nghe: 'in the school library, not in the sports hall like last year' → library. Sports hall là năm ngoái."}, {"answer": "9", "accept": ["9.00", "9:00", "nine"], "explain_vi": "Nghe: 'It opens at nine o'clock in the morning' → 9. Half past three là giờ đóng cửa."}, {"answer": "25", "accept": ["twenty-five", "twenty five"], "explain_vi": "Nghe: 'they are going to show 25 robots'. Twelve là số trường, không phải số robot."}, {"answer": "student card", "accept": ["student-card"], "explain_vi": "Nghe: 'you must bring your student card' → student card (2 từ)."}, {"answer": "tablet", "accept": ["tablet computer"], "explain_vi": "Nghe: 'The winning team will get a new tablet for their class'. T-shirt là quà cho mọi người tham gia."}]}], "exam_easy": [{"format": "dialogue_completion", "title_vi": "Hoàn thành hội thoại", "intro_vi": "Dạng hoàn thành hội thoại: có một câu của bạn A, em chọn câu đáp lại của bạn B cho hợp. Đề Chuyên Ngoại ngữ có 6 câu dạng này. Hôm nay em làm 5 câu ngắn.", "tip_vi": "Tự hỏi: A đang làm gì – xin mượn đồ, khoe tin vui, kể chuyện không may hay hỏi kế hoạch? Rồi chọn câu đáp đúng việc đó.", "kind": "mcq", "items": [{"q": "A: Can I use your laptop for a minute?\nB: ______", "options": ["Yes, I can.", "Sure. Here you are.", "You're welcome.", "I'm fine, thanks."], "answer": 1, "explain_vi": "A xin mượn đồ → đồng ý: 'Sure. Here you are.' (Được, của bạn đây). 'Yes, I can' sai vì A hỏi về việc A làm, không hỏi B."}, {"q": "A: What are you going to do this weekend?\nB: ______", "options": ["I visited my grandparents.", "Yes, I am.", "I'm going to visit my grandparents.", "At home, thanks."], "answer": 2, "explain_vi": "A hỏi dự định bằng be going to → B đáp bằng be going to. 'I visited' là quá khứ, sai thì; 'Yes, I am' không trả lời câu hỏi What."}, {"q": "A: I've got a new smartwatch for my birthday!\nB: ______", "options": ["Never mind.", "No, thanks.", "Same to you.", "Wow, that's great!"], "answer": 3, "explain_vi": "A khoe tin vui → B vui cùng: 'Wow, that's great!'. Never mind dùng để an ủi; Same to you dùng để chúc lại."}, {"q": "A: Oh no! My phone battery is dead.\nB: ______", "options": ["Here, I'll lend you my charger.", "Yes, it does.", "Congratulations!", "See you later."], "answer": 0, "explain_vi": "A gặp chuyện không may → B đề nghị giúp ngay lúc nói: I'll + V (will dùng cho lời đề nghị giúp đỡ)."}, {"q": "A: Are you free on Sunday?\nB: ______", "options": ["Yes, I was.", "Sorry, I'm visiting my aunt.", "On Sunday.", "No, you aren't."], "answer": 1, "explain_vi": "B đã có hẹn nên không rảnh. Lịch hẹn dùng hiện tại tiếp diễn: I'm visiting. 'Yes, I was' sai thì; 'No, you aren't' sai chủ ngữ."}]}, {"format": "listening", "title_vi": "Nghe và điền ghi chú", "intro_vi": "Dạng nghe và điền ghi chú: em nghe một thông báo ngắn rồi điền 1 từ hoặc 1 con số vào chỗ trống. Đề Sở chuyên Anh có phần nghe như vậy. Bài này nói chậm, câu ngắn.", "tip_vi": "Đọc ghi chú trước khi nghe. Đoán chỗ trống cần gì: thứ trong tuần, giờ, số phòng hay đồ vật. Con số viết bằng chữ số (4, 8).", "kind": "gap_text", "script": "Hello, everyone. I'm Ms Mai, and I teach computer studies. Next week, our school is starting a new computer club. The club meets every Tuesday. It starts at four o'clock in the afternoon and finishes at half past five. We are meeting in Room 8, on the second floor. In the club, you are going to learn how to make a simple game. The club is free. You need to bring a notebook and a pen. You don't need a laptop, because there are twenty computers in the room. If you want to join, please tell your class teacher before Friday. I'm sure it will be fun. Thank you!", "text": "COMPUTER CLUB\n• Day: every [1]\n• Starts at: [2] p.m.\n• Place: Room [3], second floor\n• You will learn to make a simple [4]\n• Bring: a [5] and a pen\n• To join: tell your class teacher before Friday", "items": [{"answer": "Tuesday", "accept": ["Tuesdays", "tuesday"], "explain_vi": "Nghe: 'The club meets every Tuesday' → Tuesday."}, {"answer": "4", "accept": ["four", "4.00", "4:00"], "explain_vi": "Nghe: 'It starts at four o'clock in the afternoon' → 4. Half past five là giờ kết thúc."}, {"answer": "8", "accept": ["eight"], "explain_vi": "Nghe: 'We are meeting in Room 8' → 8. Twenty là số máy tính, không phải số phòng."}, {"answer": "game", "accept": ["computer game"], "explain_vi": "Nghe: 'learn how to make a simple game' → game."}, {"answer": "notebook", "accept": ["note book"], "explain_vi": "Nghe: 'You need to bring a notebook and a pen'. Không cần mang laptop."}]}], "exam_plus": [{"format": "dialogue_completion", "title_vi": "Hoàn thành hội thoại", "intro_vi": "Câu hội thoại phân loại thường có lời đáp 'nghe đúng' nhưng sai chức năng hoặc sai sắc thái (Would you mind…?, I couldn't agree more, make it). Hôm nay em làm 5 câu như vậy.", "tip_vi": "Đọc cả phần sau chỗ trống nếu có. Nhớ cách đáp chuẩn: Would you mind…? → Sorry, I'll…; lời khen → cảm ơn; Shall I…? → That would be a great help.", "kind": "mcq", "items": [{"q": "A: Would you mind switching off your phone? The film is about to start.\nB: ______", "options": ["Yes, of course.", "Sorry, I'll do it right now.", "Never mind.", "Yes, I'd love to."], "answer": 1, "explain_vi": "Would you mind + V-ing là lời nhờ lịch sự. Đáp 'Yes, of course' lại thành 'có, tôi thấy phiền'. Lời đáp hợp: xin lỗi và làm ngay (I'll + V)."}, {"q": "A: Your presentation on artificial intelligence was brilliant!\nB: ______", "options": ["Thanks, but I couldn't have done it without your help.", "Yes, it was brilliant, wasn't it?", "You're welcome.", "That's a good idea."], "answer": 0, "explain_vi": "Đáp lời khen: cảm ơn và khiêm tốn. You're welcome dùng để đáp lời cảm ơn; tự khen lại mình là thiếu lịch sự."}, {"q": "A: I reckon robots will be teaching us in ten years' time.\nB: ______ Students need real people to inspire them.", "options": ["I couldn't agree more.", "Exactly!", "I doubt it.", "So do I."], "answer": 2, "explain_vi": "Câu sau của B phản đối ý A → chọn lời không đồng ý: I doubt it. 'I couldn't agree more' nghĩa là RẤT đồng ý, là bẫy."}, {"q": "A: Shall I set up the projector for your talk tomorrow?\nB: ______", "options": ["Yes, you shall.", "No, I won't.", "That would be a great help, thanks.", "I'd love to, but I can't."], "answer": 2, "explain_vi": "Shall I…? là lời đề nghị giúp → nhận lời: That would be a great help. 'I'd love to' dùng để nhận lời MỜI, không đáp lời đề nghị giúp."}, {"q": "A: I'm afraid I can't make it to the coding workshop on Saturday.\nB: ______", "options": ["Great! I'll see you there.", "Don't worry, I'm not afraid.", "Never mind. I'll make it for you.", "That's a shame. Maybe next time, then."], "answer": 3, "explain_vi": "make it = đến được, tham dự được; I'm afraid = rất tiếc. A báo không đến được → B tỏ ý tiếc: That's a shame."}]}, {"format": "listening", "title_vi": "Nghe và điền ghi chú", "intro_vi": "Bài nghe phân loại trong đề Sở có thông tin gây nhiễu: người nói nhắc tới 2–3 khả năng rồi sửa lại (no longer, instead, but). Bài này dài hơn và có nhiều bẫy như vậy.", "tip_vi": "Khi nghe 'no longer', 'originally', 'instead', 'but' thì chờ thông tin MỚI phía sau. Viết số đúng như nghe, kể cả dấu phẩy hàng nghìn.", "kind": "gap_text", "script": "Hello, and thank you for calling Bright Minds Digital Camp. Here is some information about our summer programme. This year, the camp is running from the fifteenth of July to the second of August. Ple
