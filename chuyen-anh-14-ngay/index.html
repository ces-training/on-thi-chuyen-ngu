thêm tiền tố). Câu 3–4: viết tiếp câu thứ hai sao cho nghĩa không đổi. Câu 5–6: khoanh A, B, C hoặc D.", "items": [{"id": "d9H1", "q": "The ______ of the new menu surprised the restaurant owners; hardly anyone ordered from it. (POPULAR)", "answer": "unpopularity", "accept": []}, {"id": "d9H2", "q": "The judges praised the young chef's ______; nobody had ever thought of putting mango in phở before. (CREATE)", "answer": "creativity", "accept": ["creativeness"]}, {"id": "d9H3", "q": "Very few people came to the festival because of the rain. → Hardly ______", "answer": "anyone came to the festival because of the rain.", "accept": ["anyone came to the festival because of the rain", "anybody came to the festival because of the rain.", "anybody came to the festival because of the rain"]}, {"id": "d9H4", "q": "There is hardly any sugar left in the jar. → We have almost run ______", "answer": "out of sugar.", "accept": ["out of sugar"]}, {"id": "d9H5", "q": "The smell of Grandma's bánh chưng was so wonderful that it made my mouth ______.", "options": ["water", "wet", "melt", "run"], "answer": "A"}, {"id": "d9H6", "q": "Every family has its own way of making nem, and Mum's recipe has been ______ from generation to generation.", "options": ["passed down", "passed out", "given up", "taken over"], "answer": "A"}]}}, "10": {"grammar_games": {"sort": {"title_vi": "Xếp mỗi câu vào đúng loại câu điều kiện", "groups": [{"name": "Type 0", "items": ["If you freeze water, it turns into ice.", "If people don't sleep, they get tired.", "Chocolate melts if you leave it in the sun."]}, {"name": "Type 1", "items": ["If you apply early, you'll get an interview.", "If Mai practises more, she will win.", "We'll miss the bus if we don't hurry."]}, {"name": "Type 2", "items": ["If I were rich, I'd travel the world.", "If I had wings, I would fly to school.", "She would apply if she spoke English."]}]}, "unjumble": [{"sentence": "If you work hard, you will have a successful career.", "hint_vi": "Loại 1: If + hiện tại đơn, will + V."}, {"sentence": "If I were you, I would apply for that job.", "hint_vi": "Loại 2 khuyên bảo: If I were you, I would..."}, {"sentence": "If you drop an egg, it usually breaks.", "hint_vi": "Loại 0: điều luôn xảy ra, hai vế đều hiện tại đơn."}, {"sentence": "What would you do if you lost your job?", "hint_vi": "Câu hỏi loại 2: What would you do if + quá khứ đơn?"}, {"sentence": "You will get the job if you have more experience.", "hint_vi": "Loại 1, mệnh đề if đứng sau nên không có dấu phẩy."}], "truefalse": [{"s": "If it will be sunny tomorrow, we'll go to the beach.", "ok": false, "fix": "If it is sunny tomorrow, we'll go to the beach.", "why_vi": "Không dùng will trong mệnh đề if; dùng hiện tại đơn: If it is sunny."}, {"s": "If I were a teacher, I would never give homework.", "ok": true, "fix": "If I were a teacher, I would never give homework.", "why_vi": "Đúng: loại 2 (điều không có thật), If + were, would + V."}, {"s": "If babies are hungry, they cry.", "ok": true, "fix": "If babies are hungry, they cry.", "why_vi": "Đúng: loại 0 nói điều luôn xảy ra, hai vế đều hiện tại đơn."}, {"s": "If I have a million dollars, I would buy a house by the sea.", "ok": false, "fix": "If I had a million dollars, I would buy a house by the sea.", "why_vi": "Vế sau có would → loại 2, vế if phải chia quá khứ đơn: had."}, {"s": "If Lan gets the job, she will move to Đà Nẵng.", "ok": true, "fix": "If Lan gets the job, she will move to Đà Nẵng.", "why_vi": "Đúng: loại 1, If + hiện tại đơn (gets), will + V."}, {"s": "My mum would be happy if I tidy my room every day.", "ok": false, "fix": "My mum would be happy if I tidied my room every day.", "why_vi": "Vế chính có would → loại 2, vế if dùng quá khứ đơn: tidied."}, {"s": "If I were you, I will apply for the job.", "ok": false, "fix": "If I were you, I would apply for the job.", "why_vi": "If I were you là loại 2 → vế sau dùng would, không dùng will."}, {"s": "If you leave ice cream in the sun, it melts.", "ok": true, "fix": "If you leave ice cream in the sun, it melts.", "why_vi": "Đúng: loại 0 (sự thật hiển nhiên), hai vế hiện tại đơn."}]}, "exam": [{"format": "dialogue_completion", "title_vi": "Hoàn thành hội thoại", "intro_vi": "Đề Chuyên Ngoại ngữ có 6 câu hoàn thành hội thoại; đề chung vào lớp 10 cũng có câu chọn lời đáp phù hợp. Em đọc lời người A rồi chọn câu B đáp lại tự nhiên nhất.", "tip_vi": "Mẹo: xác định A đang làm gì (khen, nhờ, xin lỗi, khuyên, hỏi ý kiến) rồi chọn câu đáp đúng chức năng, không chỉ đúng ngữ pháp.", "kind": "mcq", "items": [{"q": "A: I've just been offered a place at the summer art camp!\nB: ______", "options": ["Never mind. Better luck next time.", "Congratulations! You really deserve it.", "That's a pity.", "Yes, I'd love to."], "answer": 1, "explain_vi": "A báo tin vui → B chúc mừng: Congratulations! 'Never mind' và 'That's a pity' dùng cho tin buồn."}, {"q": "A: Would you mind helping me with my job application form?\nB: ______", "options": ["Yes, I'd mind.", "You're welcome.", "Not at all. Let me have a look.", "No, thanks. I can do it myself."], "answer": 2, "explain_vi": "Would you mind...? = Bạn có phiền...? Đồng ý giúp thì nói 'Not at all' (không phiền gì)."}, {"q": "A: If I were you, I'd ask the teacher for some advice.\nB: ______", "options": ["That's a good idea. Thanks.", "Me neither.", "Same to you.", "I'm afraid I can't come."], "answer": 0, "explain_vi": "A đưa lời khuyên → B cảm ơn và đồng ý: That's a good idea. Thanks."}, {"q": "A: I'm sorry, I can't finish the report today. My computer has broken down.\nB: ______", "options": ["Well done! Good job.", "Yes, I'd love to.", "You're welcome.", "Never mind. You can send it to me tomorrow."], "answer": 3, "explain_vi": "A xin lỗi → B thông cảm: Never mind (không sao). 'You're welcome' là đáp lời cảm ơn."}, {"q": "A: What would you do if you were offered a job abroad?\nB: ______", "options": ["Yes, I would.", "I would accept it. It would be a great experience.", "I will go there last year.", "I'm working abroad now."], "answer": 1, "explain_vi": "Câu hỏi What would you do if...? (loại 2) → trả lời bằng I would + V. 'Yes, I would' không trả lời câu hỏi What."}]}, {"format": "listening", "title_vi": "Nghe và điền ghi chú", "intro_vi": "Phần nghe của đề chuyên Anh của Sở có 20 câu; một dạng hay gặp là nghe một thông báo rồi điền từ hoặc số vào phiếu ghi chú. Ở đây em nghe 1 bài và điền 5 chỗ trống.", "tip_vi": "Mẹo: đọc phiếu ghi chú trước khi nghe, đoán chỗ trống cần số, tên hay danh từ. Viết số bằng chữ số, kiểm tra chính tả.", "kind": "gap_text", "script": "Good morning, everyone. This is an announcement from the school office about our Career Day. This year, Career Day will be held on Saturday the 14th of November in the school hall. It starts at half past eight and finishes at half past eleven. More than twenty guests will come to talk about their jobs, including a pilot, a chef, two doctors and a famous game designer. If you want to ask the guests questions, please prepare them before the day. There will also be a special workshop on how to write a CV. Places are limited to 40 students, so if you want to join, you need to apply before Wednesday. To apply, just send an email to Ms Hoa, the school librarian. Students who help at the event will receive a certificate. Please wear your school uniform on the day. If it rains, the outdoor activities will move to the sports hall. Thank you, and we hope to see you there!", "text": "CAREER DAY\n• Date: Saturday, [1] November\n• Place: the school [2]\n• More than 20 guests, e.g. a pilot, a chef and a game [3]\n• CV workshop: only [4] places – apply before Wednesday\n• To apply: email Ms Hoa, the school [5]", "items": [{"answer": "14", "accept": ["14th"], "explain_vi": "Bài nói: 'Saturday the 14th of November' → điền 14."}, {"answer": "hall", "accept": [], "explain_vi": "Bài nói: 'in the school hall' (hội trường trường)."}, {"answer": "designer", "accept": [], "explain_vi": "Bài nói: 'a famous game designer' (nhà thiết kế trò chơi)."}, {"answer": "40", "accept": [], "explain_vi": "Bài nói: 'Places are limited to 40 students' → 40 chỗ. Đừng nhầm với 'twenty guests'."}, {"answer": "librarian", "accept": [], "explain_vi": "Bài nói: 'Ms Hoa, the school librarian' (cô thủ thư)."}]}], "exam_easy": [{"format": "dialogue_completion", "title_vi": "Hoàn thành hội thoại", "intro_vi": "Dạng này có trong đề Chuyên Ngoại ngữ và đề chung vào lớp 10. Em đọc câu của người A rồi chọn câu trả lời của người B hợp nhất. Mỗi câu chỉ có một đáp án đúng.", "tip_vi": "Mẹo: câu hỏi 'What…?' cần câu trả lời có thông tin, không trả lời Yes/No. Ai cảm ơn thì đáp 'You're welcome'; ai chúc mình thì đáp 'Thank you'.", "kind": "mcq", "items": [{"q": "A: What does your father do?\nB: ______", "options": ["He's fine, thanks.", "He likes football.", "He's a bus driver.", "He's forty years old."], "answer": 2, "explain_vi": "'What does your father do?' là hỏi về nghề nghiệp → trả lời nghề: He's a bus driver. 'He's fine' trả lời câu hỏi sức khoẻ."}, {"q": "A: Thanks for helping me fill in this form.\nB: ______", "options": ["Good luck!", "You're welcome.", "Yes, please.", "I'm sorry."], "answer": 1, "explain_vi": "A cảm ơn → B đáp lại lời cảm ơn: You're welcome (không có gì)."}, {"q": "A: What will you do if it rains on Sunday?\nB: ______", "options": ["I'll stay at home and read books.", "Yes, it will.", "I stayed at home.", "It's very hot today."], "answer": 0, "explain_vi": "Câu hỏi 'What will you do if…?' (điều kiện loại 1) → trả lời bằng I'll (I will) + động từ. Không trả lời Yes/No, không dùng quá khứ."}, {"q": "A: I want to be a vet when I grow up.\nB: ______", "options": ["Yes, I'd love to.", "No, thank you.", "I'm sorry to hear that.", "That's great! You really love animals."], "answer": 3, "explain_vi": "A kể về ước mơ nghề nghiệp (bác sĩ thú y) → B khen, động viên: That's great! 'Yes, I'd love to' dùng để nhận lời mời."}, {"q": "A: Good luck with your job interview tomorrow!\nB: ______", "options": ["You're welcome.", "Here you are.", "Thank you! I'll do my best.", "Yes, I am."], "answer": 2, "explain_vi": "Ai chúc mình may mắn thì mình cảm ơn: Thank you! 'You're welcome' là câu đáp lại lời cảm ơn, không phải lời chúc."}]}, {"format": "listening", "title_vi": "Nghe và điền ghi chú", "intro_vi": "Phần nghe trong đề chuyên Anh của Sở có dạng nghe rồi điền vào phiếu ghi chú. Bài nghe ở đây ngắn và chậm. Em nghe rồi điền một từ hoặc một số vào 5 chỗ trống.", "tip_vi": "Mẹo: đọc 5 dòng ghi chú trước khi nghe, đoán chỗ nào cần số, chỗ nào cần danh từ. Số thì viết bằng chữ số, ví dụ 7.", "kind": "gap_text", "script": "Hello, everyone. My name is Lan. Today I want to tell you about my mother's job. My mother is a nurse. She works at a big hospital in the city centre. She starts work at seven o'clock in the morning. She goes to work by bus. Her job is not easy. She looks after sick children. She works five days a week, from Monday to Friday. She loves her job because she likes helping people. My mother always says, if you want to be a good nurse, you must be kind and patient. I want to be a nurse too. If I study hard, I will go to a medical school. Thank you for listening.", "text": "MY MOTHER'S JOB\n• Job: a [1]\n• Starts work at: [2] a.m.\n• Goes to work by: [3]\n• Works [4] days a week\n• A good nurse must be kind and [5]", "items": [{"answer": "nurse", "accept": [], "explain_vi": "Bài nói: 'My mother is a nurse.' (y tá)."}, {"answer": "7", "accept": ["7.00", "7:00", "seven"], "explain_vi": "Bài nói: 'She starts work at seven o'clock in the morning.' → điền số 7."}, {"answer": "bus", "accept": [], "explain_vi": "Bài nói: 'She goes to work by bus.' (đi làm bằng xe buýt)."}, {"answer": "5", "accept": ["five"], "explain_vi": "Bài nói: 'She works five days a week, from Monday to Friday.' → điền số 5."}, {"answer": "patient", "accept": [], "explain_vi": "Bài nói: 'you must be kind and patient' (tốt bụng và kiên nhẫn)."}]}], "exam_plus": [{"format": "dialogue_completion", "title_vi": "Hoàn thành hội thoại", "intro_vi": "Câu hội thoại khó trong đề Chuyên Ngoại ngữ thường kiểm tra lời đáp lịch sự, thành ngữ giao tiếp và câu bẫy như 'Do you mind…?'. Nhiều phương án nghe tự nhiên, nhưng chỉ một câu hợp ngữ cảnh.", "tip_vi": "Mẹo: với 'Do/Would you mind…?', đáp 'Not at all' là đồng ý. Kiểm tra cả thì: hỏi bằng 'would' thì đáp bằng 'would'.", "kind": "mcq", "items": [{"q": "A: I'm thinking of turning down the job offer from that tech company.\nB: ______", "options": ["Never mind. There's always next time.", "If I were you, I'd think it over first. It's a great chance.", "If I am you, I will accept it at once.", "Don't mention it. It was my pleasure."], "answer": 1, "explain_vi": "A đang phân vân → B khuyên: If I were you, I'd… (loại 2). 'If I am you' sai ngữ pháp; 'Never mind' dùng để an ủi khi thất bại."}, {"q": "A: Do you mind if I leave work an hour early today? My son is ill.\nB: ______", "options": ["Yes, of course. Go ahead.", "No, you mustn't.", "Never mind. It's not your fault.", "Not at all. I hope he gets better soon."], "answer": 3, "explain_vi": "Do you mind…? = Bạn có phiền không? Đồng ý thì đáp 'Not at all'. 'Yes, of course' nghĩa là 'có, tôi phiền' nên mâu thuẫn với 'Go ahead'."}, {"q": "A: I've been looking for a job for six months, and I'm starting to lose hope.\nB: ______", "options": ["Well done! Keep up the good work.", "Lucky you! I wish I had so much free time.", "Hang in there. Something will turn up soon.", "Same here. I've just got a new job."], "answer": 2, "explain_vi": "A đang nản → B động viên: Hang in there (cố lên), turn up = xuất hiện. 'Lucky you!' thiếu tế nhị; 'Same here' mâu thuẫn với vế sau."}, {"q": "A: What would you do if your boss asked you to work every weekend?\nB: ______", "options": ["I'd probably start looking for another job.", "I'll ask him for a pay rise.", "I would have refused immediately.", "I did it once last year."], "answer": 0, "explain_vi": "Câu hỏi giả định loại 2 (What would you do if + quá khứ đơn) → đáp bằng I'd (would) + V. 'I'll' là loại 1; 'would have refused' là quá khứ."}, {"q": "A: You should apply for the manager position. You're more than qualified.\nB: ______", "options": ["Don't mention it. Any time.", "Congratulations! You deserve it.", "Thanks for the vote of confidence! Maybe I'll give it a go.", "I'd rather you didn't."], "answer": 2, "explain_vi": "A khuyến khích, khen B đủ năng lực → B cảm ơn sự tin tưởng (vote of confidence) và sẽ thử (give it a go). 'Congratulations' sai vì chưa có kết quả."}]}, {"format": "listening", "title_vi": "Nghe và điền ghi chú", "intro_vi": "Bài nghe khó trong đề chuyên thường có thông tin gây nhiễu: người nói nhắc một chi tiết rồi sửa lại. Em nghe bài dài hơn và điền 5 chỗ trống, mỗi chỗ một từ hoặc một số.", "tip_vi": "Mẹo: chú ý các từ báo sửa thông tin như 'but', 'not', 'has been moved', 'rather than'. Thông tin đúng thường đến sau những từ này.", "kind": "gap_text", "script": "Good afternoon, and welcome to the job corner on Youth Radio. Today we have news about the Green City Summer Internship, which is open to students aged fifteen to eighteen. Interns will spend four weeks working at the city's recycling centre. The organisers first planned to start on the first of July, but because of the exams, the start date has been moved to the eighth. Interns will work from Monday to Thursday, not on Fridays as many people expected, and they will receive a small allowance of fifty thousand dong a day, plus a free lunch. The organisers are looking for young people who are responsible and good at teamwork. You don't need any previous experience. If you are interested, you should apply online rather than by post, and the deadline is the twentieth of June. If a lot of people apply, the best candidates will be invited to an interview, which will take place at the City Library, not at the recycling centre. So, if I were you, I would start my application today!", "text": "GREEN CITY SUMMER INTERNSHIP\n• Age: 15–18\n• Length: [1] weeks\n• Start date: [2] July\n• Working days: Monday to [3]\n• Interns should be responsible and good at [4]\n• Interviews: at the City [5]", "items": [{"answer": "4", "accept": ["four"], "explain_vi": "Bài nói: 'Interns will spend four weeks working…' → 4 tuần."}, {"answer": "8", "accept": ["8th", "eighth"], "explain_vi": "Ban đầu là ngày 1/7 nhưng 'has been moved to the eighth' → điền 8. Bẫy: ngày 1."}, {"answer": "Thursday", "accept": ["thursday"], "explain_vi": "'from Monday to Thursday, not on Fridays' → Thursday. Bẫy: Friday bị phủ định bằng 'not'."}, {"answer": "teamwork", "accept": ["team work", "team-work"], "explain_vi": "Bài nói: 'responsible and good at teamwork' (làm việc nhóm)."}, {"answer": "Library", "accept": ["library"], "explain_vi": "Phỏng vấn 'at the City Library, not at the recycling centre' → Library."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Câu 1–2: viết dạng đúng của từ in hoa (có thể phải đổi từ 2 lần hoặc thêm tiền tố). Câu 3–4: viết tiếp câu thứ hai sao cho nghĩa không đổi. Câu 5–6: khoanh A, B, C hoặc D.", "items": [{"id": "d10H1", "q": "______ among young people has risen sharply since several factories in the area closed down. (EMPLOY)", "answer": "Unemployment", "accept": ["unemployment"]}, {"id": "d10H2", "q": "Many school leavers have ______ expectations about their first salary, so they are often disappointed when they receive their first payslip. (REAL)", "answer": "unrealistic", "accept": []}, {"id": "d10H3", "q": "I don't have enough experience, so I can't apply for the job. → If I ______", "answer": "had enough experience, I could apply for the job.", "accept": ["had enough experience, I could apply for the job", "had enough experience, I would be able to apply for the job.", "had enough experience, I would be able to apply for the job", "had enough experience, I'd be able to apply for the job.", "had enough experience, I'd be able to apply for the job"]}, {"id": "d10H4", "q": "Work harder or you won't get a pay rise. → Unless ______", "answer": "you work harder, you won't get a pay rise.", "accept": ["you work harder, you won't get a pay rise", "you work harder, you will not get a pay rise.", "you work harder, you will not get a pay rise"]}, {"id": "d10H5", "q": "After months of searching, Hà finally ______ a job at an international school.", "options": ["landed", "hit", "caught", "reached"], "answer": "A"}, {"id": "d10H6", "q": "Because of falling sales, the company had to ______ two hundred workers last month.", "options": ["lay off", "take on", "put off", "give up"], "answer": "A"}]}}, "11": {"grammar_games": {"sort": {"title_vi": "Mỗi cụm cần who, which hay whose?", "groups": [{"name": "who", "items": ["the singer ___ won the contest", "my aunt, ___ lives in Đà Nẵng", "a friend ___ never tells lies"]}, {"name": "which", "items": ["the phone ___ I bought last week", "the dog ___ barks every night", "a film ___ made everyone cry"]}, {"name": "whose", "items": ["a girl ___ dad is a pilot", "the neighbour ___ cat sleeps in our garden", "students ___ projects won prizes"]}]}, "unjumble": [{"sentence": "Nam is the boy whose sister plays for our team.", "hint_vi": "whose + danh từ (chỉ sở hữu)"}, {"sentence": "This is the park where we often play badminton.", "hint_vi": "where thay cho nơi chốn"}, {"sentence": "I trust friends who keep their promises.", "hint_vi": "who thay cho người"}, {"sentence": "My grandfather, who is very generous, loves helping others.", "hint_vi": "Mệnh đề không xác định nằm giữa hai dấu phẩy"}, {"sentence": "The person that I look up to most is my aunt.", "hint_vi": "that trong mệnh đề xác định + look up to"}], "truefalse": [{"s": "Mr Hải, that teaches us PE, is very strict.", "ok": false, "fix": "Mr Hải, who teaches us PE, is very strict.", "why_vi": "Sau dấu phẩy (mệnh đề không xác định) không dùng that; nói về người thì dùng who."}, {"s": "The girl who sits behind me always shares her pencils.", "ok": true, "fix": "The girl who sits behind me always shares her pencils.", "why_vi": "who thay cho người (the girl); mệnh đề xác định nên không có dấu phẩy."}, {"s": "This is the house which my grandparents live.", "ok": false, "fix": "This is the house where my grandparents live.", "why_vi": "Sau chỗ trống là câu đủ ý (my grandparents live) và thay cho nơi chốn → where."}, {"s": "I know a boy who father is a pilot.", "ok": false, "fix": "I know a boy whose father is a pilot.", "why_vi": "'father của cậu bé' là sở hữu → whose + danh từ."}, {"s": "The cake that Lan made was delicious.", "ok": true, "fix": "The cake that Lan made was delicious.", "why_vi": "that thay cho vật trong mệnh đề xác định (không dấu phẩy) là đúng."}, {"s": "Đà Lạt, which is famous for its flowers, is cool all year round.", "ok": true, "fix": "Đà Lạt, which is famous for its flowers, is cool all year round.", "why_vi": "which thay cho địa danh làm chủ ngữ (which is famous…), đặt giữa hai dấu phẩy."}, {"s": "The man which helped us was very kind.", "ok": false, "fix": "The man who helped us was very kind.", "why_vi": "the man là người → who (hoặc that), không dùng which."}, {"s": "We visited the school where my mum used to teach.", "ok": true, "fix": "We visited the school where my mum used to teach.", "why_vi": "where thay cho nơi chốn (the school), sau đó là câu đầy đủ."}]}, "exam": [{"format": "antonym", "title_vi": "Từ trái nghĩa", "intro_vi": "Đề chuyên Chuyên Ngoại ngữ có 4 câu tìm từ trái nghĩa: mỗi câu có một từ hoặc cụm từ VIẾT HOA, em chọn A, B, C hoặc D có nghĩa NGƯỢC lại.", "tip_vi": "Mẹo: đề luôn cài một từ ĐỒNG nghĩa để bẫy. Hiểu nghĩa từ in hoa trong câu trước, rồi mới tìm từ ngược nghĩa.", "kind": "mcq", "items": [{"q": "Linh was very PATIENT with her little brother while he was learning to read.", "options": ["calm", "gentle", "impatient", "careful"], "answer": 2, "explain_vi": "patient (kiên nhẫn) >< impatient (thiếu kiên nhẫn). 'calm', 'gentle' gần nghĩa, không phải trái nghĩa."}, {"q": "All my classmates SUPPORTED my idea for the class trip.", "options": ["agreed with", "opposed", "came up with", "looked up to"], "answer": 1, "explain_vi": "support (ủng hộ) >< oppose (phản đối). 'agreed with' là đồng nghĩa – bẫy!"}, {"q": "Minh felt CONFIDENT before his speaking test because he had practised a lot.", "options": ["nervous", "relaxed", "proud", "ready"], "answer": 0, "explain_vi": "confident (tự tin) >< nervous (lo lắng, hồi hộp)."}, {"q": "Most students TRUST Ms Hoa because she always keeps her promises.", "options": ["rely on", "believe in", "look up to", "doubt"], "answer": 3, "explain_vi": "trust (tin tưởng) >< doubt (nghi ngờ). 'rely on', 'believe in' gần nghĩa với trust."}, {"q": "Mai and her best friend ARGUE about small things almost every day.", "options": ["quarrel", "agree", "disagree", "complain"], "answer": 1, "explain_vi": "argue (cãi nhau) >< agree (đồng ý, nhất trí). 'quarrel', 'disagree' cùng nghĩa với argue."}]}, {"format": "sentence_combining", "title_vi": "Nối câu", "intro_vi": "Đề chuyên Chuyên Ngoại ngữ có 5 câu nối câu: cho hai câu, em chọn A, B, C hoặc D là câu nối đúng và giữ nguyên nghĩa. Mệnh đề quan hệ là cách nối gặp rất nhiều.", "tip_vi": "Mẹo: loại ngay đáp án có 'that' sau dấu phẩy, đáp án lặp lại đại từ (him, it, there) và đáp án dùng sai who/which/whose/where.", "kind": "mcq", "items": [{"q": "Mr Tùng is our new neighbour. His dog barks all night.", "options": ["Mr Tùng, whose dog barks all night, is our new neighbour.", "Mr Tùng, who dog barks all night, is our new neighbour.", "Mr Tùng, that his dog barks all night, is our new neighbour.", "Mr Tùng, whose his dog barks all night, is our new neighbour."], "answer": 0, "explain_vi": "His dog → whose dog (sở hữu). Không thêm 'his' sau whose, không dùng that sau dấu phẩy."}, {"q": "Đà Nẵng is a beautiful city. I spent my summer holiday there.", "options": ["Đà Nẵng, which I spent my summer holiday, is a beautiful city.", "Đà Nẵng, where I spent my summer holiday, is a beautiful city.", "Đà Nẵng, that I spent my summer holiday there, is a beautiful city.", "Đà Nẵng, where I spent my summer holiday there, is a beautiful city."], "answer": 1, "explain_vi": "there (ở đó) → where. Đã dùng where thì bỏ 'there'; dùng which thì phải có 'in'."}, {"q": "The girl is very honest. She found my wallet.", "options": ["The girl which found my wallet is very honest.", "The girl, that found my wallet, is very honest.", "The girl found my wallet who is very honest.", "The girl who found my wallet is very honest."], "answer": 3, "explain_vi": "She → who, đặt ngay sau 'the girl'. Mệnh đề xác định nên không có dấu phẩy."}, {"q": "The film made me cry. I watched it last night.", "options": ["The film which I watched it last night made me cry.", "The film who I watched last night made me cry.", "The film which I watched last night made me cry.", "The film I watched last night it made me cry."], "answer": 2, "explain_vi": "it → which (vật). Đã có which thì bỏ 'it'; who chỉ dùng cho người."}, {"q": "Hùng's father is a firefighter. Everyone in our street looks up to him.", "options": ["Hùng's father, that everyone in our street looks up to, is a firefighter.", "Hùng's father, who everyone in our street looks up to, is a firefighter.", "Hùng's father, who everyone in our street looks up to him, is a firefighter.", "Hùng's father, whose everyone in our street looks up to, is a firefighter."], "answer": 1, "explain_vi": "him → who (giới từ 'to' vẫn đứng cuối). Không dùng that sau dấu phẩy, không lặp lại 'him'."}]}], "exam_easy": [{"format": "antonym", "title_vi": "Từ trái nghĩa", "intro_vi": "Đề Chuyên Ngoại ngữ có 4 câu tìm từ trái nghĩa. Em tìm từ VIẾT HOA trong câu, rồi chọn A, B, C hoặc D có nghĩa NGƯỢC lại với từ đó.", "tip_vi": "Mẹo: nhiều từ trái nghĩa chỉ cần thêm un- hoặc dis- (kind → unkind). Cẩn thận: đề hay cài một từ CÙNG nghĩa để bẫy.", "kind": "mcq", "items": [{"q": "My grandfather is a very KIND man. He helps everyone in our street.", "options": ["nice", "unkind", "tall", "busy"], "answer": 1, "explain_vi": "kind (tốt bụng) >< unkind (không tốt bụng, ác). 'nice' cùng nghĩa với kind – đó là bẫy."}, {"q": "Nam is a LAZY student. He never does his homework.", "options": ["hard-working", "sleepy", "young", "funny"], "answer": 0, "explain_vi": "lazy (lười biếng) >< hard-working (chăm chỉ)."}, {"q": "Lan always feels HAPPY when she is with her best friends.", "options": ["glad", "hungry", "sad", "late"], "answer": 2, "explain_vi": "happy (vui) >< sad (buồn). 'glad' cũng có nghĩa là vui – cùng nghĩa, không phải trái nghĩa."}, {"q": "My little brother is very NOISY when he plays with his friends.", "options": ["loud", "clever", "short", "quiet"], "answer": 3, "explain_vi": "noisy (ồn ào) >< quiet (yên lặng). 'loud' (to, ồn) cùng nghĩa với noisy."}, {"q": "Minh is always POLITE to older people.", "options": ["rude", "kind", "tall", "rich"], "answer": 0, "explain_vi": "polite (lễ phép, lịch sự) >< rude (thô lỗ, vô lễ)."}]}, {"format": "sentence_combining", "title_vi": "Nối câu", "intro_vi": "Đề Chuyên Ngoại ngữ có câu nối câu. Em đọc hai câu ngắn rồi chọn câu nối bằng who, which, where hoặc whose sao cho đúng ngữ pháp và giữ nguyên nghĩa.", "tip_vi": "Mẹo: người → who; vật → which; nơi chốn → where; 'của ai' → whose. Đã dùng who/which/where thì bỏ he, she, it, there.", "kind": "mcq", "items": [{"q": "I have a friend. She lives in Đà Lạt.", "options": ["I have a friend which lives in Đà Lạt.", "I have a friend where lives in Đà Lạt.", "I have a friend who lives in Đà Lạt.", "I have a friend who she lives in Đà Lạt."], "answer": 2, "explain_vi": "She là người → thay bằng who. Đã có who thì bỏ 'she'. which dùng cho vật, where dùng cho nơi chốn."}, {"q": "I love the bag. My grandma gave it to me.", "options": ["I love the bag which my grandma gave me.", "I love the bag which my grandma gave it to me.", "I love the bag who my grandma gave me.", "I love the bag where my grandma gave me."], "answer": 0, "explain_vi": "it là vật (the bag) → thay bằng which và bỏ 'it'. who chỉ dùng cho người."}, {"q": "This is the library. I meet my friends there.", "options": ["This is the library which I meet my friends.", "This is the library who I meet my friends.", "This is the library where I meet my friends there.", "This is the library where I meet my friends."], "answer": 3, "explain_vi": "there (ở đó) là nơi chốn → thay bằng where và bỏ 'there'."}, {"q": "The man is my uncle. He is wearing a red hat.", "options": ["The man which is wearing a red hat is my uncle.", "The man who is wearing a red hat is my uncle.", "The man is wearing a red hat who is my uncle.", "The man who is wearing a red hat he is my uncle."], "answer": 1, "explain_vi": "He = the man (người) → who, đặt ngay sau 'the man'. Không thêm 'he' nữa."}, {"q": "Lan has an uncle. His job is very interesting.", "options": ["Lan has an uncle who job is very interesting.", "Lan has an uncle which job is very interesting.", "Lan has an uncle whose job is very interesting.", "Lan has an uncle whose his job is very interesting."], "answer": 2, "explain_vi": "His job (công việc của chú ấy) là sở hữu → whose job. Không thêm 'his' sau whose."}]}], "exam_plus": [{"format": "antonym", "title_vi": "Từ trái nghĩa", "intro_vi": "Câu trái nghĩa phân loại trong đề Chuyên Ngoại ngữ thường dùng thành ngữ, cụm động từ và tính từ B2 chỉ tính cách. Bẫy quen thuộc là từ đồng nghĩa hoặc từ chỉ cùng chủ đề.", "tip_vi": "Mẹo: hiểu nghĩa cả cụm (tight-fisted, on good terms) trong ngữ cảnh, gạch bỏ các từ đồng nghĩa trước rồi mới tìm nghĩa ngược lại.", "kind": "mcq", "items": [{"q": "Although they sometimes disagree, Hùng and his stepfather have always been ON GOOD TERMS.", "options": ["in touch", "at odds", "on the same wavelength", "close"], "answer": 1, "explain_vi": "on good terms (quan hệ tốt) >< at odds (bất hoà, mâu thuẫn). 'on the same wavelength', 'close' gần nghĩa; 'in touch' = giữ liên lạc."}, {"q": "Mr Bình is so TIGHT-FISTED that he never even buys his friends a cup of coffee.", "options": ["stingy", "wealthy", "generous", "careful"], "answer": 2, "explain_vi": "tight-fisted (keo kiệt) >< generous (hào phóng). 'stingy' là từ đồng nghĩa – bẫy."}, {"q": "Hoa is a RELIABLE friend; she has never once let me down.", "options": ["dependable", "outgoing", "modest", "untrustworthy"], "answer": 3, "explain_vi": "reliable (đáng tin cậy) >< untrustworthy (không đáng tin). 'dependable' đồng nghĩa với reliable."}, {"q": "The new student was rather RESERVED at first, but after a few weeks she was chatting with everyone.", "options": ["outgoing", "shy", "polite", "serious"], "answer": 0, "explain_vi": "reserved (kín đáo, ít nói) >< outgoing (cởi mở, hướng ngoại). 'shy' gần nghĩa với reserved."}, {"q": "It's wrong to LOOK DOWN ON people just because they have less money than you.", "options": ["make fun of", "look up to", "despise", "get on with"], "answer": 1, "explain_vi": "look down on (coi thường) >< look up to (kính trọng). 'despise', 'make fun of' cùng hướng nghĩa coi thường."}]}, {"format": "sentence_combining", "title_vi": "Nối câu", "intro_vi": "Câu nối khó trong đề Chuyên Ngoại ngữ dùng giới từ + whom/which, cụm 'all of whom', 'which' thay cho cả mệnh đề và whose cho vật. Các phương án thường chỉ khác nhau một từ.", "tip_vi": "Mẹo: sau giới từ chỉ dùng whom (người) hoặc which (vật), không dùng who hay that. 'which' thay cả mệnh đề trước, đứng sau dấu phẩy.", "kind": "mcq", "items": [{"q": "I have three cousins. All of them are older than me.", "options": ["I have three cousins, all of them who are older than me.", "I have three cousins, all of who are older than me.", "I have three cousins, all of whom are older than me.", "I have three cousins, that all are older than me."], "answer": 2, "explain_vi": "all of them → all of whom (sau giới từ 'of' dùng whom). Không dùng who sau giới từ, không dùng that sau dấu phẩy."}, {"q": "Ms Lan is the teacher. I can always turn to her for advice.", "options": ["Ms Lan is the teacher to whom I can always turn for advice.", "Ms Lan is the teacher whom I can always turn for advice.", "Ms Lan is the teacher to whom I can always turn to for advice.", "Ms Lan is the teacher to that I can always turn for advice."], "answer": 0, "explain_vi": "turn to sb = tìm đến ai để nhờ giúp. Đưa 'to' lên trước: to whom. Không bỏ mất 'to', không lặp 'to', không dùng 'to that'."}, {"q": "Nam forgot his best friend's birthday. This upset her a lot.", "options": ["Nam forgot his best friend's birthday, that upset her a lot.", "Nam forgot his best friend's birthday, what upset her a lot.", "Nam forgot his best friend's birthday, who upset her a lot.", "Nam forgot his best friend's birthday, which upset her a lot."], "answer": 3, "explain_vi": "'This' chỉ cả sự việc Nam quên sinh nhật → dùng ', which' thay cho cả mệnh đề trước. Không dùng that/what ở vị trí này."}, {"q": "We visited an old family house. Its walls were covered in photos of our ancestors.", "options": ["We visited an old family house which walls were covered in photos of our ancestors.", "We visited an old family house whose walls were covered in photos of our ancestors.", "We visited an old family house whose its walls were covered in photos of our ancestors.", "We visited an old family house where its walls were covered in photos of our ancestors."], "answer": 1, "explain_vi": "Its walls → whose walls (whose dùng được cho cả vật). Không thêm 'its' sau whose."}, {"q": "The village is very peaceful. My grandparents live in it.", "options": ["The village in which my grandparents live is very peaceful.", "The village which my grandparents live is very peaceful.", "The village in where my grandparents live is very peaceful.", "The village in that my grandparents live is very peaceful."], "answer": 0, "explain_vi": "live in it → in which (giới từ + which). Thiếu 'in' là sai; không dùng 'in where' hay 'in that'."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Câu 1–2: viết dạng đúng của từ in hoa (có thể phải đổi từ 2 lần hoặc thêm tiền tố). Câu 3–4: viết tiếp câu thứ hai sao cho nghĩa không đổi. Câu 5–6: khoanh A, B, C hoặc D.", "items": [{"id": "d11H1", "q": "Most teenagers want more ______ from their parents; they like making their own decisions. (DEPEND)", "answer": "independence", "accept": []}, {"id": "d11H2", "q": "Mai kept checking her watch and tapping her foot ______; her best friend was already half an hour late. (PATIENT)", "answer": "impatiently", "accept": []}, {"id": "d11H3", "q": "I admire my grandfather more than anyone else. → The person ______", "answer": "I admire most is my grandfather.", "accept": ["I admire most is my grandfather", "I admire the most is my grandfather.", "I admire the most is my grandfather", "who I admire most is my grandfather.", "who I admire most is my grandfather", "whom I admire most is my grandfather.", "whom I admire most is my grandfather", "that I admire most is my grandfather.", "that I admire most is my grandfather", "who I admire the most is my grandfather.", "whom I admire the most is my grandfather.", "that I admire the most is my grandfather."]}, {"id": "d11H4", "q": "My best friend wants to become a nurse. Her parents are both doctors. → My best friend, ______", "answer": "whose parents are both doctors, wants to become a nurse.", "accept": ["whose parents are both doctors, wants to become a nurse"]}, {"id": "d11H5", "q": "Lan is outgoing and loves music, just like her mother – she really ______ her.", "options": ["takes after", "looks after", "takes over", "looks for"], "answer": "A"}, {"id": "d11H6", "q": "Nam and Huy argue now and then, but they have been as thick as ______ since primary school.", "options": ["thieves", "bricks", "brothers", "friends"], "answer": "A"}]}}, "12": {"grammar_games": {"sort": {"title_vi": "Khi tường thuật (said…), mỗi câu nói lùi sang thì nào?", "groups": [{"name": "Past simple (liked, was…)", "items": ["'I like chemistry.'", "'My brother is a scientist.'", "'We don't have any evidence.'"]}, {"name": "Past continuous (was doing)", "items": ["'I am writing a report.'", "'They are carrying out tests.'", "'We are waiting for the results.'"]}, {"name": "Past perfect (had done)", "items": ["'I have lost my notebook.'", "'She discovered a new star.'", "'We have finished the experiment.'"]}]}, "unjumble": [{"sentence": "She told me that she had finished her homework.", "hint_vi": "tell + người nghe + that; lùi thì sang quá khứ hoàn thành"}, {"sentence": "The scientist said that the results were very surprising.", "hint_vi": "said + that; are → were"}, {"sentence": "Nam told us that he would come up with a plan.", "hint_vi": "will → would; told + us"}, {"sentence": "My teacher said she was proud of our research.", "hint_vi": "said (không có người nghe); có thể bỏ that"}, {"sentence": "They said they could not find any evidence.", "hint_vi": "can't → could not"}], "truefalse": [{"s": "Minh said me that he had a new laptop.", "ok": false, "fix": "Minh told me that he had a new laptop.", "why_vi": "say không đi thẳng với người nghe. Có 'me' thì dùng told me (hoặc said to me)."}, {"s": "The teacher told us that the lab was closed.", "ok": true, "fix": "The teacher told us that the lab was closed.", "why_vi": "tell + người nghe (us) + that + mệnh đề đã lùi thì (was): đúng."}, {"s": "Hoa said that she will visit the museum the following day.", "ok": false, "fix": "Hoa said that she would visit the museum the following day.", "why_vi": "Câu tường thuật đã lùi thời gian (the following day) nên will → would."}, {"s": "Dr Phong said that he had discovered a new kind of plant.", "ok": true, "fix": "Dr Phong said that he had discovered a new kind of plant.", "why_vi": "Lời gốc dùng quá khứ đơn (discovered) hoặc hiện tại hoàn thành → lùi thành had discovered."}, {"s": "My brother told that he was doing an experiment.", "ok": false, "fix": "My brother said that he was doing an experiment.", "why_vi": "tell phải có người nghe (told me/us…). Không có người nghe thì dùng said."}, {"s": "They said that they were working in the laboratory then.", "ok": true, "fix": "They said that they were working in the laboratory then.", "why_vi": "are working → were working; now → then. Câu đúng."}, {"s": "'I love physics,' said Nam. → Nam said that I loved physics.", "ok": false, "fix": "'I love physics,' said Nam. → Nam said that he loved physics.", "why_vi": "Phải đổi đại từ theo người nói: Nam nói 'I' → he."}, {"s": "'I will call you tomorrow,' Linh told me. → Linh told me that she would call me the next day.", "ok": true, "fix": "'I will call you tomorrow,' Linh told me. → Linh told me that she would call me the next day.", "why_vi": "will → would; I → she; you → me; tomorrow → the next day. Đủ cả 4 thay đổi."}]}, "exam": [{"format": "transformation", "title_vi": "Viết lại câu (câu tường thuật)", "intro_vi": "Phần Viết của đề chuyên Anh Sở Hà Nội có bài viết lại câu sao cho nghĩa không đổi, bắt đầu bằng phần cho sẵn. Chuyển sang câu tường thuật là dạng rất hay gặp.", "tip_vi": "Mẹo: kiểm tra đủ 4 việc: lùi thì, đổi đại từ (I → he/she), đổi trạng từ thời gian (tomorrow → the next day), dùng đúng say/tell.", "kind": "transform", "items": [{"q": "'I am reading a book about famous inventors,' said Khang.", "start": "Khang said", "answer": "that he was reading a book about famous inventors", "accept": ["he was reading a book about famous inventors"], "explain_vi": "am reading → was reading; I → he. Có thể bỏ 'that'."}, {"q": "'We will carry out the experiment next week,' the students said.", "start": "The students said", "answer": "that they would carry out the experiment the following week", "accept": ["they would carry out the experiment the following week", "that they'd carry out the experiment the following week", "they'd carry out the experiment the following week", "that they would carry out the experiment the next week", "they would carry out the experiment the next w revious day)."}]}, {"format": "reading_mcq", "title_vi": "Đọc hiểu", "intro_vi": "Đề chuyên có bài đọc hiểu chọn A, B, C, D: đề Chuyên Ngoại ngữ có 8 câu, đề Sở có phần Đọc 25 câu gồm nhiều bài. Hôm nay em làm bản rút gọn: 1 bài đọc, 5 câu.", "tip_vi": "Mẹo: đọc câu hỏi trước, gạch từ khoá rồi tìm đoạn chứa thông tin. Đáp án đúng thường nói lại bằng từ khác, ít khi chép nguyên văn.", "kind": "mcq", "passage": "Đức is thirteen and lives with his grandmother in a small town in Thanh Hoá. A few years ago, his grandmother's eyes became weak, and she often walked into tables and doors. One evening, after she fell and hurt her knee, Đức decided that he had to do something to help her.\n\nHe came up with the idea of a walking stick which could 'see' for her. With some help from his science teacher, he fixed a small sensor to the bottom of an old stick. When the stick came close to something, it made a loud beep. However, his first experiment did not go well. The stick beeped at everything, even at a sleeping cat or a leaf on the floor. Đức felt like giving up, but his teacher told him that every inventor made mistakes before a breakthrough.\n\nFor the next two months, Đức carried out more tests in the school laboratory and changed the sensor many times. Then his grandmother told him that the beeping embarrassed her when she went to the market. So Đức made the stick vibrate gently in her hand instead.\n\nLast spring, his invention won second prize at a science fair for students in his province. Now his grandmother walks to the market on her own every morning. Đức says that his next goal is to make the stick cheap enough for every elderly person in his town.", "items": [{"q": "Why did Đức decide to make the walking stick?", "options": ["His teacher asked him to do a science project.", "He wanted to win a prize at the science fair.", "His grandmother often walked into things and got hurt.", "His grandmother wanted to go to the market more often."], "answer": 2, "explain_vi": "Đoạn 1: bà mắt kém, hay va vào bàn, cửa và bị ngã đau đầu gối, nên Đức quyết định giúp bà."}, {"q": "What was the problem with the first stick?", "options": ["It was too heavy for his grandmother.", "It beeped even at very small things.", "It broke after the first test.", "It was too expensive to make."], "answer": 1, "explain_vi": "Đoạn 2: 'The stick beeped at everything, even at a sleeping cat or a leaf' – kêu cả với vật rất nhỏ."}, {"q": "What did Đức's teacher tell him when the first experiment failed?", "options": ["Every inventor makes mistakes before a big success.", "He should stop working on the stick.", "The sensor was too expensive to buy.", "He needed a bigger laboratory."], "answer": 0, "explain_vi": "Câu tường thuật: 'his teacher told him that every inventor made mistakes before a breakthrough'. breakthrough ≈ big success."}, {"q": "Why did Đức make the stick vibrate instead of beeping?", "options": ["The beep was too quiet to hear in the market.", "The vibrating stick was cheaper to make.", "His teacher said that vibration was safer.", "His grandmother felt embarrassed by the noise."], "answer": 3, "explain_vi": "Đoạn 3: bà nói tiếng bíp làm bà ngại (embarrassed) khi đi chợ, nên Đức đổi sang rung."}, {"q": "What is the passage mainly about?", "options": ["How to look after elderly people with weak eyes", "A boy who invented something to help his grandmother", "A science fair for students in Thanh Hoá", "Why sensors are useful in modern life"], "answer": 1, "explain_vi": "Cả bài kể về Đức và chiếc gậy cậu sáng chế cho bà. Các đáp án khác chỉ là chi tiết nhỏ hoặc không có trong bài."}]}], "exam_easy": [{"format": "transformation", "title_vi": "Viết lại câu (câu tường thuật)", "intro_vi": "Đề chuyên có bài viết lại câu sao cho nghĩa không đổi, bắt đầu bằng phần cho sẵn. Hôm nay em chuyển lời nói trực tiếp sang câu tường thuật. Câu ngắn, mỗi câu chỉ cần đổi 2–3 chỗ.", "tip_vi": "Mẹo: 3 bước: (1) đổi I/my/we → he/she/his/her/they; (2) lùi thì: am → was, l  project. 'Find a problem at home and try to solve it,' he said.\n\nMai thought about her little brother, Bin. Bin is five, and he never drinks enough water. He often has headaches in the afternoon. So Mai came up with an idea: a 'talking bottle'. She put a small speaker on an old water bottle. Every hour, the bottle says, 'Hello, Bin! It's time to drink some water!'\n\nAt first, Bin was scared of the bottle, and he hid it under his bed. But after two days, he started to love it. Now he drinks six glasses of water every day, and his headaches have stopped. Mai's mother told her that Bin was much healthier now.\n\nMai showed her bottle to the class. Her friends laughed and clapped. Mr Nam said that it was a simple but clever invention. Next year, Mai wants to make a talking bottle for her grandfather too, because he often forgets to drink water.", "items": [{"q": "What was Bin's problem?", "options": ["He didn't like his sister.", "He was often late for school.", "He didn't drink enough water.", "He was afraid of the dark."], "answer": 2, "explain_vi": "Đoạn 2: 'he never drinks enough water' – Bin không bao giờ uống đủ nước, nên hay đau đầu."}, {"q": "What does the bottle do every hour?", "options": ["It tells Bin to drink water.", "It plays music for Bin.", "It cleans the water.", "It calls Mai's mother."], "answer": 0, "explain_vi": "Đoạn 2: mỗi giờ chiếc chai nói 'It's time to drink some water!' – nhắc Bin uống nước."}, {"q": "How did Bin feel about the bottle at first?", "options": ["happy", "scared", "hungry", "bored"], "answer": 1, "explain_vi": "Đoạn 3: 'At first, Bin was scared of the bottle' – lúc đầu Bin sợ chiếc chai, còn giấu nó dưới gầm giường."}, {"q": "What did Mr Nam say about the bottle?", "options": ["It was too expensive.", "It was very noisy.", "It needed a bigger speaker.", "It was simple but clever."], "answer": 3, "explain_vi": "Đoạn 4, câu tường thuật: 'Mr Nam said that it was a simple but clever invention' – đơn giản mà thông minh."}, {"q": "
