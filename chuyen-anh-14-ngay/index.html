them doze off in class. Critics argue that a later start only moves the problem, since teenagers will just go to bed even later. So far, though, the figures do not support this view."}], "items": [{"id": "diag01", "level": "A2", "skill": "grammar", "type": "mcq", "q": "My sister ______ to school by bus every day.", "options": ["go", "goes", "going", "is go"], "answer": 1, "explain_vi": "Thói quen hằng ngày (every day) dùng hiện tại đơn; chủ ngữ số ít 'My sister' nên động từ thêm -es: goes."}, {"id": "diag02", "level": "A2", "skill": "grammar", "type": "mcq", "q": "We ______ at home last weekend because it was raining.", "options": ["was", "are", "were", "did"], "answer": 2, "explain_vi": "'last weekend' là quá khứ; chủ ngữ 'We' đi với 'were' (không dùng 'was')."}, {"id": "diag03", "level": "A2", "skill": "grammar", "type": "mcq", "q": "My birthday is ______ 14th May.", "options": ["in", "at", "by", "on"], "answer": 3, "explain_vi": "Trước ngày cụ thể (14th May) dùng giới từ 'on'. 'in' dùng cho tháng/năm, 'at' cho giờ."}, {"id": "diag04", "level": "A2", "skill": "grammar", "type": "mcq", "q": "This is Tom's bag, and that one is ______ too.", "options": ["his", "him", "he", "he's"], "answer": 0, "explain_vi": "Cần đại từ sở hữu đứng một mình (= của cậu ấy): 'his'. 'him' là tân ngữ, 'he's' = he is."}, {"id": "diag05", "level": "A2", "skill": "vocab", "type": "mcq", "q": "I'm hungry. Can I have a ______ of bread?", "options": ["glass", "bowl", "slice", "bottle"], "answer": 2, "explain_vi": "'a slice of bread' = một lát bánh mì. 'glass' và 'bottle' dùng cho đồ uống, 'bowl' cho cơm/súp."}, {"id": "diag06", "level": "A2", "skill": "vocab", "type": "mcq", "q": "Please ______ the door. It's cold in here.", "options": ["wear", "close", "make", "turn"], "answer": 1, "explain_vi": "Trời lạnh nên cần 'close the door' (đóng cửa). 'wear' là mặc, 'make' là làm ra."}, {"id": "diag07", "level": "A2", "skill": "vocab", "type": "mcq", "q": "My grandfather is 80, but he is still very ______. He walks five kilometres every day.", "options": ["tired", "lazy", "ill", "active"], "answer": 3, "explain_vi": "Ông vẫn đi bộ 5 km mỗi ngày nên ông rất 'active' (năng động). Ba từ còn lại trái nghĩa với ý câu."}, {"id": "diag08", "level": "A2", "skill": "wordform", "type": "text", "q": "It's very ______ today, so take your umbrella. (RAIN)", "answer": "rainy", "accept": ["rainy"], "explain_vi": "Sau 'very' cần tính từ. rain (mưa) + -y → rainy (có mưa)."}, {"id": "diag09", "level": "A2", "skill": "reading", "type": "mcq", "passage": "diagP1", "q": "Why do Minh and his cousins swim before breakfast?", "options": ["It is too hot in the morning.", "They have breakfast at the beach.", "The sea is calm at that time.", "They want to see dolphins."], "answer": 2, "explain_vi": "Bài viết: 'we swim before breakfast, because the sea is calm then'. Trời nóng là vào buổi chiều, không phải buổi sáng."}, {"id": "diag10", "level": "A2", "skill": "reading", "type": "mcq", "passage": "diagP1", "q": "What will Minh do on Sunday?", "options": ["Travel home by train", "Go on a boat trip", "Play board games", "Go to football practice"], "answer": 3, "explain_vi": "'See you at football practice on Sunday.' Về nhà bằng tàu là thứ Bảy, đi thuyền là hôm qua."}, {"id": "diag11", "level": "B1", "skill": "grammar", "type": "mcq", "q": "You've finished your homework, ______?", "options": ["didn't you", "haven't you", "don't you", "have you"], "answer": 1, "explain_vi": "Câu hỏi đuôi: vế trước khẳng định 'You've (= have) finished' → đuôi phủ định cùng trợ động từ: 'haven't you?'."}, {"id": "diag12", "level": "B1", "skill": "grammar", "type": "mcq", "q": "______ the heavy rain, the match still went ahead.", "options": ["Although", "However", "Despite", "Because"], "answer": 2, "explain_vi": "Sau chỗ trống là cụm danh từ 'the heavy rain' → dùng 'Despite'. 'Although' phải đi với một mệnh đề (S + V)."}, {"id": "diag13", "level": "B1", "skill": "grammar", "type": "mcq", "q": "A: I don't like horror films.\nB: ______ do I. They're too scary.", "options": ["Neither", "So", "Too", "Either"], "answer": 0, "explain_vi": "Đồng ý với câu phủ định dùng 'Neither + trợ động từ + S' (Neither do I = Tớ cũng không). 'So do I' chỉ dùng sau câu khẳng định."}, {"id": "diag14", "level": "B1", "skill": "grammar", "type": "mcq", "q": "By the time we arrived at the cinema, the film ______.", "options": ["has started", "started", "was starting", "had started"], "answer": 3, "explain_vi": "'By the time + quá khứ đơn' → hành động xảy ra trước đó dùng quá khứ hoàn thành: had started."}, {"id": "diag15", "level": "B1", "skill": "vocab", "type": "mcq", "q": "Please ______ attention to the instructions before you start the test.", "options": ["keep", "pay", "take", "make"], "answer": 1, "explain_vi": "Cụm cố định: 'pay attention (to)' = chú ý (đến)."}, {"id": "diag16", "level": "B1", "skill": "vocab", "type": "mcq", "q": "Could you ______ my cat while I'm on holiday next week?", "options": ["look for", "look up", "look after", "look into"], "answer": 2, "explain_vi": "'look after' = chăm sóc. 'look for' = tìm kiếm, 'look up' = tra cứu, 'look into' = điều tra."}, {"id": "diag17", "level": "B1", "skill": "vocab", "type": "mcq", "q": "I'm afraid I can't come to your party. I've got a bad ______ and I can't stop coughing.", "options": ["cold", "pain", "ache", "temperature"], "answer": 0, "explain_vi": "'have a bad cold' = bị cảm nặng, hợp với 'ho không ngừng'. 'ache' phải ghép (headache...), không nói 'a bad temperature'."}, {"id": "diag18", "level": "B1", "skill": "wordform", "type": "text", "q": "Their ______ began in Grade 1, and they are still best friends today. (FRIEND)", "answer": "friendship", "accept": ["friendship"], "explain_vi": "Sau 'Their' cần danh từ. friend + -ship → friendship (tình bạn)."}, {"id": "diag19", "level": "B1", "skill": "reading", "type": "mcq", "passage": "diagP2", "q": "Why did Linh start the book box?", "options": ["Her school asked her to do it.", "The library near her building had closed.", "She wanted to sell her old books.", "Many families had books they no longer read."], "answer": 3, "explain_vi": "Câu đầu: các gia đình có 'shelves full of books that nobody read any more' – sách không ai đọc nữa. Các ý khác không có trong bài."}, {"id": "diag20", "level": "B1", "skill": "reading", "type": "mcq", "passage": "diagP2", "q": "What does Linh like most about the project?", "options": ["The large number of books", "The way neighbours now talk to each other", "The notes that children leave in the books", "The second shelf built by a neighbour"], "answer": 1, "explain_vi": "Câu cuối: 'the best part is not the books themselves but the conversations people now have' – điều Linh thích nhất là mọi người trò chuyện với nhau."}, {"id": "diag21", "level": "B2", "skill": "grammar", "type": "mcq", "q": "Hardly ______ the house when it started to pour with rain.", "options": ["we had left", "had we left", "have we left", "we left"], "answer": 1, "explain_vi": "Đảo ngữ: 'Hardly + had + S + V3 ... when ...' (vừa mới ... thì ...). Sau 'Hardly' đứng đầu câu phải đảo trợ động từ 'had'."}, {"id": "diag22", "level": "B2", "skill": "grammar", "type": "mcq", "q": "I'd rather you ______ tell anyone about this yet.", "options": ["don't", "won't", "didn't", "wouldn't"], "answer": 2, "explain_vi": "'would rather + S + quá khứ đơn' dùng để nói mong muốn về người khác ở hiện tại/tương lai → didn't tell."}, {"id": "diag23", "level": "B2", "skill": "grammar", "type": "mcq", "q": "She ______ have seen me. She walked straight past without saying hello.", "options": ["can't", "shouldn't", "needn't", "wouldn't"], "answer": 0, "explain_vi": "Suy đoán chắc chắn KHÔNG xảy ra trong quá khứ: 'can't have + V3' (chắc hẳn đã không ...)."}, {"id": "diag24", "level": "B2", "skill": "grammar", "type": "mcq", "q": "It's high time we ______ for the airport, or we'll miss the flight.", "options": ["leave", "will leave", "are leaving", "left"], "answer": 3, "explain_vi": "'It's (high) time + S + quá khứ đơn' = đã đến lúc phải làm gì → left."}, {"id": "diag25", "level": "B2", "skill": "vocab", "type": "mcq", "q": "The concert was ______ off because the singer had lost her voice.", "options": ["called", "dropped", "given", "broken"], "answer": 0, "explain_vi": "'call off' = huỷ bỏ (sự kiện). 'drop off' = ngủ gật/cho xuống xe, 'give off' = toả ra, 'break off' = cắt đứt."}, {"id": "diag26", "level": "B2", "skill": "vocab", "type": "mcq", "q": "After months of training, the team finally ______ their goal of playing in the final.", "options": ["won", "earned", "gained", "achieved"], "answer": 3, "explain_vi": "Kết hợp từ: 'achieve a goal' = đạt được mục tiêu. Không nói 'win/earn/gain a goal' với nghĩa này."}, {"id": "diag27", "level": "B2", "skill": "vocab", "type": "mcq", "q": "Lan ______ a lot of effort into her science project, and it really showed.", "options": ["put", "made", "did", "gave"], "answer": 0, "explain_vi": "Cụm cố định: 'put effort into something' = dồn công sức vào. ('make an effort' không đi với 'into'.)"}, {"id": "diag28", "level": "B2", "skill": "wordform", "type": "text", "q": "There must be a ______. I ordered tea, not coffee. (UNDERSTAND)", "answer": "misunderstanding", "accept": ["misunderstanding"], "explain_vi": "Sau 'a' cần danh từ, nghĩa là sự hiểu lầm: mis- + understand + -ing → misunderstanding."}, {"id": "diag29", "level": "B2", "skill": "reading", "type": "mcq", "passage": "diagP3", "q": "According to the passage, why do many teenagers find it hard to fall asleep early?", "options": ["Their bodies start producing a sleep hormone later in the evening.", "They spend too long looking at their phones at night.", "Their schools start lessons too late in the morning.", "They are lazier than they were as children."], "answer": 0, "explain_vi": "Bài viết: cơ thể tiết hormone melatonin muộn hơn khoảng 2 tiếng. Bài phủ nhận ý 'lười', và không nhắc đến điện thoại."}, {"id": "diag30", "level": "B2", "skill": "reading", "type": "mcq", "passage": "diagP3", "q": "What is the writer's attitude towards later school start times?", "options": ["completely against them", "worried about how much they cost", "generally positive about them", "sure that they will fail in the long term"], "answer": 2, "explain_vi": "Tác giả gọi kết quả là 'promising' và nói số liệu 'do not support' ý kiến phản đối → thái độ nhìn chung là tích cực."}]}, "final": {"title_vi": "Bài kiểm tra sau 2 tuần", "minutes": 25, "passages": [{"id": "finP1", "level": "A2", "text": "Dear Grandma,\nThank you for the birthday present! I wear the blue jacket every day because our classroom is very cold in the morning. On Saturday, Mum took me and four friends to the zoo for my party. We saw two baby elephants and then ate pizza in the park. Next month I'm visiting you with Dad. Can we go fishing again?\nLove,\nHoa"}, {"id": "finP2", "level": "B1", "text": "Last year, Quân's class turned an empty corner of the school yard into a vegetable garden. The idea came from their science teacher, who wanted students to see where food really comes from. At first, many students thought gardening would be boring, and insects ate most of the first tomatoes. Instead of giving up, the class asked a farmer for advice and planted flowers between the vegetables to keep the insects away. This spring, they grew enough lettuce to sell at the school fair. Quân says the money was nice, but he is prouder that his classmates now argue about whose turn it is to water the plants."}, {"id": "finP3", "level": "B2", "text": "Many students believe they can do their homework while chatting with friends online, and some even claim it helps them stay calm. Psychologists are not convinced. Their studies show that the brain does not really do two things at once; instead, it switches quickly between tasks, and every switch costs a little time and attention. Over an evening, these small losses add up, so homework that should take one hour may take ninety minutes, and the work is often less accurate. Interestingly, the people who consider themselves good at multitasking tend to perform worst in tests. This does not mean phones must be banned from bedrooms. A simple rule, such as checking messages only after finishing each subject, seems to bring most of the benefits without making teenagers feel cut off from their friends."}], "items": [{"id": "fin01", "level": "A2", "skill": "grammar", "type": "mcq", "q": "______ your brother like ice cream?", "options": ["Is", "Do", "Are", "Does"], "answer": 3, "explain_vi": "Câu hỏi hiện tại đơn với động từ thường 'like', chủ ngữ số ít 'your brother' → dùng 'Does'."}, {"id": "fin02", "level": "A2", "skill": "grammar", "type": "mcq", "q": "I ______ my keys yesterday, so I couldn't open the door.", "options": ["lose", "losed", "lost", "losing"], "answer": 2, "explain_vi": "'yesterday' → quá khứ đơn. 'lose' là động từ bất quy tắc: lose – lost – lost."}, {"id": "fin03", "level": "A2", "skill": "grammar", "type": "mcq", "q": "The film starts ______ 7.30, so please don't be late.", "options": ["at", "in", "on", "by"], "answer": 0, "explain_vi": "Trước giờ cụ thể (7.30) dùng giới từ 'at'."}, {"id": "fin04", "level": "A2", "skill": "grammar", "type": "mcq", "q": "These are my sister's shoes. Please give them to ______.", "options": ["she", "her", "hers", "herself"], "answer": 1, "explain_vi": "Sau giới từ 'to' cần đại từ tân ngữ: 'her'. 'she' là chủ ngữ, 'hers' = của cô ấy."}, {"id": "fin05", "level": "A2", "skill": "vocab", "type": "mcq", "q": "I'm thirsty. Can I have a ______ of orange juice, please?", "options": ["slice", "loaf", "piece", "glass"], "answer": 3, "explain_vi": "Đồ uống dùng 'a glass of' (một cốc). 'slice/piece' dùng cho đồ ăn, 'loaf' là ổ bánh mì."}, {"id": "fin06", "level": "A2", "skill": "vocab", "type": "mcq", "q": "It's raining outside. Don't forget to take your ______.", "options": ["sunglasses", "umbrella", "scarf", "gloves"], "answer": 1, "explain_vi": "Trời mưa thì mang 'umbrella' (ô). Các đồ còn lại không dùng để che mưa."}, {"id": "fin07", "level": "A2", "skill": "vocab", "type": "mcq", "q": "My little brother is very ______. He always smiles and talks to new people.", "options": ["quiet", "shy", "friendly", "sleepy"], "answer": 2, "explain_vi": "Luôn cười và nói chuyện với người mới → 'friendly' (thân thiện). 'quiet' và 'shy' trái nghĩa với ý câu."}, {"id": "fin08", "level": "A2", "skill": "wordform", "type": "text", "q": "It's ______ today, so let's go to the park and fly a kite. (WIND)", "answer": "windy", "accept": ["windy"], "explain_vi": "Sau 'It's' cần tính từ chỉ thời tiết. wind (gió) + -y → windy (có gió)."}, {"id": "fin09", "level": "A2", "skill": "reading", "type": "mcq", "passage": "finP1", "q": "Why does Hoa wear the blue jacket every day?", "options": ["Her classroom is cold in the morning.", "Blue is her favourite colour.", "Her mum told her to wear it.", "She wants to wear it to the zoo."], "answer": 0, "explain_vi": "Bài viết: 'I wear the blue jacket every day because our classroom is very cold in the morning.'"}, {"id": "fin10", "level": "A2", "skill": "reading", "type": "mcq", "passage": "finP1", "q": "What does Hoa want to do next month?", "options": ["Visit the zoo again", "Go fishing with Grandma", "Have another party", "Eat pizza in the park"], "answer": 1, "explain_vi": "'Next month I'm visiting you ... Can we go fishing again?' Đi sở thú và ăn pizza là thứ Bảy vừa rồi."}, {"id": "fin11", "level": "B1", "skill": "grammar", "type": "mcq", "q": "Your parents haven't met my teacher yet, ______?", "options": ["have they", "haven't they", "did they", "do they"], "answer": 0, "explain_vi": "Vế trước phủ định 'haven't met' → câu hỏi đuôi khẳng định cùng trợ động từ: 'have they?'."}, {"id": "fin12", "level": "B1", "skill": "grammar", "type": "mcq", "q": "______ she was very tired, she carried on studying until midnight.", "options": ["Despite", "However", "Although", "In spite"], "answer": 2, "explain_vi": "Sau chỗ trống là mệnh đề 'she was very tired' (S + V) → dùng 'Although'. 'Despite/In spite of' đi với danh từ/V-ing."}, {"id": "fin13", "level": "B1", "skill": "grammar", "type": "mcq", "q": "A: I've never been abroad.\nB: ______ have I. I'd love to go one day.", "options": ["So", "Neither", "Either", "Also"], "answer": 1, "explain_vi": "'never' mang nghĩa phủ định → đồng ý dùng 'Neither have I' (Tớ cũng chưa từng)."}, {"id": "fin14", "level": "B1", "skill": "grammar", "type": "mcq", "q": "When I got to the station, the train ______, so I had to wait an hour for the next one.", "options": ["has already left", "already leaves", "would already leave", "had already left"], "answer": 3, "explain_vi": "Tàu rời đi TRƯỚC khi tôi đến (một hành động quá khứ khác) → quá khứ hoàn thành: had already left."}, {"id": "fin15", "level": "B1", "skill": "vocab", "type": "mcq", "q": "I always ______ a lot of mistakes when I write in a hurry.", "options": ["do", "make", "take", "have"], "answer": 1, "explain_vi": "Kết hợp từ: 'make a mistake' = mắc lỗi (không dùng 'do a mistake')."}, {"id": "fin16", "level": "B1", "skill": "vocab", "type": "mcq", "q": "We've ______ milk, so I'll go to the shop and buy some more.", "options": ["run into", "run after", "run out of", "run over"], "answer": 2, "explain_vi": "'run out of' = hết (thứ gì). 'run into' = tình cờ gặp, 'run after' = đuổi theo, 'run over' = cán qua."}, {"id": "fin17", "level": "B1", "skill": "vocab", "type": "mcq", "q": "Eating fruit, vegetables and some protein every day is part of a ______ diet.", "options": ["fair", "equal", "even", "balanced"], "answer": 3, "explain_vi": "Kết hợp từ: 'a balanced diet' = chế độ ăn cân bằng. Không nói 'fair/equal/even diet'."}, {"id": "fin18", "level": "B1", "skill": "wordform", "type": "text", "q": "To use the swimming pool, you need a ______ card. (MEMBER)", "answer": "membership", "accept": ["membership"], "explain_vi": "Cần danh từ: member + -ship → membership (tư cách hội viên); 'membership card' = thẻ hội viên."}, {"id": "fin19", "level": "B1", "skill": "reading", "type": "mcq", "passage": "finP2", "q": "Whose idea was the vegetable garden?", "options": ["The students'", "A farmer's", "Their science teacher's", "Quân's parents'"], "answer": 2, "explain_vi": "'The idea came from their science teacher'. Người nông dân chỉ cho lời khuyên sau đó."}, {"id": "fin20", "level": "B1", "skill": "reading", "type": "mcq", "passage": "finP2", "q": "What is Quân most proud of?", "options": ["The money they made at the fair", "The tomatoes they grew in the first year", "The flowers they planted between the vegetables", "How keen his classmates now are to look after the plants"], "answer": 3, "explain_vi": "Câu cuối: tiền thì vui, nhưng Quân tự hào hơn vì các bạn giờ tranh nhau tưới cây – tức là ai cũng muốn chăm vườn."}, {"id": "fin21", "level": "B2", "skill": "grammar", "type": "mcq", "q": "No sooner ______ onto the stage than the audience began to cheer.", "options": ["had she stepped", "she had stepped", "has she stepped", "she stepped"], "answer": 0, "explain_vi": "Đảo ngữ: 'No sooner + had + S + V3 ... than ...' (vừa mới ... thì ...)."}, {"id": "fin22", "level": "B2", "skill": "grammar", "type": "mcq", "q": "I'd rather you ______ your phone during dinner.", "options": ["don't use", "didn't use", "won't use", "wouldn't use"], "answer": 1, "explain_vi": "'would rather + S + quá khứ đơn' khi muốn người khác làm/không làm gì → didn't use."}, {"id": "fin23", "level": "B2", "skill": "grammar", "type": "mcq", "q": "The experiment ______ have gone wrong. The results look perfect.", "options": ["hadn't", "needn't", "can't", "wouldn't"], "answer": 2, "explain_vi": "Suy đoán chắc chắn điều gì KHÔNG xảy ra trong quá khứ: 'can't have + V3'."}, {"id": "fin24", "level": "B2", "skill": "grammar", "type": "mcq", "q": "It's about time you ______ your room. It's a complete mess!", "options": ["tidy", "will tidy", "are tidying", "tidied"], "answer": 3, "explain_vi": "'It's (about/high) time + S + quá khứ đơn' = đã đến lúc phải làm gì → tidied."}, {"id": "fin25", "level": "B2", "skill": "vocab", "type": "mcq", "q": "After weeks of failed experiments, the team finally ______ a cheaper way to clean the water.", "options": ["came across", "came up with", "came down with", "came round to"], "answer": 1, "explain_vi": "'come up with' = nghĩ ra (ý tưởng, giải pháp). 'come across' = tình cờ thấy, 'come down with' = bị ốm, 'come round to' = dần chấp nhận (ý kiến)."}, {"id": "fin26", "level": "B2", "skill": "vocab", "type": "mcq", "q": "The new school rules will ______ effect next Monday.", "options": ["make", "get", "do", "take"], "answer": 3, "explain_vi": "Cụm cố định: 'take effect' = bắt đầu có hiệu lực."}, {"id": "fin27", "level": "B2", "skill": "vocab", "type": "mcq", "q": "She ______ most of her free time to helping at the animal shelter.", "options": ["devotes", "spends", "uses", "takes"], "answer": 0, "explain_vi": "'devote time to + V-ing' = dành (hết lòng) thời gian cho việc gì. 'spend time' đi với 'on' hoặc V-ing, không đi với 'to'."}, {"id": "fin28", "level": "B2", "skill": "wordform", "type": "text", "q": "Sorry, I ______ the question, so my answer was completely wrong. (UNDERSTAND)", "answer": "misunderstood", "accept": ["misunderstood"], "explain_vi": "Cần động từ quá khứ mang nghĩa 'hiểu sai': mis- + understand → misunderstand → quá khứ: misunderstood."}, {"id": "fin29", "level": "B2", "skill": "reading", "type": "mcq", "passage": "finP3", "q": "According to psychologists, what happens when we try to do two things at the same time?", "options": ["The brain moves rapidly from one task to the other.", "The brain does both tasks equally well.", "We become calmer and more focused.", "We completely forget the first task."], "answer": 0, "explain_vi": "Bài viết: 'the brain does not really do two things at once; instead, it switches quickly between tasks'."}, {"id": "fin30", "level": "B2", "skill": "reading", "type": "mcq", "passage": "finP3", "q": "What is the writer's view on phones and homework?", "options": ["Phones should be banned from bedrooms.", "Students who multitask get the best results.", "A sensible rule works better than a total ban.", "Messages should always be answered quickly."], "answer": 2, "explain_vi": "Tác giả nói không cần cấm điện thoại; một quy tắc đơn giản (xem tin nhắn sau mỗi môn) mang lại phần lớn lợi ích."}]}}}</script>
<script>
(function(){
"use strict";
const C = JSON.parse(document.getElementById('content').textContent);
const DAYS = C.days; // array indexed 0..13
const TESTS = {diag:C.tests.diagnostic, final:C.tests.final};
const KEY = 'chuyenAnh14_v1';
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
function blank(){return {name:'',code:'',student:null,diag:null,final:null,days:{},queue:{},mastered:{},plan:{min:40,dpw:6},created:Date.now()}}
let S = blank();
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(blank(),JSON.parse(raw));}}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.savedAt=Date.now();saveLocal();scheduleSync()}

/* ---------- item index ---------- */
const ITEM = {};
DAYS.forEach(d=>(d.web_check||[]).forEach(it=>{ITEM[it.id]=Object.assign({day:d.day},it)}));

/* ---------- levels & hours model ----------
   Cumulative guided learning hours (Cambridge English approximations):
   A2 ≈ 180–200h, B1 ≈ 350–400h, B2 ≈ 500–600h, C1 ≈ 700–800h. */
const LEVELS=[
  {k:'preA2',name:'Dưới A2',h:0},{k:'A2',name:'A2',h:190},{k:'A2+',name:'A2+',h:280},
  {k:'B1',name:'B1',h:375},{k:'B1+',name:'B1+',h:460},{k:'B2',name:'B2',h:550},
  {k:'B2+',name:'B2+',h:650},{k:'C1',name:'C1',h:750}];
const ENTRY_H={'preA2':140,'A2':220,'A2+':300,'B1':400,'B1+':490,'B2':580};
function levelOfHours(h){let L=LEVELS[0];for(const l of LEVELS){if(h>=l.h)L=l}return L}
function levelFromBands(a,b,c){
  if(a<5) return 'preA2';
  if(b<4) return 'A2';
  if(b<7) return 'A2+';
  if(c<4) return 'B1';
  if(c<7) return 'B1+';
  return 'B2';
}
const MILESTONES=[
  {date:new Date(2027,4,31),label:'Hết lớp 7',target:'B1',h:375},
  {date:new Date(2028,4,31),label:'Hết lớp 8',target:'B2',h:550},
  {date:new Date(2029,5,1),label:'Thi vào 10',target:'C1',h:750}];
const STUDY_FACTOR=0.85; // nghỉ lễ, ôn thi học kỳ, ốm…
const CONV=0.6; // 1 giờ tự học/học thêm ≈ 0,6 giờ học chuẩn có hướng dẫn (ước tính thận trọng)
function weeksUntil(d){return Math.max(0,(d-Date.now())/(7*864e5))}

/* ---------- grading ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,;:]+$/,'').replace(/\s+/g,' ').trim()}
function isCorrect(it,val){
  if(it.type==='mcq') return Number(val)===Number(it.answer);
  if(val==null||String(val).trim()==='') return false;
  const v=norm(val); const ok=[it.answer].concat(it.accept||[]).map(norm);
  return ok.includes(v);
}
function answerText(it){return it.type==='mcq'?it.options[it.answer]:it.answer}

/* ---------- question rendering ---------- */
function renderQ(it,idx,opts={}){
  const name='q_'+it.id;
  const head=`<div class="qhead"><span class="qnum">${idx}</span>${opts.review?'<span class="review-mark">Ôn lại câu em từng sai</span>':''}${it.from_day&&!opts.review?`<span class="review-mark">Ôn xoắn ốc · buổi ${it.from_day}</span>`:''}</div>`;
  let body='';
  if(it.type==='mcq'){
    body='<div class="opts">'+it.options.map((o,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="${name}" value="${i}"><span>${esc(o)}</span></label>`).join('')+'</div>';
  }else{
    body=`<input type="text" name="${name}" id="${name}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời">`;
  }
  return `<div class="q" data-id="${it.id}">${head}<div class="qtext">${esc(it.q)}</div>${body}<div class="fbslot"></div></div>`;
}
function readAnswer(form,it){
  const name='q_'+it.id;
  if(it.type==='mcq'){const r=form.querySelector(`input[name="${name}"]:checked`);return r?r.value:null}
  const t=form.querySelector(`input[name="${name}"]`);return t?t.value:null;
}
function showFeedback(form,it,val){
  const q=form.querySelector(`.q[data-id="${it.id}"]`); if(!q)return;
  const ok=isCorrect(it,val);
  if(it.type==='mcq'){
    q.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;o.classList.remove('sel');if(i===+it.answer)o.classList.add('right');else if(String(i)===String(val))o.classList.add('wrong')});
  }
  q.querySelectorAll('input').forEach(i=>i.disabled=true);
  q.querySelector('.fbslot').innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?'Đúng rồi!':'Chưa đúng. Đáp án: <b>'+esc(answerText(it))+'</b>'}${it.explain_vi?`<span class="ex">${esc(it.explain_vi)}</span>`:''}</div>`;
  return ok;
}
function wireOptionHighlight(form){
  form.addEventListener('change',e=>{
    if(e.target.type!=='radio')return;
    const q=e.target.closest('.q');q.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked));
  });
}

/* ---------- spiral SVG ---------- */
function spiralSVG(size=220){
  const cx=size/2,cy=size/2; const pts=[];
  for(let i=0;i<14;i++){const t=0.9+i*0.86; const r=14+t*11.5; pts.push([cx+r*Math.cos(t-1.6),cy+r*Math.sin(t-1.6)])}
  let path='';for(let s=0;s<=400;s++){const t=0.9+s*(13*0.86)/400;const r=14+t*11.5;path+=(s?'L':'M')+(cx+r*Math.cos(t-1.6)).toFixed(1)+' '+(cy+r*Math.sin(t-1.6)).toFixed(1)}
  const dots=pts.map((p,i)=>{
    const st=dayStatus(i+1); const rev=DAYS[i].type==='review';
    const fill=st==='done'?'var(--good)':st==='part'?'var(--hi)':'var(--surface)';
    const stroke=st==='done'?'var(--good)':st==='part'?'var(--warn)':'var(--muted)';
    const txt=st==='done'?'var(--surface)':'var(--ink)';
    return `<g><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${rev?12:10}" fill="${fill}" stroke="${stroke}" stroke-width="2" ${rev?'stroke-dasharray="3 2"':''}/><text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${txt}" font-family="Be Vietnam Pro, sans-serif">${i+1}</text></g>`}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Vòng xoắn 14 buổi học"><path d="${path}" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>${dots}</svg>`;
}
function dayStatus(n){const d=S.days[n];if(!d)return'none';if(d.web&&d.paper)return'done';if(d.web||d.paper)return'part';return'none'}

/* ---------- views ---------- */
let VIEW='start', CUR_DAY=null;
const views={start:vStart,diag:vDiag,days:vDays,progress:vProgress,plan:vPlan,school:vSchool,share:()=>cloudOn()?vShareCloud():vShare()};
function go(v,opt){VIEW=v;if(opt&&opt.day)CUR_DAY=opt.day;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v?'true':'false'));views[v]();renderHello();try{window.scrollTo({top:0})}catch(e){}}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.view)});
function renderHello(){$('#hello').innerHTML=(S.name?`Chào <strong>${esc(S.name)}</strong>`:'')+(typeof syncLabel==='function'?syncLabel():'')}
const M=()=>$('#main');

function nextDay(){for(let i=1;i<=14;i++){if(dayStatus(i)!=='done')return i}return 14}

function vStart(){
  const nd=nextDay();
  M().innerHTML=`<section class="view">
  <div class="spiral-wrap">
    ${spiralSVG()}
    <div class="spiral-legend">
      <p class="eyebrow">Hành trình 2 tuần</p>
      <h2>14 buổi, mỗi buổi khoảng 40 phút</h2>
      <p class="lead">Em học và làm bài trên tập giấy, rồi mở trang này để kiểm tra lại. Câu nào em làm sai sẽ quay lại sau 1, 3 và 6 buổi, như một vòng xoắn, cho đến khi em nhớ chắc.</p>
      <p class="small muted">Vòng tròn nét đứt là buổi ôn tập (buổi 7 và 14). Màu xanh: xong cả giấy và web. Màu vàng: mới xong một phần.</p>
    </div>
  </div>
  ${loginCard()}
  <div class="card">
    <h3>Tên em là gì?</h3>
    <div class="row"><input type="text" id="nameInput" maxlength="40" placeholder="Ví dụ: Minh Anh" value="${esc(S.name)}" style="max-width:320px"><button class="btn" id="saveName">Lưu tên</button></div>
    <p class="small muted">${cloudOn()?'Kết quả được lưu trên máy này và tự gửi cho cô.':'Kết quả được lưu trên chính máy/trình duyệt em đang dùng. Hãy luôn mở trang này trên cùng một máy.'}</p>
  </div>
  <div class="card">
    <h3>Mỗi buổi em làm theo 4 bước</h3>
    <ol class="steps">
      <li><div><b>Học và làm bài trên giấy</b> (khoảng 30 phút): từ mới, ngữ pháp, cấu tạo từ, dạng bài thi chuyên, bài đọc, đoạn viết và phần ôn xoắn ốc.</div></li>
      <li><div><b>Gấp tập giấy lại, làm phần Kiểm tra trên web</b> (khoảng 10 phút). Đây là câu mới, không trùng với bài trên giấy.</div></li>
      <li><div>${cloudOn()?'<b>Chụp bài giấy gửi lên</b>: máy chấm, nhận xét và gửi kết quả cho cô. Câu nào em chưa đồng ý thì nhắn cô.':'<b>Chữa bài giấy</b> bằng đáp án trên web, tích những câu em làm đúng.'}</div></li>
      <li><div><b>Tự kiểm đoạn viết</b> theo danh sách tiêu chí, rồi đọc đoạn văn mẫu.</div></li>
    </ol>
    <div class="row">${S.diag?`<button class="btn hi" id="goDay">Vào buổi ${nd}</button>`:'<button class="btn hi" id="goDiag">Làm bài kiểm tra đầu vào (25 phút)</button>'}<button class="btn ghost" id="goPlan">Xem lộ trình đến kỳ thi</button></div>

/* ----- tests (diagnostic / final) ----- */
function testScore(test,ans){
  const bands={A2:[0,0],B1:[0,0],B2:[0,0]};const skills={};
  test.items.forEach(it=>{const ok=isCorrect(it,ans[it.id]);bands[it.level][1]++;if(ok)bands[it.level][0]++;
    skills[it.skill]=skills[it.skill]||[0,0];skills[it.skill][1]++;if(ok)skills[it.skill][0]++});
  const total=Object.values(bands).reduce((a,b)=>a+b[0],0);
  const lv=levelFromBands(bands.A2[0],bands.B1[0],bands.B2[0]);
  return {bands,skills,total,of:test.items.length,level:lv,hours:ENTRY_H[lv],at:Date.now()};
}

function bar(label,a,b){const p=b?Math.round(100*a/b):0;return `<div class="bar"><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><span class="v">${a}/${b}</span></div>`}

function pill(x,label){return x?`<span class="pill good">✓ ${label}</span>`:`<span class="pill">${label}: chưa làm</span>`}
function updateQueue(it,ok,day,isReview){
  const id=it.id;const qd=S.queue[id];
  const gaps=[1,3,6];
  if(qd){ if(ok){qd.stage++; if(qd.stage>=3){delete S.queue[id];S.mastered[id]=day}else qd.due=day+gaps[qd.stage]} else {qd.stage=0;qd.due=day+1;qd.wrong=(qd.wrong||0)+1} }
  else if(!ok){S.queue[id]={stage:0,due:day+1,wrong:1}}
  S.stats=S.stats||{retry:[0,0],spiral:[0,0]};
  if(isReview){S.stats.retry[1]++;if(ok)S.stats.retry[0]++}
  if(it.skill==='review'||it.from_day){S.stats.spiral[1]++;if(ok)S.stats.spiral[0]++}
}

}

/* ----- aggregate ----- */
function agg(){
  const done=[],web=[0,0],paper=[0,0],skills={};const dates=[];
  for(let i=1;i<=14;i++){const r=S.days[i];if(!r)continue;
    if(r.web){web[0]+=r.web.correct;web[1]+=r.web.total;dates.push(r.web.at);Object.entries(r.web.bySkill||{}).forEach(([k,v])=>{skills[k]=skills[k]||[0,0];skills[k][0]+=v[0];skills[k][1]+=v[1]})}
    if(r.paper){paper[0]+=r.paper.correct;paper[1]+=r.paper.total;if(!r.web)dates.push(r.paper.at)}
    if(dayStatus(i)==='done')done.push(i)}
  dates.sort();
  const span=dates.length>1?Math.max(1,Math.round((dates[dates.length-1]-dates[0])/864e5)+1):dates.length;
  const studyDays=new Set(dates.map(t=>new Date(t).toDateString())).size;
  const st=S.stats||{retry:[0,0],spiral:[0,0]};
  return {done,web,paper,skills,span,studyDays,retry:st.retry,spiral:st.spiral,queue:Object.keys(S.queue).length,mastered:Object.keys(S.mastered).length};
}

function efficiency(A){
  if(A.done.length<3)return {f:1,from:false};
  const acc=pct(A.web)||0.6;const ret=pct(A.retry)!=null&&A.retry[1]>=3?pct(A.retry):acc;
  const comp=Math.min(1,A.studyDays/Math.max(1,Math.min(14,A.span)));
  let f=0.55+0.45*acc+0.15*ret+0.1*comp;f=Math.max(0.7,Math.min(1.25,f));
  return {f:Math.round(f*100)/100,from:true,acc,ret,comp};
}

  const h0=entry?entry.hours:220;
  const date=examDateFor(grade);const weeks=Math.max(0,(date-Date.now())/(7*864e5));

  let adj=0;const ex=A.skills&&A.skills.exam, all=A.web;
  if(ex&&ex[1]>=6&&all[1]>=12){adj=Math.max(-0.3,Math.min(0.3,(ex[0]/ex[1]-all[0]/all[1])))}

  return {h,entry,eff,weeks,date,adj,sd:0.35+0.15*Math.min(3,yrs),
    achSo:Math.min(ACH_CAP,scoreFromHours(h,'so')+adj),achCnn:Math.min(ACH_CAP,scoreFromHours(h,'cnn')+adj)};
}
function schoolInputs(){
  const P=S.school;const E=englishEstimate(P.mode,P.grade);
  const val=(v,d)=>v==null||v===''||isNaN(v)?d:+v;
  const achSo=val(P.achSo,E.achSo), achCnn=val(P.achCnn,E.achCnn);
  return {E,
    toan:val(P.toan,8), van:val(P.van,8), toanSet:P.toan!=null&&P.toan!=='', vanSet:P.van!=null&&P.van!=='',
    achSo, achCnn, acSo:val(P.acSo,Math.min(10,achSo+2.5)), acCnn:val(P.acCnn,Math.min(9.5,achCnn))};
}
/* total, cut-off spread and chance for one option; bump = extra points needed (NV2 rule) */
function evalOption(o,I,bump){
  bump=bump||0;
  const mean=o.cut.reduce((a,b)=>a+b,0)/o.cut.length;
  const sample=o.cut.length>1?Math.sqrt(o.cut.reduce((s,c)=>s+(c-mean)*(c-mean),0)/(o.cut.length-1)):0;
  const sdCut=o.cut.length>2?sample:Math.max(o.sdDefault||1.3,sample);
  let total,sdInd,acSlope,ach,ac;
  if(o.f==='so'){ach=I.achSo;ac=I.acSo;total=I.toan+I.van+ac+2*ach;sdInd=1.5;acSlope=ac<10?1:0}
  else if(o.f==='cnn'){ach=I.achCnn;ac=I.acCnn;total=I.toan+I.van+ac+2*ach;sdInd=1.5;acSlope=ac<9.5?1:0}
  else{ach=I.achSo;ac=I.acSo;total=2*ach+ac;sdInd=1.3;acSlope=ac<10?1:0}
  const sdProj=(2+acSlope)*I.E.sd;
  const sd=Math.sqrt(sdCut*sdCut+sdInd*sdInd+sdProj*sdProj);
  const bar=mean+bump;
  const p=phi((total-bar)/sd);
  const need80=bar+0.84*sd;
  const tvNeed=o.f==='sp'?null:need80-(ac+2*ach);
  const cls=p>=0.8?'good':p>=0.5?'hi':p>=0.2?'warn':'bad';
  const lab=p>=0.8?'An toàn':p>=0.5?'Vừa sức':p>=0.2?'Thử thách':'Còn xa';
  return {o,mean,sdCut,total,p,need80,tvNeed,cls,lab,bump,max:o.f==='sp'?30:50};
}
/* One suggestion per exam. The three exams are on different days, so a student can sit all of them.
   Within one exam every option uses the same scores: the chance of at least one place = the best single chance. */
function portfolio(rows,I,langs){
  const rank=r=>{const i=langs.indexOf(r.o.lang);return i<0?99:i};
  const pickBest=list=>{const ok=list.filter(r=>r.p>=0.5).sort((a,b)=>rank(a)-rank(b)||b.mean-a.mean);return ok[0]||list.slice().sort((a,b)=>b.p-a.p)[0]};
  const plan=[];
  ['so','sp','cnn'].forEach(ex=>{
    const list=rows.filter(r=>r.o.exam===ex);if(!list.length)return;
    let picks=[];
    if(ex==='so'){
      const anh=list.filter(r=>r.o.group==='nv');
      const nv1=pickBest(anh);if(!nv1)return;picks.push(Object.assign({},nv1,{role:'Nguyện vọng 1'}));
      // NV2 is a back-up: only schools with a lower cut-off than NV1, judged with the extra 1 point
      const others=anh.filter(r=>r.o.sk!==nv1.o.sk&&r.mean<nv1.mean).map(r=>evalOption(r.o,I,1.0));
      const nv2=others.filter(r=>r.p>=0.8).sort((a,b)=>b.mean-a.mean)[0]||others.sort((a,b)=>b.p-a.p)[0];
      if(nv2)picks.push(Object.assign({},nv2,{role:'Nguyện vọng 2 (phải hơn điểm chuẩn 1 điểm)'}));
      const schools=picks.map(r=>r.o.sk);
      list.filter(r=>r.o.group==='extra'&&schools.includes(r.o.sk)).forEach(r=>picks.push(Object.assign({},r,{role:'Đăng ký thêm, xét bằng điểm chuyên Anh'})));
    }else{
      const b=pickBest(list);if(b)picks.push(Object.assign({},b,{role:'Lớp đăng ký'}));
    }
    plan.push({exam:ex,label:(EXAMS[ex]||{}).label||ex,date:(EXAMS[ex]||{}).date||'',picks,p:Math.max(...picks.map(r=>r.p))});
  });
  // the exams are on different days: sit every exam where the best class gives a real chance (≥20%)
  const chosen=plan.filter(e=>e.p>=0.2);
  chosen.forEach(e=>{e.tier=e.p>=0.5?'Nên thi':'Có thể thử'});
  const pAny=1-chosen.reduce((m,e)=>m*(1-e.p),1);
  return {plan,chosen,pAny};
}

async function doSync(){
  if(!cloudOn()||syncing)return;syncing=true;setSync('sending');
  try{await api('sync',{code:S.code,state:S,kpi:kpi(),sum:summary()});S.syncedAt=Date.now();saveLocal();setSync('ok')}
  catch(e){setSync(e.code==='bad_code'?'badcode':'fail')}
  finally{syncing=false}
}
function setSync(s){syncState=s;renderHello()}
function syncLabel(){
  if(!cloudOn())return '';
  if(syncState==='sending')return '<span class="sync">Đang gửi cho cô…</span>';
  if(syncState==='fail')return '<span class="sync bad">Chưa gửi được, sẽ tự thử lại</span>';
  if(syncState==='badcode')return '<span class="sync bad">Mã học sinh không còn đúng</span>';
  if(S.syncedAt)return `<span class="sync ok">Đã gửi cho cô · ${new Date(S.syncedAt).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</span>`;
  return '';
}
try{window.addEventListener('online',()=>{if(cloudOn())doSync()})}catch(e){}
setInterval(()=>{if(cloudOn()&&(!S.syncedAt||(S.savedAt||0)>S.syncedAt))doSync()},60000);

let CLOUD={uploads:[],messages:[],at:0,unseen:0};
async function loadMy(){
  if(!cloudOn())return CLOUD;
  const r=await api('my',{code:S.code});
  CLOUD={uploads:r.uploads||[],messages:r.messages||[],at:Date.now(),unseen:(r.messages||[]).filter(m=>m.from==='teacher'&&!m.seenStudent).length+(CLOUD.unseen||0)};
  // kết quả chấm mới nhất của mỗi buổi điền vào bài giấy
  latestByDay().forEach(u=>applyAiResult(u));
  updateBadge();
  return CLOUD;
}
function latestByDay(){const m={};CLOUD.uploads.filter(u=>u.status==='graded'&&u.result).forEach(u=>{if(!m[u.day]||u.ts>m[u.day].ts)m[u.day]=u});return Object.values(m)}
function applyAiResult(u){
  const n=u.day,res=u.result;if(!res||!res.items)return;
  const prev=S.days[n]&&S.days[n].paper;
  if(prev&&prev.source==='ai'&&prev.uploadId===u.id&&prev.updated===u.updated&&prev.correct===u.score)return;
  const ticks={},by={};
  res.items.forEach(it=>{ticks[it.id]=it.correct===true;const k=(it.section||'').split(' ')[0];by[k]=by[k]||[0,0];by[k][1]++;if(it.correct===true)by[k][0]++});
  S.days[n]=Object.assign(S.days[n]||{},{paper:{ticks,correct:u.score,total:u.total,by,writing:{},self:(prev&&prev.self)||{},at:Date.parse(u.ts)||Date.now(),source:'ai',uploadId:u.id,updated:u.updated,wscore:res.writing?res.writing.score:null}});
  save();
}

function compressImage(file){
  if(window.__compress)return window.__compress(file);
  return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const m=1600,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const d=c.toDataURL('image/jpeg',0.8);res({mime:'image/jpeg',data:d.split(',')[1],preview:d})};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url});
}

   <p class="small muted">Máy chấm có thể đọc nhầm chữ viết tay. Câu nào em thấy chấm chưa đúng, bấm "Con chưa đồng ý" để nhắn cô.</p></div>`;
}

/* ----- share code ----- */
async function pack(obj){
  const json=JSON.stringify(obj);
  try{ if(typeof CompressionStream!=='undefined'){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let s='';buf.forEach(b=>s+=String.fromCharCode(b));return 'Z'+btoa(s)} }catch(e){}
  return 'J'+btoa(unescape(encodeURIComponent(json)));
}
async function unpack(code){
  code=code.trim().replace(/\s+/g,'');const t=code[0],b=code.slice(1);
  if(t==='Z'){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(ds).text())}
  if(t==='J')return JSON.parse(decodeURIComponent(escape(atob(b))));
  throw new Error('bad');
}
function summary(){
  const A=agg();const eff=efficiency(A);const entry=S.diag;
  const days={};for(let i=1;i<=14;i++){const r=S.days[i];if(r)days[i]=[r.web?r.web.correct:null,r.web?r.web.total:null,r.paper?r.paper.correct:null,r.paper?r.paper.total:null,r.web?r.web.at:(r.paper?r.paper.at:null)]}
  const wrong=Object.entries(S.queue).map(([id,q])=>[id,q.wrong||1]);
  return {v:1,n:S.name,d:S.diag&&{t:S.diag.total,o:S.diag.of,l:S.diag.level,b:S.diag.bands},f:S.final&&{t:S.final.total,o:S.final.of,l:S.final.level,b:S.final.bands},days,sk:A.skills,rt:A.retry,mq:A.mastered,q:wrong,p:S.plan,e:eff.f,sd:A.studyDays,sp:A.span,at:Date.now()};
}

function resetCardHTML(){return `<div class="card"><h3>Làm lại từ đầu</h3><p class="small muted">Xóa toàn bộ kết quả trên máy này. Chỉ dùng khi đổi sang một học sinh khác.${cloudOn()?' Kết quả đã gửi cho cô vẫn được giữ.':''}</p><div class="row"><button class="btn ghost" id="rs1">Xóa kết quả</button><button class="btn" id="rs2" hidden>Chắc chắn xóa</button></div></div>`}
function wireReset(){$('#rs1').onclick=()=>{$('#rs2').hidden=false};$('#rs2').onclick=()=>{S=blank();saveLocal();go('start')}}
function reportHTML(o){
  const lv=k=>(LEVELS.find(l=>l.k===k)||{name:'—'}).name;
  const rows=Object.entries(o.days||{}).map(([d,r])=>`<tr><td>${d}</td><td>${esc(DAYS[d-1].theme_vi)}</td><td>${r[0]!=null?r[0]+'/'+r[1]:'—'}</td><td>${r[2]!=null?r[2]+'/'+r[3]:'—'}</td><td>${r[4]?new Date(r[4]).toLocaleDateString('vi-VN'):'—'}</td></tr>`).join('');
  const sk=Object.entries(o.sk||{}).map(([k,v])=>bar(SKILL_VI[k]||k,v[0],v[1])).join('');
  const weak=(o.q||[]).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,w])=>{const it=ITEM[id];return it?`<li>Buổi ${it.day} · ${esc(it.q)} <span class="muted">(sai ${w} lần, đáp án: ${esc(answerText(it))})</span></li>`:''}).join('');
  const entryH=o.d?ENTRY_H[o.d.l]:null;
  let need='';if(entryH){const r=requiredMin(entryH,750,o.e||1,MILESTONES[2].date,(o.p&&o.p.dpw)||6);need=`Ước tính cần khoảng ${Math.ceil(r/5)*5} phút/ngày × ${(o.p&&o.p.dpw)||6} ngày/tuần để đạt C1 trước kỳ thi.`}
  return `<div class="card" style="margin-top:12px"><h3>${esc(o.n||'Học sinh')}</h3>
   <p>Đầu vào: <b>${o.d?o.d.t+'/'+o.d.o+' · '+lv(o.d.l):'chưa làm'}</b> · Sau 2 tuần: <b>${o.f?o.f.t+'/'+o.f.o+' · '+lv(o.f.l):'chưa làm'}</b></p>
   <p class="small">Học ${o.sd||0} ngày trong ${o.sp||0} ngày · Câu từng sai làm lại đúng ${o.rt&&o.rt[1]?Math.round(100*o.rt[0]/o.rt[1])+'%':'—'} · Đã nhớ chắc ${o.mq||0} câu · Hệ số hiệu quả ${o.e||1} · Lịch đang chọn ${o.p?o.p.min+' phút × '+o.p.dpw+' ngày':'—'}</p>
   <p class="small">${need}</p>
   <div class="bars">${sk}</div>
   <div class="tbl-wrap"><table><thead><tr><th>Buổi</th><th>Chủ đề</th><th>Web</th><th>Giấy</th><th>Ngày</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Chưa có buổi nào.</td></tr>'}</tbody></table></div>
   ${weak?`<h3 style="font-size:1.05rem">Câu còn trong vòng ôn (sai nhiều nhất)</h3><ul class="small">${weak}</ul>`:''}
   <p class="small muted">Mã tạo lúc ${new Date(o.at).toLocaleString('vi-VN')}.</p></div>`;
}

/* ---------- boot ---------- */
go(S.diag?(dayStatus(1)==='none'?'start':'days'):'start');
if(cloudOn()){loadMy().catch(()=>{});if(!S.syncedAt||(S.savedAt||0)>S.syncedAt)doSync()}
})();
</script>
