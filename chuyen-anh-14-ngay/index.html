… để; enough + N + to V = đủ (cái gì) để: He is tall enough to reach the shelf. / We have enough time to finish.", "so + adj/adv + that …; such + (a/an) + adj + N + that … = quá … đến nỗi mà: The race was so long that I felt tired. / It was such a long race that I felt tired."], "examples": ["Swimming is better exercise than watching TV!", "Hoa is the fastest runner in our class.", "This soup is too hot to eat now.", "It was such a hot day that we stayed inside."], "common_mistake_vi": "Sai: She is enough old to join the team. → Đúng: She is old enough to join the team. (enough đứng SAU tính từ nhưng đứng TRƯỚC danh từ: enough money)."}, "wordform": {"id": "d5w", "focus": "un-, im-, in-, dis-", "rule_vi": "Thêm tiền tố un-, im-, in-, dis- vào trước từ để tạo nghĩa phủ định (không, trái lại). im- thường đi với từ bắt đầu bằng p hoặc m (possible → impossible, patient → impatient). Tiền tố không làm thay đổi từ loại.", "examples": [["healthy", "unhealthy"], ["happy", "unhappy"], ["possible", "impossible"], ["patient", "impatient"], ["active", "inactive"], ["like", "dislike"], ["agree", "disagree"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần và có 2 từ thừa. Nhớ đổi dạng từ (thêm -s, -ed…) nếu cần nhé!", "bank": ["diet", "exercise", "habit", "nutritious", "injury", "energy", "avoid", "get over"], "items": [{"id": "d5A1", "q": "My grandpa changed his ______: he now eats less salt and more vegetables.", "answer": "diet", "tag": "d5v1"}, {"id": "d5A2", "q": "Staying up late to play games is a bad ______. You should go to bed earlier.", "answer": "habit", "tag": "d5v3"}, {"id": "d5A3", "q": "Brown rice is more ______ than white rice because it has more vitamins.", "answer": "nutritious", "tag": "d5v4"}, {"id": "d5A4", "q": "The footballer had a serious leg ______, so he couldn't play for two months.", "answer": "injury", "tag": "d5v5"}, {"id": "d5A5", "q": "I didn't eat breakfast this morning, so I had no ______ during the PE lesson.", "answer": "energy", "tag": "d5v6"}, {"id": "d5A6", "q": "Thu was very sad when her cat died, but she slowly ______ it.", "answer": "got over", "tag": "d5p2"}]}, "B_grammar": {"instruction_vi": "Em viết dạng đúng của từ trong ngoặc, hoặc điền too / enough / so / such vào chỗ trống nhé. Mỗi chỗ trống chỉ điền 1–3 từ.", "items": [{"id": "d5B1", "q": "Walking is ______ (good) for your health than sitting all day.", "answer": "better", "tag": "d5g"}, {"id": "d5B2", "q": "Mount Fansipan is ______ (high) mountain in Vietnam.", "answer": "the highest", "tag": "d5g"}, {"id": "d5B3", "q": "Fruit is ______ (healthy) than sweets.", "answer": "healthier", "tag": "d5g"}, {"id": "d5B4", "q": "My little brother is only five. He is ______ young to join the football club. (too / enough)", "answer": "too", "tag": "d5g"}, {"id": "d5B5", "q": "It was ______ a delicious salad that I asked for more. (so / such)", "answer": "such", "tag": "d5g"}, {"id": "d5B6", "q": "You aren't strong ______ to lift that heavy box on your own. (too / enough)", "answer": "enough", "tag": "d5g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay mình thêm tiền tố un-, im-, in- hoặc dis- để tạo nghĩa phủ định.", "items": [{"id": "d5C1", "q": "Eating fast food every day is very ______. (HEALTHY)", "answer": "unhealthy", "tag": "d5w"}, {"id": "d5C2", "q": "Running 10 km on my first day of training was ______! I could only run 2 km. (POSSIBLE)", "answer": "impossible", "tag": "d5w"}, {"id": "d5C3", "q": "Children who sit in front of screens all day are often ______ and get tired easily. (ACTIVE)", "answer": "inactive", "tag": "d5w"}, {"id": "d5C4", "q": "I ______ broccoli, but my mum says it is good for me. (LIKE)", "answer": "dislike", "tag": "d5w"}]}, "D_exam": {"format": "sentence_transformation", "instruction_vi": "Dạng bài chọn câu gần nghĩa nhất: em đọc câu cho sẵn, rồi chọn câu (A, B, C hoặc D) có nghĩa GẦN NHẤT với câu đó. Mẹo: so sánh từng ý nhỏ – ai hơn ai, có làm được hay không.", "items": [{"id": "d5D1", "q": "Nam is taller than any other student in his class.", "options": ["Nam is as tall as the other students in his class.", "Nam is the tallest student in his class.", "Nam is not as tall as the other students in his class.", "Some students in his class are taller than Nam."], "answer": "B", "tag": "fmt:sentence_transformation"}, {"id": "d5D2", "q": "The water was too cold for us to swim in.", "options": ["The water was warm enough for us to swim in.", "The water was so cold that we swam in it.", "The water wasn't warm enough for us to swim in.", "We swam in the water although it was cold."], "answer": "C", "tag": "fmt:sentence_transformation"}, {"id": "d5D3", "q": "For my mum, no other exercise is as relaxing as yoga.", "options": ["For my mum, yoga is the most relaxing exercise.", "For my mum, yoga is less relaxing than other exercise.", "My mum finds yoga as relaxing as other exercise.", "My mum doesn't do any exercise except yoga."], "answer": "A", "tag": "fmt:sentence_transformation"}, {"id": "d5D4", "q": "The match was so exciting that nobody left early.", "options": ["The match was too exciting for anybody to watch.", "Nobody watched such an exciting match.", "The match wasn't exciting enough, so people left early.", "It was such an exciting match that nobody left early."], "answer": "D", "tag": "fmt:sentence_transformation"}]}, "E_reading": {"id": "d5r", "title": "From the Sofa to the Finish Line", "text": "A year ago, Vinh was not an active boy. He spent most evenings on the sofa with his tablet, and he often ate crisps and drank fizzy drinks. He felt tired all the time and found PE lessons really difficult.\n\nEverything changed when his school organised a 5 km fun run. Vinh's best friend, Khoa, persuaded him to sign up. At first, Vinh couldn't run for more than five minutes without stopping. 'It felt impossible,' he remembers.\n\nWith Khoa's help, Vinh started to work out three times a week. He also changed his diet. He avoided sugary drinks and ate more fish, eggs and vegetables. Slowly, he became fitter and stronger.\n\nAfter two months, he hurt his ankle and had to rest for ten days. He was disappointed, but he didn't give up. On the day of the race, he finished in 31 minutes, faster than Khoa! Now Vinh says the race was the best thing that happened to him last year.", "items": [{"id": "d5E1", "kind": "tfng", "q": "Vinh decided to sign up for the race without anyone's help.", "answer": "False", "tag": "d5r"}, {"id": "d5E2", "kind": "tfng", "q": "Vinh's PE teacher helped him to plan his training.", "answer": "Not Given", "tag": "d5r"}, {"id": "d5E3", "kind": "mcq", "q": "What happened after two months of training?", "options": ["He finished the race.", "He stopped eating fish.", "He got an injury.", "He gave up running."], "answer": "C", "tag": "d5r"}, {"id": "d5E4", "kind": "mcq", "q": "Which sentence about the race is true?", "options": ["Vinh finished before Khoa.", "Vinh and Khoa finished at the same time.", "Khoa did not take part.", "Vinh could not finish it."], "answer": "A", "tag": "d5r"}]}, "F_writing": {"task_en": "Write a paragraph (50–70 words) comparing your healthy and unhealthy habits. Say which habit you want to change and why.", "task_vi": "Viết một đoạn văn (50–70 từ) so sánh những thói quen tốt và chưa tốt cho sức khoẻ của em. Nói em muốn thay đổi thói quen nào và vì sao.", "min_words": 50, "model": "I think I am healthier than many of my friends because I cycle to school every day and eat a lot of fruit. However, I have one bad habit: I go to bed too late. Last night I played games until midnight, and this morning I was so tired that I couldn't concentrate in class. I want to change this habit because sleep is the best way to get more energy.", "checklist_vi": ["Em có dùng ít nhất 1 câu so sánh hơn và 1 câu so sánh nhất không?", "Em có dùng ít nhất 1 cấu trúc too / enough hoặc so / such … that không?", "Em có dùng ít nhất 3 từ mới hoặc cụm động từ của buổi 5 không?", "Đoạn văn đủ 50 từ và có nêu lý do (because …) vì sao em muốn thay đổi."]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – em ôn lại buổi 4 (Công nghệ), buổi 2 (Sở thích) và buổi 1 (Trường học) nhé. Điền từ thích hợp hoặc chia động từ trong ngoặc.", "items": [{"id": "d5G1", "q": "Online shopping is very ______ because you can buy things at any time of day. (Gợi ý: c__________)", "answer": "convenient", "from_day": 4, "tag": "d4v8"}, {"id": "d5G2", "q": "I've decided what to do this summer. I ______ (join) a basketball club.", "answer": "am going to join", "accept": ["'m going to join"], "from_day": 4, "tag": "d4g"}, {"id": "d5G3", "q": "My uncle had to ______ smoking because it was making him ill. (Điền 2 từ: một cụm động từ)", "answer": "give up", "from_day": 2, "tag": "d2p2"}, {"id": "d5G4", "q": "Eating well and sleeping enough can ______ your memory. (Gợi ý: i______)", "answer": "improve", "from_day": 1, "tag": "d1v7"}]}}, "web_check": [{"id": "d5q1", "type": "mcq", "skill": "vocab", "q": "To stay healthy, you should ______ eating too much salt and sugar.", "options": ["avoid", "reduce of", "refuse", "stop to"], "answer": 0, "explain_vi": "avoid + V-ing = tránh làm gì. 'refuse' phải đi với to V, còn 'stop to' + V nghĩa là dừng lại để làm việc khác.", "tag": "d5v8"}, {"id": "d5q2", "type": "text", "skill": "vocab", "q": "My older sister w______ out at the gym every Tuesday and Thursday. (Viết cả từ, chú ý chia động từ)", "answer": "works", "explain_vi": "work out = tập luyện; chủ ngữ 'My older sister' số ít, thói quen → works.", "tag": "d5p1"}, {"id": "d5q3", "type": "mcq", "skill": "vocab", "q": "A ______ diet includes the right amounts of different kinds of food.", "options": ["active", "balanced", "energy", "injured"], "answer": 1, "explain_vi": "a balanced diet = chế độ ăn cân bằng, có đủ các nhóm thực phẩm với lượng phù hợp. 'energy' là danh từ nên không đứng trước 'diet' được.", "tag": "d5v7"}, {"id": "d5q4", "type": "mcq", "skill": "grammar", "q": "This is ______ restaurant in our town. The food is great and very healthy.", "options": ["the better", "best", "the best", "better"], "answer": 2, "explain_vi": "So sánh nhất của good: the best.", "tag": "d5g"}, {"id": "d5q5", "type": "text", "skill": "grammar", "q": "Swimming in the sea is ______ (dangerous) than swimming in a pool.", "answer": "more dangerous", "explain_vi": "Tính từ dài → more + adj + than.", "tag": "d5g"}, {"id": "d5q6", "type": "mcq", "skill": "grammar", "q": "I was ______ tired after the race that I fell asleep on the bus.", "options": ["such", "too", "enough", "so"], "answer": 3, "explain_vi": "so + adj + that …; 'tired' là tính từ không có danh từ đi kèm nên dùng so, không dùng such.", "tag": "d5g"}, {"id": "d5q7", "type": "mcq", "skill": "wordform", "q": "Lan felt very ______ when she lost the final match.", "options": ["dishappy", "inhappy", "unhappy", "imhappy"], "answer": 2, "explain_vi": "happy → unhappy (tiền tố un-).", "tag": "d5w"}, {"id": "d5q8", "type": "text", "skill": "wordform", "q": "Don't be so ______! The doctor will see you in five minutes. (PATIENT)", "answer": "impatient", "explain_vi": "patient bắt đầu bằng p → impatient (thiếu kiên nhẫn).", "tag": "d5w"}, {"id": "d5q9", "type": "mcq", "skill": "exam", "q": "Choose the sentence CLOSEST in meaning: 'I don't take enough exercise.'", "options": ["I take too much exercise.", "I take exercise every day.", "I need to take more exercise.", "Exercise is not good for me."], "answer": 2, "explain_vi": "'không tập thể dục đủ' = 'cần tập nhiều hơn'. Chú ý cụm take exercise = tập thể dục; exercise (sự tập luyện) là danh từ không đếm được.", "tag": "fmt:sentence_transformation"}, {"id": "d5q10", "type": "mcq", "skill": "review", "q": "Many students ______ on the Internet to find information for their homework.", "options": ["rely", "access", "invent", "update"], "answer": 0, "explain_vi": "rely on sth = dựa vào cái gì (buổi 4).", "from_day": 4, "tag": "d4v5"}, {"id": "d5q11", "type": "text", "skill": "review", "q": "I ______ (read) in bed when I heard a strange noise outside.", "answer": "was reading", "explain_vi": "Hành động đang diễn ra (quá khứ tiếp diễn) thì một hành động khác xen vào (heard) – buổi 2.", "from_day": 2, "tag": "d2g"}, {"id": "d5q12", "type": "mcq", "skill": "review", "q": "It's hard to ______ on your homework when the TV is on.", "options": ["attend", "revise", "concentrate", "encourage"], "answer": 2, "explain_vi": "concentrate on sth = tập trung vào việc gì (buổi 1).", "from_day": 1, "tag": "d1v4"}], "can_do_vi": ["Em có thể nói về sức khoẻ và thói quen bằng 8 từ mới và 2 cụm động từ work out, get over.", "Em có thể dùng đúng so sánh hơn, so sánh nhất, too / enough và so / such … that.", "Em có thể tạo từ trái nghĩa với tiền tố un-, im-, in-, dis-.", "Em có thể chọn câu gần nghĩa nhất với câu cho sẵn trong đề thi chuyên."]}, {"day": 6, "type": "normal", "theme_en": "Travel & transport", "theme_vi": "Du lịch và đi lại", "goal_vi": "Hôm nay em sẽ học 8 từ mới và 2 cụm động từ về du lịch, đi lại, cùng cách dùng can/could/be able to, must/have to và should. Em cũng sẽ làm quen với dạng bài điền từ vào đoạn văn – một dạng rất hay gặp trong đề thi chuyên, cố lên em nhé!", "minutes": 30, "vocab": [{"id": "d6v1", "word": "journey", "pos": "n", "ipa": "/ˈdʒɜːni/", "meaning_vi": "chuyến đi, hành trình (quãng đường di chuyển từ nơi này đến nơi khác)", "example": "The journey from Hà Nội to Đà Nẵng takes about sixteen hours by train.", "family": "journeys (n, số nhiều)"}, {"id": "d6v2", "word": "destination", "pos": "n", "ipa": "/ˌdestɪˈneɪʃn/", "meaning_vi": "điểm đến, nơi đến", "example": "Hội An is a popular destination for tourists from all over the world.", "family": "destinations (n, số nhiều); holiday destination (cụm từ: điểm đến du lịch)"}, {"id": "d6v3", "word": "crowded", "pos": "adj", "ipa": "/ˈkraʊdɪd/", "meaning_vi": "đông đúc, chật ních người", "example": "The bus was so crowded that we had to stand all the way.", "family": "crowd (n, v)"}, {"id": "d6v4", "word": "explore", "pos": "v", "ipa": "/ɪkˈsplɔː(r)/", "meaning_vi": "khám phá, thám hiểm", "example": "We spent the whole afternoon exploring the old town on foot.", "family": "explorer (n), exploration (n)"}, {"id": "d6v5", "word": "delay", "pos": "n, v", "ipa": "/dɪˈleɪ/", "meaning_vi": "sự chậm trễ; làm chậm trễ, hoãn", "example": "Our flight was delayed for two hours because of the storm.", "family": "delayed (adj)"}, {"id": "d6v6", "word": "passenger", "pos": "n", "ipa": "/ˈpæsɪndʒə(r)/", "meaning_vi": "hành khách", "example": "All passengers must wear a seat belt during the flight.", "family": "passengers (n, số nhiều)"}, {"id": "d6v7", "word": "abroad", "pos": "adv", "ipa": "/əˈbrɔːd/", "meaning_vi": "ở nước ngoài, ra nước ngoài", "example": "My cousin is studying abroad in Australia.", "family": "go abroad, study abroad, travel abroad (không dùng ✗ go to abroad)"}, {"id": "d6v8", "word": "souvenir", "pos": "n", "ipa": "/ˌsuːvəˈnɪə(r)/", "meaning_vi": "quà lưu niệm", "example": "I bought a small silk lantern as a souvenir for my grandma.", "family": "souvenirs (n, số nhiều); souvenir shop (cửa hàng lưu niệm)"}], "phrasal": [{"id": "d6p1", "phrase": "set off", "meaning_vi": "khởi hành, lên đường", "example": "We set off at 5 a.m. to avoid the heavy traffic."}, {"id": "d6p2", "phrase": "look forward to", "meaning_vi": "mong chờ, háo hức chờ đợi (+ danh từ / V-ing)", "example": "I'm really looking forward to visiting Sa Pa next month."}], "grammar": {"id": "d6g", "title": "Modals: can/could/be able to; must/have to; should", "rule_vi": ["can / could + V (nguyên thể): chỉ khả năng hoặc xin phép. can = hiện tại, could = quá khứ. Ví dụ: She could read when she was four.", "be able to + V: cũng nghĩa là 'có thể', nhưng dùng được ở mọi thì (will be able to, have been able to). Khi nói đã làm được một việc khó trong một lần cụ thể ở quá khứ, dùng was/were able to.", "must + V: bắt buộc (người nói thấy cần, hoặc luật, biển báo). mustn't + V = CẤM. have to + V: bắt buộc do hoàn cảnh, quy định bên ngoài; quá khứ là had to.", "don't have to + V = KHÔNG CẦN phải làm (không bắt buộc) – khác hẳn với mustn't (cấm làm).", "should / shouldn't + V: đưa ra lời khuyên (nên / không nên)."], "examples": ["Passengers mustn't smoke on the train.", "We didn't have to queue because we had bought our tickets online.", "After a long search, we were able to find our hotel.", "You should bring a raincoat – it often rains in Đà Lạt."], "common_mistake_vi": "Sau động từ khuyết thiếu không dùng 'to' và không chia động từ: ✗ She can to speaks English. → ✓ She can speak English. Ngoài ra 'must' không có dạng quá khứ: ✗ Yesterday I must get up early. → ✓ Yesterday I had to get up early."}, "wordform": {"id": "d6w", "focus": "-er, -or, -ist, -ian", "rule_vi": "Thêm -er/-or vào động từ để chỉ người làm việc đó (teach → teacher, visit → visitor). Thêm -ist/-ian vào danh từ để chỉ người làm nghề hoặc giỏi về lĩnh vực đó (tour → tourist, music → musician). Chú ý: travel → traveller (Anh-Anh gấp đôi chữ l).", "examples": [["travel", "traveller"], ["visit", "visitor"], ["tour", "tourist"], ["music", "musician"], ["library", "librarian"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần, và có 2 từ không cần dùng đến nhé.", "bank": ["journey", "destination", "crowded", "passengers", "souvenir", "set off", "explore", "abroad"], "items": [{"id": "d6A1", "q": "The ______ from my house to my grandparents' village takes three hours by bus.", "answer": "journey", "tag": "d6v1"}, {"id": "d6A2", "q": "Phú Quốc has become a favourite holiday ______ for many families because of its beautiful beaches.", "answer": "destination", "tag": "d6v2"}, {"id": "d6A3", "q": "The market was so ______ on Sunday morning that we could hardly move.", "answer": "crowded", "tag": "d6v3"}, {"id": "d6A4", "q": "The bus driver asked all the ______ to fasten their seat belts.", "answer": "passengers", "tag": "d6v6"}, {"id": "d6A5", "q": "Before we left Huế, I bought a small conical hat as a ______ for my best friend.", "answer": "souvenir", "tag": "d6v8"}, {"id": "d6A6", "q": "We ______ from home at 5 a.m. to get onto the motorway before the traffic got heavy.", "answer": "set off", "tag": "d6p1"}]}, "B_grammar": {"instruction_vi": "Em chọn từ đúng trong ngoặc, hoặc viết dạng đúng của động từ khuyết thiếu trong ngoặc. Nhớ để ý xem câu nói về hiện tại, quá khứ hay tương lai nhé.", "items": [{"id": "d6B1", "q": "You ______ (mustn't / don't have to) buy lunch – it is already included in the tour price, but you can buy snacks if you want.", "answer": "don't have to", "accept": ["do not have to"], "tag": "d6g"}, {"id": "d6B2", "q": "Passengers ______ (mustn't / don't have to) open the doors while the train is moving. It's very dangerous.", "answer": "mustn't", "accept": ["must not"], "tag": "d6g"}, {"id": "d6B3", "q": "Last summer our flight was cancelled, so we ______ (have to) stay at the airport hotel for one night.", "answer": "had to", "tag": "d6g"}, {"id": "d6B4", "q": "When my grandfather was young, he ______ (can) ride a bicycle for 50 kilometres without stopping.", "answer": "could", "accept": ["was able to"], "tag": "d6g"}, {"id": "d6B5", "q": "Don't worry. After a few more lessons, you ______ (be able to) read the train timetable by yourself.", "answer": "will be able to", "accept": ["'ll be able to"], "tag": "d6g"}, {"id": "d6B6", "q": "It's going to be cold in Mộc Châu tonight. You ______ (should / shouldn't) forget your jacket.", "answer": "shouldn't", "accept": ["should not"], "tag": "d6g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay tất cả đều là danh từ chỉ người – em nhớ xem có cần thêm -s số nhiều không nhé.", "items": [{"id": "d6C1", "q": "Thousands of foreign ______ visit Hạ Long Bay every year. (TOUR)", "answer": "tourists", "tag": "d6w"}, {"id": "d6C2", "q": "Ms Lan works as a ______ at our school; she always helps us find good books. (LIBRARY)", "answer": "librarian", "tag": "d6w"}, {"id": "d6C3", "q": "My uncle is a keen ______. He has been to more than twenty countries. (TRAVEL)", "answer": "traveller", "accept": ["traveler"], "tag": "d6w"}, {"id": "d6C4", "q": "The museum welcomed more than 5,000 ______ last weekend. (VISIT)", "answer": "visitors", "tag": "d6w"}]}, "D_exam": {"format": "cloze", "instruction_vi": "Em đọc đoạn văn rồi chọn đáp án A, B, C hoặc D phù hợp nhất cho mỗi chỗ trống (1)–(4). Mẹo: đọc cả câu trước và sau chỗ trống trước khi chọn nhé!", "text": "Last month my class went on a school trip to Ninh Bình. We (1) ______ off at six o'clock in the morning, and everyone was very excited. The journey took about two hours. When we arrived, we took a boat along the river and (2) ______ several caves. Our teacher told us that we (3) ______ throw rubbish into the water because it would harm the fish. At the end of the day, we were tired but happy. I am already looking forward (4) ______ our next trip!", "items": [{"id": "d6D1", "q": "(1)", "options": ["gave", "set", "made", "turned"], "answer": "B", "tag": "fmt:cloze"}, {"id": "d6D2", "q": "(2)", "options": ["relaxed", "arrived", "explored", "waited"], "answer": "C", "tag": "fmt:cloze"}, {"id": "d6D3", "q": "(3)", "options": ["mustn't", "don't have to", "needn't to", "shouldn't to"], "answer": "A", "tag": "fmt:cloze"}, {"id": "d6D4", "q": "(4)", "options": ["for", "at", "with", "to"], "answer": "D", "tag": "fmt:cloze"}]}, "E_reading": {"id": "d6r", "title": "A Train Journey to Remember", "text": "Last summer, Minh and his parents decided to travel from Hà Nội to Huế by train instead of by plane. Minh's father said that flying was faster, but the train would let them see the countryside. They set off on a Friday evening. The station was crowded with passengers carrying heavy bags, and their train was delayed for almost an hour. Minh felt a little bored, but his mother had brought a pack of cards, so they played games while they waited.\n\nThe journey took around thirteen hours. Minh shared a sleeping cabin with his parents and an elderly couple from Quảng Trị. The old man told Minh stories about his village and taught him a few words in the local dialect. In the morning, Minh woke up to see green rice fields and the sea outside the window.\n\nWhen they finally reached their destination, Minh was tired but happy. He says he is already looking forward to his next trip by train.", "items": [{"id": "d6E1", "kind": "tfng", "q": "Minh's father thought that the train was faster than the plane.", "answer": "False", "tag": "d6r"}, {"id": "d6E2", "kind": "tfng", "q": "The elderly couple were travelling to Huế to visit their grandchildren.", "answer": "Not Given", "tag": "d6r"}, {"id": "d6E3", "kind": "mcq", "q": "Why did the family choose to travel by train?", "options": ["It was cheaper than flying.", "They wanted to see the countryside.", "Minh was afraid of flying.", "There were no flights that day."], "answer": "B", "tag": "d6r"}, {"id": "d6E4", "kind": "mcq", "q": "What did Minh's family do while their train was delayed?", "options": ["They had dinner at the station.", "They read books.", "They went back home.", "They played card games."], "answer": "D", "tag": "d6r"}]}, "F_writing": {"task_en": "Write a short paragraph (50–70 words) about a trip you have taken or would like to take. Say where you went (or want to go), how you travelled, and what you did (or want to do) there. Use at least one modal verb (can, could, must, have to, should) and two words from today's lesson.", "task_vi": "Em viết một đoạn văn ngắn (50–70 từ) kể về một chuyến đi em đã đi hoặc muốn đi: đi đâu, đi bằng phương tiện gì, đã làm gì (hoặc muốn làm gì) ở đó. Em nhớ dùng ít nhất 1 động từ khuyết thiếu và 2 từ mới của bài hôm nay nhé.", "min_words": 50, "model": "Last Tết, my family went to Đà Lạt by coach. We set off very early, but the journey was long because the roads were crowded. In Đà Lạt, we explored the flower gardens and the night market. It was cold, so we had to wear thick jackets. I bought a little wooden horse as a souvenir for my cousin. If you visit Đà Lạt, you should try the hot soy milk there!", "checklist_vi": ["Em đã nói rõ đi đâu, đi bằng gì và làm gì ở đó chưa?", "Em đã dùng ít nhất 1 động từ khuyết thiếu (can/could/must/have to/should) và theo sau là động từ nguyên thể không 'to' chưa?", "Em đã dùng ít nhất 2 từ mới của bài hôm nay chưa?", "Em đã viết đủ 50 từ, kiểm tra chính tả và dấu chấm câu chưa?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – Em làm theo gợi ý trong ngoặc ở mỗi câu để ôn lại kiến thức của các buổi trước nhé. Không nhớ thì em mở lại bài cũ xem cũng được!", "items": [{"id": "d6G1", "q": "My cousin has a very ______ diet: she eats lots of vegetables, fruit, fish and rice. (BALANCE)", "answer": "balanced", "from_day": 5, "tag": "d5v7"}, {"id": "d6G2", "q": "The suitcase was ______ heavy for me to carry up the stairs. (too / enough / so)", "answer": "too", "from_day": 5, "tag": "d5g"}, {"id": "d6G3", "q": "We ______ (never / visit) Cát Bà Island, but we hope to go there next summer.", "answer": "have never visited", "accept": ["'ve never visited"], "from_day": 3, "tag": "d3g"}, {"id": "d6G4", "q": "Please be quiet. I ______ (try) to concentrate on my homework.", "answer": "am trying", "accept": ["'m trying"], "from_day": 1, "tag": "d1g"}]}}, "web_check": [{"id": "d6q1", "type": "mcq", "skill": "vocab", "q": "Many young people dream of studying ______ in countries like the UK or Japan.", "options": ["at abroad", "abroad", "to abroad", "in abroad"], "answer": 1, "explain_vi": "'abroad' là trạng từ nên không đi kèm giới từ: study abroad, go abroad.", "tag": "d6v7"}, {"id": "d6q2", "type": "mcq", "skill": "vocab", "q": "Heavy rain caused a long ______, so the train arrived three hours late.", "options": ["journey", "souvenir", "passenger", "delay"], "answer": 3, "explain_vi": "delay = sự chậm trễ; tàu đến muộn 3 tiếng vì mưa lớn.", "tag": "d6v5"}, {"id": "d6q3", "type": "text", "skill": "vocab", "q": "Điền 1 động từ bắt đầu bằng 'e': On our first day in Hội An, we walked for hours to ______ the old streets and little shops.", "answer": "explore", "accept": ["explore"], "explain_vi": "explore = khám phá; sau 'to' dùng động từ nguyên thể.", "tag": "d6v4"}, {"id": "d6q4", "type": "mcq", "skill": "grammar", "q": "Students ______ use their phones during the test. It's against the rules.", "options": ["don't have to", "can", "mustn't", "should"], "answer": 2, "explain_vi": "'against the rules' = trái quy định → cấm → mustn't.", "tag": "d6g"}, {"id": "d6q5", "type": "mcq", "skill": "grammar", "q": "I ______ find my passport this morning, so we nearly missed the flight.", "options": ["couldn't", "can't", "mustn't", "shouldn't"], "answer": 0, "explain_vi": "Việc xảy ra sáng nay (quá khứ) và nói về khả năng → couldn't.", "tag": "d6g"}, {"id": "d6q6", "type": "text", "skill": "grammar", "q": "Điền dạng đúng của 'have to': Yesterday my dad ______ drive me to school because the bus was late.", "answer": "had to", "accept": ["had to"], "explain_vi": "'Yesterday' → quá khứ của have to là had to (must không có dạng quá khứ).", "tag": "d6g"}, {"id": "d6q7", "type": "mcq", "skill": "wordform", "q": "The ______ played beautiful music on the piano in the hotel lobby. (MUSIC)", "options": ["musical", "musicist", "musicer", "musician"], "answer": 3, "explain_vi": "music → musician (người chơi nhạc). 'musical' là tính từ.", "tag": "d6w"}, {"id": "d6q8", "type": "text", "skill": "wordform", "q": "Viết dạng đúng của từ in hoa: Every morning, hundreds of ______ ride their bikes around West Lake. (CYCLE)", "answer": "cyclists", "accept": ["cyclists"], "explain_vi": "cycle → cyclist (người đi xe đạp); 'hundreds of' nên cần số nhiều: cyclists.", "tag": "d6w"}, {"id": "d6q9", "type": "mcq", "skill": "exam", "q": "Đọc đoạn văn ngắn và chọn từ đúng cho chỗ trống: 'It was a public holiday, so the beach was extremely ______. There was almost no space to put our towels down.'", "options": ["quiet", "empty", "crowded", "abroad"], "answer": 2, "explain_vi": "Câu sau nói 'gần như không còn chỗ' → bãi biển rất đông: crowded.", "tag": "fmt:cloze"}, {"id": "d6q10", "type": "mcq", "skill": "review", "from_day": 5, "q": "This is ______ interesting book that I finished it in one evening.", "options": ["so", "such an", "such", "so an"], "answer": 1, "explain_vi": "such + a/an + (tính từ) + danh từ số ít: such an interesting book.", "tag": "d5g"}, {"id": "d6q11", "type": "mcq", "skill": "review", "from_day": 3, "q": "Plastic bags are very ______ to sea turtles because the turtles often eat them by mistake and get ill.", "options": ["harmful", "harmless", "helpful", "careful"], "answer": 0, "explain_vi": "harmful = có hại; rùa ăn nhầm túi ni-lông và bị ốm.", "tag": "d3v8"}, {"id": "d6q12", "type": "text", "skill": "review", "from_day": 1, "q": "Điền 1 động từ bắt đầu bằng 'a', nghĩa là 'tham dự, có mặt': More than 300 students ______ the school's English festival every year.", "answer": "attend", "accept": ["attend"], "explain_vi": "attend = tham dự; 'every year' + chủ ngữ số nhiều → attend.", "tag": "d1v5"}], "can_do_vi": ["Em có thể dùng 8 từ mới và 2 cụm động từ (set off, look forward to) để nói về một chuyến đi.", "Em có thể phân biệt mustn't (cấm) và don't have to (không cần), và dùng could/was able to, had to khi nói về quá khứ.", "Em có thể tạo danh từ chỉ người với -er/-or/-ist/-ian và làm bài điền từ vào đoạn văn."]}, {"day": 7, "type": "review", "theme_en": "Review 1", "theme_vi": "Vòng ôn 1 (buổi 1–6)", "goal_vi": "Hôm nay không có bài mới đâu em ạ – mình cùng ôn lại toàn bộ từ vựng, ngữ pháp và các dạng bài thi của 6 buổi đầu tiên. Em làm chậm rãi, câu nào chưa chắc thì đánh dấu lại để xem lại bài cũ nhé!", "minutes": 35, "paper": {"R1_vocab": {"instruction_vi": "Em chọn từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần, có 2 từ thừa. Gợi ý: đọc kỹ cả câu để chọn đúng loại từ nhé.", "bank": ["assignment", "concentrate", "spare", "enthusiastic", "recycle", "species", "rely", "convenient", "nutritious", "destination", "injury", "crowded"], "items": [{"id": "d7R1_1", "q": "It's hard to ______ on my homework when my little brother is watching TV in the same room.", "answer": "concentrate", "from_day": 1, "tag": "d1v4"}, {"id": "d7R1_2", "q": "Ms Hoa asked us to hand in our history ______ by Friday. It's a two-page report about our town.", "answer": "assignment", "from_day": 1, "tag": "d1v2"}, {"id": "d7R1_3", "q": "What do you like doing in your ______ time? – I usually play badminton with my dad.", "answer": "spare", "from_day": 2, "tag": "d2v4"}, {"id": "d7R1_4", "q": "Nam is very ______ about football; he never misses a match on TV.", "answer": "enthusiastic", "from_day": 2, "tag": "d2v3"}, {"id": "d7R1_5", "q": "Instead of throwing away old bottles, we can ______ them to make new things.", "answer": "recycle", "from_day": 3, "tag": "d3v4"}, {"id": "d7R1_6", "q": "Many ______ of birds are in danger because people are cutting down the forests where they live.", "answer": "species", "from_day": 3, "tag": "d3v5"}, {"id": "d7R1_7", "q": "These days, many students ______ on the Internet to find information for their projects and hardly use library books.", "answer": "rely", "from_day": 4, "tag": "d4v5"}, {"id": "d7R1_8", "q": "Online shopping is very ______ because you can buy things without leaving home.", "answer": "convenient", "from_day": 4, "tag": "d4v8"}, {"id": "d7R1_9", "q": "Fruit and vegetables are very ______, so you should eat some every day.", "answer": "nutritious", "from_day": 5, "tag": "d5v4"}, {"id": "d7R1_10", "q": "Our final ______ was Đà Nẵng, but we stopped in Huế for one night on the way.", "answer": "destination", "from_day": 6, "tag": "d6v2"}]}, "R2_grammar": {"instruction_vi": "Em viết dạng đúng của động từ trong ngoặc, hoặc chọn từ đúng trong ngoặc. Nhớ tìm 'dấu hiệu' về thời gian trong câu trước khi chia động từ nhé.", "items": [{"id": "d7R2_1", "q": "Look! The children ______ (play) in the rain without their raincoats.", "answer": "are playing", "accept": ["'re playing"], "from_day": 1, "tag": "d1g"}, {"id": "d7R2_2", "q": "I ______ (not understand) this question. Can you explain it again, please?", "answer": "don't understand", "accept": ["do not understand"], "from_day": 1, "tag": "d1g"}, {"id": "d7R2_3", "q": "While I ______ (walk) to school this morning, I saw a beautiful rainbow.", "answer": "was walking", "from_day": 2, "tag": "d2g"}, {"id": "d7R2_4", "q": "My dad ______ (collect) stamps when he was a boy, but he stopped many years ago. (Dùng 'used to')", "answer": "used to collect", "from_day": 2, "tag": "d2g"}, {"id": "d7R2_5", "q": "I ______ (already / finish) my science project, so I can relax this weekend.", "answer": "have already finished", "accept": ["'ve already finished"], "from_day": 3, "tag": "d3g"}, {"id": "d7R2_6", "q": "We ______ (go) to Tràng An with our class two years ago.", "answer": "went", "from_day": 3, "tag": "d3g"}, {"id": "d7R2_7", "q": "Look at those dark clouds! It ______ (rain) very soon.", "answer": "is going to rain", "accept": ["'s going to rain"], "from_day": 4, "tag": "d4g"}, {"id": "d7R2_8", "q": "I ______ (meet) my cousin at the airport at 3 p.m. tomorrow – we arranged it last week.", "answer": "am meeting", "accept": ["'m meeting", "am going to meet", "'m going to meet"], "from_day": 4, "tag": "d4g"}, {"id": "d7R2_9", "q": "This year's maths test was ______ (easy) than last year's, so most of us got good marks.", "answer": "easier", "from_day": 5, "tag": "d5g"}, {"id": "d7R2_10", "q": "You ______ (mustn't / don't have to) wear a uniform on Saturdays – you can wear whatever you like.", "answer": "don't have to", "accept": ["do not have to"], "from_day": 6, "tag": "d6g"}]}, "R3_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Em xác định trước: chỗ trống cần danh từ, tính từ hay trạng từ?", "items": [{"id": "d7R3_1", "q": "Thanks to my teacher's ______, I finally found the courage to join the English speaking contest. (ENCOURAGE)", "answer": "encouragement", "from_day": 1, "tag": "d1w"}, {"id": "d7R3_2", "q": "My brother is so ______; he has lost his phone twice this month. (CARE)", "answer": "careless", "from_day": 2, "tag": "d2w"}, {"id": "d7R3_3", "q": "The north of Việt Nam is very ______, so many roads there have sharp bends. (MOUNTAIN)", "answer": "mountainous", "from_day": 3, "tag": "d3w"}, {"id": "d7R3_4", "q": "The children listened ______ while the teacher read them a story. (QUIET)", "answer": "quietly", "from_day": 4, "tag": "d4w"}, {"id": "d7R3_5", "q": "It is ______ to swim across this river; it's far too wide and the water moves too fast. (POSSIBLE)", "answer": "impossible", "from_day": 5, "tag": "d5w"}, {"id": "d7R3_6", "q": "My sister wants to become a ______ and study life in the ocean. (SCIENCE)", "answer": "scientist", "from_day": 6, "tag": "d6w"}]}, "R4_exam": {"instruction_vi": "Mỗi câu là một dạng bài thi khác nhau mà em đã học. Em đọc kỹ yêu cầu ngắn ở đầu mỗi câu rồi khoanh A, B, C hoặc D nhé.", "items": [{"id": "d7R4_1", "format": "sentence_completion", "q": "[Sentence completion] I missed three lessons because I was ill, so now I have to work hard to ______ with my classmates.", "options": ["drop out", "catch up", "give up", "take up"], "answer": "B", "from_day": 1, "tag": "fmt:sentence_completion"}, {"id": "d7R4_2", "format": "synonym", "q": "[Synonym] Choose the word CLOSEST in meaning to the words in CAPITALS: My grandfather TOOK UP painting after he retired.", "options": ["stopped", "sold", "hated", "started"], "answer": "D", "from_day": 2, "tag": "fmt:synonym"}, {"id": "d7R4_3", "format": "antonym", "q": "[Antonym] Choose the word OPPOSITE in meaning to the word in CAPITALS: We should REDUCE the amount of plastic we use every day.", "options": ["lower", "recycle", "increase", "cut"], "answer": "C", "from_day": 3, "tag": "fmt:antonym"}, {"id": "d7R4_4", "format": "dialogue", "q": "[Dialogue completion] Lan: \"Shall we go to the cinema on Saturday afternoon?\" – Minh: \"______\"", "options": ["Sorry, I'm visiting my grandparents that day.", "Yes, I went there last week.", "No, I didn't.", "I'm going to the cinema right now."], "answer": "A", "from_day": 4, "tag": "fmt:dialogue_completion"}, {"id": "d7R4_5", "format": "transformation", "q": "[Closest meaning] Choose the sentence CLOSEST in meaning to: \"No one in my class runs faster than Huy.\"", "options": ["Huy is slower than everyone in my class.", "Some of my classmates run faster than Huy.", "Huy is the fastest runner in my class.", "Huy doesn't run as fast as my classmates."], "answer": "C", "from_day": 5, "tag": "fmt:sentence_transformation"}, {"id": "d7R4_6", "format": "cloze", "q": "[Cloze] My aunt works abroad, so she doesn't often come home. But when she does, she always brings us lovely ______ from the countries she has visited.", "options": ["passengers", "souvenirs", "destinations", "journeys"], "answer": "B", "from_day": 6, "tag": "fmt:cloze"}]}, "E_reading": {"id": "d7r", "title": "Lan's New Wheels", "text": "When Lan started Year 7, she spent most of her spare time in front of a screen. She played games on her tablet until late at night, and in the morning she felt too tired to concentrate in class. Her marks in maths began to fall.\n\nThen her school started a cycling club. Lan's teacher encouraged her to join, and although she was nervous at first, she soon became one of its most enthusiastic members. Every Saturday the club cycles to a different place near Hà Nội. Last month they explored a village that is famous for its pottery.\n\nCycling has changed Lan's life in many ways. She has more energy, she sleeps better, and her marks have improved. She has also learnt that bikes do not cause air pollution, so now she rides to school every day instead of asking her dad to drive her. \"I still play games sometimes,\" she says, \"but I always switch off my tablet at nine o'clock.\"", "items": [{"id": "d7E1", "kind": "tfng", "q": "Lan used to find it difficult to concentrate at school.", "answer": "True", "from_day": 1, "tag": "d7r"}, {"id": "d7E2", "kind": "tfng", "q": "Lan felt confident when she first joined the cycling club.", "answer": "False", "from_day": 2, "tag": "d7r"}, {"id": "d7E3", "kind": "tfng", "q": "The cycling club has more than twenty members.", "answer": "Not Given", "from_day": 2, "tag": "d7r"}, {"id": "d7E4", "kind": "mcq", "q": "Where did the club go last month?", "options": ["To a museum in the city centre", "To a school in Hà Nội", "To a village known for its pottery", "To a farm near the river"], "answer": "C", "from_day": 6, "tag": "d7r"}, {"id": "d7E5", "kind": "mcq", "q": "Why does Lan ride her bike to school now?", "options": ["Because bikes don't pollute the air.", "Because her dad has sold his car.", "Because it is faster than going by car.", "Because her teacher told her to."], "answer": "A", "from_day": 3, "tag": "d7r"}]}, "F_writing": {"task_en": "Write an email (80–100 words) to your English penfriend, Alex. Tell Alex about a new hobby or a healthy habit you have started: what you used to do before, what you do now, and what you are going to do next. Use at least four words or phrasal verbs from Days 1–6.", "task_vi": "Em viết một email (80–100 từ) cho bạn qua thư người nước ngoài tên Alex, kể về một sở thích mới hoặc một thói quen tốt em vừa bắt đầu: trước đây em thường làm gì (used to), bây giờ em làm gì, và sắp tới em dự định làm gì (be going to). Em dùng ít nhất 4 từ hoặc cụm động từ đã học ở buổi 1–6 nhé.", "min_words": 80, "model": "Hi Alex,\n\nHow are you? I want to tell you about my new hobby. I used to spend most of my spare time on my phone, and I often felt too tired to concentrate in class. Two months ago, I took up badminton. Now I play with my dad three times a week, and I have much more energy than before. Next month I'm going to enter a school competition – wish me luck! What do you do in your free time? Write back soon.\n\nBest wishes,\nMinh", "checklist_vi": ["Email của em có lời chào mở đầu (Hi Alex,) và lời chào kết thúc (Best wishes, + tên) chưa?", "Em đã dùng đúng 3 mốc thời gian: trước đây (used to / quá khứ đơn), bây giờ (hiện tại đơn / hiện tại hoàn thành), sắp tới (be going to) chưa?", "Em đã dùng ít nhất 4 từ hoặc cụm động từ của buổi 1–6 chưa? Em gạch chân chúng nhé.", "Em đã viết đủ 80 từ, kiểm tra chính tả và chữ cái viết hoa đầu câu chưa?"]}, "self_check_vi": ["Em đã thuộc và dùng được 8 từ mới của mỗi buổi 1–6 (ví dụ: curriculum, enthusiastic, species, convenient, nutritious, souvenir).", "Em phân biệt được hiện tại đơn và hiện tại tiếp diễn, và biết động từ chỉ trạng thái (know, like, understand) không dùng ở dạng tiếp diễn.", "Em biết dùng quá khứ tiếp diễn với 'while/when', dùng 'used to' để nói về thói quen trong quá khứ.", "Em phân biệt được hiện tại hoàn thành và quá khứ đơn, và dùng đúng will / be going to / hiện tại tiếp diễn cho tương lai.", "Em dùng đúng so sánh hơn, so sánh nhất, too/enough, so/such và các động từ khuyết thiếu can/could/must/have to/should.", "Em nhận ra được các dạng bài: điền câu, đồng nghĩa, trái nghĩa, hoàn thành hội thoại, câu gần nghĩa nhất và điền từ vào đoạn văn."]}, "web_check": [{"id": "d7q1", "type": "mcq", "skill": "vocab", "from_day": 1, "q": "Science is my favourite subject in the school ______; we have it four times a week.", "options": ["knowledge", "curriculum", "assignment", "membership"], "answer": 1, "explain_vi": "curriculum = chương trình học (gồm các môn học trong trường).", "tag": "d1v1"}, {"id": "d7q2", "type": "mcq", "skill": "vocab", "from_day": 1, "q": "Tuấn ______ of the swimming team because the training started too early in the morning.", "options": ["dropped out", "caught up", "set off", "worked out"], "answer": 0, "explain_vi": "drop out (of) = rời bỏ, bỏ ngang (một đội, khoá học, trường học).", "tag": "d1p2"}, {"id": "d7q3", "type": "text", "skill": "grammar", "from_day": 1, "q": "Điền dạng đúng của động từ trong ngoặc: The sun ______ (rise) in the east.", "answer": "rises", "accept": ["rises"], "explain_vi": "Sự thật hiển nhiên → hiện tại đơn; chủ ngữ 'the sun' số ít → rises.", "tag": "d1g"}, {"id": "d7q4", "type": "mcq", "skill": "vocab", "from_day": 2, "q": "The ______ fee for the chess club is 200,000 đồng a year.", "options": ["leisure", "challenge", "membership", "collection"], "answer": 2, "explain_vi": "membership fee = phí thành viên (để tham gia câu lạc bộ).", "tag": "d2v8"}, {"id": "d7q5", "type": "mcq", "skill": "grammar", "from_day": 2, "q": "I ______ a shower when the phone rang.", "options": ["took", "was taking", "am taking", "have taken"], "answer": 1, "explain_vi": "Hành động đang xảy ra (quá khứ tiếp diễn) thì một hành động khác xen vào (quá khứ đơn).", "tag": "d2g"}, {"id": "d7q6", "type": "text", "skill": "wordform", "from_day": 2, "q": "Viết dạng đúng của từ in hoa: This old map is ______ now; most of the roads have changed. (USE)", "answer": "useless", "accept": ["useless"], "explain_vi": "Bản đồ cũ, đường đã thay đổi hết → vô dụng: use + less = useless.", "tag": "d2w"}, {"id": "d7q7", "type": "mcq", "skill": "vocab", "from_day": 3, "q": "My family is trying to ______ on plastic bags by taking cloth bags to the market.", "options": ["throw away", "give up", "switch off", "cut down"], "answer": 3, "explain_vi": "cut down on = cắt giảm (dùng ít đi).", "tag": "d3p1"}, {"id": "d7q8", "type": "mcq", "skill": "grammar", "from_day": 3, "q": "My sister ______ in Đà Nẵng since 2020.", "options": ["lives", "lived", "has lived", "is living"], "answer": 2, "explain_vi": "'since 2020' → hành động bắt đầu trong quá khứ, kéo dài tới nay → hiện tại hoàn thành.", "tag": "d3g"}, {"id": "d7q9", "type": "text", "skill": "vocab", "from_day": 3, "q": "Điền 1 động từ bắt đầu bằng 'p', nghĩa là 'bảo vệ': National parks help to ______ rare animals and plants.", "answer": "protect", "accept": ["protect"], "explain_vi": "protect = bảo vệ; sau 'must' dùng động từ nguyên thể.", "tag": "d3v2"}, {"id": "d7q10", "type": "mcq", "skill": "vocab", "from_day": 4, "q": "You should ______ the apps on your phone regularly so that they work properly.", "options": ["update", "invent", "rely", "access"], "answer": 0, "explain_vi": "update = cập nhật (để ứng dụng chạy tốt).", "tag": "d4v7"}, {"id": "d7q11", "type": "mcq", "skill": "grammar", "from_day": 4, "q": "\"Oh no, I've left my umbrella at home!\" – \"Don't worry. I ______ lend you mine.\"", "options": ["was", "will", "am", "did"], "answer": 1, "explain_vi": "Quyết định / lời đề nghị giúp đỡ ngay lúc nói → will.", "tag": "d4g"}, {"id": "d7q12", "type": "text", "skill": "wordform", "from_day": 4, "q": "Viết dạng đúng của từ in hoa: The old man walked ______ across the busy road. (SLOW)", "answer": "slowly", "accept": ["slowly"], "explain_vi": "Bổ nghĩa cho động từ 'walked' → cần trạng từ: slow + ly.", "tag": "d4w"}, {"id": "d7q13", "type": "mcq", "skill": "grammar", "from_day": 5, "q": "My little sister isn't old ______ to ride a bike on the main road.", "options": ["too", "so", "enough", "such"], "answer": 2, "explain_vi": "tính từ + enough + to V: old enough to ride.", "tag": "d5g"}, {"id": "d7q14", "type": "text", "skill": "wordform", "from_day": 5, "q": "Viết dạng đúng của từ in hoa: Sitting in front of a screen all day is an ______ habit. (HEALTHY)", "answer": "unhealthy", "accept": ["unhealthy"], "explain_vi": "Ngồi trước màn hình cả ngày là thói quen không tốt cho sức khoẻ → un + healthy = unhealthy.", "tag": "d5w"}, {"id": "d7q15", "type": "mcq", "skill": "vocab", "from_day": 6, "q": "My uncle often travels ______ for work; he has been to Japan, Korea and France.", "options": ["crowded", "delay", "souvenir", "abroad"], "answer": 3, "explain_vi": "travel abroad = đi nước ngoài (abroad là trạng từ).", "tag": "d6v7"}, {"id": "d7q16", "type": "mcq", "skill": "vocab", "from_day": 6, "q": "We are really looking forward to ______ our cousins in Huế this summer.", "options": ["visiting", "visit", "be visiting", "visited"], "answer": 0, "explain_vi": "look forward to + V-ing ('to' ở đây là giới từ).", "tag": "d6p2"}], "can_do_vi": ["Em có thể nhớ lại và dùng đúng từ vựng, cụm động từ của 6 chủ đề: trường học, sở thích, môi trường, công nghệ, sức khoẻ, du lịch.", "Em có thể chọn đúng thì (hiện tại, quá khứ, hiện tại hoàn thành, tương lai) dựa vào dấu hiệu trong câu.", "Em có thể nhận ra và làm được 6 dạng câu hỏi trắc nghiệm hay gặp trong đề thi chuyên."]}, {"day": 8, "type": "normal", "theme_en": "Media & communication", "theme_vi": "Truyền thông", "goal_vi": "Hôm nay em sẽ học các từ về báo chí, truyền hình, quảng cáo và cách dùng câu bị động ở thì hiện tại đơn và quá khứ đơn. Em cũng sẽ luyện cách phân biệt 'make' và 'do' – một 'bẫy' rất quen thuộc trong đề thi chuyên đấy!", "minutes": 30, "vocab": [{"id": "d8v1", "word": "article", "pos": "n", "ipa": "/ˈɑːtɪkl/", "meaning_vi": "bài báo, bài viết", "example": "I read an article about healthy eating in today's newspaper.", "family": "articles (n, số nhiều)"}, {"id": "d8v2", "word": "audience", "pos": "n", "ipa": "/ˈɔːdiəns/", "meaning_vi": "khán giả, thính giả, người xem", "example": "The audience laughed at every joke in the show.", "family": "audiences (n, số nhiều)"}, {"id": "d8v3", "word": "broadcast", "pos": "v, n", "ipa": "/ˈbrɔːdkɑːst/", "meaning_vi": "phát sóng (trên TV, radio); chương trình phát sóng", "example": "The concert will be broadcast live on the radio.", "family": "broadcast – broadcast – broadcast (v, bất quy tắc); broadcaster (n)"}, {"id": "d8v4", "word": "advertise", "pos": "v", "ipa": "/ˈædvətaɪz/", "meaning_vi": "quảng cáo", "example": "The shop advertises its new phones on TV and on social media.", "family": "advertisement / advert (n), advertiser (n), advertising (n)"}, {"id": "d8v5", "word": "reliable", "pos": "adj", "ipa": "/rɪˈlaɪəbl/", "meaning_vi": "đáng tin cậy", "example": "Is this website a reliable source of information?", "family": "rely (v), unreliable (adj), reliability (n)"}, {"id": "d8v6", "word": "opinion", "pos": "n", "ipa": "/əˈpɪnjən/", "meaning_vi": "ý kiến, quan điểm", "example": "In my opinion, reading the news every day is a good habit.", "family": "in my opinion (cụm từ: theo ý kiến của tôi)"}, {"id": "d8v7", "word": "inform", "pos": "v", "ipa": "/ɪnˈfɔːm/", "meaning_vi": "thông báo, cung cấp thông tin", "example": "The school informed parents about the change of timetable.", "family": "information (n), informative (adj)"}, {"id": "d8v8", "word": "influence", "pos": "n, v", "ipa": "/ˈɪnfluəns/", "meaning_vi": "sự ảnh hưởng; ảnh hưởng đến", "example": "Advertisements can influence what children want to buy.", "family": "influential (adj); have an influence on (cụm từ)"}], "phrasal": [{"id": "d8p1", "phrase": "find out", "meaning_vi": "tìm ra, phát hiện ra (thông tin)", "example": "I searched online to find out when the film starts."}, {"id": "d8p2", "phrase": "come across", "meaning_vi": "tình cờ gặp, tình cờ thấy", "example": "While I was tidying my room, I came across some old photos."}], "grammar": {"id": "d8g", "title": "Passive voice (present simple, past simple)", "rule_vi": ["Câu bị động dùng khi ta quan tâm đến việc/vật được làm hơn là người làm: S + be + V3/V-ed (+ by + người làm).", "Hiện tại đơn bị động: am / is / are + V3. Ví dụ: The news is broadcast every evening.", "Quá khứ đơn bị động: was / were + V3. Ví dụ: This article was written by a student.", "Phủ định: thêm 'not' sau be (isn't / aren't / wasn't / weren't + V3). Câu hỏi: đưa be lên đầu câu (Is it made...? Was it built...?).", "Chỉ dùng 'by + người làm' khi thông tin đó quan trọng; nếu người làm không rõ hoặc không quan trọng (people, someone, they) thì bỏ đi."], "examples": ["English is spoken in many countries.", "The school magazine is published twice a year.", "The match was watched by millions of fans.", "These letters weren't sent last week."], "common_mistake_vi": "Quên động từ 'be' hoặc quên chia V3: ✗ The article written by Nam. / ✗ English is speak here. → ✓ The article was written by Nam. / ✓ English is spoken here. Nhớ học thuộc V3 của động từ bất quy tắc (write – wrote – written, speak – spoke – spoken)."}, "wordform": {"id": "d8w", "focus": "-able/-ible, -ive", "rule_vi": "Thêm -able/-ible vào động từ hoặc danh từ để tạo tính từ mang nghĩa 'có thể… được' hoặc 'có tính chất…' (rely → reliable: y đổi thành i). Thêm -ive vào động từ để tạo tính từ chỉ đặc điểm (create → creative: bỏ e trước khi thêm -ive).", "examples": [["rely", "reliable"], ["access", "accessible"], ["create", "creative"], ["expense", "expensive"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần, và có 2 từ không cần dùng đến nhé.", "bank": ["article", "audience", "broadcast", "reliable", "opinion", "find out", "advertise", "influence"], "items": [{"id": "d8A1", "q": "I read an interesting ______ in the newspaper about a boy who built a robot from rubbish.", "answer": "article", "tag": "d8v1"}, {"id": "d8A2", "q": "When the concert ended, the whole ______ stood up and clapped for five minutes.", "answer": "audience", "tag": "d8v2"}, {"id": "d8A3", "q": "The TV channel is going to ______ the football final live tonight, so millions of people can watch it at home.", "answer": "broadcast", "tag": "d8v3"}, {"id": "d8A4", "q": "Online encyclopedias are useful, but they aren't always ______, so you should check the facts in other places too.", "answer": "reliable", "tag": "d8v5"}, {"id": "d8A5", "q": "In my ______, children under ten shouldn't have their own smartphones.", "answer": "opinion", "tag": "d8v6"}, {"id": "d8A6", "q": "I want to ______ what time the museum opens, so I'm going to check its website.", "answer": "find out", "tag": "d8p1"}]}, "B_grammar": {"instruction_vi": "Em viết dạng bị động đúng của động từ trong ngoặc (hiện tại đơn hoặc quá khứ đơn). Nhớ nhìn dấu hiệu thời gian và xem chủ ngữ số ít hay số nhiều nhé.", "items": [{"id": "d8B1", "q": "English ______ (speak) in many countries around the world.", "answer": "is spoken", "tag": "d8g"}, {"id": "d8B2", "q": "The evening news ______ (watch) by millions of people every day.", "answer": "is watched", "tag": "d8g"}, {"id": "d8B3", "q": "This article ______ (write) by a 13-year-old student last month.", "answer": "was written", "tag": "d8g"}, {"id": "d8B4", "q": "The school newspaper ______ (not publish) last week because the printer was broken.", "answer": "wasn't published", "accept": ["was not published"], "tag": "d8g"}, {"id": "d8B5", "q": "Hundreds of advertisements ______ (show) on TV every day.", "answer": "are shown", "tag": "d8g"}, {"id": "d8B6", "q": "The match was cancelled, and the fans ______ (inform) by text message an hour before it started.", "answer": "were informed", "tag": "d8g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay cả 4 chỗ trống đều cần TÍNH TỪ (đuôi -able, -ible hoặc -ive).", "items": [{"id": "d8C1", "q": "This TV programme is very ______; I learnt a lot of useful facts about the ocean. (INFORM)", "answer": "informative", "tag": "d8w"}, {"id": "d8C2", "q": "The new sofa is so ______ that I fell asleep on it. (COMFORT)", "answer": "comfortable", "tag": "d8w"}, {"id": "d8C3", "q": "It isn't ______ to believe everything you read on social media. (SENSE)", "answer": "sensible", "tag": "d8w"}, {"id": "d8C4", "q": "The poster for the school play was so ______ that everyone stopped to look at it. (ATTRACT)", "answer": "attractive", "tag": "d8w"}]}, "D_exam": {"format": "sentence_completion", "instruction_vi": "Em chọn đáp án A, B, C hoặc D để hoàn thành câu. Mẹo: 'make' thường đi với việc tạo ra cái gì mới (make a cake, make friends, make a phone call); 'do' thường đi với công việc, nhiệm vụ (do homework, do the shopping, do exercise). Có một số cụm em phải học thuộc lòng nhé!", "items": [{"id": "d8D1", "q": "Before writing the article, the students had to ______ some research on the Internet.", "options": ["do", "make", "take", "get"], "answer": "A", "tag": "fmt:sentence_completion"}, {"id": "d8D2", "q": "The reporter ______ a serious mistake: she wrote the wrong name under the photo.", "options": ["did", "took", "got", "made"], "answer": "D", "tag": "fmt:sentence_completion"}, {"id": "d8D3", "q": "It took the editors a long time to ______ a decision about which photo to put on the front page.", "options": ["say", "make", "do", "put"], "answer": "B", "tag": "fmt:sentence_completion"}, {"id": "d8D4", "q": "Could you ______ me a favour and share our class video on your page?", "options": ["make", "give", "do", "take"], "answer": "C", "tag": "fmt:sentence_completion"}]}, "E_reading": {"id": "d8r", "title": "Can You Believe Everything You Read?", "text": "Every day, millions of articles and videos are shared on social media. Some of them are useful, but others are not reliable at all. Last month, Mai came across a post which said that drinking cold water after meals was dangerous. She was worried, so she showed it to her mum. Her mum said they should find out who wrote it. After a few minutes of searching, they discovered that the post was made by a company that wanted to advertise its own herbal tea.\n\nMai's teacher says that young people are easily influenced by what they see online. She gives her class three simple tips. First, check who wrote the information. Second, look for the same story on a well-known news website. Third, ask an adult if you are not sure. \"The Internet is a wonderful place to learn,\" she says, \"but you have to think before you believe.\"", "items": [{"id": "d8E1", "kind": "tfng", "q": "The post about cold water was written by a doctor.", "answer": "False", "tag": "d8r"}, {"id": "d8E2", "kind": "tfng", "q": "Mai's teacher writes articles for a news website.", "answer": "Not Given", "tag": "d8r"}, {"id": "d8E3", "kind": "mcq", "q": "Why was the post about cold water written?", "options": ["To warn people about a disease", "To help sell a product", "To share a teacher's opinion", "To inform students about the news"], "answer": "B", "tag": "d8r"}, {"id": "d8E4", "kind": "mcq", "q": "Which of these is NOT one of the teacher's tips?", "options": ["Check who wrote the information.", "Look for the story on a well-known news website.", "Ask an adult if you are not sure.", "Share the post with your friends first."], "answer": "D", "tag": "d8r"}]}, "F_writing": {"task_en": "Write a short paragraph (50–70 words) about how you get news and information. Which media do you use (TV, newspapers, websites, social media)? Which one do you think is the most reliable, and why? Use at least one passive sentence and two words from today's lesson.", "task_vi": "Em viết một đoạn văn ngắn (50–70 từ) kể em thường lấy tin tức, thông tin từ đâu (TV, báo, trang web, mạng xã hội). Theo em, nguồn nào đáng tin cậy nhất và vì sao? Em nhớ dùng ít nhất 1 câu bị động và 2 từ mới của bài hôm nay nhé.", "min_words": 50, "model": "I usually get news from TV and the Internet. Every evening, the news is broadcast on TV, and my family watches it together. I also read articles on news websites, but I don't trust everything on social media because many posts are written by people who want to advertise something. In my opinion, TV news is the most reliable because the information is checked carefully.", "checklist_vi": ["Em đã kể ra các nguồn tin em dùng và chọn ra một nguồn đáng tin cậy nhất, có giải thích lý do chưa?", "Em đã viết ít nhất 1 câu bị động đúng công thức be + V3 chưa?", "Em đã dùng ít nhất 2 từ mới của bài hôm nay chưa?", "Em đã viết đủ 50 từ, kiểm tra chính tả và dấu chấm câu chưa?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – Em làm theo gợi ý trong ngoặc ở mỗi câu để ôn lại bài các buổi 6, 5 và 2 nhé. Câu nào chưa chắc, em mở lại bài cũ xem lại cũng được!", "items": [{"id": "d8G1", "q": "Because of the thick fog, our flight was ______ for three hours. (DELAY)", "answer": "delayed", "from_day": 6, "tag": "d6v5"}, {"id": "d8G2", "q": "You ______ (should / mustn't) take photos in this room of the museum. Look at the sign: 'NO CAMERAS'!", "answer": "mustn't", "accept": ["must not"], "from_day": 6, "tag": "d6g"}, {"id": "d8G3", "q": "It took my brother a whole week to ______ his cold. (cụm động từ 2 từ, nghĩa là 'khỏi bệnh, bình phục')", "answer": "get over", "from_day": 5, "tag": "d5p2"}, {"id": "d8G4", "q": "My grandparents ______ (live) in the countryside, but now they live with us in the city. (Dùng 'used to')", "answer": "used to live", "from_day": 2, "tag": "d2g"}]}}, "web_check": [{"id": "d8q1", "type": "mcq", "skill": "vocab", "q": "Many companies ______ their products on social media because lots of young people use it.", "options": ["inform", "advertise", "influence", "broadcast"], "answer": 1, "explain_vi": "advertise = quảng cáo (sản phẩm).", "tag": "d8v4"}, {"id": "d8q2", "type": "text", "skill": "vocab", "q": "Điền 1 động từ bắt đầu bằng 'i', nghĩa là 'thông báo, báo cho biết': Please ______ your teacher if you can't come to class tomorrow.", "answer": "inform", "accept": ["inform"], "explain_vi": "inform somebody = thông báo cho ai biết.", "tag": "d8v7"}, {"id": "d8q3", "type": "mcq", "skill": "vocab", "q": "My older sister has had a big ______ on me; I started reading novels because of her.", "options": ["opinion", "audience", "influence", "article"], "answer": 2, "explain_vi": "have an influence on somebody = có ảnh hưởng đến ai.", "tag": "d8v8"}, {"id": "d8q4", "type": "mcq", "skill": "grammar", "q": "Our school magazine ______ by students in Year 8 and Year 9.", "options": ["is written", "writes", "wrote", "is writing"], "answer": 0, "explain_vi": "Tạp chí không tự viết được → bị động hiện tại đơn: is written.", "tag": "d8g"}, {"id": "d8q5", "type": "mcq", "skill": "grammar", "q": "These photos ______ by my grandfather fifty years ago.", "options": ["took", "are taken", "were taken", "have taken"], "answer": 2, "explain_vi": "'fifty years ago' → quá khứ; ảnh được chụp → bị động: were taken.", "tag": "d8g"}, {"id": "d8q6", "type": "text", "skill": "grammar", "q": "Điền dạng bị động của động từ trong ngoặc: The winners of the singing contest ______ (announce) on the radio yesterday.", "answer": "were announced", "accept": ["were announced"], "explain_vi": "'yesterday' → quá khứ đơn; 'winners' số nhiều → were + V3.", "tag": "d8g"}, {"id": "d8q7", "type": "mcq", "skill": "wordform", "q": "Playing sports helps you stay ______ and healthy. (ACT)", "options": ["action", "actor", "actively", "active"], "answer": 3, "explain_vi": "Sau 'stay' cần tính từ: act + ive = active.", "tag": "d8w"}, {"id": "d8q8", "type": "text", "skill": "wordform", "q": "Viết dạng đúng của từ in hoa: Our trip to the zoo was really ______; we had a great time. (ENJOY)", "answer": "enjoyable", "accept": ["enjoyable"], "explain_vi": "Sau 'was really' cần tính từ: enjoy + able = enjoyable (thú vị).", "tag": "d8w"}, {"id": "d8q9", "type": "mcq", "skill": "exam", "q": "Mum, can I go out to play now? I've already ______ the washing-up.", "options": ["made", "taken", "had", "done"], "answer": 3, "explain_vi": "do the washing-up = rửa bát (công việc nhà đi với 'do').", "tag": "fmt:sentence_completion"}, {"id": "d8q10", "type": "mcq", "skill": "review", "from_day": 6, "q": "We ______ off for the airport at 4 a.m. to catch the early flight.", "options": ["set", "took", "got", "went"], "answer": 0, "explain_vi": "set off = khởi hành, lên đường.", "tag": "d6p1"}, {"id": "d8q11", "type": "text", "skill": "review", "from_day": 5, "q": "Điền 1 động từ, nghĩa là 'tránh': You should ______ eating too many sweets if you want healthy teeth.", "answer": "avoid", "accept": ["avoid"], "explain_vi": "avoid + V-ing = tránh làm gì.", "tag": "d5v8"}, {"id": "d8q12", "type": "mcq", "skill": "review", "from_day": 2, "q": "My dad ______ golf last year, and now he plays every Sunday.", "options": ["gave up", "took up", "set off", "dropped out"], "answer": 1, "explain_vi": "take up = bắt đầu một sở thích mới (quá khứ: took up).", "tag": "d2p1"}], "can_do_vi": ["Em có thể dùng 8 từ mới và 2 cụm động từ (find out, come across) để nói về tin tức và truyền thông.", "Em có thể viết câu bị động ở thì hiện tại đơn và quá khứ đơn (is written, was broadcast).", "Em có thể tạo tính từ đuôi -able/-ible/-ive và chọn đúng 'make' hay 'do' trong các cụm từ quen thuộc."]}, {"day": 9, "type": "normal", "theme_en": "Food & culture", "theme_vi": "Ẩm thực và văn hoá", "goal_vi": "Hôm nay em sẽ học các từ về món ăn, lễ hội và phong tục, cùng cách dùng danh từ đếm được/không đếm được, much/many/a few/a little/plenty of và mạo từ a/an/the. Em cũng sẽ luyện dạng bài tìm từ đồng nghĩa – chuẩn bị một chút đồ ăn vặt rồi mình bắt đầu nhé!", "minutes": 30, "vocab": [{"id": "d9v1", "word": "tradition", "pos": "n", "ipa": "/trəˈdɪʃn/", "meaning_vi": "truyền thống", "example": "It is a tradition in my family to visit our grandparents on the first day of Tết.", "family": "traditional (adj), traditionally (adv)"}, {"id": "d9v2", "word": "festival", "pos": "n", "ipa": "/ˈfestɪvl/", "meaning_vi": "lễ hội", "example": "The Mid-Autumn Festival is my little sister's favourite time of the year.", "family": "festive (adj), festivals (n, số nhiều)"}, {"id": "d9v3", "word": "ingredient", "pos": "n", "ipa": "/ɪnˈɡriːdiənt/", "meaning_vi": "nguyên liệu (để nấu món ăn)", "example": "The main ingredients of bánh chưng are sticky rice, green beans and pork.", "family": "ingredients (n, số nhiều)"}, {"id": "d9v4", "word": "recipe", "pos": "n", "ipa": "/ˈresəpi/", "meaning_vi": "công thức nấu ăn", "example": "My grandma never uses a recipe; she cooks everything from memory.", "family": "recipes (n, số nhiều); recipe book (sách dạy nấu ăn)"}, {"id": "d9v5", "word": "flavour", "pos": "n", "ipa": "/ˈfleɪvə(r)/", "meaning_vi": "hương vị", "example": "This ice cream comes in three flavours: mango, coconut and chocolate.", "family": "flavoured (adj); Anh-Mỹ viết: flavor"}, {"id": "d9v6", "word": "custom", "pos": "n", "ipa": "/ˈkʌstəm/", "meaning_vi": "phong tục, tập quán", "example": "Giving lucky money to children at Tết is an old Vietnamese custom.", "family": "customs (n, số nhiều; còn có nghĩa 'hải quan')"}, {"id": "d9v7", "word": "celebrate", "pos": "v", "ipa": "/ˈselɪbreɪt/", "meaning_vi": "tổ chức ăn mừng, kỷ niệm", "example": "We celebrated my brother's birthday with a big family dinner.", "family": "celebration (n)"}, {"id": "d9v8", "word": "local", "pos": "adj", "ipa": "/ˈləʊkl/", "meaning_vi": "(thuộc về) địa phương", "example": "When I travel, I always try the local food.", "family": "locally (adv); locals (n: người dân địa phương)"}], "phrasal": [{"id": "d9p1", "phrase": "eat out", "meaning_vi": "đi ăn ở ngoài (nhà hàng, quán ăn)", "example": "My family usually eats out on Saturday evenings."}, {"id": "d9p2", "phrase": "run out of", "meaning_vi": "hết, cạn (cái gì)", "example": "We've run out of fish sauce, so I have to go to the shop."}], "grammar": {"id": "d9g", "title": "Countable/uncountable nouns; much/many/a few/a little/plenty of; articles a/an/the/zero", "rule_vi": ["Danh từ đếm được có số ít/số nhiều (an egg – two eggs). Danh từ không đếm được không có số nhiều, không dùng a/an và đi với động từ số ít (rice, water, bread, information, advice, money).", "many / a few + danh từ đếm được số nhiều (many eggs, a few apples). much / a little + danh từ không đếm được (much sugar, a little salt). plenty of / a lot of dùng được với cả hai loại.", "a few / a little = một ít (đủ dùng, nghĩa tích cực). few / little (không có 'a') = rất ít, gần như không có (nghĩa tiêu cực).", "a/an: nhắc đến lần đầu, danh từ đếm được số ít (an onion, a festival). the: vật đã được nhắc đến, hoặc chỉ có một (the sun, the best dish).", "Mạo từ rỗng (không dùng mạo từ): khi nói chung chung về danh từ số nhiều hoặc không đếm được (Children love sweets. Rice is grown in Asia.), và trước tên bữa ăn (have breakfast)."], "examples": ["There isn't much milk left, but we have plenty of eggs.", "Add a little salt and a few spring onions.", "I bought a cake and a bottle of juice. The cake was delicious.", "Rice is the main food in many Asian countries."], "common_mistake_vi": "Dùng a/an hoặc thêm -s cho danh từ không đếm được: ✗ She gave me an advice. / ✗ two breads → ✓ She gave me some advice / a piece of advice. ✓ two loaves of bread / two pieces of bread."}, "wordform": {"id": "d9w", "focus": "-ness, -ity", "rule_vi": "Thêm -ness hoặc -ity vào tính từ để tạo danh từ. Với -ness: y đổi thành i (happy → happiness). Với -ity: thường bỏ e hoặc đổi chút chính tả (pure → purity, able → ability).", "examples": [["kind", "kindness"], ["happy", "happiness"], ["popular", "popularity"], ["able", "ability"], ["dark", "darkness"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần, và có 2 từ không cần dùng đến nhé.", "bank": ["tradition", "festival", "ingredients", "recipe", "flavour", "celebrate", "local", "ran out of"], "items": [{"id": "d9A1", "q": "Making bánh chưng together before Tết is an important ______ in many Vietnamese families.", "answer": "tradition", "tag": "d9v1"}, {"id": "d9A2", "q": "To make this pancake, you only need three ______: flour, eggs and milk.", "answer": "ingredients", "tag": "d9v3"}, {"id": "d9A3", "q": "My aunt gave me her ______ for chicken curry, so now I can cook it myself.", "answer": "recipe", "tag": "d9v4"}, {"id": "d9A4", "q": "I love the ______ of fresh mint in my spring rolls.", "answer": "flavour", "accept": ["flavor"], "tag": "d9v5"}, {"id": "d9A5", "q": "When we went to Hội An, we ate at a small restaurant that served only ______ dishes like cao lầu.", "answer": "local", "tag": "d9v8"}, {"id": "d9A6", "q": "Halfway through the party, we ______ ice, so Dad drove to the shop to buy some more.", "answer": "ran out of", "tag": "d9p2"}]}, "B_grammar": {"instruction_vi": "Em chọn từ đúng trong ngoặc. Nếu không cần mạo từ, em viết dấu '–' (gạch ngang) nhé. Gợi ý: trước tiên hãy xác định danh từ sau chỗ trống là đếm được hay không đếm được.", "items": [{"id": "d9B1", "q": "How ______ (much / many) sugar do you put in your coffee?", "answer": "much", "tag": "d9g"}, {"id": "d9B2", "q": "There were ______ (much / many) people at the flower festival last Sunday.", "answer": "many", "tag": "d9g"}, {"id": "d9B3", "q": "The soup tastes a bit bland. Can you add ______ (a few / a little) salt?", "answer": "a little", "tag": "d9g"}, {"id": "d9B4", "q": "I've invited ______ (a few / a little) friends to my birthday party – just four or five.", "answer": "a few", "tag": "d9g"}, {"id": "d9B5", "q": "Yesterday I ate ______ (a / an / the) orange and a banana. ______ (A / An / The) orange was very sweet. (Viết 2 đáp án, cách nhau bởi dấu phẩy)", "answer": "an, The", "accept": ["an, the", "an,The", "an,the", "an The", "an the"], "tag": "d9g"}, {"id": "d9B6", "q": "In my opinion, ______ (a / the / –) vegetables are good for everyone, so we should eat them every day.", "answer": "–", "accept": ["-", "x", "no article", "zero article", "0", "Ø"], "tag": "d9g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: cả 4 chỗ trống đều cần DANH TỪ đuôi -ness hoặc -ity.", "items": [{"id": "d9C1", "q": "Thank you for your ______. You helped me a lot when I was ill. (KIND)", "answer": "kindness", "tag": "d9w"}, {"id": "d9C2", "q": "The ______ of phở has spread around the world; you can find it in London, Paris and Tokyo. (POPULAR)", "answer": "popularity", "tag": "d9w"}, {"id": "d9C3", "q": "My little brother has a great ______ to remember the names of all the dishes on a menu. (ABLE)", "answer": "ability", "tag": "d9w"}, {"id": "d9C4", "q": "The children's faces were full of ______ when they saw the lanterns at the festival. (HAPPY)", "answer": "happiness", "tag": "d9w"}]}, "D_exam": {"format": "synonym", "instruction_vi": "Em chọn từ hoặc cụm từ A, B, C hoặc D có nghĩa GẦN NHẤT với từ in hoa trong câu. Mẹo: thử thay từng đáp án vào câu xem câu có giữ nguyên nghĩa không nhé.", "items": [{"id": "d9D1", "q": "In some countries, it is a CUSTOM to take off your shoes before entering a house.", "options": ["habit of one person", "rule of the school", "traditional way of doing something", "kind of clothes"], "answer": "C", "tag": "fmt:synonym"}, {"id": "d9D2", "q": "Our family CELEBRATED Grandpa's 80th birthday with a big party.", "options": ["forgot", "marked", "planned", "missed"], "answer": "B", "tag": "fmt:synonym"}, {"id": "d9D3", "q": "We often EAT OUT on Friday evenings because everyone is too tired to cook.", "options": ["have a meal at a restaurant", "eat everything on the plate", "have a picnic in the garden", "eat less food than usual"], "answer": "A", "tag": "fmt:synonym"}, {"id": "d9D4", "q": "This dish has a very strong FLAVOUR of ginger.", "options": ["colour", "price", "smell only", "taste"], "answer": "D", "tag": "fmt:synonym"}]}, "E_reading": {"id": "d9r", "title": "Grandma's Kitchen at Tết", "text": "For Linh, the best part of Tết is not the lucky money. It is the two days before the festival, when the whole family gathers in her grandmother's kitchen in Nam Định. It is a family tradition: everyone has a job. The men wash the banana leaves, the children carry water, and Grandma prepares the ingredients for bánh chưng – sticky rice, green beans, pork and a little pepper.\n\nGrandma has never written down her recipe. \"It is in my hands,\" she says. This year, Linh decided to learn it. She watched carefully and wrote every step in a notebook. Her first cake was not perfectly square, but everyone said it had a wonderful flavour.\n\nThe cakes are boiled for about ten hours, so the family takes turns to watch the fire through the night. Linh's cousins tell stories and sing songs. \"We don't eat out much at Tết,\" Linh says. \"Food made together just tastes better.\"", "items": [{"id": "d9E1", "kind": "tfng", "q": "Linh's grandmother keeps her recipe for bánh chưng in a notebook.", "answer": "False", "tag": "d9r"}, {"id": "d9E2", "kind": "tfng", "q": "Linh's first bánh chưng tasted good even though its shape was not perfect.", "answer": "True", "tag": "d9r"}, {"id": "d9E3", "kind": "mcq", "q": "What do the children do in the kitchen?", "options": ["They wash the banana leaves.", "They prepare the pork.", "They carry water.", "They watch the fire alone."], "answer": "C", "tag": "d9r"}, {"id": "d9E4", "kind": "mcq", "q": "What does Linh mean when she says \"Food made together just tastes better\"?", "options": ["Restaurant food is too expensive at Tết.", "Cooking with her family makes the food more special.", "Her grandmother is the best cook in Nam Định.", "Bánh chưng should always be boiled for ten hours."], "answer": "B", "tag": "d9r"}]}, "F_writing": {"task_en": "Write a short paragraph (50–70 words) about a traditional dish from your family or your hometown. Say what the main ingredients are, when people usually eat it, and why you like it. Use much/many/a few/a little at least once and two words from today's lesson.", "task_vi": "Em viết một đoạn văn ngắn (50–70 từ) giới thiệu một món ăn truyền thống của gia đình hoặc quê hương em: nguyên liệu chính là gì, mọi người thường ăn vào dịp nào, và vì sao em thích món đó. Em dùng ít nhất 1 lần much/many/a few/a little và 2 từ mới của bài hôm nay nhé.", "min_words": 50, "model": "My favourite traditional dish is bún chả, a local speciality of Hà Nội. The main ingredients are rice noodles, grilled pork and fresh herbs. You also need a little sugar, garlic and fish sauce to make the dipping sauce. Many people eat it for lunch, and my family often eats out at a small bún chả shop near our house. I love its smoky flavour!", "checklist_vi": ["Em đã nêu tên món ăn, nguyên liệu chính, dịp ăn và lý do em thích chưa?", "Em đã dùng đúng much/many/a few/a little với danh từ đếm được và không đếm được chưa?", "Em đã dùng ít nhất 2 từ mới của bài hôm nay và kiểm tra mạo từ a/an/the chưa?", "Em đã viết đủ 50 từ, kiểm tra chính tả và dấu chấm câu chưa?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – Em làm theo gợi ý trong ngoặc ở mỗi câu để ôn lại bài các buổi 8, 6 và 3 nhé. Câu nào chưa chắc, em mở lại bài cũ xem lại cũng được!", "items": [{"id": "d9G1", "q": "The famous Hà Nội Opera House ______ (build) by the French in the early 20th century.", "answer": "was built", "from_day": 8, "tag": "d8g"}, {"id": "d9G2", "q": "While I was looking for a recipe online, I ______ a video about street food in Thailand. (cụm động từ ở thì quá khứ, nghĩa là 'tình cờ thấy')", "answer": "came across", "from_day": 8, "tag": "d8p2"}, {"id": "d9G3", "q": "Hundreds of ______ were waiting at the station when the train finally arrived. (từ của buổi 6, bắt đầu bằng 'p', nghĩa là 'hành khách')", "answer": "passengers", "from_day": 6, "tag": "d6v6"}, {"id": "d9G4", "q": "I ______ (not / finish) my lunch yet, so I can't go out to play.", "answer": "haven't finished", "accept": ["have not finished"], "from_day": 3, "tag": "d3g"}]}}, "web_check": [{"id": "d9q1", "type": "mcq", "skill": "vocab", "q": "Every year, our town holds a food ______ where people can try dishes from all over Việt Nam.", "options": ["recipe", "custom", "festival", "ingredient"], "answer": 2, "explain_vi": "food festival = lễ hội ẩm thực.", "tag": "d9v2"}, {"id": "d9q2", "type": "text", "skill": "vocab", "q": "Điền 1 động từ bắt đầu bằng 'c', nghĩa là 'ăn mừng, tổ chức kỷ niệm': How do people in your country ______ the New Year?", "answer": "celebrate", "accept": ["celebrate"], "explain_vi": "celebrate = ăn mừng, tổ chức (một dịp đặc biệt).", "tag": "d9v7"}, {"id": "d9q3", "type": "mcq", "skill": "vocab", "q": "Mum is too busy to cook tonight, so we're going to ______ at the noodle shop near the park.", "options": ["eat out", "run out", "set off", "find out"], "answer": 0, "explain_vi": "eat out = đi ăn ở ngoài, không nấu ở nhà.", "tag": "d9p1"}, {"id": "d9q4", "type": "mcq", "skill": "grammar", "q": "Could you give me ______ advice about what to cook for my parents' anniversary?", "options": ["an", "many", "a few", "some"], "answer": 3, "explain_vi": "advice là danh từ không đếm được → không dùng an / many / a few; dùng some advice.", "tag": "d9g"}, {"id": "d9q5", "type": "mcq", "skill": "grammar", "q": "Hurry up! We only have ______ minutes before the film starts.", "options": ["a little", "much", "a few", "little"], "answer": 2, "explain_vi": "minutes là danh từ đếm được số nhiều → a few minutes (một vài phút).", "tag": "d9g"}, {"id": "d9q6", "type": "text", "skill": "grammar", "q": "Điền một mạo từ (a, an hoặc the): Look at ______ moon! It's so bright tonight.", "answer": "the", "accept": ["the"], "explain_vi": "Chỉ có duy nhất một mặt trăng → dùng the.", "tag": "d9g"}, {"id": "d9q7", "type": "mcq", "skill": "wordform", "q": "There is a strong ______ between these two soups; both use rice noodles, beef and fresh herbs. (SIMILAR)", "options": ["similar", "similarity", "similarly", "similarness"], "answer": 1, "explain_vi": "Sau 'a strong' cần danh từ: similar + ity = similarity (sự giống nhau). Không có từ 'similarness'.", "tag": "d9w"}, {"id": "d9q8", "type": "text", "skill": "wordform", "q": "Viết dạng đúng của từ in hoa: After the long walk, I felt a strange ______ in my legs. (WEAK)", "answer": "weakness", "accept": ["weakness"], "explain_vi": "Sau 'a strange' cần danh từ: weak + ness = weakness (sự yếu, mệt).", "tag": "d9w"}, {"id": "d9q9", "type": "mcq", "skill": "exam", "q": "Choose the word CLOSEST in meaning to the word in CAPITALS: We bought some LOCAL fruit at the market in Đà Lạt.", "options": ["imported", "expensive", "fresh", "from the area"], "answer": 3, "explain_vi": "local = thuộc địa phương, tức là 'from the area' (của vùng đó).", "tag": "fmt:synonym"}, {"id": "d9q10", "type": "mcq", "skill": "review", "from_day": 8, "q": "The singing competition ______ on TV every Saturday night.", "options": ["broadcasts", "is broadcast", "was broadcasting", "broadcasted"], "answer": 1, "explain_vi": "Cuộc thi được phát sóng → bị động hiện tại đơn: is broadcast (V3 của broadcast vẫn là broadcast).", "tag": "d8g"}, {"id": "d9q11", "type": "mcq", "skill": "review", "from_day": 6, "q": "When we arrived at the bus station, we ______ wait for an hour because the bus was late.", "options": ["must", "should", "had to", "can"], "answer": 2, "explain_vi": "Việc bắt buộc do hoàn cảnh trong quá khứ → had to (must không có dạng quá khứ).", "tag": "d6g"}, {"id": "d9q12", "type": "text", "skill": "review", "from_day": 3, "q": "Điền 1 động từ bắt đầu bằng 'r', nghĩa là 'giảm bớt': We can ______ waste by bringing our own lunch boxes to school.", "answer": "reduce", "accept": ["reduce"], "explain_vi": "reduce = giảm bớt; sau 'can' dùng động từ nguyên thể.", "tag": "d3v7"}], "can_do_vi": ["Em có thể dùng 8 từ mới và 2 cụm động từ (eat out, run out of) để nói về món ăn, lễ hội và phong tục.", "Em có thể phân biệt danh từ đếm được/không đếm được, dùng đúng much/many/a few/a little/plenty of và mạo từ a/an/the.", "Em có thể tạo danh từ đuôi -ness/-ity và tìm từ đồng nghĩa trong bài thi."]}, {"day": 10, "type": "normal", "theme_en": "Work & jobs", "theme_vi": "Công việc và nghề nghiệp", "goal_vi": "Hôm nay em sẽ học các từ để nói về nghề nghiệp và ước mơ tương lai của mình. Em cũng sẽ làm quen với câu điều kiện loại 0, 1, 2 – một chủ điểm rất hay gặp trong đề thi chuyên đấy!", "minutes": 30, "vocab": [{"id": "d10v1", "word": "career", "pos": "n", "ipa": "/kəˈrɪə(r)/", "meaning_vi": "sự nghiệp, nghề nghiệp (lâu dài)", "example": "My aunt had a long career as a nurse.", "family": "career-minded (adj)"}, {"id": "d10v2", "word": "skill", "pos": "n", "ipa": "/skɪl/", "meaning_vi": "kỹ năng", "example": "Cooking is a useful skill for everyone.", "family": "skilful (adj), skilled (adj), unskilled (adj)"}, {"id": "d10v3", "word": "e
