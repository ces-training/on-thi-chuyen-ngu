ase note that it is no longer held at the City Science Centre. We have moved to Thanh Xuan Youth Club, which has bigger computer rooms. Sessions start at half past eight every morning, but on the first day we'd like everyone to arrive fifteen minutes earlier, at a quarter past eight, to collect their name badges. In the first week, campers are going to learn the basics of coding, and in the second week they are designing their own mobile app. We originally planned a trip to a robot factory, but unfortunately that has been cancelled, so instead we are visiting a technology museum. The full fee is 2,500,000 dong, but students who register before the end of May will pay only 2,100,000. Laptops are provided, but you will need to bring your own headphones. To register, please visit our website. Thank you for calling.", "text": "BRIGHT MINDS DIGITAL CAMP\n• Dates: 15 July – 2 August\n• Place: Thanh Xuan Youth [1]\n• First day: arrive at [2] a.m.\n• Week 2: design a mobile [3]\n• Trip: a technology [4]\n• Fee if you register before the end of May: [5] dong\n• Bring: your own headphones", "items": [{"answer": "Club", "accept": ["club"], "explain_vi": "Nghe: 'We have moved to Thanh Xuan Youth Club'. City Science Centre là địa điểm cũ (no longer held)."}, {"answer": "8.15", "accept": ["8:15", "8.15 a.m.", "quarter past eight", "a quarter past eight"], "explain_vi": "Ngày đầu đến sớm 15 phút: a quarter past eight = 8.15. Half past eight (8.30) là giờ bắt đầu các ngày khác – bẫy."}, {"answer": "app", "accept": ["application"], "explain_vi": "Tuần 2: 'designing their own mobile app'. Coding là nội dung tuần 1."}, {"answer": "museum", "accept": [], "explain_vi": "Chuyến thăm nhà máy robot đã bị huỷ; thay vào đó (instead) là 'a technology museum'."}, {"answer": "2,100,000", "accept": ["2100000", "2.100.000", "2 100 000"], "explain_vi": "Đăng ký trước cuối tháng 5 chỉ trả 2,100,000; 2,500,000 là giá đầy đủ."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Thử thách dành cho học sinh mức Nâng cao. Câu 1–2: viết dạng đúng của từ in hoa (có thể phải đổi 2 lần hoặc thêm tiền tố). Câu 3–4: viết tiếp câu sau sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d4H1", "q": "Some apps collect users' personal data ______, without asking for permission. (LEGAL)", "answer": "illegally", "accept": []}, {"id": "d4H2", "q": "Thanks to its powerful processor, the new laptop runs even the biggest games ______. (EFFORT)", "answer": "effortlessly", "accept": []}, {"id": "d4H3", "q": "I've arranged to meet the IT technician at 3 p.m. tomorrow. → I'm ______", "answer": "meeting the IT technician at 3 p.m. tomorrow", "accept": ["seeing the IT technician at 3 p.m. tomorrow"]}, {"id": "d4H4", "q": "I'm sure the new app will be popular with teenagers. → The new app is bound ______", "answer": "to be popular with teenagers", "accept": []}, {"id": "d4H5", "q": "With new gadgets coming out every month, it's hard to ______ pace with the latest technology.", "options": ["keep", "catch", "hold", "stay"], "answer": "A", "accept": []}, {"id": "d4H6", "q": "Please don't forget to ______ up your files before you update the software.", "options": ["save", "make", "back", "put"], "answer": "C", "accept": []}]}}, "5": {"grammar_games": {"sort": {"title_vi": "Chỗ trống cần too, so hay such? Xếp mỗi câu vào đúng nhóm.", "groups": [{"name": "too (+ adj + to V)", "items": ["I'm ___ tired to go jogging tonight.", "The soup was ___ salty for me to eat.", "It's ___ late to drink coffee now."]}, {"name": "so (+ adj/adv + that)", "items": ["Vinh ran ___ fast that he won the race.", "I was ___ hungry that I ate three bowls.", "She has ___ much energy that she never stops."]}, {"name": "such (+ a/an + adj + N + that)", "items": ["It was ___ a long walk that my legs hurt.", "We had ___ fun that we didn't want to leave.", "These are ___ juicy mangoes that I want more."]}]}, "unjumble": [{"sentence": "My grandpa is fitter than most young people I know.", "hint_vi": "So sánh hơn của tính từ ngắn: fit → fitter than"}, {"sentence": "Swimming is one of the best ways to stay fit.", "hint_vi": "So sánh nhất: one of the best + danh từ số nhiều"}, {"sentence": "He isn't old enough to work out at the gym.", "hint_vi": "adj + enough + to V"}, {"sentence": "This salad is too big for me to finish.", "hint_vi": "too + adj + for sb + to V"}, {"sentence": "The match was so tiring that I went to bed early.", "hint_vi": "so + adj + that + mệnh đề"}], "truefalse": [{"s": "My brother is enough tall to play basketball.", "ok": false, "fix": "My brother is tall enough to play basketball.", "why_vi": "enough đứng SAU tính từ: tall enough."}, {"s": "Cycling is more healthier than taking the bus.", "ok": false, "fix": "Cycling is healthier than taking the bus.", "why_vi": "healthier đã là so sánh hơn, không thêm more."}, {"s": "This is the most nutritious breakfast I have ever had.", "ok": true, "fix": "This is the most nutritious breakfast I have ever had.", "why_vi": "Tính từ dài → the most + adj; thường đi với 'I have ever…'."}, {"s": "It was such a long race that many runners gave up.", "ok": true, "fix": "It was such a long race that many runners gave up.", "why_vi": "such + a + adj + danh từ số ít + that."}, {"s": "We don't have enough time to cook a proper dinner.", "ok": true, "fix": "We don't have enough time to cook a proper dinner.", "why_vi": "enough đứng TRƯỚC danh từ: enough time."}, {"s": "The weather was so hot that we couldn't work out outside.", "ok": true, "fix": "The weather was so hot that we couldn't work out outside.", "why_vi": "so + tính từ (không có danh từ đi sau) + that."}, {"s": "My cold is badder than it was yesterday.", "ok": false, "fix": "My cold is worse than it was yesterday.", "why_vi": "bad là bất quy tắc: bad – worse – the worst."}, {"s": "It was so a delicious soup that I had two bowls.", "ok": false, "fix": "It was such a delicious soup that I had two bowls.", "why_vi": "Có a + adj + danh từ → dùng such, không dùng so."}]}, "exam": [{"format": "closest_meaning", "title_vi": "Chọn câu gần nghĩa nhất", "intro_vi": "Đề Chuyên Ngoại ngữ có 5 câu chọn câu gần nghĩa nhất với câu cho sẵn, mỗi câu 4 lựa chọn. Câu gốc hay dùng so sánh, too/enough, so/such; đáp án là cách nói khác giữ nguyên nghĩa.", "tip_vi": "Mẹo: tách câu gốc thành từng ý nhỏ (ai hơn ai, làm được hay không), loại câu bị đảo nghĩa và câu sai ngữ pháp như 'such heavy'.", "kind": "mcq", "items": [{"q": "My brother doesn't run as fast as I do.", "options": ["My brother runs faster than me.", "I run faster than my brother.", "My brother and I run equally fast.", "I don't run as fast as my brother."], "answer": 1, "explain_vi": "not as fast as = chậm hơn. Anh trai chạy chậm hơn em → em chạy nhanh hơn: I run faster than my brother."}, {"q": "The bag was so heavy that Lan couldn't lift it.", "options": ["The bag was heavy enough for Lan to lift.", "The bag was such heavy that Lan couldn't lift it.", "Lan was strong enough to lift the bag.", "The bag was too heavy for Lan to lift."], "answer": 3, "explain_vi": "so … that + couldn't = too … for sb to V. 'such heavy' sai vì such cần danh từ đi sau."}, {"q": "I have never eaten such a nutritious meal.", "options": ["This is the most nutritious meal I have ever eaten.", "I have eaten more nutritious meals than this.", "This meal is less nutritious than other meals I have eaten.", "I never eat nutritious meals."], "answer": 0, "explain_vi": "never … such a + adj + N = đây là … nhất từng: the most nutritious meal I have ever eaten."}, {"q": "Thu is not tall enough to reach the top shelf.", "options": ["Thu is tall enough to reach the top shelf.", "Thu is too short to reach the top shelf.", "Thu is so tall that she can reach the top shelf.", "The top shelf is too low for Thu to reach."], "answer": 1, "explain_vi": "not tall enough to = too short to: không đủ cao nên không với tới."}, {"q": "Fast food is less healthy than home-cooked food.", "options": ["Fast food is as healthy as home-cooked food.", "Fast food is healthier than home-cooked food.", "Home-cooked food is healthier than fast food.", "Home-cooked food is not as healthy as fast food."], "answer": 2, "explain_vi": "A less healthy than B = B healthier than A. Đổi chủ ngữ thì đổi less thành dạng so sánh hơn."}]}, {"format": "transformation", "title_vi": "Viết lại câu", "intro_vi": "Đề Sở chuyên Anh Hà Nội có phần viết lại câu bắt đầu bằng từ cho sẵn, giữ nguyên nghĩa; đề chung vào 10 cũng có dạng này. Hôm nay em luyện 5 câu với so sánh, too/enough, so/such.", "tip_vi": "Mẹo: viết xong đọc lại cả câu mới và so với câu gốc: nghĩa có giữ nguyên không, thì có đúng không, chủ ngữ mới đã hợp chưa?", "kind": "transform", "items": [{"q": "This test is easier than the last one.", "start": "The last test was", "answer": "more difficult than this one", "accept": ["harder than this one", "more difficult than this test", "harder than this test", "more difficult than this", "harder than this"], "explain_vi": "Đổi chủ ngữ thì dùng tính từ trái nghĩa: easier ↔ more difficult / harder."}, {"q": "My little brother is too short to ride this roller coaster.", "start": "My little brother isn't", "answer": "tall enough to ride this roller coaster", "accept": ["tall enough to ride it"], "explain_vi": "too + adj + to V = not + adj trái nghĩa + enough + to V: too short → not tall enough."}, {"q": "The film was so boring that I fell asleep.", "start": "It was", "answer": "such a boring film that I fell asleep", "accept": [], "explain_vi": "so + adj + that = such + a + adj + N + that: such a boring film that…"}, {"q": "Nobody in my family cooks as well as my grandma.", "start": "My grandma is the", "answer": "best cook in my family", "accept": ["best cook in the family", "best cook in our family"], "explain_vi": "Không ai bằng bà → bà giỏi nhất: the best cook (good/well → best)."}, {"q": "The exercise was too difficult for me to do.", "start": "The exercise was so", "answer": "difficult that I couldn't do it", "accept": ["difficult that I could not do it", "difficult that I wasn't able to do it", "difficult that I was not able to do it"], "explain_vi": "too … for me to V = so … that I couldn't V + it. Nhớ thêm tân ngữ 'it' sau do."}]}], "exam_easy": [{"format": "closest_meaning", "title_vi": "Chọn câu gần nghĩa nhất", "intro_vi": "Đề Chuyên Ngoại ngữ có dạng đọc một câu rồi chọn câu A, B, C hoặc D có nghĩa giống nhất. Bản này câu ngắn, từ quen; em chỉ cần chú ý ai hơn ai, làm được hay không.", "tip_vi": "Mẹo: gạch chân từ so sánh (taller, the best, too, enough). Nếu đổi chủ ngữ thì đổi tính từ sang nghĩa ngược lại: taller → shorter.", "kind": "mcq", "items": [{"q": "Minh is taller than Nam.", "options": ["Nam is taller than Minh.", "Nam is shorter than Minh.", "Minh is shorter than Nam.", "Minh and Nam are the same height."], "answer": 1, "explain_vi": "Minh cao hơn Nam nghĩa là Nam thấp hơn Minh. Đổi chủ ngữ (Nam lên đầu) thì đổi taller thành từ ngược nghĩa: shorter."}, {"q": "The tea is too hot to drink.", "options": ["The tea is cool enough to drink.", "The tea isn't cool enough to drink.", "The tea isn't hot.", "I drink hot tea every day."], "answer": 1, "explain_vi": "too hot to drink = nóng quá, chưa uống được. Nghĩa giống: chưa đủ nguội để uống = isn't cool enough to drink."}, {"q": "Hoa is the best swimmer in our class.", "options": ["Hoa swims better than everyone else in our class.", "Hoa can't swim.", "Everyone in our class swims better than Hoa.", "Hoa is a bad swimmer."], "answer": 0, "explain_vi": "the best swimmer = bơi giỏi nhất, tức là bơi giỏi hơn mọi bạn khác: better than everyone else."}, {"q": "It was such a cold day that we stayed at home.", "options": ["The day was warm, so we went out.", "We went out because it was cold.", "The day was so cold that we stayed at home.", "It was a hot day, so we stayed at home."], "answer": 2, "explain_vi": "such a cold day that … = so cold that …: trời lạnh quá nên cả nhà ở nhà. Các câu khác đổi nghĩa (warm, went out, hot)."}, {"q": "Cycling is healthier than watching TV.", "options": ["Watching TV is healthier than cycling.", "Cycling is as healthy as watching TV.", "Cycling isn't healthy.", "Watching TV isn't as healthy as cycling."], "answer": 3, "explain_vi": "Đạp xe tốt cho sức khoẻ hơn xem TV, nghĩa là xem TV không tốt bằng đạp xe: not as healthy as."}]}, {"format": "transformation", "title_vi": "Viết lại câu", "intro_vi": "Đề Sở chuyên Anh Hà Nội và đề chung vào 10 có phần viết lại câu, phần đầu câu mới cho sẵn. Bản này câu ngắn: em chỉ cần đổi so sánh, too/enough hoặc so/such.", "tip_vi": "Mẹo: too + tính từ = not + tính từ ngược nghĩa + enough (too small = not big enough). such cần a + tính từ + danh từ.", "kind": "transform", "items": [{"q": "Lan is shorter than her sister.", "start": "Her sister is", "answer": "taller than Lan", "accept": ["taller than her"], "explain_vi": "Lan thấp hơn chị → chị cao hơn Lan. Đổi chủ ngữ thì đổi shorter thành taller."}, {"q": "My shoes are too small for me to wear.", "start": "My shoes aren't", "answer": "big enough for me to wear", "accept": ["big enough to wear", "large enough for me to wear", "large enough to wear"], "explain_vi": "too small = not big enough. Nhớ: enough đứng SAU tính từ: big enough, không viết enough big."}, {"q": "The cake was so delicious that I ate three pieces.", "start": "It was", "answer": "such a delicious cake that I ate three pieces", "accept": [], "explain_vi": "so + tính từ + that → such + a + tính từ + danh từ + that. Phải thêm danh từ cake và mạo từ a."}, {"q": "No one in my class is as tall as Đức.", "start": "Đức is the", "answer": "tallest student in my class", "accept": ["tallest in my class", "tallest person in my class", "tallest boy in my class", "tallest pupil in my class"], "explain_vi": "Không ai cao bằng Đức → Đức cao nhất: the tallest (tính từ ngắn thêm -est)."}, {"q": "I am not old enough to drive a car.", "start": "I am too", "answer": "young to drive a car", "accept": ["young to drive"], "explain_vi": "not old enough = too young: chưa đủ tuổi = còn quá nhỏ. Sau too + tính từ là to + động từ."}]}], "exam_plus": [{"format": "closest_meaning", "title_vi": "Chọn câu gần nghĩa nhất", "intro_vi": "Trong đề Chuyên Ngoại ngữ, các câu gần nghĩa cuối phần thường là câu phân loại: phương án nhiễu chỉ lệch một chữ như slightly/much, few/little, hoặc đảo ngược ý rất khéo.", "tip_vi": "Mẹo: so từng chữ chỉ mức độ (hardly, nearly, much, slightly) và kiểm tra ngữ pháp từng phương án trước khi so nghĩa.", "kind": "mcq", "items": [{"q": "Hardly anyone in the team is as fit as Quang.", "options": ["Quang is the least fit player in the team.", "Almost everyone in the team is fitter than Quang.", "Quang is fitter than almost everyone else in the team.", "Quang is as fit as most of the players in the team."], "answer": 2, "explain_vi": "hardly anyone = hầu như không ai. Hầu như không ai khoẻ bằng Quang → Quang khoẻ hơn gần như tất cả: fitter than almost everyone else."}, {"q": "The more you exercise, the more energy you will have.", "options": ["If you exercise more, you will have more energy.", "You will have more energy if you exercise less.", "Exercising gives you less energy than resting.", "However much you exercise, your energy stays the same."], "answer": 0, "explain_vi": "the more …, the more … = càng … càng …: tập càng nhiều càng có sức → If you exercise more, you will have more energy."}, {"q": "There weren't enough doctors to treat all the injured fans.", "options": ["There were too few doctors to treat all the injured fans.", "There were too little doctors to treat all the injured fans.", "There were so many doctors that all the injured fans were treated.", "Not all the doctors were needed to treat the injured fans."], "answer": 0, "explain_vi": "not enough + danh từ đếm được = too few + danh từ. 'too little doctors' sai vì little chỉ đi với danh từ không đếm được."}, {"q": "The instructions were too complicated for the patients to follow.", "options": ["The instructions were complicated enough for the patients to follow.", "The instructions were so complicated that the patients couldn't follow them.", "Although the instructions were complicated, the patients followed them.", "The patients were such complicated that they couldn't follow the instructions."], "answer": 1, "explain_vi": "too … for sb to V = so … that sb couldn't V + them. Câu cuối sai vì such không đứng một mình trước tính từ."}, {"q": "My grandmother's health is not nearly as good as it used to be.", "options": ["My grandmother's health is slightly worse than it used to be.", "My grandmother's health is almost as good as it used to be.", "My grandmother's health is better than it used to be.", "My grandmother's health is much worse than it used to be."], "answer": 3, "explain_vi": "not nearly as good as = kém xa, tức là much worse. 'slightly worse' (hơi kém) sai mức độ; 'almost as good' là bẫy vì nearly ≈ almost."}]}, {"format": "transformation", "title_vi": "Viết lại câu", "intro_vi": "Câu viết lại khó trong đề Sở chuyên Anh thường kết hợp hai điểm: so sánh kép the more…, the more…, such với danh từ không đếm được, hoặc cụm động từ cùng enough. Đây là câu phân loại.", "tip_vi": "Mẹo: advice, information, news không đếm được nên không có a: such useful advice. Viết xong đọc lại cả câu, kiểm tra tân ngữ và thì.", "kind": "transform", "items": [{"q": "Phong recovered from his injury too slowly to play in the final.", "start": "Phong didn't get over", "answer": "his injury quickly enough to play in the final", "accept": ["his injury fast enough to play in the final"], "explain_vi": "recover from = get over. too slowly = not quickly enough; enough đứng sau trạng từ: quickly enough."}, {"q": "She is the most energetic person I have ever met.", "start": "I have never", "answer": "met such an energetic person", "accept": ["met such an energetic person before", "met a more energetic person", "met a more energetic person than her", "met anyone more energetic", "met anyone more energetic than her", "met anyone as energetic as her", "met anyone so energetic", "met a person as energetic as her", "met anyone as energetic as she is", "met anybody more energetic"], "explain_vi": "the most … I have ever met = I have never met such a(n) … / a more … person. Chú ý an trước energetic (nguyên âm)."}, {"q": "As my grandfather gets older, he finds it harder to walk long distances.", "start": "The older my grandfather gets,", "answer": "the harder he finds it to walk long distances", "accept": ["the more difficult he finds it to walk long distances", "the harder it is for him to walk long distances", "the more difficult it is for him to walk long distances"], "explain_vi": "So sánh kép (càng … càng …): The + so sánh hơn + S + V, the + so sánh hơn + S + V. Vế sau cũng cần the."}, {"q": "The doctor's advice was so useful that I followed it immediately.", "start": "The doctor gave me", "answer": "such useful advice that I followed it immediately", "accept": [], "explain_vi": "advice không đếm được nên dùng such + tính từ + danh từ, KHÔNG có a: such useful advice (không viết such a useful advice)."}, {"q": "In our club, no exercise is as tiring as the hill run.", "start": "The hill run is", "answer": "the most tiring exercise in our club", "accept": ["more tiring than any other exercise in our club", "the most tiring exercise of all in our club"], "explain_vi": "no … as tiring as X = X is the most tiring … hoặc more tiring than any other … (any other + danh từ số ít)."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Câu 1–2: viết dạng đúng của từ in hoa (từ phải đổi hai lần). Câu 3–4: viết tiếp câu mới sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d5H1", "q": "The doctor said that my grandfather's heart problems were caused by years of ______. (ACTIVE)", "answer": "inactivity", "accept": []}, {"id": "d5H2", "q": "Eating a heavy meal late at night can have some ______ effects on your sleep. (DESIRE)", "answer": "undesirable", "accept": []}, {"id": "d5H3", "q": "Nobody in the club works out as regularly as my uncle. → My uncle works out ______", "answer": "more regularly than anybody else in the club", "accept": ["more regularly than anyone else in the club", "more regularly than any other member of the club", "more regularly than any other club member"]}, {"id": "d5H4", "q": "The gym is too small for all the members to use at the same time. → The gym isn't ______", "answer": "big enough for all the members to use at the same time", "accept": ["large enough for all the members to use at the same time", "big enough for all members to use at the same time", "large enough for all members to use at the same time"]}, {"id": "d5H5", "q": "After a week in bed with flu, Hùng was still feeling a bit under the ______, so he didn't go to football practice.", "options": ["rain", "sky", "weather", "cloud"], "answer": "C"}, {"id": "d5H6", "q": "After his check-up, my dad decided to ______ a healthier lifestyle: no more fizzy drinks and no more late nights.", "options": ["adapt", "adopt", "accept", "adjust"], "answer": "B"}]}}, "6": {"grammar_games": {"sort": {"title_vi": "Chỗ trống cần mustn't, don't have to hay should? Xếp mỗi câu vào đúng nhóm.", "groups": [{"name": "mustn't (bị cấm)", "items": ["Visitors ___ touch the paintings. It's against the rules.", "You ___ cross the road when the light is red.", "You ___ feed the animals at the zoo."]}, {"name": "don't have to (không cần, không bắt buộc)", "items": ["It's Sunday, so I ___ get up early.", "The museum is free. You ___ buy a ticket.", "The hotel is near. We ___ take a taxi."]}, {"name": "should (nên – lời khuyên)", "items": ["It's very sunny. You ___ wear a hat.", "You look tired. You ___ have a rest.", "Hội An is beautiful. You ___ visit it."]}]}, "unjumble": [{"sentence": "Our flight was delayed, so we had to wait.", "hint_vi": "had to: quá khứ của have to / must"}, {"sentence": "You should buy a souvenir for your grandparents.", "hint_vi": "should + V: lời khuyên"}, {"sentence": "Passengers mustn't use their phones during take-off.", "hint_vi": "mustn't + V: cấm"}, {"sentence": "Will you be able to explore the old town tomorrow?", "hint_vi": "will be able to: 'có thể' ở tương lai"}, {"sentence": "You don't have to bring food on the journey.", "hint_vi": "don't have to: không cần"}], "truefalse": [{"s": "She can speaks three languages.", "ok": false, "fix": "She can speak three languages.", "why_vi": "Sau can là động từ nguyên thể, không chia: can speak."}, {"s": "Yesterday we must leave the hotel at 6 a.m.", "ok": false, "fix": "Yesterday we had to leave the hotel at 6 a.m.", "why_vi": "must không có dạng quá khứ; quá khứ dùng had to."}, {"s": "You don't have to bring a towel. The hotel gives you one.", "ok": true, "fix": "You don't have to bring a towel. The hotel gives you one.", "why_vi": "Khách sạn có sẵn khăn → không cần mang: don't have to."}, {"s": "You should to book your train tickets early.", "ok": false, "fix": "You should book your train tickets early.", "why_vi": "Sau should không dùng to: should book."}, {"s": "Drivers mustn't use their phones while they are driving.", "ok": true, "fix": "Drivers mustn't use their phones while they are driving.", "why_vi": "Luật cấm → mustn't + V."}, {"s": "After two hours, we were able to find the way back to our hotel.", "ok": true, "fix": "After two hours, we were able to find the way back to our hotel.", "why_vi": "Làm được việc khó trong một lần cụ thể ở quá khứ → was/were able to."}, {"s": "We mustn't go to school on Sunday because there are no lessons.", "ok": false, "fix": "We don't have to go to school on Sunday because there are no lessons.", "why_vi": "Không có tiết học → không cần đi (don't have to), chứ không phải bị cấm (mustn't)."}, {"s": "My cousin couldn't come to the party last weekend because she was ill.", "ok": true, "fix": "My cousin couldn't come to the party last weekend because she was ill.", "why_vi": "Không thể làm gì trong quá khứ → couldn't + V."}]}, "exam": [{"format": "cloze", "title_vi": "Điền từ vào đoạn văn", "intro_vi": "Đề Chuyên Ngoại ngữ có 8 câu điền từ vào đoạn văn, mỗi chỗ 4 lựa chọn; đề chung vào 10 cũng có dạng này. Chỗ trống kiểm tra từ vựng, ngữ pháp và dạng từ.", "tip_vi": "Mẹo: đọc lướt cả đoạn trước, rồi xét cả câu chứa chỗ trống: cần từ loại gì, có hợp nghĩa với câu trước và sau không.", "kind": "cloze_mcq", "text": "Last summer, my family went abroad for the first time. Our [1] was Singapore, a small but very modern country. On the day we left, there was a two-hour [2] at Nội Bài Airport because of bad weather, so we had to sit in a [3] waiting room with hundreds of other passengers. When we finally arrived, we were tired, but we couldn't wait to explore the city. Singapore has some strict rules. For example, passengers mustn't eat or drink on the trains, or they will [4] pay a big fine. Luckily, the trains are clean and fast, so we were [5] to visit many places in just four days. Before we flew home, I bought a small key ring as a souvenir for my best friend. I'm already looking forward to our next trip!", "items": [{"options": ["journey", "destination", "passenger", "souvenir"], "answer": 1, "explain_vi": "destination = điểm đến. Singapore là nơi cả nhà đến, không phải 'chuyến đi' (journey)."}, {"options": ["journey", "traffic", "delay", "destination"], "answer": 2, "explain_vi": "a two-hour delay = chậm trễ hai tiếng; có 'because of bad weather' và 'had to sit… waiting'."}, {"options": ["crowd", "crowded", "crowding", "crowdedly"], "answer": 1, "explain_vi": "Trước danh từ 'waiting room' cần tính từ: crowded (đông đúc). crowd là danh từ."}, {"options": ["must", "should", "can", "have to"], "answer": 3, "explain_vi": "Sau will không dùng must/should/can; tương lai của 'phải' là will have to."}, {"options": ["can", "able", "possible", "could"], "answer": 1, "explain_vi": "Cấu trúc was/were able to + V = đã có thể làm được. Không nói 'were can' hay 'were possible to'."}]}, {"format": "matching_headings", "title_vi": "Nối tiêu đề với đoạn văn", "intro_vi": "Phần đọc 25 câu của đề Sở chuyên Anh Hà Nội có thể có dạng nối tiêu đề với đoạn văn: mỗi đoạn một tiêu đề, luôn có tiêu đề thừa. Ở đây có 4 đoạn và 6 tiêu đề.", "tip_vi": "Mẹo: tìm ý chính của cả đoạn, chú ý từ nối However, but. Loại tiêu đề chỉ trùng một từ mà sai ý (đoạn nói dangerous, tiêu đề nói safe).", "kind": "matching", "paragraphs": ["Flying is the fastest way to travel between big cities. A flight from Hà Nội to Hồ Chí Minh City takes only about two hours. However, you have to arrive at the airport early, and flights are sometimes delayed by bad weather. Tickets can also be expensive before Tết, so you should book early.", "If you are not in a hurry, the train is a great choice. The journey is slow, but you can walk around, sleep in a comfortable bed and enjoy beautiful views of rice fields, mountains and the sea. Many travellers say the train ride is part of the holiday, not just a way to get there.", "Some young travellers prefer to explore the countryside by motorbike. They can stop wherever they like and visit small villages that buses never reach. But riding on mountain roads can be dangerous. Riders must always wear a helmet, and they shouldn't travel alone in case they have an accident.", "Sleeper buses are the cheapest way to travel long distances. Passengers lie on narrow beds, and the bus travels through the night, so you don't have to pay for a hotel. However, the buses are often crowded, and tall people may find the beds too short to sleep comfortably."], "headings": ["Save money while you sleep", "A safe way to see small villages", "Fast, but not always on time", "Why trains are faster than planes", "Freedom, but with some danger", "Enjoy the journey, not just the destination"], "answer": [2, 5, 4, 0], "explain_vi": "Đoạn 1: nhanh nhất nhưng có thể delayed. Đoạn 2: chậm nhưng được ngắm cảnh. Đoạn 3: tự do nhưng dangerous. Đoạn 4: rẻ nhất, khỏi trả tiền khách sạn."}], "exam_easy": [{"format": "cloze", "title_vi": "Điền từ vào đoạn văn", "intro_vi": "Đề Chuyên Ngoại ngữ và đề chung vào 10 có bài đọc đoạn văn, mỗi chỗ trống chọn 1 trong 4 từ. Bản này đoạn văn ngắn, câu đơn giản, các lựa chọn khác nghĩa rõ ràng.", "tip_vi": "Mẹo: đọc cả câu có chỗ trống và câu ngay sau nó. Thử đặt từng lựa chọn vào rồi đọc to: câu nào nghe hợp nghĩa nhất?", "kind": "cloze_mcq", "text": "Last summer, my family took a trip to Cát Bà Island. We [1] off very early in the morning to catch the boat. The boat was slow, but the sea was calm and blue. There were many [2] on the boat, and some of them were tourists from Korea. When we arrived, we [3] to wait for a bus because our hotel was far from the port. On the second day, we went for a walk in the national park. My dad said that we [4] stay on the path because it is easy to get lost there. In the evening, we went to the night market. I bought a T-shirt as a [5] for my best friend, Mai. It was a wonderful trip, and I want to go back next year.", "items": [{"options": ["set", "kept", "did", "put"], "answer": 0, "explain_vi": "set off = khởi hành, lên đường. Cả nhà lên đường từ sáng sớm để kịp chuyến tàu thuỷ."}, {"options": ["passengers", "souvenirs", "journeys", "destinations"], "answer": 0, "explain_vi": "passengers = hành khách. Câu sau nói 'some of them were tourists', nên chỗ trống là người đi trên tàu."}, {"options": ["must", "had", "should", "can"], "answer": 1, "explain_vi": "Sau chỗ trống có 'to wait', nên cần had to (đã phải). must, should, can không đi với to."}, {"options": ["should", "don't have to", "can't", "mustn't"], "answer": 0, "explain_vi": "Bố khuyên đi đúng đường mòn vì dễ bị lạc → should (nên). mustn't và can't nghĩa là không được đi trên đường mòn, ngược ý."}, {"options": ["passenger", "souvenir", "ticket", "journey"], "answer": 1, "explain_vi": "a souvenir = quà lưu niệm. Mua áo làm quà cho bạn thân sau chuyến đi."}]}, {"format": "matching_headings", "title_vi": "Nối tiêu đề với đoạn văn", "intro_vi": "Đề Sở chuyên Anh Hà Nội có thể có bài nối tiêu đề với đoạn văn, luôn có tiêu đề thừa. Bản này có 4 đoạn ngắn, mỗi đoạn một bạn kể về cách đi lại, và 6 tiêu đề.", "tip_vi": "Mẹo: đọc từng đoạn, tự hỏi 'Bạn này nói về phương tiện gì? Thích hay không thích điều gì?' rồi tìm tiêu đề có cùng ý.", "kind": "matching", "paragraphs": ["I go to school by bus every day. The bus is cheap, and I can read a book on the way. But in the morning the bus is often very crowded, and I have to stand. Sometimes I can't find a seat for the whole journey.", "I ride my bike to school. It is good exercise, and it doesn't make the air dirty. I don't have to wait for anybody. When it rains, I have to wear a raincoat, but I still love cycling every day.", "Last year I travelled to another country for the first time. We flew to Singapore. The plane was very fast, and the journey took only three hours. The flight attendants gave us food and drinks. I looked out of the window and saw the clouds below us.", "My grandparents live in Huế, so we often visit them by train. The trip is long, but I can sleep in a bed and walk around. I like to watch the rice fields and the sea from the window. It is my favourite way to travel."], "headings": ["Good for my body and the air", "Lost at the airport", "Cheap but full of people", "A long ride with nice views", "The fastest way to get to school", "My first flight to another country"], "answer": [2, 0, 5, 3], "explain_vi": "Đoạn 1: xe buýt rẻ nhưng đông (crowded). Đoạn 2: xe đạp tốt cho sức khoẻ, không làm bẩn không khí. Đoạn 3: lần đầu đi máy bay ra nước ngoài. Đoạn 4: tàu chậm nhưng cảnh đẹp."}], "exam_plus": [{"format": "cloze", "title_vi": "Điền từ vào đoạn văn", "intro_vi": "Trong đề Chuyên Ngoại ngữ, câu phân loại của bài điền từ thường hỏi từ gần nghĩa (trip/travel/voyage), cụm động từ và collocation như make the best of. Bản này luyện đúng kiểu đó.", "tip_vi": "Mẹo: khi 4 lựa chọn gần nghĩa, xét từ đi kèm ngay sau chỗ trống (giới từ, to V, danh từ) và loại từ không kết hợp được.", "kind": "cloze_mcq", "text": "Travelling abroad on a tight budget is not as difficult as many people think. Last summer, my cousin Linh spent three weeks backpacking around Thailand and Malaysia, and the whole [1] cost her less than a new phone. Her secret was careful planning. She booked her flights months in advance, and instead of staying in hotels, she slept in cheap hostels, where she [2] friends with travellers from all over the world. Of course, not everything went smoothly. On her way to Penang, her train was [3] up by a landslide, and she had to spend a night at a tiny station in the middle of nowhere. Her phone battery was almost dead, but she was [4] to borrow a charger from another passenger and call her parents. Linh says the experience taught her to stay calm and [5] the best of every situation. Now she is already saving up for her next adventure.", "items": [{"options": ["travel", "voyage", "trip", "excursion"], "answer": 2, "explain_vi": "the whole trip = cả chuyến đi. travel là danh từ không đếm được, voyage là chuyến đi biển dài, excursion là chuyến tham quan ngắn trong ngày."}, {"options": ["did", "made", "got", "took"], "answer": 1, "explain_vi": "Collocation: make friends (with sb) = kết bạn. Không nói do/get/take friends."}, {"options": ["held", "put", "kept", "set"], "answer": 0, "explain_vi": "be held up = bị chậm trễ, bị kẹt lại (đồng nghĩa delayed). put up, kept up, set up không mang nghĩa này."}, {"options": ["able", "capable", "possible", "succeeded"], "answer": 0, "explain_vi": "was able to + V = đã làm được. capable đi với of + V-ing; possible không dùng cho chủ ngữ chỉ người; succeed đi với in."}, {"options": ["make", "do", "take", "have"], "answer": 0, "explain_vi": "Thành ngữ make the best of sth = cố tận dụng tốt nhất một hoàn cảnh không thuận lợi."}]}, {"format": "matching_headings", "title_vi": "Nối tiêu đề với đoạn văn", "intro_vi": "Trong đề Sở chuyên Anh, câu nối tiêu đề khó thường có tiêu đề thừa dùng lại từ khoá của đoạn nhưng sai ý chính. Bản này có 4 đoạn mức B2 và 2 tiêu đề bẫy như vậy.", "tip_vi": "Mẹo: tìm câu chủ đề và các từ đổi hướng (In reality, Rather than). Cẩn thận với tiêu đề lặp đúng một từ trong đoạn nhưng nói điều ngược lại.", "kind": "matching", "paragraphs": ["Many travellers assume that booking everything at the last minute will save them money. In reality, the opposite is usually true. Airlines raise their prices as the departure date approaches, and the best rooms are often taken weeks in advance, especially during public holidays such as Tết.", "Packing light is an art. Experienced backpackers rarely carry more than seven kilograms, which means they can avoid baggage fees and move freely on crowded buses. Instead of bringing a different outfit for every day, they choose a few clothes that can be mixed, matched and washed easily.", "Delays are an unavoidable part of travel, but how you react to them makes a huge difference. Rather than getting angry with airline staff, who are rarely responsible, use the extra time to explore the airport, catch up on your reading or simply rest before the journey continues.", "Respecting local customs is just as important as visiting famous sights. In many temples, visitors must cover their shoulders and knees, and they are not supposed to point their feet at statues. A little research before you set off can save you from embarrassing mistakes."], "headings": ["How to complain about flight delays successfully", "Why less luggage means more freedom", "Doing your homework on local traditions", "The hidden cost of waiting too long", "Famous temples every tourist must see", "Making the most of unexpected waits"], "answer": [3, 1, 5, 2], "explain_vi": "Đoạn 1: đặt vé sát ngày lại đắt hơn. Đoạn 2: hành lý gọn thì tự do hơn. Đoạn 3: tận dụng thời gian chờ, không phàn nàn. Đoạn 4: tìm hiểu phong tục trước khi đi."}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Câu 1–2: viết dạng đúng của từ in hoa (thêm cả tiền tố và hậu tố). Câu 3–4: viết tiếp câu mới sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d6H1", "q": "In winter, the mountain village is almost ______ because heavy snow often blocks the only road. (ACCESS)", "answer": "inaccessible", "accept": []}, {"id": "d6H2", "q": "Climbers must be well prepared, as the weather on Fansipan can be extremely ______. (PREDICT)", "answer": "unpredictable", "accept": []}, {"id": "d6H3", "q": "We booked our train tickets in advance, but it wasn't necessary because the train was half empty. → We needn't ______", "answer": "have booked our train tickets in advance", "accept": ["have booked our tickets in advance", "have booked the train tickets in advance", "have booked them in advance"]}, {"id": "d6H4", "q": "The pilot succeeded in landing the plane safely despite the strong wind. → Although the wind was strong, the pilot was ______", "answer": "able to land the plane safely", "accept": ["able to land it safely", "successful in landing the plane safely"]}, {"id": "d6H5", "q": "We'd better ______ before dawn if we want to reach the top of the mountain by lunchtime.", "options": ["set up", "set back", "set in", "set out"], "answer": "D"}, {"id": "d6H6", "q": "Travelling around Southeast Asia with her grandparents was a once-in-a-______ experience for my cousin.", "options": ["life", "lifetime", "living", "lifestyle"], "answer": "B"}]}}, "7": {"grammar_games": {"sort": {"title_vi": "Xếp mỗi câu vào đúng thì (ôn buổi 2–4)", "groups": [{"name": "Past continuous", "items": ["At 9 p.m. yesterday, we were watching TV.", "While Dad was cooking, I was reading.", "They were waiting for the bus."]}, {"name": "Present perfect", "items": ["I have already finished my project.", "She has been abroad twice.", "We haven't eaten lunch yet."]}, {"name": "Future (will / be going to / present continuous)", "items": ["We're going to visit Hue next summer.", "I think robots will do our housework one day.", "I'm meeting Lan at 5 p.m. tomorrow."]}]}, "unjumble": [{"sentence": "We were having dinner when the power went off.", "hint_vi": "Quá khứ tiếp diễn + when + quá khứ đơn (buổi 2)"}, {"sentence": "Have you ever travelled abroad with your family?", "hint_vi": "Hiện tại hoàn thành với ever (buổi 3)"}, {"sentence": "I'm going to take up the guitar next month.", "hint_vi": "be going to: dự định có từ trước (buổi 4)"}, {"sentence": "It was such a boring film that I fell asleep.", "hint_vi": "such + a + tính từ + danh từ + that (buổi 5)"}, {"sentence": "You don't have to bring your own lunch.", "hint_vi": "don't have to = không cần phải (buổi 6)"}], "truefalse": [{"s": "She is owning two cats and a dog.", "ok": false, "fix": "She owns two cats and a dog.", "why_vi": "own là động từ trạng thái, không chia -ing (buổi 1)."}, {"s": "I was doing my homework when my friend called.", "ok": true, "fix": "I was doing my homework when my friend called.", "why_vi": "Việc đang diễn ra (was doing) bị việc khác xen vào (called) (buổi 2)."}, {"s": "We have moved to Hanoi in 2019.", "ok": false, "fix": "We moved to Hanoi in 2019.", "why_vi": "Có mốc thời gian xác định (in 2019) → quá khứ đơn (buổi 3)."}, {"s": "I'm sure you will pass the test.", "ok": true, "fix": "I'm sure you will pass the test.", "why_vi": "Dự đoán theo ý kiến cá nhân (I'm sure) → will + V (buổi 4)."}, {"s": "Hoa is more taller than her sister.", "ok": false, "fix": "Hoa is taller than her sister.", "why_vi": "Tính từ ngắn chỉ thêm -er, không dùng thêm more (buổi 5)."}, {"s": "You mustn't use your phone during the exam.", "ok": true, "fix": "You mustn't use your phone during the exam.", "why_vi": "mustn't + V = bị cấm (buổi 6)."}, {"s": "This is the most interesting book I have ever read.", "ok": true, "fix": "This is the most interesting book I have ever read.", "why_vi": "So sánh nhất của tính từ dài (the most) + hiện tại hoàn thành với ever."}, {"s": "He is enough old to drive a car.", "ok": false, "fix": "He is old enough to drive a car.", "why_vi": "enough đứng SAU tính từ: old enough to V (buổi 5)."}]}, "exam": [{"format": "mixed", "title_vi": "Đề thi thu nhỏ", "intro_vi": "Đề thật trộn nhiều dạng: đề Chuyên Ngoại ngữ có 60 câu trắc nghiệm, đề chung có ngữ âm, trọng âm, hội thoại, viết lại câu. Bài này gồm 10 câu trộn các dạng của buổi 1–6.", "tip_vi": "Đọc nhãn [ ] để biết dạng bài trước. Câu nào chưa chắc thì làm câu khác trước rồi quay lại.", "kind": "mcq", "items": [{"format": "sentence_completion", "q": "[Hoàn thành câu] Phong ______ on his maths homework at the moment, so please don't disturb him.", "options": ["concentrates", "is concentrating", "concentrated", "has concentrated"], "answer": 1, "explain_vi": "'at the moment' → hiện tại tiếp diễn (buổi 1)."}, {"format": "pronunciation", "q": "[Phát âm] Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["devic[[es]]", "souvenir[[s]]", "journey[[s]]", "passenger[[s]]"], "answer": 0, "explain_vi": "device tận cùng bằng âm /s/ nên devices đọc /ɪz/; ba từ kia đọc /z/."}, {"format": "stress", "q": "[Trọng âm] Chọn từ có trọng âm khác các từ còn lại.", "options": ["habit", "diet", "journey", "explore"], "answer": 3, "explain_vi": "explore /ɪkˈsplɔː/ là động từ, nhấn âm 2; habit, diet, journey là danh từ nhấn âm 1."}, {"format": "synonym", "q": "[Đồng nghĩa] Our flight to Da Nang was DELAYED because of the heavy storm.", "options": ["held up", "cancelled", "crowded", "booked"], "answer": 0, "explain_vi": "delayed (bị hoãn, đến muộn) ≈ held up. 'cancelled' là bị huỷ hẳn, khác nghĩa."}, {"format": "antonym", "q": "[Trái nghĩa] This street is always CROWDED on Saturday evenings.", "options": ["empty", "busy", "full", "noisy"], "answer": 0, "explain_vi": "crowded (đông đúc) >< empty (vắng). busy, full gần nghĩa với crowded nên là bẫy."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: I've had a headache all morning.\nB: ______", "options": ["You should lie down for a while.", "Congratulations!", "Yes, please. I'd love to.", "It doesn't matter."], "answer": 0, "explain_vi": "Bạn bị đau đầu → đưa lời khuyên với should (buổi 6)."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: Would you like to come to my birthday party on Sunday?\nB: ______", "options": ["I'd love to. What time does it start?", "Yes, I do.", "No, I wouldn't like.", "I'm going to have a party."], "answer": 0, "explain_vi": "Nhận lời mời 'Would you like to…?' → I'd love to. 'Yes, I do' không hợp với câu hỏi Would."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] I started learning English five years ago.", "options": ["I have learnt English for five years.", "I learnt English five years ago.", "I haven't learnt English for five years.", "I have learnt English since five years."], "answer": 0, "explain_vi": "started … ago = have + V3 + for + khoảng thời gian (buổi 3). 'since five years' sai."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] The bag was so heavy that Lan couldn't carry it.", "options": ["The bag was too heavy for Lan to carry.", "The bag was heavy enough for Lan to carry.", "Lan was strong enough to carry the bag.", "It was such heavy bag that Lan couldn't carry it."], "answer": 0, "explain_vi": "so … that … couldn't = too … for sb to V (buổi 5). Câu cuối thiếu 'a'."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] My dad used to smoke, but he ______ it up three years ago.", "options": ["gave", "took", "set", "dropped"], "answer": 0, "explain_vi": "give up = từ bỏ thói quen (buổi 2); 'three years ago' → quá khứ đơn gave."}]}], "exam_easy": [{"format": "mixed", "title_vi": "Đề thi thu nhỏ", "intro_vi": "Đề thi thật trộn nhiều dạng bài trong cùng một đề. Bài này có 10 câu ngắn trộn các dạng của buổi 1–6: hoàn thành câu, phát âm, trọng âm, đồng nghĩa, trái nghĩa, hội thoại, câu gần nghĩa.", "tip_vi": "Mẹo: đọc nhãn [ ] để biết dạng bài. Tìm từ gợi ý thời gian (now, ago, for) trước khi chọn. Câu khó thì làm sau.", "kind": "mcq", "items": [{"format": "sentence_completion", "q": "[Hoàn thành câu] Listen! My sister ______ the piano in her room.", "options": ["plays", "is playing", "played", "has played"], "answer": 1, "explain_vi": "'Listen!' cho biết việc đang xảy ra ngay lúc nói → hiện tại tiếp diễn: is playing (buổi 1)."}, {"format": "pronunciation", "q": "[Phát âm] Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["pen[[s]]", "bag[[s]]", "book[[s]]", "chair[[s]]"], "answer": 2, "explain_vi": "book tận cùng bằng âm /k/ (âm vô thanh) nên books đọc /s/. pens, bags, chairs đọc /z/ (buổi 1)."}, {"format": "stress", "q": "[Trọng âm] Chọn từ có trọng âm khác các từ còn lại.", "options": ["teacher", "hotel", "happy", "table"], "answer": 1, "explain_vi": "hotel /həʊˈtel/ nhấn âm 2. teacher, happy, table đều nhấn âm 1 (buổi 2)."}, {"format": "synonym", "q": "[Đồng nghĩa] After school, I usually RELAX by listening to music.", "options": ["rest", "study", "run", "shout"], "answer": 0, "explain_vi": "relax = thư giãn, nghỉ ngơi ≈ rest. study (học), run (chạy), shout (hét) khác nghĩa hẳn (buổi 2)."}, {"format": "antonym", "q": "[Trái nghĩa] Plastic bags are HARMFUL to sea animals.", "options": ["dangerous", "harmless", "bad", "heavy"], "answer": 1, "explain_vi": "harmful (có hại) >< harmless (vô hại). dangerous và bad gần nghĩa với harmful nên không phải đáp án (buổi 3)."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: Excuse me, can I take photos in the museum?\nB: ______", "options": ["Yes, I took them.", "No, I don't like photos.", "Sorry, you can't. Look at the sign.", "Here are your photos."], "answer": 2, "explain_vi": "A xin phép chụp ảnh → B trả lời cho phép hay không: Sorry, you can't (không được). Các câu khác không trả lời câu hỏi (buổi 6)."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: What are you going to do this weekend?\nB: ______", "options": ["I'm going to visit my grandparents.", "I visited my grandparents.", "I visit my grandparents every day.", "Yes, I am."], "answer": 0, "explain_vi": "Câu hỏi về dự định cuối tuần này (be going to) → trả lời bằng be going to. 'Yes, I am' không trả lời câu hỏi What (buổi 4)."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] My brother is older than me.", "options": ["I am older than my brother.", "My brother is younger than me.", "I am younger than my brother.", "My brother and I are the same age."], "answer": 2, "explain_vi": "Anh trai lớn tuổi hơn em → em nhỏ tuổi hơn anh: I am younger than my brother (buổi 5)."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] I have lived in Hà Nội for three years.", "options": ["I lived in Hà Nội three years ago.", "I moved to Hà Nội three years ago.", "I will live in Hà Nội for three years.", "I have never lived in Hà Nội."], "answer": 1, "explain_vi": "Sống ở Hà Nội được 3 năm (đến nay vẫn sống) → chuyển đến Hà Nội cách đây 3 năm: moved … three years ago (buổi 3)."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] Please ______ off the lights when you leave the room.", "options": ["switch", "give", "take", "drop"], "answer": 0, "explain_vi": "switch off = tắt (đèn, máy móc). give off, take off, drop off không có nghĩa tắt đèn (buổi 4)."}]}], "exam_plus": [{"format": "mixed", "title_vi": "Đề thi thu nhỏ", "intro_vi": "Đề Chuyên Ngoại ngữ có 60 câu trắc nghiệm trộn nhiều dạng; các câu phân loại thường gài bẫy ở động từ trạng thái, Do you mind…?, từ gần nghĩa. Bài này có 10 câu như vậy, ôn buổi 1–6.", "tip_vi": "Mẹo: với câu khó, loại trước phương án sai ngữ pháp, rồi so sắc thái nghĩa của hai phương án còn lại. Đừng chọn chỉ vì thấy từ quen.", "kind": "mcq", "items": [{"format": "sentence_completion", "q": "[Hoàn thành câu] This soup ______ delicious. Can I have some more?", "options": ["is tasting", "tastes", "has tasted", "was tasting"], "answer": 1, "explain_vi": "taste ở đây là động từ chỉ trạng thái (có vị), không dùng tiếp diễn → tastes. 'is tasting' chỉ dùng khi ai đó đang nếm thử (buổi 1)."}, {"format": "pronunciation", "q": "[Phát âm] Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "options": ["month[[s]]", "breath[[s]]", "breathe[[s]]", "laugh[[s]]"], "answer": 2, "explain_vi": "breathe tận cùng âm /ð/ (hữu thanh) nên breathes đọc /z/. months, breaths (/θ/), laughs (/f/) đọc /s/ (buổi 1)."}, {"format": "stress", "q": "[Trọng âm] Chọn từ có trọng âm khác các từ còn lại.", "options": ["concentrate", "recycle", "assignment", "pollution"], "answer": 0, "explain_vi": "concentrate /ˈkɒnsntreɪt/ nhấn âm 1 (nhưng concentration nhấn âm 3). recycle, assignment, pollution nhấn âm 2."}, {"format": "synonym", "q": "[Đồng nghĩa] After failing three times, Tuấn almost GAVE UP learning the guitar, but his teacher encouraged him to keep trying.", "options": ["took up", "cut down on", "put off", "quit"], "answer": 3, "explain_vi": "give up = quit (từ bỏ). put off là hoãn lại, cut down on là giảm bớt, took up là bắt đầu: đều lệch nghĩa (buổi 2)."}, {"format": "antonym", "q": "[Trái nghĩa] The museum guide was so ENTHUSIASTIC that even the youngest visitors listened carefully.", "options": ["energetic", "indifferent", "eager", "talkative"], "answer": 1, "explain_vi": "enthusiastic (nhiệt tình, hăng hái) >< indifferent (thờ ơ). eager và energetic gần nghĩa, talkative (nói nhiều) không trái nghĩa (buổi 2)."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: I'm sorry I couldn't make it to your party last night.\nB: ______", "options": ["Never mind. Maybe next time.", "Not at all. I'd love to.", "You're welcome to make it.", "That's very kind of you."], "answer": 0, "explain_vi": "Đáp lại lời xin lỗi vì vắng mặt → Never mind (không sao đâu). 'Not at all. I'd love to' dùng để nhận lời mời."}, {"format": "dialogue_completion", "q": "[Hội thoại] A: Do you mind if I switch off the air conditioner?\nB: ______", "options": ["Yes, please do.", "Not at all. Go ahead.", "No, I mind it.", "Never mind."], "answer": 1, "explain_vi": "Do you mind…? = bạn có phiền không. Đồng ý thì nói Not at all (không phiền). 'Yes, please do' mâu thuẫn: Yes nghĩa là có phiền (buổi 4)."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] It's ages since I last went cycling.", "options": ["I went cycling for ages.", "I have been cycling for ages.", "It took me ages to go cycling.", "I haven't been cycling for ages."], "answer": 3, "explain_vi": "It's ages since I last + V2 = I haven't + V3 + for ages: đã lâu rồi chưa đi xe đạp (buổi 3)."}, {"format": "closest_meaning", "q": "[Câu gần nghĩa] Hoa didn't use to enjoy cooking, but now she loves it.", "options": ["Hoa has always loved cooking.", "Hoa enjoys cooking more now than she used to.", "Hoa enjoyed cooking more in the past than she does now.", "Hoa no longer enjoys cooking."], "answer": 1, "explain_vi": "Trước đây không thích, giờ rất thích → bây giờ thích nấu ăn hơn trước: more now than she used to (buổi 2 và 5)."}, {"format": "sentence_completion", "q": "[Hoàn thành câu] Minh ______ a lot of progress in English since he started reading graded readers.", "options": ["has done", "made", "has made", "did"], "answer": 2, "explain_vi": "since + mốc quá khứ → hiện tại hoàn thành; collocation make progress (tiến bộ), không dùng do → has made (buổi 1 và 3)."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Ôn buổi 1–6. Câu 1–2: viết dạng đúng của từ in hoa (từ phải đổi hai lần). Câu 3–4: viết tiếp câu mới sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d7H1", "q": "Many parents worry that their children waste hours on ______ activities such as scrolling through social media. (PRODUCT)", "answer": "unproductive", "accept": []}, {"id": "d7H2", "q": "Our school canteen has switched to paper straws and other ______ friendly products. (ENVIRONMENT)", "answer": "environmentally", "accept": []}, {"id": "d7H3", "q": "I last saw my cousin when she moved to Australia two years ago. → I haven't ______", "answer": "seen my cousin since she moved to Australia two years ago", "accept": ["seen my cousin since she moved to Australia", "seen her since she moved to Australia two years ago", "seen her since she moved to Australia", "seen my cousin for two years"]}, {"id": "d7H4", "q": "My town is much noisier now than it was in the past. → My town didn't ______", "answer": "use to be so noisy", "accept": ["use to be as noisy", "use to be this noisy", "use to be as noisy as it is now", "use to be so noisy as it is now"]}, {"id": "d7H5", "q": "If you keep ______ your revision until the night before the test, you won't remember everything.", "options": ["setting off", "taking off", "putting off", "giving off"], "answer": "C"}, {"id": "d7H6", "q": "Studying abroad for a year really ______ my horizons; I learnt to see things from many different points of view.", "options": ["enlarged", "broadened", "lengthened", "increased"], "answer": "B"}]}}, "8": {"grammar_games": {"sort": {"title_vi": "Xếp mỗi câu vào đúng nhóm: bị động hiện tại đơn, bị động quá khứ đơn hay câu chủ động", "groups": [{"name": "Present simple passive", "items": ["Coffee is grown in the Central Highlands.", "These cartoons are watched by millions of kids.", "The school gate is locked at 6 p.m."]}, {"name": "Past simple passive", "items": ["The film was made in South Korea.", "Two new libraries were opened last year.", "My phone was stolen on the bus."]}, {"name": "Active voice", "items": ["The reporter interviewed our head teacher.", "Millions of people watch this show.", "My mum writes articles for a magazine."]}]}, "unjumble": [{"sentence": "Most football matches are broadcast live on this channel.", "hint_vi": "Bị động hiện tại đơn: are + V3 (broadcast – broadcast – broadcast)."}, {"sentence": "This article was written by a famous journalist.", "hint_vi": "Bị động quá khứ đơn có 'by + người làm'."}, {"sentence": "Was this video made by your classmates?", "hint_vi": "Câu hỏi bị động quá khứ: Was + chủ ngữ + V3 + by...?"}, {"sentence": "Mobile phones are not allowed in the exam room.", "hint_vi": "Phủ định bị động hiện tại: are not + V3."}, {"sentence": "The concert wasn't broadcast live because of the storm.", "hint_vi": "Phủ định bị động quá khứ: wasn't + V3."}], "truefalse": [{"s": "The magazine is publish every month.", "ok": false, "fix": "The magazine is published every month.", "why_vi": "Bị động cần be + V3: is published, không phải is publish."}, {"s": "My bike was repaired by my dad yesterday.", "ok": true, "fix": "My bike was repaired by my dad yesterday.", "why_vi": "Đúng: 'yesterday' → quá khứ; chủ ngữ số ít → was + V3."}, {"s": "The prizes gave to the best students last Friday.", "ok": false, "fix": "The prizes were given to the best students last Friday.", "why_vi": "Giải thưởng không tự trao → bị động; chủ ngữ số nhiều, quá khứ → were given."}, {"s": "These cakes are made by my grandmother.", "ok": true, "fix": "These cakes are made by my grandmother.", "why_vi": "Đúng: chủ ngữ số nhiều → are + V3 (made)."}, {"s": "Long Biên Bridge was build in 1902.", "ok": false, "fix": "Long Biên Bridge was built in 1902.", "why_vi": "V3 của build là built (build – built – built)."}, {"s": "Is breakfast served at 7 a.m. in this hotel?", "ok": true, "fix": "Is breakfast served at 7 a.m. in this hotel?", "why_vi": "Đúng: câu hỏi bị động hiện tại đơn, đưa 'is' lên đầu câu."}, {"s": "These shoes was made in Việt Nam.", "ok": false, "fix": "These shoes were made in Việt Nam.", "why_vi": "'These shoes' số nhiều → were, không dùng was."}, {"s": "The posters weren't printed on time.", "ok": true, "fix": "The posters weren't printed on time.", "why_vi": "Đúng: phủ định bị động quá khứ, số nhiều → weren't + V3."}]}, "exam": [{"format": "sentence_completion", "title_vi": "Hoàn thành câu", "intro_vi": "Đề Chuyên Ngoại ngữ có 10 câu hoàn thành câu (chọn A, B, C, D); phần Ngôn ngữ của đề Sở cũng có nhiều câu như vậy, kiểm tra ngữ pháp, từ vựng, cụm cố định như make/do.", "tip_vi": "Mẹo: đọc cả câu, tìm dấu hiệu (thời gian, chủ ngữ là người hay vật) rồi mới nhìn đáp án. Cụm make/do thì phải học thuộc.", "kind": "mcq", "items": [{"q": "Please don't ______ any noise in the studio – the show is broadcast live.", "options": ["do", "make", "give", "take"], "answer": 1, "explain_vi": "Cụm cố định: make (a) noise = gây ồn. Không nói 'do noise'."}, {"q": "Don't worry about winning the contest. Just ______ your best.", "options": ["make", "take", "do", "give"], "answer": 2, "explain_vi": "Cụm cố định: do your best = cố gắng hết sức."}, {"q": "The first Vietnamese-language newspaper, Gia Định báo, ______ in 1865.", "options": ["published", "was published", "is published", "has published"], "answer": 1, "explain_vi": "Tờ báo được xuất bản (bị động), mốc 1865 là quá khứ → was published."}, {"q": "Nguyễn Nhật Ánh's novel 'Mắt biếc' ______ into a film in 2019.", "options": ["made", "has made", "is made", "was made"], "answer": 3, "explain_vi": "Cuốn tiểu thuyết được chuyển thể thành phim (bị động), năm 2019 → was made into a film."}, {"q": "I only read news on ______ websites that always check their facts.", "options": ["creative", "reliable", "attractive", "expensive"], "answer": 1, "explain_vi": "reliable = đáng tin cậy; trang web luôn kiểm tra thông tin thì đáng tin."}]}, {"format": "error_id", "title_vi": "Tìm lỗi sai", "intro_vi": "Đề chung vào lớp 10 thường có vài câu tìm lỗi sai: mỗi câu có 4 phần gạch chân A, B, C, D, em chọn phần sai. Lỗi hay gặp: thì, bị động, hoà hợp chủ ngữ – động từ.", "tip_vi": "Mẹo: tìm động từ chính trước. Hỏi: chủ ngữ số ít hay nhiều? Chủ ngữ tự làm hay được làm? Đúng dạng V3 chưa?", "kind": "mcq", "items": [{"q": "These advertisements are design to make children want more toys.", "options": ["advertisements", "are design", "to make", "more toys"], "answer": 1, "explain_vi": "Bị động cần V3: are designed (được thiết kế), không phải are design."}, {"q": "The article was wrote by a student who came across the story online.", "options": ["was wrote", "a student", "came across", "online"], "answer": 0, "explain_vi": "V3 của write là written → was written. 'wrote' là quá khứ đơn, không dùng sau 'was'."}, {"q": "My sister always does a lot of mistakes when she types messages quickly.", "options": ["always", "does", "when she types", "quickly"], "answer": 1, "explain_vi": "Cụm cố định: make a mistake (mắc lỗi) → makes. Không nói 'do mistakes'."}, {"q": "In my opinion, this website is more reliable than that one because its news are checked carefully.", "options": ["In my opinion", "more reliable", "news are", "carefully"], "answer": 2, "explain_vi": "'news' là danh từ không đếm được, đi với động từ số ít → its news is checked."}, {"q": "Last weekend, two football matches was broadcast live on VTV.", "options": ["Last weekend", "football matches", "was broadcast", "on VTV"], "answer": 2, "explain_vi": "Chủ ngữ 'two football matches' số nhiều → were broadcast, không dùng was."}]}], "exam_easy": [{"format": "sentence_completion", "title_vi": "Hoàn thành câu", "intro_vi": "Đề Chuyên Ngoại ngữ và đề Sở có nhiều câu hoàn thành câu: chọn 1 trong 4 đáp án A, B, C, D. Bản này câu ngắn, luyện make/do, câu bị động và từ mới về truyền thông.", "tip_vi": "Mẹo: tự hỏi chủ ngữ tự làm hay được làm? Được làm thì dùng be + V3. Cụm make/do thì học thuộc: do homework, make a cake.", "kind": "mcq", "items": [{"q": "I always ______ my homework before dinner.", "options": ["make", "do", "play", "go"], "answer": 1, "explain_vi": "Cụm cố định: do homework = làm bài tập về nhà. Không nói make homework."}, {"q": "My mum ______ a cake for my birthday every year.", "options": ["makes", "does", "plays", "goes"], "answer": 0, "explain_vi": "make a cake = làm bánh (tạo ra một thứ mới). 'does a cake' sai cụm từ."}, {"q": "English ______ at my school from Grade 1.", "options": ["teaches", "taught", "is taught", "is teaching"], "answer": 2, "explain_vi": "Môn tiếng Anh không tự dạy được, nó được dạy → bị động hiện tại đơn: is + V3 (taught)."}, {"q": "The football match ______ on TV last night.", "options": ["shows", "is shown", "showed", "was shown"], "answer": 3, "explain_vi": "Trận đấu được chiếu (bị động), 'last night' là quá khứ → was + V3: was shown."}, {"q": "We watch the news on TV to ______ out what is happening in the world.", "options": ["give", "find", "make", "take"], "answer": 1, "explain_vi": "find out = tìm hiểu, biết được (thông tin). Xem thời sự để biết chuyện gì đang xảy ra."}]}, {"format": "error_id", "title_vi": "Tìm lỗi sai", "intro_vi": "Đề chung vào lớp 10 có câu tìm lỗi sai: 4 phần gạch chân A, B, C, D, chỉ một phần sai. Bản này câu ngắn, mỗi câu một lỗi dễ thấy về bị động, make/do hoặc danh từ.", "tip_vi": "Mẹo: tìm động từ trước. Sau was/were/is/are phải là V3 (written, played). Chủ ngữ số nhiều đi với are/were.", "kind": "mcq", "items": [{"q": "This book was write by a famous Vietnamese writer.", "options": ["This book", "was write", "a famous", "writer"], "answer": 1, "explain_vi": "Câu bị động cần be + V3. V3 của write là written → was written, không viết was write."}, {"q": "Every day, a lot of letters is sent to the TV station.", "options": ["Every day", "a lot of", "is sent", "the TV station"], "answer": 2, "explain_vi": "Chủ ngữ 'a lot of letters' là số nhiều → are sent, không dùng is sent."}, {"q": "My little brother always does a big mess when he cooks.", "options": ["always", "does", "a big mess", "when he cooks"], "answer": 1, "explain_vi": "Cụm cố định: make a mess = bày bừa, làm bừa bộn → makes a big mess. Không dùng do."}, {"q": "Did the cake made by your sister?", "options": ["Did", "made", "by", "your sister"], "answer": 0, "explain_vi": "Câu hỏi bị động quá khứ đưa was lên đầu: Was the cake made by your sister? Không dùng Did với V3."}, {"q": "I read an interesting article about robots and learnt a lot of informations.", "options": ["read", "interesting article", "learnt", "informations"], "answer": 3, "explain_vi": "information là danh từ không đếm được, không thêm -s → a lot of information."}]}], "exam_plus": [{"format": "sentence_completion", "title_vi": "Hoàn thành câu", "intro_vi": "Trong 10 câu hoàn thành câu của đề Chuyên Ngoại ngữ, câu phân loại thường hỏi họ từ (persuade/persuasive), động từ bất quy tắc ở bị động, cụm động từ và collocation như make an effort.", "tip_vi": "Mẹo: xác định từ loại cần điền trước, rồi mới xét nghĩa. Với 4 phương án cùng gốc từ, chọn theo vị trí trong câu.", "kind": "mcq", "items": [{"q": "The advert was so ______ that thousands of teenagers queued overnight to buy the new phone.", "options": ["persuaded", "persuasion", "persuasive", "persuadable"], "answer": 2, "explain_vi": "Sau so cần tính từ mô tả quảng cáo: persuasive (có sức thuyết phục). persuaded là cảm giác của người bị thuyết phục."}, {"q": "The president's speech ______ live on all national channels yesterday evening.", "options": ["broadcast", "was broadcast", "was broadcasting", "has broadcast"], "answer": 1, "explain_vi": "Bài phát biểu được phát sóng → bị động quá khứ. broadcast là động từ bất quy tắc: V3 vẫn là broadcast → was broadcast."}, {"q": "The reporter refused to ______ the name of the person who had given her the information.", "options": ["inform", "reveal", "express", "advertise"], "answer": 1, "explain_vi": "reveal = tiết lộ (tên, bí mật). inform đi với người (inform sb), express dùng cho cảm xúc, ý kiến."}, {"q": "While doing research for her essay, Mai ______ an old newspaper article that her grandfather had written.", "options": ["came across", "came up with", "came round", "came over"], "answer": 0, "explain_vi": "come across = tình cờ thấy. come up with = nghĩ ra (ý tưởng), come round = ghé thăm, tỉnh lại."}, {"q": "Social media companies should ______ more effort to stop the spread of false information.", "options": ["do", "make", "take", "give"], "answer": 1, "explain_vi": "Collocation: make an effort = cố gắng, nỗ lực. Không nói do/take/give effort."}]}, {"format": "error_id", "title_vi": "Tìm lỗi sai", "intro_vi": "Câu tìm lỗi khó trong đề vào 10 chuyên thường giấu lỗi ở chủ ngữ ở xa động từ, giới từ đi kèm bị động, danh từ không đếm được hoặc V3 bất quy tắc.", "tip_vi": "Mẹo: bỏ qua mệnh đề phụ (which…, who…) để tìm chủ ngữ thật. Nhớ: every + danh từ số ít, information không đếm được.", "kind": "mcq", "items": [{"q": "The documentary, which was filmed in the Arctic, were watched by over two million viewers.", "options": ["which was filmed", "in the Arctic", "were watched", "viewers"], "answer": 2, "explain_vi": "Chủ ngữ thật là 'The documentary' (số ít); bỏ mệnh đề which… sẽ thấy → was watched."}, {"q": "Many teenagers are influenced from what they see online, so they should be taught to think critically.", "options": ["are influenced from", "what they see", "should be taught", "critically"], "answer": 0, "explain_vi": "Bị động dùng by để chỉ tác nhân: be influenced by sth. Không dùng from."}, {"q": "Not all the information that are shared online is reliable, so readers should always check it.", "options": ["Not all", "that are shared", "is reliable", "should always check"], "answer": 1, "explain_vi": "that thay cho information (không đếm được, số ít) → that is shared. Động từ chính 'is reliable' cũng cho thấy số ít."}, {"q": "The winner of the photo contest, which was organised by a local newspaper, was chose by readers.", "options": ["of the photo contest", "was organised", "local newspaper", "was chose"], "answer": 3, "explain_vi": "V3 của choose là chosen → was chosen. chose là quá khứ đơn, không dùng sau was."}, {"q": "Every advertisement on children's channels are checked carefully before it is broadcast.", "options": ["Every advertisement", "are checked", "carefully", "before it is broadcast"], "answer": 1, "explain_vi": "every + danh từ số ít đi với động từ số ít → is checked. Đại từ 'it' phía sau cũng cho thấy số ít."}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Câu 1–2: viết dạng đúng của từ in hoa (thêm cả tiền tố và hậu tố). Câu 3–4: viết tiếp câu mới ở dạng bị động sao cho nghĩa không đổi. Câu 5–6: chọn A, B, C hoặc D.", "items": [{"id": "d8H1", "q": "Teachers have stopped recommending that website because its information is often ______. (RELY)", "answer": "unreliable", "accept": []}, {"id": "d8H2", "q": "The drink advert was banned for being ______: it suggested that the drink could cure serious illnesses. (LEAD)", "answer": "misleading", "accept": []}, {"id": "d8H3", "q": "Who wrote this article about plastic waste? → Who was ______", "answer": "this article about plastic waste written by?", "accept": ["this article about plastic waste written by", "this article written by?", "this article written by"]}, {"id": "d8H4", "q": "Someone gave the journalist some secret documents last week. → The journalist ______", "answer": "was given some secret documents last week", "accept": ["was given some secret documents last week by someone"]}, {"id": "d8H5", "q": "The story about the singer's secret wedding ______ the headlines for weeks.", "options": ["hit", "won", "took", "reached"], "answer": "A"}, {"id": "d8H6", "q": "The company had to ______ its new advertisement after many parents complained that it was harmful to children.", "options": ["take after", "take over", "take down", "take up"], "answer": "C"}]}}, "9": {"grammar_games": {"sort": {"title_vi": "Từ nào đi với many / a few, từ nào đi với much / a little?", "groups": [{"name": "many / a few + …", "items": ["ingredients", "festivals", "recipes", "dishes", "spring rolls"]}, {"name": "much / a little + …", "items": ["sugar", "information", "fish sauce", "advice", "bread"]}]}, "unjumble": [{"sentence": "How many guests are coming to the festival?", "hint_vi": "How many + danh từ đếm được số nhiều."}, {"sentence": "We only need a little sugar for this recipe.", "hint_vi": "a little + danh từ không đếm được (sugar)."}, {"sentence": "My grandma gave me some useful advice about cooking.", "hint_vi": "advice không đếm được → dùng some, không dùng an."}, {"sentence": "There are plenty of local dishes to try in Huế.", "hint_vi": "plenty of dùng được với danh từ đếm được số nhiều."}, {"sentence": "Very few tourists know about this tiny village.", "hint_vi": "few (không có a) = rất ít, nghĩa tiêu cực."}], "truefalse": [{"s": "Can you give me an information about the festival?", "ok": false, "fix": "Can you give me some information about the festival?", "why_vi": "information không đếm được → không dùng an; dùng some."}, {"s": "There are a few bananas in the fridge.", "ok": true, "fix": "There are a few bananas in the fridge.", "why_vi": "Đúng: bananas đếm được số nhiều → a few."}, {"s": "How much eggs do we need for the cake?", "ok": false, "fix": "How many eggs do we need for the cake?", "why_vi": "eggs đếm được số nhiều → How many, không dùng How much."}, {"s": "The moon looks beautiful during the Mid-Autumn Festival.", "ok": true, "fix": "The moon looks beautiful during the Mid-Autumn Festival.", "why_vi": "Đúng: chỉ có một mặt trăng → the moon."}, {"s": "I'd like a little milk in my tea, please.", "ok": true, "fix": "I'd like a little milk in my tea, please.", "why_vi": "Đúng: milk không đếm được → a little."}, {"s": "My mum bought two breads at the bakery.", "ok": false, "fix": "My mum bought two loaves of bread at the bakery.", "why_vi": "bread không đếm được, không thêm -s; dùng two loaves of bread."}, {"s": "We usually have the breakfast at 6:30.", "ok": false, "fix": "We usually have breakfast at 6:30.", "why_vi": "Không dùng mạo từ trước tên bữa ăn: have breakfast."}, {"s": "There is plenty of food for everyone at the party.", "ok": true, "fix": "There is plenty of food for everyone at the party.", "why_vi": "Đúng: plenty of + food (không đếm được) + động từ số ít is."}]}, "exam": [{"format": "synonym", "title_vi": "Từ đồng nghĩa", "intro_vi": "Đề Chuyên Ngoại ngữ có 4 câu tìm từ đồng nghĩa: mỗi câu có một từ hoặc cụm từ VIẾT HOA, em chọn A, B, C hoặc D có nghĩa gần nhất.", "tip_vi": "Mẹo: thay từng đáp án vào chỗ từ viết hoa; đáp án đúng giữ nguyên nghĩa câu. Cẩn thận với từ chỉ liên quan chủ đề nhưng khác nghĩa.", "kind": "mcq", "items": [{"q": "We have RUN OUT OF rice, so someone has to go to the market.", "options": ["bought plenty of", "used up all the", "cooked a little", "forgotten to buy"], "answer": 1, "explain_vi": "run out of = hết sạch, tức là đã dùng hết (used up all the)."}, {"q": "Phở is one of the most POPULAR dishes in Việt Nam.", "options": ["expensive", "traditional", "liked by many people", "difficult to cook"], "answer": 2, "explain_vi": "popular = được nhiều người yêu thích. 'traditional' (truyền thống) là nghĩa khác."}, {"q": "My aunt PREPARED a delicious meal for the whole family.", "options": ["ate", "made", "ordered", "bought"], "answer": 1, "explain_vi": "prepare a meal = chuẩn bị, nấu một bữa ăn, gần nghĩa với make a meal."}, {"q": "The flower festival in Đà Lạt ATTRACTS thousands of visitors every year.", "options": ["draws", "sends", "refuses", "surprises"], "answer": 0, "explain_vi": "attract = thu hút; draw (visitors/crowds) cũng có nghĩa thu hút người đến."}, {"q": "The soup tasted rather BLAND, so I added some fish sauce and pepper.", "options": ["too spicy", "very sweet", "too salty", "without much flavour"], "answer": 3, "explain_vi": "bland = nhạt, ít hương vị; vì vậy mới phải thêm nước mắm và tiêu."}]}, {"format": "open_cloze", "title_vi": "Điền từ vào đoạn văn (không có lựa chọn)", "intro_vi": "Đề chuyên Anh của Sở thường có bài điền một từ vào đoạn văn mà không cho sẵn lựa chọn. Từ cần điền hay là mạo từ, giới từ, lượng từ hoặc trợ động từ.", "tip_vi": "Mẹo: nhìn từ ngay sau chỗ trống. Danh từ số ít đếm được cần a/an/the; danh từ số nhiều đi với many/few; trước buổi trong ngày dùng in.", "kind": "gap_text", "text": "Have you ever tried bánh cuốn? It is [1] traditional dish from the north of Việt Nam, and many people in Hà Nội eat it [2] the morning. How [3] main ingredients do you need to make it? Only four: rice flour, water, minced pork and mushrooms. The cook spreads a thin layer of rice batter on a cloth over a pot of boiling water. After a [4] seconds, the soft rice sheet is ready. It is filled with pork and mushrooms, then rolled up. Bánh cuốn is served with fried shallots, fresh herbs and a small bowl of dipping sauce. [5] sauce is made from fish sauce, sugar, lime and water, and it gives the dish its special flavour. If you visit Hà Nội, try it at a local market!", "items": [{"answer": "a", "accept": [], "explain_vi": "Danh từ đếm được số ít, nhắc lần đầu: a traditional dish."}, {"answer": "in", "accept": ["during"], "explain_vi": "Buổi trong ngày đi với in: in the morning."}, {"answer": "many", "accept": [], "explain_vi": "ingredients là danh từ đếm được số nhiều → How many."}, {"answer": "few", "accept": [], "explain_vi": "seconds đếm được số nhiều → a few seconds (vài giây)."}, {"answer": "The", "accept": ["the", "This", "this"], "explain_vi": "Nước chấm đã được nhắc ở câu trước → dùng The sauce (This sauce cũng được)."}]}], "exam_easy": [{"format": "synonym", "title_vi": "Từ đồng nghĩa", "intro_vi": "Đề Chuyên Ngoại ngữ có 4 câu tìm từ đồng nghĩa. Mỗi câu có một từ VIẾT HOA. Em chọn A, B, C hoặc D có nghĩa giống nhất với từ đó.", "tip_vi": "Mẹo: đọc cả câu để đoán nghĩa từ viết hoa, rồi thay từng đáp án vào chỗ đó. Đáp án nào làm câu vẫn giữ nguyên nghĩa là đúng.", "kind": "mcq", "items": [{"q": "This fish soup is DELICIOUS. Can I have some more?", "options": ["very tasty", "very old", "very cold", "very cheap"], "answer": 0, "explain_vi": "delicious = rất ngon, giống 'very tasty'. Người nói muốn ăn thêm, nên món ăn phải ngon."}, {"q": "Bánh mì is a FAMOUS dish from Việt Nam.", "options": ["new", "cheap", "well-known", "small"], "answer": 2, "explain_vi": "famous = nổi tiếng, nhiều người biết đến, giống 'well-known'. Các từ còn lại nghĩa khác hẳn: mới, rẻ, nhỏ."}, {"q": "The lantern festival in our town BEGINS at seven o'clock in the evening.", "options": ["ends", "starts", "stops", "closes"], "answer": 1, "explain_vi": "begin = bắt đầu, giống 'start'. 'ends', 'stops', 'closes' đều có nghĩa là kết thúc, dừng lại."}, {"q": "Could you GIVE me the salt, please?", "options": ["sell", "cook", "eat", "pass"], "answer": 3, "explain_vi": "Trên bàn ăn, nhờ ai đưa giúp đồ gì ta nói 'pass me the salt' = give me the salt (đưa cho tôi lọ muối)."}, {"q": "The night market is always BUSY at the weekend.", "options": ["full of people", "quiet", "closed", "clean"], "answer": 0, "explain_vi": "Chợ 'busy' = đông người, nhộn nhịp, tức là 'full of people'. 'quiet' (yên tĩnh) là nghĩa ngược lại."}]}, {"format": "open_cloze", "title_vi": "Điền từ vào đoạn văn (không có lựa chọn)", "intro_vi": "Dạng này có một đoạn văn với các chỗ trống và không cho sẵn lựa chọn. Em tự điền MỘT từ, thường là a/an/the, much/many hoặc giới từ như in, on, at, of.", "tip_vi": "Mẹo: nhìn từ ngay sau chỗ trống: danh từ số ít, số nhiều hay không đếm được? Vật đã được nhắc đến trước đó thì dùng 'the'.", "kind": "gap_text", "text": "Hi! I'm Nam and I live in [1] small town near Huế. Every Sunday morning, I go to the market with my mum. She buys a lot [2] vegetables, some fish and a bag of rice. Last Sunday, I bought [3] apple and a banana with my pocket money. Then Mum asked me, \"How [4] money have you got left?\" I had only two thousand dong! When we got home, I gave [5] apple to my little sister and ate the banana myself.", "items": [{"answer": "a", "accept": [], "explain_vi": "town là danh từ đếm được số ít, nhắc đến lần đầu, 'small' bắt đầu bằng phụ âm → a small town."}, {"answer": "of", "accept": [], "explain_vi": "Cụm cố định: a lot of + danh từ (a lot of vegetables = rất nhiều rau)."}, {"answer": "an", "accept": ["one"], "explain_vi": "apple bắt đầu bằng nguyên âm 'a', là danh từ đếm được số ít, nhắc đến lần đầu → an apple."}, {"answer": "much", "accept": [], "explain_vi": "money là danh từ không đếm được → How much money (bao nhiêu tiền)."}, {"answer": "the", "accept": [], "explain_vi": "Quả táo này đã được nhắc đến ở câu trước (an apple) → lần sau dùng the apple."}]}], "exam_plus": [{"format": "synonym", "title_vi": "Từ đồng nghĩa", "intro_vi": "Ở đề Chuyên Ngoại ngữ, các câu đồng nghĩa khó thường dùng từ B2, cụm động từ hoặc thành ngữ; phương án nhiễu gần nghĩa hoặc cùng chủ đề. Đây là những câu phân loại học sinh giỏi.", "tip_vi": "Mẹo: so sắc thái (khen hay chê), cách kết hợp từ và ngữ pháp (đếm được hay không). Phương án gần nghĩa nhưng lệch sắc thái là bẫy chính.", "kind": "mcq", "items": [{"q": "This small family restaurant in Hội An is RENOWNED for its cao lầu.", "options": ["notorious", "criticised", "celebrated", "recommended"], "answer": 2, "explain_vi": "renowned = nổi tiếng (nghĩa tốt) = celebrated. 'notorious' cũng là nổi tiếng nhưng vì điều xấu – bẫy sắc thái."}, {"q": "Our school canteen serves PLENTY OF fresh vegetables every day.", "options": ["a great deal of", "a large number of", "a variety of", "a lack of"], "answer": 1, "explain_vi": "plenty of = rất nhiều. vegetables đếm được số nhiều → a large number of. 'a great deal of' chỉ đi với danh từ không đếm được."}, {"q": "After the long walk, the hungry children POLISHED OFF the whole plate of spring rolls in minutes.", "options": ["quickly finished", "carefully cleaned", "shared out", "nicely decorated"], "answer": 0, "explain_vi": "polish off (food) = ăn sạch thật nhanh. 'carefully cleaned' là bẫy vì 'polish' còn có nghĩa đánh bóng."}, {"q": "Tết customs VARY from region to region, so a family meal in Huế may look quite different from one in Hà Nội.", "options": ["survive", "spread", "develop", "differ"], "answer": 3, "explain_vi": "vary = khác nhau, thay đổi tuỳ nơi = differ. Vế sau 'look quite different' xác nhận nghĩa này."}, {"q": "Many young chefs are trying to PRESERVE the cooking traditions of their grandparents' generation.", "options": ["abandon", "maintain", "promote", "modernise"], "answer": 1, "explain_vi": "preserve = gìn giữ, bảo tồn = maintain. 'promote' (quảng bá) gần chủ đề nhưng khác nghĩa; 'abandon' là trái nghĩa."}]}, {"format": "open_cloze", "title_vi": "Điền từ vào đoạn văn (không có lựa chọn)", "intro_vi": "Bài điền từ không có lựa chọn trong đề Sở và Chuyên Ngoại ngữ thường có vài chỗ trống phân loại: lượng từ nghĩa phủ định (few/little), cụm cố định (a great deal of), giới từ đi kèm.", "tip_vi": "Mẹo: đọc cả câu trước và sau chỗ trống để biết nghĩa tích cực hay phủ định, và tìm cụm từ cố định, đừng chỉ nhìn từ ngay sau.", "kind": "gap_text", "text": "Street food is [1] essential part of daily life in Việt Nam. Walk down almost any street in Hà Nội and you will find someone selling bún, xôi or bánh mì from a tiny stall on the pavement. Very [2] of these vendors have ever had any formal training; most of them simply learned their recipes from their parents. Even so, they put a great [3] of effort into every bowl, and their dishes are by no means lacking [4] flavour. In recent years, [5] popularity of street food tours has grown so rapidly that they are now one of the city's top attractions for foreign visitors.", "items": [{"answer": "an", "accept": [], "explain_vi": "part đếm được số ít, chưa xác định; 'essential' bắt đầu bằng nguyên âm → an essential part."}, {"answer": "few", "accept": [], "explain_vi": "Very few of + danh từ số nhiều = rất ít (phủ định). Vế sau 'most of them simply learned…' cho thấy hầu như không ai được đào tạo."}, {"answer": "deal", "accept": [], "explain_vi": "Cụm cố định: a great deal of + danh từ không đếm được (effort) = rất nhiều."}, {"answer": "in", "accept": [], "explain_vi": "Cụm: lacking in sth = thiếu cái gì. 'by no means lacking in flavour' = không hề thiếu hương vị."}, {"answer": "the", "accept": [], "explain_vi": "popularity được xác định bởi 'of street food tours' → the popularity of…"}]}], "paper_plus": {"title_vi": "H. Thử thách nâng cao", "instruction_vi": "Câu 1–2: viết dạng đúng của từ in hoa (có thể phải đổi từ 2 lần hoặc
