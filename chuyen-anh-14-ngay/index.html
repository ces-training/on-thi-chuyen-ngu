    <li class="ok">96 từ vựng B1–B2 theo 12 chủ đề hay gặp trong đề chuyên, mỗi từ kèm họ từ</li>
    <li class="ok">24 cụm động từ (phrasal verbs)</li>
    <li class="ok">12 chủ điểm ngữ pháp B1 và 12 quy tắc cấu tạo từ</li>
    <li class="ok">Làm quen 6 dạng câu hỏi của đề chuyên: hoàn thành câu, đồng nghĩa, trái nghĩa, hội thoại, viết lại câu, điền từ đoạn văn</li>
    <li class="ok">12 bài đọc và 14 đoạn viết có tiêu chí tự kiểm</li>
    <li class="ok">Một con số thật về nhịp học và khả năng nhớ của em, để cả nhà quyết định lịch học dài hạn</li></ul>
    <p class="small muted">2 tuần chưa đủ để lên một bậc trình độ (mỗi bậc cần khoảng 90–200 giờ). Giá trị của 2 tuần là thói quen và dữ liệu để đánh giá.</p></div>
  </section>`;
  const draw=()=>{
    const hpw=S.plan.min*S.plan.dpw/60;
    $('#chart').innerHTML=chartSVG(entryH,hpw,eff.f);
    $('#mTable').innerHTML=MILESTONES.map(m=>{const h=project(entryH,hpw,eff.f,m.date);const L=levelOfHours(h);const ok=h>=m.h;return `<tr><td>${m.label} (${String(m.date.getMonth()+1).padStart(2,'0')}/${m.date.getFullYear()})</td><td>${m.target}</td><td>${L.name}</td><td><span class="pill ${ok?'good':'bad'}">${ok?'Kịp':'Chưa kịp'}</span></td></tr>`}).join('');
    const V=verdict(entryH,eff,A);
    $('#verdictSlot').innerHTML=`<div class="verdict ${V.cls}"><p class="eyebrow">Đánh giá dành cho em và bố mẹ</p><h3>${esc(V.head)}</h3><p>${esc(V.msg)}</p>${V.notes.length?'<ul>'+V.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':''}<p class="small">${entry?`Điểm xuất phát: ${LEVELS.find(l=>l.k===entry.level).name} (bài ${entry===S.final?'sau 2 tuần':'đầu vào'}).`:''} ${A.done.length<7?'Đánh giá sẽ chính xác hơn khi em xong ít nhất 7 buổi.':''}</p></div>`;
  };
  draw();
  $('#minR').oninput=e=>{S.plan.min=+e.target.value;$('#minO').textContent=S.plan.min;draw();save()};
  $('#dpwR').oninput=e=>{S.plan.dpw=+e.target.value;$('#dpwO').textContent=S.plan.dpw;draw();save()};
}

/* ===== Game kiểu Wordwall: nối cặp, lật thẻ, xếp chữ, đố nhanh, phân nhóm, xếp câu, đúng hay sai =====
   Mỗi game: renderGame(box, spec, onDone). spec = {type, key, title, how, items, ...}. onDone({score,total,ms}).
   Chơi bằng chạm/bấm (không kéo thả) để chạy tốt trên điện thoại. */
const G_SHUF=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const G_ICON={match:'handshake',flip:'sparkles',anagram:'memo',quiz:'bullseye',sort:'books',unjumble:'writing-hand',truefalse:'check-mark-button'};
const G_NAME={match:'Nối cặp',flip:'Lật thẻ',anagram:'Xếp chữ',quiz:'Đố nhanh',sort:'Phân nhóm',unjumble:'Xếp câu',truefalse:'Đúng hay sai'};
let G_AC=null;let G_MUTE=false;try{G_MUTE=localStorage.getItem('ca14_mute')==='1'}catch(e){}
function gBeep(ok){if(G_MUTE)return;try{G_AC=G_AC||new (window.AudioContext||window.webkitAudioContext)();const o=G_AC.createOscillator(),g=G_AC.createGain();o.type='triangle';const t=G_AC.currentTime;
  if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08)}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.1)}
  g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(G_AC.destination);o.start(t);o.stop(t+.26)}catch(e){}}
function gStars(score,total){const p=total?score/total:0;return p>=.9?3:p>=.6?2:p>0?1:0}
function gStarHTML(n){return '<span class="g-stars" aria-label="'+n+' sao">'+[1,2,3].map(i=>`<b class="${i<=n?'on':''}">★</b>`).join('')+'</span>'}

function renderGame(box,spec,onDone){
  const t0=Date.now();let score=0,total=0;
  box.innerHTML=`<div class="g-head"><span class="g-name">${esc(G_NAME[spec.type]||'Game')}</span><span class="g-meta"><span class="g-score">0</span> điểm · <span class="g-time">0:00</span></span><button class="g-mute" type="button" aria-label="Bật/tắt âm thanh">${G_MUTE?'🔇':'🔊'}</button></div>
  <p class="g-how small muted">${esc(spec.how||'')}</p><div class="g-stage"></div>`;
  const stage=box.querySelector('.g-stage'),scEl=box.querySelector('.g-score'),tmEl=box.querySelector('.g-time');
  box.querySelector('.g-mute').onclick=e=>{G_MUTE=!G_MUTE;try{localStorage.setItem('ca14_mute',G_MUTE?'1':'0')}catch(_){}e.target.textContent=G_MUTE?'🔇':'🔊'};
  const timer=setInterval(()=>{if(!box.isConnected){clearInterval(timer);return}const s=Math.floor((Date.now()-t0)/1000);tmEl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
  const add=(d)=>{score+=d;scEl.textContent=score};
  const finish=(sc,tot,extra)=>{clearInterval(timer);const ms=Date.now()-t0;const st=gStars(sc,tot);
    stage.innerHTML=`<div class="g-end">${st>=2?em('party-popper','',72):em('flexed-biceps','',72)}<h3>${st===3?'Xuất sắc!':st===2?'Tốt lắm!':'Cố thêm chút nữa nhé!'}</h3>${gStarHTML(st)}<p>Em đúng <b>${sc}/${tot}</b> · ${Math.round(ms/1000)} giây${extra?' · '+extra:''}</p><div class="row" style="justify-content:center"><button class="btn hi g-again" type="button">Chơi lại</button></div></div>`;
    stage.querySelector('.g-again').onclick=()=>renderGame(box,spec,onDone);
    onDone&&onDone({score:sc,total:tot,ms,stars:st})};
  const api={stage,add,finish,setTotal:n=>{total=n}};
  (G_PLAY[spec.type]||G_PLAY.quiz)(spec,api);
}

const G_PLAY={
  /* Nối cặp: chạm một ô bên trái rồi chạm nghĩa đúng bên phải */
  match(spec,A){
    const pairs=G_SHUF(spec.items).slice(0,(spec.cfg||{}).pairs||6);let sel=null,done=0,sc=0;const missed=new Set();const total=pairs.length;
    const L=pairs.map((p,i)=>({i,t:p.a})),R=G_SHUF(pairs.map((p,i)=>({i,t:p.b})));
    A.stage.innerHTML=`<div class="g-match"><div class="g-col">${L.map(x=>`<button type="button" class="g-tile" data-side="L" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="g-col">${R.map(x=>`<button type="button" class="g-tile alt" data-side="R" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
    A.stage.onclick=e=>{const b=e.target.closest('.g-tile');if(!b||b.disabled)return;
      if(!sel||sel.dataset.side===b.dataset.side){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
      if(sel.dataset.i===b.dataset.i){[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});gBeep(true);
        if(!missed.has(b.dataset.i)){sc++;A.add(1)}done++;sel=null;if(done===total)setTimeout(()=>A.finish(sc,total),500)}
      else{missed.add(sel.dataset.i);missed.add(b.dataset.i);gBeep(false);const pr=[sel,b];pr.forEach(x=>x.classList.add('bad'));setTimeout(()=>pr.forEach(x=>x.classList.remove('bad','sel')),450);sel=null}};
  },
  /* Lật thẻ: tìm các cặp từ – nghĩa */
  flip(spec,A){
    const pairs=G_SHUF(spec.items).slice(0,(spec.cfg||{}).pairs||6);const cards=G_SHUF(pairs.flatMap((p,i)=>[{i,t:p.a,k:'a'},{i,t:p.b,k:'b'}]));
    let open=[],moves=0,found=0,lock=false;
    A.stage.innerHTML=`<div class="g-flip">${cards.map((c,j)=>`<button type="button" class="g-card" data-j="${j}" aria-label="Thẻ ${j+1}"><span class="f">?</span><span class="b ${c.k}">${esc(c.t)}</span></button>`).join('')}</div><p class="small muted g-moves">Số lượt lật: 0</p>`;
    A.stage.onclick=e=>{const b=e.target.closest('.g-card');if(!b||lock||b.classList.contains('up'))return;b.classList.add('up');open.push(b);
      if(open.length<2)return;moves++;A.stage.querySelector('.g-moves').textContent='Số lượt lật: '+moves;
      const [x,y]=open.map(o=>cards[+o.dataset.j]);
      if(x.i===y.i&&x.k!==y.k){open.forEach(o=>o.classList.add('ok'));gBeep(true);A.add(1);found++;open=[];if(found===pairs.length){const sc=Math.max(0,Math.min(pairs.length,Math.round(pairs.length*(pairs.length+2)/moves)));setTimeout(()=>A.finish(sc,pairs.length,moves+' lượt lật'),600)}}
      else{lock=true;gBeep(false);setTimeout(()=>{open.forEach(o=>o.classList.remove('up'));open=[];lock=false},800)}};
  },
  /* Xếp chữ: chạm các chữ cái theo đúng thứ tự để ghép từ */
  anagram(spec,A){
    const qs=G_SHUF(spec.items).slice(0,(spec.cfg||{}).n||5);let k=0,sc=0;
    const next=()=>{if(k>=qs.length)return A.finish(sc,qs.length);const q=qs[k];const word=q.a;let letters=G_SHUF(word.split('').map((c,i)=>({c,i})));
      if(letters.map(x=>x.c).join('')===word&&word.length>2)letters=letters.reverse();
      let built=[],miss=0,hint=0;if((spec.cfg||{}).firstLetter){const x=letters.find(y=>y.c===word[0]);if(x)built.push(x)}
      const draw=()=>{A.stage.innerHTML=`<div class="g-ana"><p class="g-prog">Từ ${k+1}/${qs.length}</p><p class="g-clue">${esc(q.b)}</p>${q.c?`<p class="small muted">${esc(q.c)}</p>`:''}
        <div class="g-slots">${word.split('').map((c,i)=>`<span class="g-slot ${built[i]?'full':''}">${built[i]?esc(built[i].c):''}</span>`).join('')}</div>
        <div class="g-letters">${letters.map((x,j)=>`<button type="button" class="g-let" data-j="${j}" ${built.includes(x)?'disabled':''}>${esc(x.c)}</button>`).join('')}</div>
        <div class="row" style="justify-content:center"><button type="button" class="btn ghost g-undo">Xoá chữ cuối</button><button type="button" class="btn ghost g-hint">Gợi ý (−½ điểm)</button></div></div>`};
      draw();
      A.stage.onclick=e=>{const l=e.target.closest('.g-let');
        if(e.target.closest('.g-undo')){built.pop();draw();return}
        if(e.target.closest('.g-hint')){const need=word[built.length];const x=letters.find(y=>y.c===need&&!built.includes(y));if(x){built.push(x);hint++;draw();check()}return}
        if(!l)return;built.push(letters[+l.dataset.j]);draw();check()};
      const check=()=>{if(built.length<word.length)return;const got=built.map(x=>x.c).join('');
        if(got===word){gBeep(true);const p=hint?0.5:1;sc+=p;A.add(p);A.stage.querySelector('.g-slots').classList.add('ok');k++;setTimeout(next,700)}
        else{gBeep(false);miss++;A.stage.querySelector('.g-slots').classList.add('bad');setTimeout(()=>{built=[];draw()},600)}}};
    next();
  },
  /* Đố nhanh: 4 lựa chọn, 15 giây mỗi câu, đúng liên tiếp được thưởng */
  quiz(spec,A){
    const QT=(spec.cfg||{}).qtime||15;const qs=G_SHUF(spec.items).slice(0,(spec.cfg||{}).n||8);let k=0,sc=0,streak=0,tm=null;
    const next=()=>{clearInterval(tm);if(k>=qs.length)return A.finish(sc,qs.length,'chuỗi dài nhất '+best);const q=qs[k];const opts=G_SHUF(q.options.map((t,i)=>({t,ok:i===q.answer})));let left=QT;
      A.stage.innerHTML=`<div class="g-quiz"><div class="g-bar"><i style="width:100%"></i></div><p class="g-prog">Câu ${k+1}/${qs.length}${streak>=2?` · 🔥 ${streak} câu liền`:''}</p><p class="g-q">${esc(q.q)}</p><div class="g-opts">${opts.map((o,j)=>`<button type="button" class="g-opt" data-j="${j}">${esc(o.t)}</button>`).join('')}</div><p class="g-fb small"></p></div>`;
      const bar=A.stage.querySelector('.g-bar i');
      tm=setInterval(()=>{left-=.25;bar.style.width=Math.max(0,left/QT*100)+'%';if(left<=0){clearInterval(tm);answer(-1)}},250);
      const answer=j=>{clearInterval(tm);const bs=A.stage.querySelectorAll('.g-opt');bs.forEach((b,i)=>{b.disabled=true;if(opts[i].ok)b.classList.add('ok');else if(i===j)b.classList.add('bad')});
        const ok=j>=0&&opts[j].ok;gBeep(ok);if(ok){streak++;best=Math.max(best,streak);sc++;A.add(1+(streak>=3?1:0))}else streak=0;
        A.stage.querySelector('.g-fb').innerHTML=(ok?'✓ Đúng! ':j<0?'⏰ Hết giờ. ':'✗ Chưa đúng. ')+(q.explain?esc(q.explain):'');k++;setTimeout(next,ok?900:1800)};
      A.stage.querySelector('.g-opts').onclick=e=>{const b=e.target.closest('.g-opt');if(b&&!b.disabled)answer(+b.dataset.j)}};
    let best=0;next();
  },
  /* Phân nhóm: mỗi thẻ hiện ra, chạm vào nhóm đúng */
  sort(spec,A){
    const groups=spec.groups;const items=G_SHUF(groups.flatMap((g,gi)=>g.items.map(t=>({t,gi}))));let k=0,sc=0;
    const draw=()=>{if(k>=items.length)return A.finish(sc,items.length);const it=items[k];
      A.stage.innerHTML=`<div class="g-sort"><p class="g-prog">Thẻ ${k+1}/${items.length}</p><div class="g-sortcard">${esc(it.t)}</div><div class="g-bins">${groups.map((g,gi)=>`<button type="button" class="g-bin" data-g="${gi}"><b>${esc(g.name)}</b><span>${items.slice(0,k).filter(x=>x.gi===gi).length} thẻ</span></button>`).join('')}</div><p class="g-fb small"></p></div>`;
      A.stage.querySelector('.g-bins').onclick=e=>{const b=e.target.closest('.g-bin');if(!b||b.disabled)return;const ok=+b.dataset.g===it.gi;gBeep(ok);
        A.stage.querySelectorAll('.g-bin').forEach(x=>{x.disabled=true;if(+x.dataset.g===it.gi)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
        if(ok){sc++;A.add(1)}A.stage.querySelector('.g-fb').textContent=ok?'✓ Đúng nhóm!':'✗ Thẻ này thuộc nhóm "'+groups[it.gi].name+'".';k++;setTimeout(draw,ok?650:1500)}};
    draw();
  },
  /* Xếp câu: chạm các từ theo đúng thứ tự */
  unjumble(spec,A){
    const qs=G_SHUF(spec.items).slice(0,(spec.cfg||{}).un||5);let k=0,sc=0;
    const next=()=>{if(k>=qs.length)return A.finish(sc,qs.length);const q=qs[k];const words=q.sentence.trim().split(/\s+/);let pool=G_SHUF(words.map((w,i)=>({w,i})));
      if(pool.every((x,i)=>x.i===i))pool=pool.reverse();let built=[],tries=0;
      const draw=()=>{A.stage.innerHTML=`<div class="g-unj"><p class="g-prog">Câu ${k+1}/${qs.length}</p>${q.hint?`<p class="small muted">Gợi ý: ${esc(q.hint)}</p>`:''}
        <div class="g-line">${built.map((x,j)=>`<button type="button" class="g-word in" data-b="${j}">${esc(x.w)}</button>`).join('')||'<span class="muted small">Chạm các từ bên dưới để xếp câu</span>'}</div>
        <div class="g-pool">${pool.map((x,j)=>`<button type="button" class="g-word" data-p="${j}" ${built.includes(x)?'disabled':''}>${esc(x.w)}</button>`).join('')}</div>
        <div class="row" style="justify-content:center"><button type="button" class="btn g-check" ${built.length<words.length?'disabled':''}>Kiểm tra</button></div><p class="g-fb small"></p></div>`};
      draw();
      A.stage.onclick=e=>{const p=e.target.closest('[data-p]'),bb=e.target.closest('[data-b]');
        if(p&&!p.disabled){built.push(pool[+p.dataset.p]);draw();return}
        if(bb){built.splice(+bb.dataset.b,1);draw();return}
        if(e.target.closest('.g-check')){const got=built.map(x=>x.w).join(' ');const ok=got===words.join(' ');gBeep(ok);tries++;
          const fb=A.stage.querySelector('.g-fb');
          if(ok){const p2=tries===1?1:0.5;sc+=p2;A.add(p2);A.stage.querySelector('.g-line').classList.add('ok');fb.textContent='✓ Chính xác!';k++;setTimeout(next,900)}
          else if(tries>=2){A.stage.querySelector('.g-line').classList.add('bad');fb.innerHTML='Câu đúng: <b>'+esc(q.sentence)+'</b>';k++;setTimeout(next,2600)}
          else{A.stage.querySelector('.g-line').classList.add('bad');fb.textContent='✗ Chưa đúng, thử lại một lần nữa nhé.';setTimeout(()=>{built=[];draw();A.stage.querySelector('.g-fb').textContent='Thử lại lần 2'},900)}}}};
    next();
  },
  /* Đúng hay sai: 8 giây mỗi câu */
  truefalse(spec,A){
    const TT=(spec.cfg||{}).tftime||10;const qs=G_SHUF(spec.items).slice(0,8);let k=0,sc=0,tm=null;
    const next=()=>{clearInterval(tm);if(k>=qs.length)return A.finish(sc,qs.length);const q=qs[k];let left=TT;
      A.stage.innerHTML=`<div class="g-tf"><div class="g-bar"><i style="width:100%"></i></div><p class="g-prog">Câu ${k+1}/${qs.length}</p><p class="g-q">${esc(q.s)}</p><div class="g-tfb"><button type="button" class="g-yes" data-v="1">✓ Đúng</button><button type="button" class="g-no" data-v="0">✗ Sai</button></div><p class="g-fb small"></p></div>`;
      const bar=A.stage.querySelector('.g-bar i');tm=setInterval(()=>{left-=.25;bar.style.width=Math.max(0,left/TT*100)+'%';if(left<=0){clearInterval(tm);ans(null)}},250);
      const ans=v=>{clearInterval(tm);A.stage.querySelectorAll('.g-tfb button').forEach(b=>b.disabled=true);const ok=v!==null&&(v===1)===q.ok;gBeep(ok);if(ok){sc++;A.add(1)}
        A.stage.querySelector('.g-fb').innerHTML=(ok?'✓ Đúng rồi! ':v===null?'⏰ Hết giờ. ':'✗ Chưa đúng. ')+(q.ok?'Câu này đúng.':'Sửa: <b>'+esc(q.fix)+'</b>')+(q.why?'<br>'+esc(q.why):'');k++;setTimeout(next,ok&&q.ok?1100:2600)};
      A.stage.querySelector('.g-tfb').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)ans(+b.dataset.v)}};
    next();
  }
};

/* ===== Sinh dữ liệu game cho từng buổi, theo mức của con ===== */
const G_CFG={
  nen:{pairs:5,n:5,un:4,qtime:22,tftime:15,lives:8,speed:1300,roundMs:9000,dur:9,size:8,max:8,diag:false,showWords:true,firstLetter:true,hintMeaning:true,extra:0,autoFill:true,useGap:false},
  chuan:{pairs:6,n:7,un:5,qtime:15,tftime:10,lives:6,speed:1000,roundMs:7000,dur:7,size:9,max:9,diag:false,showWords:true,firstLetter:false,hintMeaning:true,extra:1},
  nang:{pairs:8,n:9,un:5,qtime:10,tftime:7,lives:5,speed:750,roundMs:5500,dur:5.5,size:10,max:11,diag:true,showWords:false,firstLetter:false,hintMeaning:false,extra:2,gapOnly:true}};
/* Mỗi buổi một bộ 3 game khác nhau; hai buổi liền nhau không lặp loại game; buổi 1–8, 10 và 14 đều mở một loại game mới. */
const G_PLAN={1:['match','sort','quiz'],2:['flip','unjumble','hangman'],3:['anagram','truefalse','whack'],4:['balloon','sort','match'],5:['wordsearch','truefalse','quiz'],6:['crossword','unjumble','flip'],7:['openbox','quiz','whack'],
  8:['dictation','sort','anagram'],9:['hangman','truefalse','balloon'],10:['missing','unjumble','wordsearch'],11:['whack','openbox','crossword'],12:['flip','sort','dictation'],13:['balloon','truefalse','anagram'],14:['wheel','unjumble','match']};
const G_HOW={hangman:'Đọc nghĩa, chạm từng chữ cái để đoán từ. Mỗi lần đoán sai em mất một quả bóng bay.',whack:'Đọc nghĩa ở trên, đập (chạm) vào con chuột mang đúng từ tiếng Anh. Chạm nhầm không mất điểm nhưng mất thời gian.',
  balloon:'Bóng bay đang bay lên! Chạm quả bóng mang đáp án đúng trước khi nó bay mất.',wordsearch:'Tìm các từ của buổi học trong bảng chữ theo nghĩa cho sẵn.',crossword:'Điền từ tiếng Anh theo nghĩa vào ô chữ; các từ giao nhau ở những chữ cái chung.',
  openbox:'Chọn hộp bất kỳ. Mỗi hộp là một câu hỏi; có hộp quà +2 điểm và hộp nhân đôi điểm.',dictation:'Bấm nghe, rồi gõ lại từ cho đúng chính tả. Có thể nghe lại và nghe từ trong câu.',missing:'Chạm một từ trong khung rồi chạm vào chỗ trống phù hợp trong câu.',wheel:'Quay vòng và làm thử thách vừa quay được: nghĩa của từ, chính tả hoặc đúng hay sai.'};
function gTrack(){return S.track||trackFromLevel(S.diag&&S.diag.level)}
function gPool(n){const D=DAYS[n-1];if(D.vocab)return {v:D.vocab,p:D.phrasal||[],w:(D.wordform&&D.wordform.examples)||[]};
  const from=n===7?[1,2,3,4,5,6]:[8,9,10,11,12,13];const v=[],p=[],w=[];from.forEach(i=>{const d=DAYS[i-1];(d.vocab||[]).slice(0,3).forEach(x=>v.push(x));(d.phrasal||[]).slice(0,1).forEach(x=>p.push(x));((d.wordform&&d.wordform.examples)||[]).slice(0,2).forEach(x=>w.push(x))});return {v,p,w}}
function gQuizItems(v,gapOnly){const words=v.map(x=>x.word);const out=[];v.forEach(x=>{const re=new RegExp('\\b'+x.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');const distract=G_SHUF(words.filter(w=>w!==x.word)).slice(0,3);
  const options=[x.word,...distract];if(re.test(x.example))out.push({q:x.example.replace(re,'______'),options,answer:0,explain:x.word+' = '+x.meaning_vi});
  else if(!gapOnly)out.push({q:'Từ nào có nghĩa là "'+x.meaning_vi+'"?',options,answer:0,explain:x.example})});return out.length>=4?out:gQuizItems(v,false)}
function gamesForDay(n){const tr=gTrack();const cfg=G_CFG[tr]||G_CFG.chuan;const P=gPool(n);const W=(C.web&&C.web[n])||{};const GG=W.grammar_games||{};const out=[];
  const V=P.v.map(x=>({w:x.word,m:x.meaning_vi,ex:x.example,ipa:x.ipa}));const VP=V.concat(P.p.map(x=>({w:x.phrase,m:x.meaning_vi,ex:x.example})));
  const tfPool=(GG.truefalse||[]).map(x=>({kind:'tf',s:x.s,ok:x.ok,fix:x.fix}));const seen=new Set();for(let d=1;d<n;d++)(G_PLAN[d]||[]).forEach(t=>seen.add(t));
  (G_PLAN[n]||['match','quiz','flip']).forEach((t,idx)=>{const key=t+idx;const base={type:t,key,cfg,isNew:!seen.has(t)};let g=null;
    if(t==='match')g={title:'Nối từ với nghĩa',how:'Chạm một từ bên trái, rồi chạm nghĩa đúng bên phải. Nối đúng ngay lần đầu mới được điểm.',items:P.v.map(x=>({a:x.word,b:x.meaning_vi})).concat(P.p.map(x=>({a:x.phrase,b:x.meaning_vi}))).concat(tr==='nang'?P.w.map(x=>({a:x[0],b:x[1]})):[])};
    else if(t==='flip')g={title:'Lật thẻ tìm cặp',how:'Lật hai thẻ một lượt. Tìm thẻ từ tiếng Anh và thẻ nghĩa đi với nhau. Càng ít lượt càng nhiều sao.',items:P.v.map(x=>({a:x.word,b:x.meaning_vi})).concat(P.p.map(x=>({a:x.phrase,b:x.meaning_vi})))};
    else if(t==='anagram')g={title:'Xếp chữ thành từ',how:'Đọc nghĩa, chạm các chữ cái theo đúng thứ tự để ghép thành từ tiếng Anh.'+(cfg.firstLetter?' Chữ cái đầu đã được xếp sẵn.':''),items:P.v.filter(x=>/^[a-z]+$/i.test(x.word)).map(x=>({a:x.word.toLowerCase(),b:x.meaning_vi,c:tr==='nang'?'':(x.ipa||'')}))};
    else if(t==='quiz')g={title:'Đố nhanh từ vựng',how:cfg.qtime+' giây mỗi câu. Đúng 3 câu liền được thưởng điểm.',items:gQuizItems(P.v,cfg.gapOnly)};
    else if(t==='sort'&&GG.sort)g={title:GG.sort.title_vi||'Phân nhóm',how:'Mỗi thẻ hiện ra, em chạm vào nhóm đúng của nó.',groups:GG.sort.groups};
    else if(t==='unjumble'&&GG.unjumble)g={title:'Xếp từ thành câu',how:'Chạm các từ theo đúng thứ tự để thành câu đúng ngữ pháp. Chạm từ đã xếp để bỏ ra. Được thử 2 lần.',items:GG.unjumble.map(u=>({sentence:u.sentence,hint:tr==='nang'?'':u.hint_vi}))};
    else if(t==='truefalse'&&GG.truefalse)g={title:'Câu này đúng hay sai?',how:cfg.tftime+' giây mỗi câu. Đọc nhanh và quyết định câu đúng hay sai ngữ pháp.',items:GG.truefalse.map(x=>({s:x.s,ok:x.ok,fix:x.fix,why:x.why_vi}))};
    else if(t==='openbox')g={title:'Mở hộp bí mật',how:G_HOW.openbox,pool:tfPool.concat(gQuizItems(P.v,cfg.gapOnly).map(q=>Object.assign({kind:'mcq'},q))),cfg:Object.assign({},cfg,{n:tr==='nen'?6:tr==='nang'?10:8})};
    else if(t==='wheel')g={title:'Vòng quay may mắn',how:G_HOW.wheel,items:V,pool:tfPool,cfg:Object.assign({},cfg,{n:tr==='nen'?5:tr==='nang'?8:6})};
    else if(['hangman','wordsearch','crossword','dictation','missing'].includes(t))g={title:G_NAME[t],how:G_HOW[t],items:V};
    else if(t==='whack'||t==='balloon')g={title:G_NAME[t],how:G_HOW[t],items:tr==='nen'?V:VP};
    if(g)out.push(Object.assign(base,g))});
  /* Game vận động: buổi 3, 7, 11 nghiêng đầu; buổi 5, 9, 13 bước sang trái/phải */
  const MO={3:'tilt',7:'tilt',11:'tilt',5:'lean',9:'lean',13:'lean'};
  if(MO[n]){const voc=G_SHUF(V).slice(0,6).map(x=>{const o=G_SHUF(V.filter(y=>y!==x))[0];const L0=Math.random()<.5;return {q:'Từ nào có nghĩa là: '+x.m+'?',L:L0?x.w:o.w,R:L0?o.w:x.w,ans:L0?'L':'R',why:x.w+' = '+x.m}});
    const tfs=(GG.truefalse||[]).map(x=>({q:x.s,L:'✓ Đúng',R:'✗ Sai',ans:x.ok?'L':'R',why:x.ok?'Câu này đúng.':'Sửa: '+x.fix}));
    out.push({type:'motion',key:'motion'+n,mode:MO[n],title:MO[n]==='tilt'?'Nghiêng đầu chọn đáp án':'Bước sang trái – phải',how:'Game vận động: chọn đáp án bằng cách '+(MO[n]==='tilt'?'nghiêng đầu':'bước người')+' sang trái hoặc phải. Không có camera thì bấm nút.',items:G_SHUF(voc).slice(0,4).concat(G_SHUF(tfs).slice(0,4)),cfg:Object.assign({},cfg,{mn:8,mtime:tr==='nen'?10:tr==='nang'?6:8}),isNew:n===3||n===5}) }
  if(out.length<3){const have=new Set(out.map(o=>o.type));['quiz','flip','anagram','match'].forEach(t=>{if(out.length<3&&!have.has(t)){have.add(t);const s=gamesForDayFallback(P,t);if(s)out.push(Object.assign(s,{cfg}))}})}
  return out}
function gamesForDayFallback(P,t){const k=t+'f';if(t==='quiz')return {type:'quiz',key:k,title:'Đố nhanh từ vựng',how:'Trả lời nhanh trước khi hết giờ.',items:gQuizItems(P.v)};
  if(t==='flip')return {type:'flip',key:k,title:'Lật thẻ tìm cặp',how:'Lật hai thẻ một lượt để tìm cặp từ – nghĩa.',items:P.v.map(x=>({a:x.word,b:x.meaning_vi}))};
  if(t==='anagram')return {type:'anagram',key:k,title:'Xếp chữ thành từ',how:'Chạm các chữ cái theo đúng thứ tự.',items:P.v.filter(x=>/^[a-z]+$/i.test(x.word)).map(x=>({a:x.word.toLowerCase(),b:x.meaning_vi}))};
  return {type:'match',key:k,title:'Nối từ với nghĩa',how:'Chạm từ rồi chạm nghĩa.',items:P.v.map(x=>({a:x.word,b:x.meaning_vi}))}}

/* ===== Game bổ sung: đoán chữ, đập chuột, bắn bóng bay, tìm từ, ô chữ, mở hộp bí mật, nghe và viết, điền từ còn thiếu, vòng quay =====
   Dữ liệu từ vựng: spec.items = [{w, m, ex, ipa}] (từ, nghĩa, ví dụ, phiên âm). Câu ngữ pháp: spec.pool = [{kind:'tf'|'mcq', …}].
   spec.cfg chứa tham số theo mức (số câu, thời gian, gợi ý). */
Object.assign(G_ICON,{hangman:'red-apple',whack:'flexed-biceps',balloon:'party-popper',wordsearch:'brain',crossword:'puzzle-piece',openbox:'trophy',dictation:'television',missing:'writing-hand',wheel:'glowing-star'});
Object.assign(G_NAME,{hangman:'Đoán chữ',whack:'Đập chuột',balloon:'Bắn bóng bay',wordsearch:'Tìm từ',crossword:'Ô chữ',openbox:'Mở hộp bí mật',dictation:'Nghe và viết',missing:'Điền từ còn thiếu',wheel:'Vòng quay may mắn'});
const G_WORD=s=>/^[a-z]+$/i.test(s);
function gSay(text,rate){try{const sy=window.speechSynthesis;if(!sy||!window.SpeechSynthesisUtterance)return false;sy.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate||.85;const v=sy.getVoices().find(x=>/en-GB/i.test(x.lang))||sy.getVoices().find(x=>/^en/i.test(x.lang));if(v)u.voice=v;sy.speak(u);return true}catch(e){return false}}
function gGap(it){const re=new RegExp('\\b'+it.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');return re.test(it.ex||'')?(it.ex||'').replace(re,'______'):null}

Object.assign(G_PLAY,{
  /* Đoán chữ: đọc nghĩa, đoán từng chữ cái; mỗi lần sai mất một quả bóng */
  hangman(spec,A){const L=spec.cfg||{};const qs=G_SHUF(spec.items.filter(x=>G_WORD(x.w))).slice(0,L.n||5);let k=0,sc=0;
    const next=()=>{if(k>=qs.length)return A.finish(sc,qs.length);const q=qs[k],w=q.w.toLowerCase();const lives0=L.lives||6;let lives=lives0;const got=new Set(L.firstLetter?[w[0]]:[]);
      const draw=()=>{const done=[...w].every(c=>got.has(c));A.stage.innerHTML=`<div class="g-hang"><p class="g-prog">Từ ${k+1}/${qs.length}</p><p class="g-clue">${esc(q.m)}</p>
        <div class="g-lives" aria-label="Còn ${lives} lượt">${'🎈'.repeat(lives)}<span class="lost">${'🎈'.repeat(lives0-lives)}</span></div>
        <div class="g-slots">${[...w].map(c=>`<span class="g-slot ${got.has(c)?'full':''}">${got.has(c)?c:''}</span>`).join('')}</div>
        <div class="g-keys">${'qwertyuiopasdfghjklzxcvbnm'.split('').map(c=>`<button type="button" class="g-key" data-c="${c}" ${got.has(c)||A.stage.dataset['x'+c]?'disabled':''}>${c}</button>`).join('')}</div><p class="g-fb small"></p></div>`;
        if(done){gBeep(true);sc++;A.add(1);A.stage.querySelector('.g-slots').classList.add('ok');k++;clean();setTimeout(next,800)}
        else if(lives<=0){gBeep(false);A.stage.querySelector('.g-fb').innerHTML='Từ đúng là <b>'+esc(w)+'</b>';k++;clean();setTimeout(next,1800)}};
      const clean=()=>{Object.keys(A.stage.dataset).forEach(x=>{if(x[0]==='x')delete A.stage.dataset[x]})};
      A.stage.onclick=e=>{const b=e.target.closest('.g-key');if(!b||b.disabled||lives<=0)return;const c=b.dataset.c;if(w.includes(c)){got.add(c);gBeep(true)}else{lives--;A.stage.dataset['x'+c]='1';gBeep(false)}draw()};
      draw()};next()},
  /* Đập chuột: đọc nghĩa, đập con chuột mang đúng từ */

    const svg=()=>`<svg viewBox="-110 -110 220 220" class="g-wsvg" style="transform:rotate(${angle}deg)">${seg.map((s,i)=>{const a0=i*45-90-22.5,a1=a0+45,r=100,p=(a)=>[r*Math.cos(a*Math.PI/180),r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);const tx=62*Math.cos((a0+22.5)*Math.PI/180),ty=62*Math.sin((a0+22.5)*Math.PI/180);
      return `<path d="M0 0L${x0.toFixed(1)} ${y0.toFixed(1)}A100 100 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${cols[i]}" stroke="#151521" stroke-width="2"/><text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${s.t.length>4?10:16}" font-weight="800" fill="${cols[i]==='#FCC539'?'#151521':'#fff'}" transform="rotate(${a0+22.5+90} ${tx.toFixed(1)} ${ty.toFixed(1)})">${s.t}</text>`}).join('')}<circle r="14" fill="#fff" stroke="#151521" stroke-width="3"/></svg>`;
    const home=(msg)=>{if(k>=spins)return A.finish(sc,Math.max(tot,1));A.stage.innerHTML=`<div class="g-wheel"><p class="g-prog">Lượt quay ${k+1}/${spins}${dbl?' · lượt này ×2!':''}</p><div class="g-wwrap"><div class="g-wptr">▼</div>${svg()}</div><div class="row" style="justify-content:center"><button type="button" class="btn hi g-spin">Quay!</button></div><p class="g-fb small">${msg||''}</p></div>`;
      A.stage.querySelector('.g-spin').onclick=e=>{e.target.disabled=true;const i=Math.floor(Math.random()*8);angle+=1080+((360-i*45)-(angle%360)+360)%360;const el=A.stage.querySelector('.g-wsvg');el.style.transition='transform 2.2s cubic-bezier(.2,.8,.2,1)';el.style.transform=`rotate(${angle}deg)`;setTimeout(()=>play(seg[i]),2300)}};
    const fin=ok=>{tot++;if(ok){sc++;A.add(dbl?2:1)}dbl=false;gBeep(ok);k++;setTimeout(()=>home(ok?'✓ Đúng!':'✗ Chưa đúng.'),ok?800:1900)};
    const play=s=>{if(s.k==='x2'){dbl=true;k++;gBeep(true);return home('🎁 Lượt sau được nhân đôi điểm!')}if(s.k==='p1'){A.add(1);k++;gBeep(true);return home('🎁 Được tặng 1 điểm!')}
      if(s.k==='tf'&&tf.length){const q=tf[Math.floor(Math.random()*tf.length)];A.stage.innerHTML=`<div class="g-tf"><p class="g-prog">Đúng hay sai?</p><p class="g-q">${esc(q.s)}</p><div class="g-tfb"><button type="button" class="g-yes" data-v="1">✓ Đúng</button><button type="button" class="g-no" data-v="0">✗ Sai</button></div><p class="g-fb small"></p></div>`;
        A.stage.querySelector('.g-tfb').onclick=e=>{const b=e.target.closest('button');if(!b)return;A.stage.querySelectorAll('.g-tfb button').forEach(x=>x.disabled=true);const ok=(+b.dataset.v===1)===q.ok;A.stage.querySelector('.g-fb').innerHTML=q.ok?'Câu này đúng.':'Sửa: <b>'+esc(q.fix)+'</b>';fin(ok)};return}
      const q=voc[Math.floor(Math.random()*voc.length)];
      if(s.k==='spell'&&G_WORD(q.w)){A.stage.innerHTML=`<div class="g-dict"><p class="g-prog">Chính tả: gõ từ có nghĩa là</p><p class="g-clue">${esc(q.m)}</p>${L.firstLetter?`<p class="small muted" style="text-align:center">Bắt đầu bằng "${esc(q.w[0])}", ${q.w.length} chữ cái</p>`:''}<input class="g-type" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gõ từ"><div class="row" style="justify-content:center"><button type="button" class="btn hi g-ok">Kiểm tra</button></div><p class="g-fb small"></p></div>`;
        const inp=A.stage.querySelector('.g-type');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')A.stage.querySelector('.g-ok').click()};A.stage.querySelector('.g-ok').onclick=e=>{e.target.disabled=true;const ok=inp.value.trim().toLowerCase()===q.w.toLowerCase();A.stage.querySelector('.g-fb').innerHTML='Đáp án: <b>'+esc(q.w)+'</b>';fin(ok)};return}
      const opts=G_SHUF([q,...G_SHUF(voc.filter(x=>x!==q)).slice(0,3)]);A.stage.innerHTML=`<div class="g-quiz"><p class="g-prog">Từ nào có nghĩa là</p><p class="g-q">${esc(q.m)}</p><div class="g-opts">${opts.map((o,j)=>`<button type="button" class="g-opt" data-j="${j}">${esc(o.w)}</button>`).join('')}</div><p class="g-fb small"></p></div>`;
      A.stage.querySelector('.g-opts').onclick=e=>{const b=e.target.closest('.g-opt');if(!b)return;A.stage.querySelectorAll('.g-opt').forEach((x,j)=>{x.disabled=true;if(opts[j]===q)x.classList.add('ok');else if(x===b)x.classList.add('bad')});fin(opts[+b.dataset.j]===q)}};
    home()}
});

/* ===== Game vận động: nghiêng đầu hoặc dịch người sang trái/phải để chọn đáp án (camera của máy) =====
   Hình ảnh camera chỉ được xử lý ngay trên máy (MediaPipe Face Landmarker chạy trong trình duyệt), không gửi đi đâu.
   Không có camera thì chơi bằng nút bấm hoặc phím mũi tên ← →. */
Object.assign(G_ICON,{motion:'flexed-biceps'});Object.assign(G_NAME,{motion:'Game vận động'});
const MP_VER='0.10.14';let MP_LM=null;
async function mpLoad(){if(MP_LM)return MP_LM;const vis=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
  const fs=await vis.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
  MP_LM=await vis.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1});return MP_LM}
G_PLAY.motion=function(spec,A){const L=spec.cfg||{};const tilt=spec.mode!=='lean';const qs=G_SHUF(spec.items).slice(0,L.mn||8);const secs=L.mtime||8;
  let k=0,sc=0,stream=null,raf=0,base=null,calib=[],state='idle',hold=null,tm=null,left=secs,video=null;
  const stop=()=>{cancelAnimationFrame(raf);clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(state!=='q')return;if(e.key==='ArrowLeft')choose('L');if(e.key==='ArrowRight')choose('R')};
  const how=tilt?'Nghiêng đầu sang TRÁI để chọn đáp án bên trái, nghiêng sang PHẢI để chọn đáp án bên phải. Xong mỗi câu, đưa đầu về thẳng.':'Bước người sang TRÁI hoặc PHẢI (cả đầu ra khỏi giữa khung hình) để chọn đáp án bên đó. Xong mỗi câu, quay về giữa.';
  A.stage.innerHTML=`<div class="g-mo"><div class="g-mo-intro">${em(tilt?'sparkles':'flexed-biceps','',64)}<h3>${tilt?'Nghiêng đầu chọn đáp án':'Bước sang trái – phải'}</h3><p>${how}</p>
    <p class="small muted">Camera chỉ dùng ngay trên máy này để nhận biết tư thế, không ghi hình và không gửi đi đâu. Nên đứng/ngồi cách màn hình khoảng 1 mét, đủ sáng.</p>
    <div class="row" style="justify-content:center"><button type="button" class="btn hi g-cam">📷 Bật camera và chơi</button><button type="button" class="btn ghost g-nocam">Chơi bằng nút bấm</button></div><p class="g-fb small"></p></div></div>`;
  const view=()=>{A.stage.innerHTML=`<div class="g-mo"><div class="g-mo-top"><p class="g-prog"></p><div class="g-bar"><i style="width:100%"></i></div></div><p class="g-q"></p>
    <div class="g-mo-row"><button type="button" class="g-mo-opt" data-s="L"><span class="arr">←</span><b></b></button><div class="g-mo-cam">${stream?'<video playsinline muted></video><div class="g-mo-meter"><i></i></div>':''}</div><button type="button" class="g-mo-opt" data-s="R"><b></b><span class="arr">→</span></button></div><p class="g-fb small"></p></div>`;
    if(stream){video=A.stage.querySelector('video');video.srcObject=stream;video.play().catch(()=>{})}
    A.stage.querySelector('.g-mo-row').onclick=e=>{const b=e.target.closest('.g-mo-opt');if(b&&state==='q')choose(b.dataset.s)}};
  const ask=()=>{clearInterval(tm);if(k>=qs.length){stop();return A.finish(sc,qs.length)}const q=qs[k];state=stream?'center':'q';left=secs;
    A.stage.querySelector('.g-prog').textContent=`Câu ${k+1}/${qs.length}`+(stream&&state==='center'?' · đưa đầu về giữa':'');A.stage.querySelector('.g-q').textContent=q.q;
    const [l,r]=A.stage.querySelectorAll('.g-mo-opt');l.className='g-mo-opt';r.className='g-mo-opt';l.querySelector('b').textContent=q.L;r.querySelector('b').textContent=q.R;A.stage.querySelector('.g-fb').textContent='';
    const bar=A.stage.querySelector('.g-bar i');tm=setInterval(()=>{if(state==='center')return;left-=.25;bar.style.width=Math.max(0,left/secs*100)+'%';if(left<=0)choose(null)},250)};
  const choose=s=>{if(state==='done')return;state='done';clearInterval(tm);const q=qs[k];const ok=s===q.ans;gBeep(ok);if(ok){sc++;A.add(1)}
    const opts=A.stage.querySelectorAll('.g-mo-opt');opts.forEach(o=>{if(o.dataset.s===q.ans)o.classList.add('ok');else if(o.dataset.s===s)o.classList.add('bad')});
    A.stage.querySelector('.g-fb').innerHTML=(ok?'✓ Đúng rồi! ':s===null?'⏰ Hết giờ. ':'✗ Chưa đúng. ')+(q.why?esc(q.why):'');k++;setTimeout(ask,ok?1100:2200)};
  const loop=async()=>{if(!stream||!A.stage.isConnected){stop();return}try{if(video&&video.readyState>=2){const r=MP_LM.detectForVideo(video,performance.now());const f=r.faceLandmarks&&r.faceLandmarks[0];
      if(f){const a=f[33],b=f[263],nz=f[1];const v=tilt?Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI:(nz.x-.5)*100;
        if(base===null){calib.push(v);if(calib.length>=15){base=calib.reduce((x,y)=>x+y,0)/calib.length;ask()}}
        else{const d=v-base;const th=tilt?14:13;const m=A.stage.querySelector('.g-mo-meter i');if(m)m.style.left=Math.max(0,Math.min(100,50-d*(tilt?1.6:1.8)))+'%';
          const side=d>th?'L':d<-th?'R':null;
          if(state==='center'&&!side){state='q';const pg=A.stage.querySelector('.g-prog');if(pg)pg.textContent=`Câu ${k+1}/${qs.length}`}
          else if(state==='q'&&side){if(!hold||hold.s!==side)hold={s:side,t:performance.now()};else if(performance.now()-hold.t>450){hold=null;choose(side)}
            A.stage.querySelectorAll('.g-mo-opt').forEach(o=>o.classList.toggle('lean',o.dataset.s===side))}
          else{hold=null;A.stage.querySelectorAll('.g-mo-opt').forEach(o=>o.classList.remove('lean'))}}}}}catch(e){}
    raf=requestAnimationFrame(loop)};
  A.stage.querySelector('.g-nocam').onclick=()=>{document.addEventListener('keydown',onKey);view();ask()};
  A.stage.querySelector('.g-cam').onclick=async e=>{const fb=A.stage.querySelector('.g-fb');e.target.disabled=true;fb.textContent='Đang bật camera và tải bộ nhận diện (lần đầu mất vài giây)…';
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});await mpLoad();document.addEventListener('keydown',onKey);view();
      A.stage.querySelector('.g-q').textContent=tilt?'Nhìn thẳng vào camera, giữ đầu thẳng 2 giây để máy làm quen…':'Đứng ở giữa khung hình 2 giây để máy làm quen…';A.stage.querySelector('.g-prog').textContent='Chuẩn bị';loop()}
    catch(err){stop();e.target.disabled=false;fb.textContent='Không bật được camera hoặc không tải được bộ nhận diện ('+(err&&err.name||'lỗi')+'). Em chơi bằng nút bấm nhé.'}};
};

/* ===== Bài theo dạng đề thi thật (rút gọn): mcq, cloze_mcq, gap_text (gồm nghe), transform, matching, order =====
   renderExam(box, block, saved, onDone). saved = kết quả lần trước (nếu có) để hiện lại. onDone({correct,total,answers}). */
const X_FMT={sentence_completion:'Hoàn thành câu',synonym:'Đồng nghĩa',antonym:'Trái nghĩa',dialogue_completion:'Hoàn thành hội thoại',pronunciation:'Phát âm',stress:'Trọng âm',
  error_id:'Tìm lỗi sai',sentence_combining:'Kết hợp câu',closest_meaning:'Câu gần nghĩa nhất',reading_mcq:'Đọc hiểu',cloze:'Điền từ vào đoạn văn',open_cloze:'Điền từ tự do',
  word_formation:'Cấu tạo từ trong đoạn văn',listening:'Nghe',transformation:'Viết lại câu',key_word:'Viết lại câu với từ cho sẵn',matching_headings:'Nối tiêu đề với đoạn',dialogue_order:'Sắp xếp hội thoại',mixed:'Đề thi thu nhỏ'};
const xU=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<u>$1</u>');
function xErr(q,opts){let html='',pos=0;opts.forEach((o,i)=>{const p=q.indexOf(o,pos);if(p<0)return;html+=esc(q.slice(pos,p))+`<u class="x-seg">${esc(o)}<sub>${'ABCD'[i]}</sub></u>`;pos=p+o.length});return html+esc(q.slice(pos))}
function xOk(val,it){const v=norm(val);if(!v)return false;return [it.answer].concat(it.accept||[]).some(a=>norm(a)===v)}
function xSpeak(text,btn,state){const synth=window.speechSynthesis;if(!synth||!window.SpeechSynthesisUtterance){btn.disabled=true;btn.textContent='Máy này không đọc được';return}
  if(state.plays>=2){return}synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;
  const vs=synth.getVoices();const v=vs.find(x=>/en-GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;
  u.onend=()=>{btn.disabled=state.plays>=2;btn.textContent=state.plays>=2?'Đã nghe 2 lần':'▶ Nghe lần 2'};
  state.plays++;btn.disabled=true;btn.textContent='Đang phát…';synth.speak(u)}

function renderExam(box,B,saved,onDone){
  const kind=B.kind,items=B.items||[];
  const perm=it=>B.format==='error_id'||!it.options?[0,1,2,3]:G_SHUF([0,1,2,3].slice(0,it.options.length));
  let body='';
  if(B.passage)body+=`<div class="passage">${esc(B.passage)}</div>`;
  if(kind==='mcq'){
    body+=items.map((it,i)=>{const q=B.format==='error_id'?xErr(it.q,it.options):esc(it.q).replace(/\n/g,'<br>');
      return `<div class="q x-item" data-i="${i}"><div class="qhead"><span class="qnum">${i+1}</span>${it.format?`<span class="review-mark">${esc(X_FMT[it.format]||it.format)}</span>`:''}</div><div class="qtext">${q}</div><div class="opts">${perm(it).map(j=>{const o=it.options[j];return `<label class="opt" data-i="${j}"><input type="radio" name="x${i}" value="${j}"><span>${B.format==='pronunciation'?xU(o):B.format==='error_id'?'ABCD'[j]+'. '+esc(o):esc(o)}</span></label>`}).join('')}</div><div class="fbslot"></div></div>`}).join('');
  }else if(kind==='cloze_mcq'){
    body+=`<div class="passage x-text">${esc(B.text).replace(/\[(\d+)\]/g,(m,n)=>`<b class="x-gap" data-g="${n-1}">(${n}) ____</b>`)}</div>`;
    body+=items.map((it,i)=>`<div class="q x-item" data-i="${i}"><div class="qhead"><span class="qnum">${i+1}</span></div><div class="opts row-opts">${perm(it).map(j=>`<label class="opt" data-i="${j}"><input type="radio" name="x${i}" value="${j}"><span>${esc(it.options[j])}</span></label>`).join('')}</div><div class="fbslot"></div></div>`).join('');
  }else if(kind==='gap_text'){
    if(B.format==='listening')body+=`<div class="x-listen"><button type="button" class="btn x-play">▶ Nghe lần 1</button><span class="small muted">Như đề thật, em được nghe 2 lần. Đọc trước phần ghi chú bên dưới.</span></div>`;
    body+=`<div class="passage x-text">${esc(B.text).replace(/\[(\d+)\]/g,(m,n)=>{const it=items[n-1]||{};return `<span class="x-inwrap"><b>(${n})</b><input class="x-in" data-i="${n-1}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chỗ trống ${n}">${it.base?`<i class="x-base">${esc(it.base)}</i>`:''}</span>`})}</div><div class="x-fbs"></div>`;
    if(B.format==='listening')body+=`<details class="x-script" hidden><summary>Xem lời bài nghe</summary><p>${esc(B.script)}</p></details>`;
  }else if(kind==='transform'){
    body+=items.map((it,i)=>`<div class="q x-item" data-i="${i}"><div class="qhead"><span class="qnum">${i+1}</span>${it.word?`<span class="x-key">${esc(it.word)}</span>`:''}</div><div class="qtext">${esc(it.q)}</div>
      <div class="x-tr"><span>${esc(it.start)}</span><input class="x-in" data-i="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Viết tiếp câu ${i+1}">${it.end?`<span>${esc(it.end)}</span>`:''}</div><div class="fbslot"></div></div>`).join('');
  }else if(kind==='matching'){
    body+=`<ol class="x-heads" type="A">${B.headings.map(h=>`<li>${esc(h)}</li>`).join('')}</ol>`;
    body+=B.paragraphs.map((p,i)=>`<div class="q x-item" data-i="${i}"><div class="qhead"><span class="qnum">${i+1}</span><select class="x-sel" data-i="${i}" aria-label="Tiêu đề cho đoạn ${i+1}"><option value="">Chọn tiêu đề…</option>${B.headings.map((h,j)=>`<option value="${j}">${'ABCDEF'[j]}</option>`).join('')}</select></div><div class="passage">${esc(p)}</div><div class="fbslot"></div></div>`).join('');
  }else if(kind==='order'){
    body+=`<div class="x-order"><p class="small muted">Lượt đầu đã đặt sẵn. Chạm các lượt lời còn lại theo đúng thứ tự; chạm lượt đã xếp để bỏ ra.</p><ol class="x-built"></ol><div class="x-pool"></div></div>`;
  }
  box.innerHTML=`<div class="x-intro"><p class="eyebrow">${esc(X_FMT[B.format]||B.format)}</p><h3>${esc(B.title_vi||'')}</h3><p class="small">${esc(B.intro_vi||'')}</p>${B.tip_vi?`<p class="x-tip small">${esc(B.tip_vi)}</p>`:''}</div>
   <form class="x-form">${body}<div class="sticky-submit"><button class="btn hi" type="submit">Chấm bài</button><span class="small muted x-msg"></span></div></form>`;
  const form=box.querySelector('form');wireOptionHighlight(form);
  // nghe
  const play=box.querySelector('.x-play');const lst={plays:0};if(play)play.onclick=()=>xSpeak(B.script,play,lst);
  // cloze: hiện lựa chọn vào chỗ trống
  if(kind==='cloze_mcq')form.addEventListener('change',e=>{const r=e.target;if(r.type!=='radio')return;const i=+r.name.slice(1);const g=form.querySelector(`.x-gap[data-g="${i}"]`);if(g)g.textContent=`(${i+1}) ${items[i].options[+r.value]}`});
  // sắp xếp hội thoại
  let ord=null;
  if(kind==='order'){const lines=B.lines;ord=[0];const pool=G_SHUF(lines.map((l,i)=>i).slice(1));
    const draw=()=>{form.querySelector('.x-built').innerHTML=ord.map((i,j)=>`<li><button type="button" class="x-line ${j===0?'fixed':''}" data-o="${j}" ${j===0?'disabled':''}>${esc(lines[i])}</button></li>`).join('');
      form.querySelector('.x-pool').innerHTML=pool.filter(i=>!ord.includes(i)).map(i=>`<button type="button" class="x-line" data-p="${i}">${esc(lines[i])}</button>`).join('')};
    draw();form.querySelector('.x-order').onclick=e=>{const p=e.target.closest('[data-p]'),o=e.target.closest('[data-o]');if(form.dataset.done)return;if(p){ord.push(+p.dataset.p);draw()}else if(o&&+o.dataset.o>0){ord.splice(+o.dataset.o,1);draw()}}}
  const grade=()=>{let correct=0,total=0;const answers={};
    if(kind==='mcq'||kind==='cloze_mcq'){items.forEach((it,i)=>{total++;const r=form.querySelector(`input[name="x${i}"]:checked`);const v=r?+r.value:null;answers[i]=v;const ok=v===it.answer;if(ok)correct++;
      const q=form.querySelector(`.x-item[data-i="${i}"]`);q.querySelectorAll('.opt').forEach(o=>{const j=+o.dataset.i;o.classList.remove('sel');if(j===it.answer)o.classList.add('right');else if(j===v)o.classList.add('wrong')});

    achSo:Math.min(ACH_CAP,scoreFromHours(h,'so')+adj),achCnn:Math.min(ACH_CAP,scoreFromHours(h,'cnn')+adj)};
}
function schoolInputs(){
  const P=S.school;const E=englishEstimate(P.mode,P.grade);
  const val=(v,d)=>v==null||v===''||isNaN(v)?d:+v;
  const achSo=val(P.achSo,E.achSo), achCnn=val(P.achCnn,E.achCnn);
  return {E,
    toan:val(P.toan,8), van:val(P.van,8), toanSet:P.toan!=null&&P.toan!=='', vanSet:P.van!=null&&P.van!=='',
    achSo, achCnn, acSo:val(P.acSo,Math.min(10,achSo+2.5)), acCnn:val(P.acCnn,Math.min(9.5,achCnn))};
}
/* total, cut-off spread and chance for one option; bump = extra points needed (NV2 rule) */
function evalOption(o,I,bump){
  bump=bump||0;
  const mean=o.cut.reduce((a,b)=>a+b,0)/o.cut.length;
  const sample=o.cut.length>1?Math.sqrt(o.cut.reduce((s,c)=>s+(c-mean)*(c-mean),0)/(o.cut.length-1)):0;
  const sdCut=o.cut.length>2?sample:Math.max(o.sdDefault||1.3,sample);
  let total,sdInd,acSlope,ach,ac;
  if(o.f==='so'){ach=I.achSo;ac=I.acSo;total=I.toan+I.van+ac+2*ach;sdInd=1.5;acSlope=ac<10?1:0}
  else if(o.f==='cnn'){ach=I.achCnn;ac=I.acCnn;total=I.toan+I.van+ac+2*ach;sdInd=1.5;acSlope=ac<9.5?1:0}
  else{ach=I.achSo;ac=I.acSo;total=2*ach+ac;sdInd=1.3;acSlope=ac<10?1:0}
  const sdProj=(2+acSlope)*I.E.sd;
  const sd=Math.sqrt(sdCut*sdCut+sdInd*sdInd+sdProj*sdProj);
  const bar=mean+bump;
  const p=phi((total-bar)/sd);
  const need80=bar+0.84*sd;
  const tvNeed=o.f==='sp'?null:need80-(ac+2*ach);
  const cls=p>=0.8?'good':p>=0.5?'hi':p>=0.2?'warn':'bad';
  const lab=p>=0.8?'An toàn':p>=0.5?'Vừa sức':p>=0.2?'Thử thách':'Còn xa';
  return {o,mean,sdCut,total,p,need80,tvNeed,cls,lab,bump,max:o.f==='sp'?30:50};
}
/* One suggestion per exam. The three exams are on different days, so a student can sit all of them.
   Within one exam every option uses the same scores: the chance of at least one place = the best single chance. */
function portfolio(rows,I,langs){
  const rank=r=>{const i=langs.indexOf(r.o.lang);return i<0?99:i};
  const pickBest=list=>{const ok=list.filter(r=>r.p>=0.5).sort((a,b)=>rank(a)-rank(b)||b.mean-a.mean);return ok[0]||list.slice().sort((a,b)=>b.p-a.p)[0]};
  const plan=[];
  ['so','sp','cnn'].forEach(ex=>{
    const list=rows.filter(r=>r.o.exam===ex);if(!list.length)return;
    let picks=[];
    if(ex==='so'){
      const anh=list.filter(r=>r.o.group==='nv');
      const nv1=pickBest(anh);if(!nv1)return;picks.push(Object.assign({},nv1,{role:'Nguyện vọng 1'}));
      // NV2 is a back-up: only schools with a lower cut-off than NV1, judged with the extra 1 point
      const others=anh.filter(r=>r.o.sk!==nv1.o.sk&&r.mean<nv1.mean).map(r=>evalOption(r.o,I,1.0));
      const nv2=others.filter(r=>r.p>=0.8).sort((a,b)=>b.mean-a.mean)[0]||others.sort((a,b)=>b.p-a.p)[0];
      if(nv2)picks.push(Object.assign({},nv2,{role:'Nguyện vọng 2 (phải hơn điểm chuẩn 1 điểm)'}));
      const schools=picks.map(r=>r.o.sk);
      list.filter(r=>r.o.group==='extra'&&schools.includes(r.o.sk)).forEach(r=>picks.push(Object.assign({},r,{role:'Đăng ký thêm, xét bằng điểm chuyên Anh'})));
    }else{
      const b=pickBest(list);if(b)picks.push(Object.assign({},b,{role:'Lớp đăng ký'}));
    }
    plan.push({exam:ex,label:(EXAMS[ex]||{}).label||ex,date:(EXAMS[ex]||{}).date||'',picks,p:Math.max(...picks.map(r=>r.p))});
  });
  // the exams are on different days: sit every exam where the best class gives a real chance (≥20%)
  const chosen=plan.filter(e=>e.p>=0.2);
  chosen.forEach(e=>{e.tier=e.p>=0.5?'Nên thi':'Có thể thử'});
  const pAny=1-chosen.reduce((m,e)=>m*(1-e.p),1);
  return {plan,chosen,pAny};
}

/* ----- kết nối máy chủ của cô (Google Apps Script) -----
   Chèn vào template.html bởi build.py. Dùng: S, save, saveLocal, $, esc, M, go, DAYS, agg, efficiency, summary, LEVELS, renderDay. */
const API = "";
function cloudOn(){return !!(API&&S.code)}
async function api(action,data){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data||{}))});
  const j=await r.json();
  if(!j.ok){const e=new Error(j.error||'error');e.code=j.error;throw e}
  return j;
}
const ERR_VI={bad_code:'Mã học sinh không đúng. Em kiểm tra lại mã cô gửi nhé.',image_too_big:'Ảnh quá lớn, em chụp lại nhé.',too_many_images:'Mỗi lần gửi tối đa 6 ảnh.',no_images:'Em chưa chọn ảnh nào.'};

/* ---- đồng bộ tiến độ ---- */
let syncTimer=null,syncing=false,syncState='';
function kpi(){
  const A=agg(),eff=efficiency(A);let w=0,p=0;
  for(let i=1;i<=14;i++){const d=S.days[i];if(d&&d.web)w++;if(d&&d.paper)p++}
  const pc=a=>a&&a[1]?Math.round(1000*a[0]/a[1])/1000:null;
  return {daysWeb:w,daysPaper:p,webAcc:pc(A.web),retryAcc:pc(A.retry),mastered:A.mastered,eff:eff.f,entryLevel:S.diag?S.diag.level:'',finalLevel:S.final?S.final.level:'',planMin:S.plan.min,planDpw:S.plan.dpw};
}
function scheduleSync(){if(!cloudOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(doSync,2000)}
async function doSync(){
  if(!cloudOn()||syncing)return;syncing=true;setSync('sending');
  try{await api('sync',{code:S.code,state:S,kpi:kpi(),sum:summary()});S.syncedAt=Date.now();saveLocal();setSync('ok')}
  catch(e){setSync(e.code==='bad_code'?'badcode':'fail')}
  finally{syncing=false}
}

      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const d=c.toDataURL('image/jpeg',0.8);res({mime:'image/jpeg',data:d.split(',')[1],preview:d})};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url});
}

async function pack(obj){
  const json=JSON.stringify(obj);
  try{ if(typeof CompressionStream!=='undefined'){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let s='';buf.forEach(b=>s+=String.fromCharCode(b));return 'Z'+btoa(s)} }catch(e){}
  return 'J'+btoa(unescape(encodeURIComponent(json)));
}
async function unpack(code){
  code=code.trim().replace(/\s+/g,'');const t=code[0],b=code.slice(1);
  if(t==='Z'){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(ds).text())}
  if(t==='J')return JSON.parse(decodeURIComponent(escape(atob(b))));
  throw new Error('bad');
}
function summary(){
  const A=agg();const eff=efficiency(A);const entry=S.diag;
  const days={};for(let i=1;i<=14;i++){const r=S.days[i];if(r){const g=Object.values(r.games||{}),x=Object.values(r.exam||{});days[i]=[r.web?r.web.correct:null,r.web?r.web.total:null,r.paper?r.paper.correct:null,r.paper?r.paper.total:null,r.web?r.web.at:(r.paper?r.paper.at:(g.length?Math.max(...g.map(y=>y.at)):null)),g.reduce((t,y)=>t+(y.stars||0),0),g.length,x.length?x.reduce((t,y)=>t+y.correct,0):null,x.length?x.reduce((t,y)=>t+y.total,0):null,...(()=>{const l=Object.values(r.listen||{});return l.length?[l.reduce((t,y)=>t+y.correct,0),l.reduce((t,y)=>t+y.total,0)]:[null,null]})()]}}
  const wrong=Object.entries(S.queue).map(([id,q])=>[id,q.wrong||1]);
  return {v:1,n:S.name,d:S.diag&&{t:S.diag.total,o:S.diag.of,l:S.diag.level,b:S.diag.bands},f:S.final&&{t:S.final.total,o:S.final.of,l:S.final.level,b:S.final.bands},days,sk:A.skills,rt:A.retry,mq:A.mastered,q:wrong,p:S.plan,e:eff.f,sd:A.studyDays,sp:A.span,tr:curTrack(),at:Date.now()};
}

function wireReset(){$('#rs1').onclick=()=>{$('#rs2').hidden=false};$('#rs2').onclick=()=>{S=blank();saveLocal();go('start')}}
function reportHTML(o){
  const lv=k=>(LEVELS.find(l=>l.k===k)||{name:'—'}).name;
  const rows=Object.entries(o.days||{}).map(([d,r])=>`<tr><td>${d}</td><td>${esc(DAYS[d-1].theme_vi)}</td><td>${r[0]!=null?r[0]+'/'+r[1]:'—'}</td><td>${r[2]!=null?r[2]+'/'+r[3]:'—'}</td><td>${r[4]?new Date(r[4]).toLocaleDateString('vi-VN'):'—'}</td></tr>`).join('');
  const sk=Object.entries(o.sk||{}).map(([k,v])=>bar(SKILL_VI[k]||k,v[0],v[1])).join('');
  const weak=(o.q||[]).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,w])=>{const it=ITEM[id];return it?`<li>Buổi ${it.day} · ${esc(it.q)} <span class="muted">(sai ${w} lần, đáp án: ${esc(answerText(it))})</span></li>`:''}).join('');
  const entryH=o.d?ENTRY_H[o.d.l]:null;
  let need='';if(entryH){const r=requiredMin(entryH,750,o.e||1,MILESTONES[2].date,(o.p&&o.p.dpw)||6);need=`Ước tính cần khoảng ${Math.ceil(r/5)*5} phút/ngày × ${(o.p&&o.p.dpw)||6} ngày/tuần để đạt C1 trước kỳ thi.`}
  return `<div class="card" style="margin-top:12px"><h3>${esc(o.n||'Học sinh')}</h3>
   <p>Đầu vào: <b>${o.d?o.d.t+'/'+o.d.o+' · '+lv(o.d.l):'chưa làm'}</b> · Sau 2 tuần: <b>${o.f?o.f.t+'/'+o.f.o+' · '+lv(o.f.l):'chưa làm'}</b></p>
   <p class="small">Học ${o.sd||0} ngày trong ${o.sp||0} ngày · Câu từng sai làm lại đúng ${o.rt&&o.rt[1]?Math.round(100*o.rt[0]/o.rt[1])+'%':'—'} · Đã nhớ chắc ${o.mq||0} câu · Hệ số hiệu quả ${o.e||1} · Lịch đang chọn ${o.p?o.p.min+' phút × '+o.p.dpw+' ngày':'—'}</p>
   <p class="small">${need}</p>
   <div class="bars">${sk}</div>
   <div class="tbl-wrap"><table><thead><tr><th>Buổi</th><th>Chủ đề</th><th>Web</th><th>Giấy</th><th>Ngày</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Chưa có buổi nào.</td></tr>'}</tbody></table></div>
   ${weak?`<h3 style="font-size:1.05rem">Câu còn trong vòng ôn (sai nhiều nhất)</h3><ul class="small">${weak}</ul>`:''}
   <p class="small muted">Mã tạo lúc ${new Date(o.at).toLocaleString('vi-VN')}.</p></div>`;
}

/* ---------- boot ---------- */
go(S.diag?(dayStatus(1)==='none'?'start':'days'):'start');
if(cloudOn()){loadMy().catch(()=>{});if(!S.syncedAt||(S.savedAt||0)>S.syncedAt)doSync()}
})();
</script>
