singing competition ______ on TV every Saturday night.", "options": ["broadcasts", "is broadcast", "was broadcasting", "broadcasted"], "answer": 1, "explain_vi": "Cuộc thi được phát sóng → bị động hiện tại đơn: is broadcast (V3 của broadcast vẫn là broadcast).", "tag": "d8g"}, {"id": "d9q11", "type": "mcq", "skill": "review", "from_day": 6, "q": "When we arrived at the bus station, we ______ wait for an hour because the bus was late.", "options": ["must", "should", "had to", "can"], "answer": 2, "explain_vi": "Việc bắt buộc do hoàn cảnh trong quá khứ → had to (must không có dạng quá khứ).", "tag": "d6g"}, {"id": "d9q12", "type": "text", "skill": "review", "from_day": 3, "q": "Điền 1 động từ bắt đầu bằng 'r', nghĩa là 'giảm bớt': We can ______ waste by bringing our own lunch boxes to school.", "answer": "reduce", "accept": ["reduce"], "explain_vi": "reduce = giảm bớt; sau 'can' dùng động từ nguyên thể.", "tag": "d3v7"}], "can_do_vi": ["Em có thể dùng 8 từ mới và 2 cụm động từ (eat out, run out of) để nói về món ăn, lễ hội và phong tục.", "Em có thể phân biệt danh từ đếm được/không đếm được, dùng đúng much/many/a few/a little/plenty of và mạo từ a/an/the.", "Em có thể tạo danh từ đuôi -ness/-ity và tìm từ đồng nghĩa trong bài thi."]}, {"day": 10, "type": "normal", "theme_en": "Work & jobs", "theme_vi": "Công việc và nghề nghiệp", "goal_vi": "Hôm nay em sẽ học các từ để nói về nghề nghiệp và ước mơ tương lai của mình. Em cũng sẽ làm quen với câu điều kiện loại 0, 1, 2 – một chủ điểm rất hay gặp trong đề thi chuyên đấy!", "minutes": 30, "vocab": [{"id": "d10v1", "word": "career", "pos": "n", "ipa": "/kəˈrɪə(r)/", "meaning_vi": "sự nghiệp, nghề nghiệp (lâu dài)", "example": "My aunt had a long career as a nurse.", "family": "career-minded (adj)"}, {"id": "d10v2", "word": "skill", "pos": "n", "ipa": "/skɪl/", "meaning_vi": "kỹ năng", "example": "Cooking is a useful skill for everyone.", "family": "skilful (adj), skilled (adj), unskilled (adj)"}, {"id": "d10v3", "word": "employ", "pos": "v", "ipa": "/ɪmˈplɔɪ/", "meaning_vi": "thuê, tuyển dụng (ai đó làm việc)", "example": "The new hotel will employ fifty local people.", "family": "employer (n), employee (n), employment (n), unemployed (adj)"}, {"id": "d10v4", "word": "experience", "pos": "n", "ipa": "/ɪkˈspɪəriəns/", "meaning_vi": "kinh nghiệm; trải nghiệm", "example": "She has three years of experience in teaching.", "family": "experienced (adj), inexperienced (adj)"}, {"id": "d10v5", "word": "responsible", "pos": "adj", "ipa": "/rɪˈspɒnsəbl/", "meaning_vi": "có trách nhiệm; chịu trách nhiệm (for)", "example": "Who is responsible for cleaning the classroom today?", "family": "responsibility (n), irresponsible (adj)"}, {"id": "d10v6", "word": "apply", "pos": "v", "ipa": "/əˈplaɪ/", "meaning_vi": "nộp đơn, ứng tuyển (for)", "example": "My brother applied for a job at a bookshop.", "family": "application (n), applicant (n)"}, {"id": "d10v7", "word": "colleague", "pos": "n", "ipa": "/ˈkɒliːɡ/", "meaning_vi": "đồng nghiệp", "example": "Dad often talks about his colleagues at dinner.", "family": "colleagues (n, số nhiều)"}, {"id": "d10v8", "word": "ambition", "pos": "n", "ipa": "/æmˈbɪʃn/", "meaning_vi": "hoài bão, khát vọng", "example": "Her ambition is to become a pilot.", "family": "ambitious (adj)"}], "phrasal": [{"id": "d10p1", "phrase": "carry on", "meaning_vi": "tiếp tục (làm gì) – carry on + V-ing / carry on with sth", "example": "Please carry on working while I make a phone call."}, {"id": "d10p2", "phrase": "turn down", "meaning_vi": "từ chối (lời mời, lời đề nghị); vặn nhỏ (âm lượng)", "example": "He turned down the job because it was too far from home."}], "grammar": {"id": "d10g", "title": "Conditionals type 0, 1, 2", "rule_vi": ["Loại 0 – sự thật luôn đúng: If + hiện tại đơn, hiện tại đơn. (If you heat ice, it melts.)", "Loại 1 – việc có thể xảy ra ở hiện tại/tương lai: If + hiện tại đơn, will/can + V nguyên mẫu.", "Loại 2 – việc không có thật hoặc khó xảy ra ở hiện tại: If + quá khứ đơn, would/could + V nguyên mẫu.", "Ở loại 2, động từ 'be' dùng 'were' cho mọi ngôi (If I were you...). 'was' cũng gặp trong văn nói, nhưng khi làm bài thi em nên chọn 'were'.", "Mệnh đề If có thể đứng trước hoặc sau. Nếu đứng trước thì có dấu phẩy: If it rains, we'll stay home. = We'll stay home if it rains."], "examples": ["If you mix blue and yellow, you get green.", "If you finish your homework early, we will go to the park.", "If I had a lot of money, I would build a library for my village."], "common_mistake_vi": "Không dùng 'will' trong mệnh đề If. Sai: If it will rain tomorrow, we will stay at home. Đúng: If it rains tomorrow, we will stay at home."}, "wordform": {"id": "d10w", "focus": "-ise, -ify, -en", "rule_vi": "Thêm -ise, -ify hoặc -en vào sau tính từ/danh từ để tạo ra ĐỘNG TỪ (nghĩa: làm cho...). Tiếng Anh-Anh viết -ise (realise), tiếng Anh-Mỹ viết -ize (realize) – cả hai đều đúng.", "examples": [["modern", "modernise"], ["real", "realise"], ["pure", "purify"], ["class", "classify"], ["wide", "widen"], ["short", "shorten"]]}, "paper": {"A_vocab": {"instruction_vi": "Chọn từ thích hợp trong khung để điền vào chỗ trống. Mỗi từ dùng một lần, có 2 từ thừa nhé.", "bank": ["ambition", "employs", "responsible", "apply", "skills", "career", "colleague", "carry on"], "items": [{"id": "d10A1", "q": "My uncle's ______ is to open his own restaurant one day.", "answer": "ambition", "tag": "d10v8"}, {"id": "d10A2", "q": "The factory near my house ______ more than three hundred workers.", "answer": "employs", "tag": "d10v3"}, {"id": "d10A3", "q": "Who is ______ for feeding the cat while we are on holiday?", "answer": "responsible", "tag": "d10v5"}, {"id": "d10A4", "q": "If you want to join the school newspaper, you need to ______ for a place before Friday.", "answer": "apply", "tag": "d10v6"}, {"id": "d10A5", "q": "Good communication ______ are important in almost every job.", "answer": "skills", "tag": "d10v2"}, {"id": "d10A6", "q": "She had a long and successful ______ in banking before she retired.", "answer": "career", "tag": "d10v1"}]}, "B_grammar": {"instruction_vi": "Chia động từ trong ngoặc theo câu điều kiện loại 0, 1 hoặc 2. Em nhìn kỹ động từ ở vế còn lại để đoán loại câu nhé.", "items": [{"id": "d10B1", "q": "If you heat ice, it ______ (melt).", "answer": "melts", "tag": "d10g"}, {"id": "d10B2", "q": "If it rains tomorrow, we ______ (play) indoors.", "answer": "will play", "accept": ["'ll play"], "tag": "d10g"}, {"id": "d10B3", "q": "If I ______ (be) taller, I would join the basketball team.", "answer": "were", "accept": ["was"], "tag": "d10g"}, {"id": "d10B4", "q": "If Nam ______ (not hurry), he will miss the bus.", "answer": "doesn't hurry", "accept": ["does not hurry"], "tag": "d10g"}, {"id": "d10B5", "q": "If I had more free time, I ______ (learn) to play the guitar.", "answer": "would learn", "accept": ["'d learn"], "tag": "d10g"}, {"id": "d10B6", "q": "Plants die if they ______ (not get) enough water.", "answer": "don't get", "accept": ["do not get"], "tag": "d10g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay các đáp án đều là động từ đuôi -ise, -ify hoặc -en.", "items": [{"id": "d10C1", "q": "The city plans to ______ the road because the traffic is getting heavier. (WIDE)", "answer": "widen", "tag": "d10w"}, {"id": "d10C2", "q": "Scientists ______ animals into different groups, such as mammals and birds. (CLASS)", "answer": "classify", "tag": "d10w"}, {"id": "d10C3", "q": "I didn't ______ how late it was until my mum called me. (REAL)", "answer": "realise", "accept": ["realize"], "tag": "d10w"}, {"id": "d10C4", "q": "Can you ______ this report? It's too long for our presentation. (SHORT)", "answer": "shorten", "tag": "d10w"}]}, "D_exam": {"format": "dialogue", "instruction_vi": "Hoàn thành đoạn hội thoại: chọn câu đáp phù hợp nhất (A, B, C hoặc D). Mẹo: em hãy đọc kỹ câu của người thứ nhất và tự hỏi 'người ta đang chúc, mời, xin lỗi hay kể chuyện?'.", "items": [{"id": "d10D1", "q": "Lan: 'I've got a job interview tomorrow and I'm really nervous.' – Minh: '______'", "options": ["Good luck! I'm sure you'll do well.", "Congratulations on your new job!", "Never mind. It doesn't matter.", "Yes, I'd love to."], "answer": "A", "tag": "fmt:dialogue_completion"}, {"id": "d10D2", "q": "Teacher: 'Would you like to help organise the school career day?' – Student: '______'", "options": ["No, I don't like you.", "Yes, I'd be happy to. What do I need to do?", "I'm fine, thank you.", "It's very kind of me."], "answer": "B", "tag": "fmt:dialogue_completion"}, {"id": "d10D3", "q": "Hùng: 'Sorry, shall I stop reading here?' – Teacher: '______'", "options": ["Yes, please turn it down.", "You're welcome.", "Same to you.", "No, please carry on. You're doing well."], "answer": "D", "tag": "fmt:dialogue_completion"}, {"id": "d10D4", "q": "Linh: 'They offered me a part-time job, but I turned it down.' – Nga: '______'", "options": ["Great! When do you start?", "Yes, please.", "Really? Why did you say no?", "Let's turn it down together."], "answer": "C", "tag": "fmt:dialogue_completion"}]}, "E_reading": {"id": "d10r", "title": "Two Weeks at the Animal Clinic", "instruction_vi": "Đọc đoạn văn rồi làm bài. Câu 1–2: chọn True (đúng), False (sai) hoặc Not Given (bài không nói đến). Câu 3–4: chọn A, B, C hoặc D.", "text": "Last summer, fifteen-year-old Khoa spent two weeks helping at a small animal clinic near his home. He did not get paid, but he wanted some real experience because his ambition is to become a vet. On his first morning, the head vet, Dr Thu, gave him one simple rule: 'If you are not sure, ask.' Khoa was responsible for cleaning the cages and feeding the cats. It was not exciting work, but he soon learned an important skill: staying calm when animals were frightened. Dr Thu's colleagues were friendly and always explained what they were doing. One afternoon, a dog arrived with a badly injured leg, and Khoa watched the whole team work together for over an hour. That evening he told his parents, 'If I worked there every day, I would learn so much!' At the end of the two weeks, the clinic invited him to come back next summer. He did not turn the offer down.", "items": [{"id": "d10E1", "kind": "tfng", "q": "Khoa received money for his work at the clinic.", "answer": "False", "tag": "d10r"}, {"id": "d10E2", "kind": "tfng", "q": "Khoa already has a pet dog at home.", "answer": "Not Given", "tag": "d10r"}, {"id": "d10E3", "kind": "mcq", "q": "What was Khoa's main job at the clinic?", "options": ["treating injured animals", "answering the phone", "cleaning the cages and feeding the cats", "training dogs"], "answer": "C", "tag": "d10r"}, {"id": "d10E4", "kind": "mcq", "q": "'He did not turn the offer down' means that Khoa ______.", "options": ["refused to go back", "forgot about the offer", "made the music quieter", "accepted the invitation"], "answer": "D", "tag": "d10r"}]}, "F_writing": {"task_en": "Write about a job you would like to do in the future. Say why you want this job, what skills it needs, and what you will do to get it. Use at least one conditional sentence.", "task_vi": "Viết về một nghề em muốn làm trong tương lai: vì sao em thích nghề đó, nghề đó cần kỹ năng gì, và em sẽ làm gì để đạt được ước mơ. Dùng ít nhất một câu điều kiện nhé.", "min_words": 50, "model": "When I grow up, I want to be a doctor. My ambition is to help sick people in my town. A good doctor needs many skills, for example, listening carefully and staying calm. If I study hard at school, I will get into a good medical university. If I were a doctor now, I would visit poor villages and treat people for free. I know it is a long journey, but I will carry on.", "checklist_vi": ["Em đã nói rõ nghề em muốn làm và lý do chưa?", "Em đã dùng ít nhất 3 từ mới của hôm nay (career, skill, ambition, experience...)?", "Câu điều kiện của em đã đúng thì chưa? (If + hiện tại đơn → will; If + quá khứ đơn → would)", "Em đã viết đủ 50 từ trở lên chưa?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – em làm 4 câu ôn lại kiến thức của các buổi trước nhé. Chữ cái gợi ý (nếu có) là chữ cái đầu của đáp án.", "items": [{"id": "d10G1", "q": "Rice, eggs and spring onions are the main ______ in this fried rice dish. (i______)", "answer": "ingredients", "from_day": 9, "tag": "d9v3"}, {"id": "d10G2", "q": "There isn't ______ milk left in the fridge. (much / many)", "answer": "much", "from_day": 9, "tag": "d9g"}, {"id": "d10G3", "q": "I'm looking forward to ______ (see) my grandparents next week.", "answer": "seeing", "from_day": 6, "tag": "d6p2"}, {"id": "d10G4", "q": "Be careful! You ______ (drop) those plates!", "answer": "are going to drop", "accept": ["'re going to drop"], "from_day": 4, "tag": "d4g"}]}}, "web_check": [{"id": "d10q1", "type": "text", "skill": "vocab", "q": "The hotel wants a receptionist with at least one year of e______.", "answer": "experience", "accept": [], "explain_vi": "'experience' = kinh nghiệm (danh từ không đếm được). 'one year of experience' = một năm kinh nghiệm.", "tag": "d10v4"}, {"id": "d10q2", "type": "mcq", "skill": "vocab", "q": "My mum often has lunch with her ______ from the office.", "options": ["careers", "colleagues", "ambitions", "skills"], "answer": 1, "explain_vi": "'colleagues' = đồng nghiệp – những người làm cùng cơ quan với mẹ.", "tag": "d10v7"}, {"id": "d10q3", "type": "mcq", "skill": "vocab", "q": "Minh was offered a part-time job, but he ______ because it was too far from his home.", "options": ["turned it down", "carried it on", "turned down it", "applied it"], "answer": 0, "explain_vi": "'turn down' = từ chối. Khi tân ngữ là đại từ (it), đại từ phải đứng giữa: turn it down (không nói turn down it).", "tag": "d10p2"}, {"id": "d10q4", "type": "mcq", "skill": "grammar", "q": "If you press this button, the machine ______.", "options": ["stopped", "would stop", "stopping", "stops"], "answer": 3, "explain_vi": "Câu điều kiện loại 0 (sự thật luôn đúng): If + hiện tại đơn, hiện tại đơn → stops.", "tag": "d10g"}, {"id": "d10q5", "type": "mcq", "skill": "grammar", "q": "If I ______ ten million dong, I would buy a new bike.", "options": ["have", "will have", "had", "am having"], "answer": 2, "explain_vi": "Vế sau có 'would buy' → câu điều kiện loại 2: If + quá khứ đơn → had.", "tag": "d10g"}, {"id": "d10q6", "type": "text", "skill": "grammar", "q": "If Lan ______ (study) hard, she will pass the test.", "answer": "studies", "accept": [], "explain_vi": "Câu điều kiện loại 1: If + hiện tại đơn. Chủ ngữ số ít 'Lan' → studies (y → ies).", "tag": "d10g"}, {"id": "d10q7", "type": "mcq", "skill": "wordform", "q": "We need to ______ the river water before we drink it. (PURE)", "options": ["purify", "pureness", "purely", "purity"], "answer": 0, "explain_vi": "Sau 'need to' cần động từ. pure + -ify → purify (làm sạch).", "tag": "d10w"}, {"id": "d10q8", "type": "text", "skill": "wordform", "q": "This photo is too dark. Can you ______ it a little? (BRIGHT)", "answer": "brighten", "accept": [], "explain_vi": "Sau 'Can you' cần động từ. bright + -en → brighten (làm sáng lên).", "tag": "d10w"}, {"id": "d10q9", "type": "mcq", "skill": "exam", "q": "A: 'If you need any help with your application form, just ask me.' – B: '______'", "options": ["You're welcome.", "Yes, I am.", "Not at all.", "Thanks, that's very kind of you."], "answer": 3, "explain_vi": "Khi ai đó đề nghị giúp mình, ta cảm ơn: 'Thanks, that's very kind of you.' 'You're welcome' là câu đáp lại lời cảm ơn.", "tag": "fmt:dialogue_completion"}, {"id": "d10q10", "type": "mcq", "skill": "review", "from_day": 9, "q": "We've run ______ sugar, so I can't make the cake.", "options": ["out", "off", "out of", "down of"], "answer": 2, "explain_vi": "'run out of + danh từ' = hết (cái gì). Phải có đủ 'out of'.", "tag": "d9p2"}, {"id": "d10q11", "type": "mcq", "skill": "review", "from_day": 6, "q": "You ______ wear a seat belt in the car. It's the law.", "options": ["can", "would", "must", "could"], "answer": 2, "explain_vi": "'must' diễn tả sự bắt buộc (luật lệ). 'can/could' chỉ khả năng hoặc sự cho phép.", "tag": "d6g"}, {"id": "d10q12", "type": "text", "skill": "review", "from_day": 4, "q": "Please s______ off the lights when you leave the room.", "answer": "switch", "accept": [], "explain_vi": "'switch off' = tắt (đèn, máy). Câu mệnh lệnh dùng động từ nguyên mẫu: switch.", "tag": "d4p1"}], "can_do_vi": ["Em có thể nói về nghề nghiệp và ước mơ của mình bằng các từ career, skill, ambition, experience...", "Em có thể dùng đúng câu điều kiện loại 0, 1 và 2.", "Em có thể tạo động từ bằng đuôi -ise, -ify, -en và chọn câu đáp phù hợp trong hội thoại."]}, {"day": 11, "type": "normal", "theme_en": "People & relationships", "theme_vi": "Con người và các mối quan hệ", "goal_vi": "Hôm nay em sẽ học các từ để miêu tả tính cách con người và các mối quan hệ quanh em. Em cũng sẽ học mệnh đề quan hệ với who, which, that, whose, where để nối câu thật gọn và hay!", "minutes": 30, "vocab": [{"id": "d11v1", "word": "personality", "pos": "n", "ipa": "/ˌpɜːsəˈnæləti/", "meaning_vi": "tính cách", "example": "My sister has a warm and friendly personality.", "family": "personal (adj), person (n)"}, {"id": "d11v2", "word": "generous", "pos": "adj", "ipa": "/ˈdʒenərəs/", "meaning_vi": "hào phóng, rộng lượng", "example": "It was generous of you to share your lunch with me.", "family": "generosity (n), generously (adv)"}, {"id": "d11v3", "word": "honest", "pos": "adj", "ipa": "/ˈɒnɪst/", "meaning_vi": "trung thực, thật thà", "example": "Please be honest and tell me what you really think.", "family": "honesty (n), dishonest (adj), honestly (adv)"}, {"id": "d11v4", "word": "support", "pos": "v, n", "ipa": "/səˈpɔːt/", "meaning_vi": "ủng hộ, hỗ trợ; sự ủng hộ", "example": "My friends always support me when I feel nervous.", "family": "supportive (adj), supporter (n)"}, {"id": "d11v5", "word": "argue", "pos": "v", "ipa": "/ˈɑːɡjuː/", "meaning_vi": "cãi nhau, tranh cãi (with sb, about sth)", "example": "The twins often argue about which TV programme to watch.", "family": "argument (n)"}, {"id": "d11v6", "word": "trust", "pos": "v, n", "ipa": "/trʌst/", "meaning_vi": "tin tưởng; lòng tin", "example": "I trust my best friend completely.", "family": "trustworthy (adj), distrust (v, n)"}, {"id": "d11v7", "word": "sympathetic", "pos": "adj", "ipa": "/ˌsɪmpəˈθetɪk/", "meaning_vi": "biết cảm thông, thông cảm", "example": "Our teacher was very sympathetic when my grandmother was ill.", "family": "sympathy (n), sympathise (v)"}, {"id": "d11v8", "word": "respect", "pos": "v, n", "ipa": "/rɪˈspekt/", "meaning_vi": "tôn trọng, kính trọng; sự tôn trọng", "example": "We should respect other people's opinions.", "family": "respectful (adj), disrespect (n)"}], "phrasal": [{"id": "d11p1", "phrase": "get on (well) with", "meaning_vi": "hoà hợp, có quan hệ tốt với (ai)", "example": "I get on well with my new classmates."}, {"id": "d11p2", "phrase": "look up to", "meaning_vi": "kính trọng, ngưỡng mộ (ai)", "example": "Many young players look up to their team captain."}], "grammar": {"id": "d11g", "title": "Relative clauses: who, which, that, whose, where (defining & non-defining)", "rule_vi": ["who = người; which = vật/con vật; that = người hoặc vật (chỉ dùng trong mệnh đề XÁC ĐỊNH).", "whose + danh từ = 'của người/vật đó' (sở hữu): the boy whose bike was stolen.", "where = nơi mà (thay cho địa điểm): the town where I was born.", "Mệnh đề XÁC ĐỊNH: cần thiết để biết ta nói về ai/cái gì, KHÔNG có dấu phẩy: The girl who sits next to me is Mai.", "Mệnh đề KHÔNG XÁC ĐỊNH: chỉ thêm thông tin, đặt giữa hai dấu phẩy, KHÔNG dùng 'that': My father, who is a doctor, works at night."], "examples": ["The teacher who teaches us music can play five instruments.", "I have a friend whose brother is a famous footballer.", "Hội An, which is in central Vietnam, is famous for its lanterns."], "common_mistake_vi": "Không dùng 'that' sau dấu phẩy. Sai: My mum, that is a nurse, works very hard. Đúng: My mum, who is a nurse, works very hard."}, "wordform": {"id": "d11w", "focus": "-ence/-ance (n), -ent/-ant (adj)", "rule_vi": "Nhiều tính từ đuôi -ent có danh từ đuôi -ence, và tính từ đuôi -ant có danh từ đuôi -ance (patient → patience, important → importance). Em nhìn vị trí trong câu để biết cần tính từ hay danh từ.", "examples": [["patient", "patience"], ["confident", "confidence"], ["different", "difference"], ["important", "importance"], ["silent", "silence"], ["distant", "distance"]]}, "paper": {"A_vocab": {"instruction_vi": "Chọn từ thích hợp trong khung để điền vào chỗ trống. Mỗi từ dùng một lần, có 2 từ thừa. Em nhớ đổi dạng từ nếu cần (thêm -s, -ed...) nhé.", "bank": ["personality", "generous", "honest", "support", "argue", "trust", "sympathetic", "respect"], "items": [{"id": "d11A1", "q": "Linh has a cheerful ______; she can make everyone laugh.", "answer": "personality", "tag": "d11v1"}, {"id": "d11A2", "q": "Be ______ with me – did you eat the last piece of cake?", "answer": "honest", "tag": "d11v3"}, {"id": "d11A3", "q": "My parents always come to my football matches to ______ me and cheer for my team.", "answer": "support", "tag": "d11v4"}, {"id": "d11A4", "q": "My brother and I sometimes ______ about who can use the computer first.", "answer": "argue", "tag": "d11v5"}, {"id": "d11A5", "q": "You can ______ Hoa with your secrets; she never tells anyone.", "answer": "trust", "tag": "d11v6"}, {"id": "d11A6", "q": "Students show ______ to their teachers by standing up when they come into the classroom.", "answer": "respect", "tag": "d11v8"}]}, "B_grammar": {"instruction_vi": "Điền who, which, that, whose hoặc where vào chỗ trống. Nếu có hai đáp án đúng, em chỉ cần viết một. Chú ý: sau dấu phẩy thì không dùng 'that' nhé!", "items": [{"id": "d11B1", "q": "My grandmother, ______ is eighty years old, still walks to the market every day.", "answer": "who", "tag": "d11g"}, {"id": "d11B2", "q": "This is the small village ______ my father grew up.", "answer": "where", "accept": ["in which"], "tag": "d11g"}, {"id": "d11B3", "q": "I have a classmate ______ mother is a famous singer.", "answer": "whose", "tag": "d11g"}, {"id": "d11B4", "q": "Ha Long Bay, ______ has nearly two thousand islands, attracts many visitors every year.", "answer": "which", "tag": "d11g"}, {"id": "d11B5", "q": "The boy ______ sits next to me is very good at maths.", "answer": "who", "accept": ["that"], "tag": "d11g"}, {"id": "d11B6", "q": "The book ______ you lent me was really interesting.", "answer": "which", "accept": ["that"], "tag": "d11g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Em xem chỗ trống cần danh từ (-ence/-ance) hay tính từ (-ent/-ant) nhé.", "items": [{"id": "d11C1", "q": "Thank you for your ______. I know you waited a long time. (PATIENT)", "answer": "patience", "tag": "d11w"}, {"id": "d11C2", "q": "Mai answered the interview questions with great ______. (CONFIDENT)", "answer": "confidence", "tag": "d11w"}, {"id": "d11C3", "q": "Can you see any ______ between these two pictures? (DIFFERENT)", "answer": "difference", "tag": "d11w"}, {"id": "d11C4", "q": "Good friends are very ______ in our lives. (IMPORTANCE)", "answer": "important", "tag": "d11w"}]}, "D_exam": {"format": "antonym", "instruction_vi": "Chọn từ/cụm từ có nghĩa TRÁI NGƯỢC với phần viết IN HOA (A, B, C hoặc D). Mẹo: em hãy hiểu nghĩa từ in hoa trước, rồi tìm từ có nghĩa ngược lại – cẩn thận đừng chọn nhầm từ đồng nghĩa nhé!", "items": [{"id": "d11D1", "q": "My best friend is very GENEROUS; she always shares her snacks with everyone.", "options": ["kind", "mean", "rich", "honest"], "answer": "B", "tag": "fmt:antonym"}, {"id": "d11D2", "q": "Mai and her younger sister usually GET ON WELL WITH each other.", "options": ["look up to", "take care of", "agree with", "often quarrel with"], "answer": "D", "tag": "fmt:antonym"}, {"id": "d11D3", "q": "Everyone in the class RESPECTS Mr Long because he is fair to all students.", "options": ["looks down on", "looks up to", "admires", "supports"], "answer": "A", "tag": "fmt:antonym"}, {"id": "d11D4", "q": "The nurse was very SYMPATHETIC when I hurt my arm.", "options": ["friendly", "gentle", "uncaring", "worried"], "answer": "C", "tag": "fmt:antonym"}]}, "E_reading": {"id": "d11r", "title": "The Bench Under the Mango Tree", "instruction_vi": "Đọc đoạn văn rồi làm bài. Câu 1–2: chọn True (đúng), False (sai) hoặc Not Given (bài không nói đến). Câu 3–4: chọn A, B, C hoặc D.", "text": "In my grandparents' village, there is an old wooden bench under a mango tree, where the neighbours meet every evening. My grandfather, who is seventy-five, sits there with his best friend, Mr Sáu. The two men have very different personalities. Grandpa is quiet and patient, while Mr Sáu loves telling jokes. They sometimes argue about football, but they have never stopped being friends. Last summer, Mr Sáu fell ill and could not leave his house for a month. Grandpa visited him every day, carrying a flask of hot tea and the newspaper. 'A real friend is someone who stays when life is difficult,' he told me. I look up to my grandfather because he is generous with his time and always honest, even when the truth is hard to hear. When I grow up, I hope I will have a friend whose friendship lasts as long as theirs – more than sixty years.", "items": [{"id": "d11E1", "kind": "tfng", "q": "Grandpa and Mr Sáu have similar personalities.", "answer": "False", "tag": "d11r"}, {"id": "d11E2", "kind": "tfng", "q": "Mr Sáu is younger than the writer's grandfather.", "answer": "Not Given", "tag": "d11r"}, {"id": "d11E3", "kind": "mcq", "q": "What did Grandpa do when Mr Sáu was ill?", "options": ["He sent him letters.", "He visited him every day.", "He took him to hospital.", "He called a doctor."], "answer": "B", "tag": "d11r"}, {"id": "d11E4", "kind": "mcq", "q": "How long have the two men been friends?", "options": ["more than sixty years", "seventy-five years", "about a month", "since last summer"], "answer": "A", "tag": "d11r"}]}, "F_writing": {"task_en": "Write about a person you look up to. Who is this person? What is his/her personality like? Why do you respect him/her? Use at least two relative clauses (who, which, whose, where).", "task_vi": "Viết về một người mà em kính trọng/ngưỡng mộ: người đó là ai, tính cách thế nào, vì sao em kính trọng họ. Dùng ít nhất hai mệnh đề quan hệ nhé.", "min_words": 50, "model": "The person I look up to most is my aunt Hương, who is a primary school teacher in a mountain village. She has a kind and patient personality. Every morning she rides her motorbike along a road which is narrow and dangerous, but she never complains. She is also very generous: she often buys books for children whose families are poor. I respect her because she always puts other people first.", "checklist_vi": ["Em đã giới thiệu người đó là ai và vì sao em kính trọng họ chưa?", "Em đã dùng ít nhất 2 mệnh đề quan hệ, và không dùng 'that' sau dấu phẩy chưa?", "Em đã dùng ít nhất 3 từ mới về tính cách (generous, honest, sympathetic...) chưa?", "Em đã viết đủ 50 từ trở lên chưa?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – em làm 4 câu ôn lại kiến thức của các buổi trước nhé. Chữ cái gợi ý (nếu có) là chữ cái đầu của đáp án.", "items": [{"id": "d11G1", "q": "My sister is going to a______ for a job at the new library.", "answer": "apply", "from_day": 10, "tag": "d10v6"}, {"id": "d11G2", "q": "If I ______ (have) wings, I would fly to school every day.", "answer": "had", "from_day": 10, "tag": "d10g"}, {"id": "d11G3", "q": "While I was tidying my room, I came ______ an old photo of my parents.", "answer": "across", "from_day": 8, "tag": "d8p2"}, {"id": "d11G4", "q": "The box was ______ heavy for me to carry, so my dad helped me. (too / enough)", "answer": "too", "from_day": 5, "tag": "d5g"}]}}, "web_check": [{"id": "d11q1", "type": "mcq", "skill": "vocab", "q": "My uncle is very ______. Last year he gave a lot of money to help children in flooded areas.", "options": ["honest", "lazy", "jealous", "generous"], "answer": 3, "explain_vi": "'generous' = hào phóng – sẵn sàng cho đi tiền bạc, thời gian.", "tag": "d11v2"}, {"id": "d11q2", "type": "text", "skill": "vocab", "q": "I really look ______ to my grandfather. He is wise, kind and hard-working.", "answer": "up", "accept": [], "explain_vi": "'look up to sb' = kính trọng, ngưỡng mộ ai đó.", "tag": "d11p2"}, {"id": "d11q3", "type": "mcq", "skill": "vocab", "q": "Do you get ______ well with your new neighbours?", "options": ["on", "over", "up", "off"], "answer": 0, "explain_vi": "'get on well with sb' = hoà hợp với ai. 'get over' = vượt qua (bệnh, nỗi buồn).", "tag": "d11p1"}, {"id": "d11q4", "type": "mcq", "skill": "grammar", "q": "That's the café ______ my parents first met.", "options": ["which", "who", "where", "whose"], "answer": 2, "explain_vi": "Chỗ trống thay cho địa điểm (the café) và sau đó là một câu đầy đủ (my parents first met) → where.", "tag": "d11g"}, {"id": "d11q5", "type": "mcq", "skill": "grammar", "q": "My English teacher, ______ comes from Australia, tells very funny stories.", "options": ["that", "who", "which", "whose"], "answer": 1, "explain_vi": "Mệnh đề có dấu phẩy (không xác định) nói về người → who. Không dùng 'that' sau dấu phẩy.", "tag": "d11g"}, {"id": "d11q6", "type": "text", "skill": "grammar", "q": "I met a girl ______ dream is to become an astronaut.", "answer": "whose", "accept": [], "explain_vi": "'whose dream' = ước mơ của cô bé ấy → dùng whose + danh từ để chỉ sở hữu.", "tag": "d11g"}, {"id": "d11q7", "type": "mcq", "skill": "wordform", "q": "Her ______ in herself helped her win the speaking contest. (CONFIDENT)", "options": ["confident", "confidently", "confide", "confidence"], "answer": 3, "explain_vi": "Sau tính từ sở hữu 'Her' cần danh từ: confident → confidence.", "tag": "d11w"}, {"id": "d11q8", "type": "text", "skill": "wordform", "q": "Learning to play the piano takes a long time, so you have to be ______. (PATIENCE)", "answer": "patient", "accept": [], "explain_vi": "Sau 'be' cần tính từ: patience (n) → patient (adj) = kiên nhẫn.", "tag": "d11w"}, {"id": "d11q9", "type": "mcq", "skill": "exam", "q": "Choose the word OPPOSITE in meaning to the word in CAPITALS: Tuấn is an HONEST boy; he never cheats in tests.", "options": ["truthful", "brave", "dishonest", "polite"], "answer": 2, "explain_vi": "honest (trung thực) >< dishonest (không trung thực). 'truthful' là từ đồng nghĩa – bẫy hay gặp!", "tag": "fmt:antonym"}, {"id": "d11q10", "type": "mcq", "skill": "review", "from_day": 10, "q": "If I ______ you, I would say sorry to her.", "options": ["am", "will be", "be", "were"], "answer": 3, "explain_vi": "Câu điều kiện loại 2 (lời khuyên): If I were you, I would...", "tag": "d10g"}, {"id": "d11q11", "type": "mcq", "skill": "review", "from_day": 8, "q": "This newspaper ______ every morning at 4 a.m.", "options": ["prints", "is printed", "printed", "is printing"], "answer": 1, "explain_vi": "Tờ báo không tự in được → câu bị động hiện tại đơn: is + V3 (is printed).", "tag": "d8g"}, {"id": "d11q12", "type": "text", "skill": "review", "from_day": 5, "q": "This is the ______ (healthy) breakfast I have ever eaten!", "answer": "healthiest", "accept": ["most healthy"], "explain_vi": "So sánh nhất với tính từ ngắn đuôi -y: healthy → the healthiest.", "tag": "d5g"}], "can_do_vi": ["Em có thể miêu tả tính cách một người bằng các từ generous, honest, sympathetic...", "Em có thể dùng who, which, that, whose, where để nối câu, và biết khi nào không được dùng 'that'.", "Em có thể đổi giữa tính từ -ent/-ant và danh từ -ence/-ance, và tìm từ trái nghĩa trong bài thi."]}, {"day": 12, "type": "normal", "theme_en": "Science & inventions", "theme_vi": "Khoa học và phát minh", "goal_vi": "Hôm nay em sẽ khám phá thế giới khoa học với những từ như experiment, research, breakthrough. Em cũng sẽ học câu tường thuật – cách kể lại lời người khác nói – và ôn tổng hợp tất cả các hậu tố đã học!", "minutes": 30, "vocab": [{"id": "d12v1", "word": "experiment", "pos": "n, v", "ipa": "/ɪkˈsperɪmənt/", "meaning_vi": "thí nghiệm; làm thí nghiệm", "example": "In today's science lesson, we did an experiment with magnets.", "family": "experimental (adj)"}, {"id": "d12v2", "word": "discover", "pos": "v", "ipa": "/dɪˈskʌvə(r)/", "meaning_vi": "phát hiện, khám phá (ra cái đã có sẵn)", "example": "Scientists have discovered a new type of frog in the forest.", "family": "discovery (n), discoverer (n)"}, {"id": "d12v3", "word": "research", "pos": "n, v", "ipa": "/rɪˈsɜːtʃ/, /ˈriːsɜːtʃ/", "meaning_vi": "sự nghiên cứu; nghiên cứu", "example": "She is doing research on how children learn languages.", "family": "researcher (n)"}, {"id": "d12v4", "word": "theory", "pos": "n", "ipa": "/ˈθɪəri/", "meaning_vi": "học thuyết, giả thuyết, lý thuyết", "example": "Darwin's theory explains how animals change over time.", "family": "theoretical (adj)"}, {"id": "d12v5", "word": "evidence", "pos": "n", "ipa": "/ˈevɪdəns/", "meaning_vi": "bằng chứng (danh từ không đếm được)", "example": "There is no evidence that this drink makes you smarter.", "family": "evident (adj)"}, {"id": "d12v6", "word": "laboratory", "pos": "n", "ipa": "/ləˈbɒrətri/", "meaning_vi": "phòng thí nghiệm (viết tắt: lab)", "example": "Students must wear glasses to protect their eyes in the laboratory.", "family": "lab (n, viết tắt)"}, {"id": "d12v7", "word": "breakthrough", "pos": "n", "ipa": "/ˈbreɪkθruː/", "meaning_vi": "bước đột phá", "example": "The new vaccine was a major breakthrough in medicine.", "family": "break through (phrasal v)"}, {"id": "d12v8", "word": "analyse", "pos": "v", "ipa": "/ˈænəlaɪz/", "meaning_vi": "phân tích", "example": "The team analysed the water from the lake.", "family": "analysis (n), analyst (n), analytical (adj); Anh-Mỹ: analyze"}], "phrasal": [{"id": "d12p1", "phrase": "carry out", "meaning_vi": "tiến hành, thực hiện (thí nghiệm, nghiên cứu, khảo sát...)", "example": "Our class carried out a survey about students' sleeping habits."}, {"id": "d12p2", "phrase": "come up with", "meaning_vi": "nghĩ ra (ý tưởng, giải pháp)", "example": "Nam came up with a clever way to save water at school."}], "grammar": {"id": "d12g", "title": "Reported speech: statements, tense backshift, say/tell", "rule_vi": ["Khi kể lại lời ai đó với động từ ở quá khứ (said/told), ta lùi thì: hiện tại đơn → quá khứ đơn; hiện tại tiếp diễn → quá khứ tiếp diễn; will → would; can → could.", "Hiện tại hoàn thành → quá khứ hoàn thành (had + V3); quá khứ đơn → quá khứ hoàn thành (had + V3).", "say (that) + mệnh đề: She said (that) she was tired. — tell + NGƯỜI + (that) + mệnh đề: She told me (that) she was tired.", "Đổi đại từ cho hợp người nói: I → he/she; my → his/her; we → they.", "Đổi trạng từ thời gian/nơi chốn: now → then; today → that day; tomorrow → the next day / the following day; yesterday → the day before; here → there; this → that."], "examples": ["'I am tired,' said Lan. → Lan said (that) she was tired.", "'We will finish the experiment tomorrow,' the scientist told us. → The scientist told us (that) they would finish the experiment the next day.", "'I have lost my key,' Minh said. → Minh said (that) he had lost his key."], "common_mistake_vi": "Không dùng 'say' + người, và không dùng 'tell' mà thiếu người nghe. Sai: She said me that... / She told that... Đúng: She told me that... / She said that... (hoặc She said to me that...)."}, "wordform": {"id": "d12w", "focus": "Mixed word formation (all suffixes so far)", "rule_vi": "Hôm nay em ôn tất cả hậu tố đã học: danh từ (-tion, -ment, -ness, -ity, -ence, -ance, -er/-ist), tính từ (-ful, -less, -al, -ous, -able, -ive), trạng từ (-ly), động từ (-ise, -ify, -en). Bước 1: xem chỗ trống cần loại từ gì. Bước 2: chọn hậu tố phù hợp. Bước 3: kiểm tra nghĩa (khẳng định hay phủ định? số ít hay số nhiều?).", "examples": [["discover", "discovery"], ["science", "scientist"], ["success", "successful"], ["invent", "invention"], ["care", "carefully"], ["simple", "simplify"]]}, "paper": {"A_vocab": {"instruction_vi": "Chọn từ thích hợp trong khung để điền vào chỗ trống. Mỗi từ dùng một lần, có 2 từ thừa. Em nhớ đổi dạng từ nếu cần (thêm -s, -ed...) nhé.", "bank": ["experiment", "discovered", "research", "theory", "evidence", "laboratory", "breakthrough", "analyse"], "items": [{"id": "d12A1", "q": "In 1928, Alexander Fleming ______ penicillin by accident when he noticed mould growing on a dish.", "answer": "discovered", "tag": "d12v2"}, {"id": "d12A2", "q": "The police found no ______ that the man had been in the house.", "answer": "evidence", "tag": "d12v5"}, {"id": "d12A3", "q": "The scientists work in a modern ______ full of microscopes and computers.", "answer": "laboratory", "tag": "d12v6"}, {"id": "d12A4", "q": "Finding a cure for this disease would be a huge ______ in medicine.", "answer": "breakthrough", "tag": "d12v7"}, {"id": "d12A5", "q": "Our teacher showed us how to ______ the results of the survey by making a chart.", "answer": "analyse", "accept": ["analyze"], "tag": "d12v8"}, {"id": "d12A6", "q": "In this ______, we put one plant in the dark and another in the sun to see which grows better.", "answer": "experiment", "tag": "d12v1"}]}, "B_grammar": {"instruction_vi": "Hoàn thành câu tường thuật. Mỗi chỗ trống điền 1–3 từ. Nhớ lùi thì và đổi đại từ nhé!", "items": [{"id": "d12B1", "q": "'I like science,' said Hoa. → Hoa said that she ______ science.", "answer": "liked", "tag": "d12g"}, {"id": "d12B2", "q": "'We are doing an experiment,' the students said. → The students said that they ______ an experiment.", "answer": "were doing", "tag": "d12g"}, {"id": "d12B3", "q": "'I will help you,' Nam said to me. → Nam ______ me that he would help me. (say / tell)", "answer": "told", "tag": "d12g"}, {"id": "d12B4", "q": "'I can't find my notebook,' said Mai. → Mai said that she ______ find her notebook.", "answer": "couldn't", "accept": ["could not"], "tag": "d12g"}, {"id": "d12B5", "q": "'I have finished my report,' said Dr Lâm. → Dr Lâm said that he ______ his report.", "answer": "had finished", "accept": ["'d finished"], "tag": "d12g"}, {"id": "d12B6", "q": "'The test is tomorrow,' the teacher said. → The teacher said that the test was ______.", "answer": "the next day", "accept": ["the following day"], "tag": "d12g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Hôm nay là bài tổng hợp: đáp án có thể là danh từ, tính từ, trạng từ hoặc động từ – em xem kỹ vị trí trong câu nhé.", "items": [{"id": "d12C1", "q": "Marie Curie was one of the most famous ______ in history. (SCIENCE)", "answer": "scientists", "tag": "d12w"}, {"id": "d12C2", "q": "The ______ of electricity changed people's lives forever. (DISCOVER)", "answer": "discovery", "tag": "d12w"}, {"id": "d12C3", "q": "Please handle the glass tubes ______; they break easily. (CARE)", "answer": "carefully", "tag": "d12w"}, {"id": "d12C4", "q": "The first test was ______, so the team had to start again. (SUCCESS)", "answer": "unsuccessful", "tag": "d12w"}]}, "D_exam": {"format": "transformation", "instruction_vi": "Chọn câu (A, B, C hoặc D) có nghĩa GẦN NHẤT với câu đã cho. Mẹo: em kiểm tra cả thì, đại từ và nghĩa khẳng định/phủ định – sai một chi tiết là sai cả câu đấy!", "items": [{"id": "d12D1", "q": "'I am working in the lab,' said Dr Hà.", "options": ["Dr Hà said she was not working in the lab.", "Dr Hà told she was working in the lab.", "Dr Hà said she was working in the lab.", "Dr Hà said I was working in the lab."], "answer": "C", "tag": "fmt:sentence_transformation"}, {"id": "d12D2", "q": "The scientists carried out the experiment last week.", "options": ["The experiment was carried out by the scientists last week.", "The experiment is carried out by the scientists last week.", "The scientists came up with the experiment last week.", "The experiment carried out the scientists last week."], "answer": "A", "tag": "fmt:sentence_transformation"}, {"id": "d12D3", "q": "Nobody had thought of this idea before Linh.", "options": ["Linh turned down this idea.", "Linh was the first person to come up with this idea.", "Linh found out the idea from somebody else.", "Linh didn't like this idea."], "answer": "B", "tag": "fmt:sentence_transformation"}, {"id": "d12D4", "q": "'We will publish the results next month,' the researchers told us.", "options": ["The researchers told us they would publish the results the month before.", "The researchers said us they would publish the results the following month.", "The researchers told us we would publish the results the following month.", "The researchers told us they would publish the results the following month."], "answer": "D", "tag": "fmt:sentence_transformation"}]}, "E_reading": {"id": "d12r", "title": "The Girl Who Tested the River", "instruction_vi": "Đọc đoạn văn rồi làm bài. Câu 1–2: chọn True (đúng), False (sai) hoặc Not Given (bài không nói đến). Câu 3–4: chọn A, B, C hoặc D.", "text": "When thirteen-year-old Thảo noticed that fewer fish were living in the river behind her school, she decided to find out why. Her science teacher, Mr Quang, told her that a good scientist always starts with a question and then looks for evidence. So, every Saturday for three months, Thảo collected small bottles of river water and took them to the school laboratory. There she carried out simple tests to measure how clean the water was. When she analysed her results, she discovered that the water was much dirtier on days after heavy rain. Her theory was that rain was washing rubbish from a nearby market into the river. Thảo shared her research with the local council, and an officer told her that her work was very useful. The council has now put new rubbish bins near the market. It was not a world-famous breakthrough, but for the fish, it was a big step forward.", "items": [{"id": "d12E1", "kind": "tfng", "q": "Thảo collected water samples every Saturday for three months.", "answer": "True", "tag": "d12r"}, {"id": "d12E2", "kind": "tfng", "q": "Thảo's research won a national science prize.", "answer": "Not Given", "tag": "d12r"}, {"id": "d12E3", "kind": "mcq", "q": "What did Thảo discover?", "options": ["The fish were ill because of the hot weather.", "The water was dirtier after heavy rain.", "The school laboratory was too small.", "The market sold too many fish."], "answer": "B", "tag": "d12r"}, {"id": "d12E4", "kind": "mcq", "q": "What did the council do after reading Thảo's research?", "options": ["They closed the market.", "They gave Thảo a job.", "They put new rubbish bins near the market.", "They cleaned the river every Saturday."], "answer": "C", "tag": "d12r"}]}, "F_writing": {"task_en": "Write about an invention that you think is very important. What is it? How does it help people? What would life be like without it? Report one thing that somebody (a parent, a teacher) said about it.", "task_vi": "Viết về một phát minh mà em cho là rất quan trọng: nó là gì, giúp ích con người ra sao, cuộc sống sẽ thế nào nếu không có nó. Hãy kể lại (bằng câu tường thuật) một điều mà ai đó (bố mẹ, thầy cô) đã nói về phát minh đó.", "min_words": 50, "model": "I think the washing machine is one of the most important inventions. Before it was invented, people spent hours washing clothes by hand. My grandmother told me that she had to wash clothes in the river when she was young. She said that her hands were often cold and painful. Today, a machine does this job while we study or rest. If we didn't have washing machines, we would have much less free time.", "checklist_vi": ["Em đã nêu tên phát minh và nói nó giúp ích thế nào chưa?", "Em đã có ít nhất 1 câu tường thuật đúng (said that / told me that + lùi thì) chưa?", "Em đã dùng ít nhất 3 từ mới hôm nay (invent, discover, research, breakthrough...) chưa?", "Em đã viết đủ 50 từ trở lên chưa?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – em làm 4 câu ôn lại kiến thức của các buổi trước nhé. Chữ cái gợi ý (nếu có) là chữ cái đầu của đáp án.", "items": [{"id": "d12G1", "q": "Mr Bình is very s______. He always listens when we have problems and tries to understand how we feel.", "answer": "sympathetic", "from_day": 11, "tag": "d11v7"}, {"id": "d12G2", "q": "The museum ______ we visited last Sunday was full of old cameras. (who / which)", "answer": "which", "from_day": 11, "tag": "d11g"}, {"id": "d12G3", "q": "Wearing áo dài on special days is a t______ in Vietnam.", "answer": "tradition", "from_day": 9, "tag": "d9v1"}, {"id": "d12G4", "q": "You ______ bring your passport when you travel abroad. It's necessary. (should / have to / can)", "answer": "have to", "from_day": 6, "tag": "d6g"}]}}, "web_check": [{"id": "d12q1", "type": "mcq", "skill": "vocab", "q": "My aunt is doing ______ on how dolphins communicate with each other.", "options": ["laboratory", "research", "breakthrough", "evidence"], "answer": 1, "explain_vi": "'do research on sth' = nghiên cứu về điều gì. 'research' là danh từ không đếm được.", "tag": "d12v3"}, {"id": "d12q2", "type": "text", "skill": "vocab", "q": "We need a new idea for our project. Can anyone come up ______ something?", "answer": "with", "accept": [], "explain_vi": "'come up with sth' = nghĩ ra (ý tưởng, giải pháp). Phải có giới từ 'with'.", "tag": "d12p2"}, {"id": "d12q3", "type": "mcq", "skill": "vocab", "q": "According to the ______ of gravity, everything that goes up must come down.", "options": ["laboratory", "evidence", "breakthrough", "theory"], "answer": 3, "explain_vi": "'theory' = học thuyết, lý thuyết (lý thuyết về trọng lực).", "tag": "d12v4"}, {"id": "d12q4", "type": "mcq", "skill": "grammar", "q": "Lan ______ me that she had lost her calculator.", "options": ["told", "said", "spoke", "talked"], "answer": 0, "explain_vi": "Sau chỗ trống có người nghe 'me' → dùng told (tell + người). 'said' không đi trực tiếp với người.", "tag": "d12g"}, {"id": "d12q5", "type": "mcq", "skill": "grammar", "q": "'I live near the museum,' said Phong. → Phong said that he ______ near the museum.", "options": ["lives", "is living", "lived", "has lived"], "answer": 2, "explain_vi": "Lùi thì: hiện tại đơn (live) → quá khứ đơn (lived).", "tag": "d12g"}, {"id": "d12q6", "type": "text", "skill": "grammar", "q": "'We will visit the science museum,' they said. → They said that they ______ visit the science museum.", "answer": "would", "accept": [], "explain_vi": "Lùi thì: will → would.", "tag": "d12g"}, {"id": "d12q7", "type": "mcq", "skill": "wordform", "q": "The ______ of the telephone made long-distance communication much easier. (INVENT)", "options": ["inventive", "invention", "invented", "inventively"], "answer": 1, "explain_vi": "Sau 'The' và trước 'of' cần danh từ: invent → invention.", "tag": "d12w"}, {"id": "d12q8", "type": "text", "skill": "wordform", "q": "Can you ______ these instructions? They are too difficult for young children. (SIMPLE)", "answer": "simplify", "accept": [], "explain_vi": "Sau 'Can you' cần động từ: simple → simplify (làm cho đơn giản hơn).", "tag": "d12w"}, {"id": "d12q9", "type": "mcq", "skill": "exam", "q": "Choose the sentence closest in meaning: 'I saw a strange light in the sky,' said Tuấn.", "options": ["Tuấn said he sees a strange light in the sky.", "Tuấn told that he saw a strange light in the sky.", "Tuấn said I had seen a strange light in the sky.", "Tuấn said he had seen a strange light in the sky."], "answer": 3, "explain_vi": "Quá khứ đơn (saw) → quá khứ hoàn thành (had seen); I → he; dùng 'said' (không có người nghe).", "tag": "fmt:sentence_transformation"}, {"id": "d12q10", "type": "mcq", "skill": "review", "from_day": 11, "q": "I don't get ______ well with my cousin because she is always rude to me.", "options": ["over", "on", "up", "off"], "answer": 1, "explain_vi": "'get on (well) with sb' = hoà hợp với ai.", "tag": "d11p1"}, {"id": "d12q11", "type": "mcq", "skill": "review", "from_day": 9, "q": "Could I have ______ water, please? I'm really thirsty.", "options": ["a few", "many", "a little", "a"], "answer": 2, "explain_vi": "'water' là danh từ không đếm được → dùng 'a little' (một ít). 'a few' và 'many' dùng cho danh từ đếm được.", "tag": "d9g"}, {"id": "d12q12", "type": "text", "skill": "review", "from_day": 6, "q": "We'll set ______ at 5 a.m. to avoid the traffic.", "answer": "off", "accept": [], "explain_vi": "'set off' = khởi hành, bắt đầu chuyến đi.", "tag": "d6p1"}], "can_do_vi": ["Em có thể nói về khoa học và phát minh bằng các từ experiment, research, evidence, breakthrough...", "Em có thể chuyển câu nói trực tiếp sang câu tường thuật, biết lùi thì và dùng đúng say/tell.", "Em có thể chọn đúng dạng từ với mọi hậu tố đã học và tìm câu đồng nghĩa trong bài thi."]}, {"day": 13, "type": "normal", "theme_en": "Arts & entertainment", "theme_vi": "Nghệ thuật và giải trí", "goal_vi": "Hôm nay em sẽ bước vào thế giới nghệ thuật với âm nhạc, hội hoạ và sân khấu. Em cũng sẽ học khi nào dùng V-ing, khi nào dùng to V – một chủ điểm 'nhỏ mà có võ' trong đề thi chuyên!", "minutes": 30, "vocab": [{"id": "d13v1", "word": "performance", "pos": "n", "ipa": "/pəˈfɔːməns/", "meaning_vi": "buổi biểu diễn; màn trình diễn", "example": "The band gave an amazing performance last night.", "family": "perform (v), performer (n)"}, {"id": "d13v2", "word": "exhibition", "pos": "n", "ipa": "/ˌeksɪˈbɪʃn/", "meaning_vi": "cuộc triển lãm", "example": "There is an exhibition of children's paintings at the museum this week.", "family": "exhibit (v, n)"}, {"id": "d13v3", "word": "talented", "pos": "adj", "ipa": "/ˈtæləntɪd/", "meaning_vi": "có tài, tài năng", "example": "Lan is a talented singer; she has won three competitions.", "family": "talent (n)"}, {"id": "d13v4", "word": "imagination", "pos": "n", "ipa": "/ɪˌmædʒɪˈneɪʃn/", "meaning_vi": "trí tưởng tượng", "example": "Children often have a wonderful imagination.", "family": "imagine (v), imaginative (adj)"}, {"id": "d13v5", "word": "compose", "pos": "v", "ipa": "/kəmˈpəʊz/", "meaning_vi": "sáng tác (nhạc)", "example": "He composed this song for his mother's birthday.", "family": "composer (n), composition (n)"}, {"id": "d13v6", "word": "admire", "pos": "v", "ipa": "/ədˈmaɪə(r)/", "meaning_vi": "ngưỡng mộ; chiêm ngưỡng, ngắm nhìn (với sự thích thú)", "example": "I admire people who can play the piano.", "family": "admiration (n), admirable (adj)"}, {"id": "d13v7", "word": "rehearse", "pos": "v", "ipa": "/rɪˈhɜːs/", "meaning_vi": "diễn tập, tập dượt", "example": "The actors rehearsed the last scene again and again.", "family": "rehearsal (n)"}, {"id": "d13v8", "word": "inspire", "pos": "v", "ipa": "/ɪnˈspaɪə(r)/", "meaning_vi": "truyền cảm hứng", "example": "My art teacher inspired me to keep drawing.", "family": "inspiration (n), inspiring (adj)"}], "phrasal": [{"id": "d13p1", "phrase": "put on", "meaning_vi": "tổ chức, dàn dựng (buổi biểu diễn, triển lãm); (cũng có nghĩa: mặc vào)", "example": "Our class is putting on a play for Teachers' Day."}, {"id": "d13p2", "phrase": "take part in", "meaning_vi": "tham gia (hoạt động, cuộc thi)", "example": "More than fifty students took part in the drawing competition."}], "grammar": {"id": "d13g", "title": "Gerund vs to-infinitive", "rule_vi": ["Động từ + V-ing: enjoy, finish, mind, avoid, practise, keep, suggest, can't stand. (I enjoy dancing.)", "Động từ + to V: decide, want, hope, plan, agree, refuse, learn, manage, promise. (She decided to join the choir.)", "Sau giới từ luôn dùng V-ing: interested in painting, good at singing, look forward to seeing.", "stop / remember / try + cả hai nhưng KHÁC NGHĨA: stop doing = ngừng hẳn việc đang làm; stop to do = dừng lại ĐỂ làm việc khác. remember doing = nhớ là ĐÃ làm (quá khứ); remember to do = nhớ PHẢI làm (chưa làm). try doing = thử làm xem sao; try to do = cố gắng làm.", "like, love, hate, start, begin + V-ing hoặc to V đều được, nghĩa gần như không đổi."], "examples": ["My brother practises playing the violin every evening.", "We stopped to buy some water on the way to the concert.", "Remember to turn off your phone during the performance."], "common_mistake_vi": "Nhầm stop doing và stop to do. 'He stopped to talk' = anh ấy dừng lại (việc đang làm) để nói chuyện. 'He stopped talking' = anh ấy thôi không nói nữa. Em hỏi: việc sau stop là việc bị bỏ đi (V-ing) hay mục đích mới (to V)?"}, "wordform": {"id": "d13w", "focus": "-ure, -age, -ance (nouns)", "rule_vi": "Thêm -ure, -age hoặc -ance vào động từ để tạo DANH TỪ. Chú ý thay đổi chính tả: please → pleasure (bỏ e), marry → marriage (y → i).", "examples": [["please", "pleasure"], ["fail", "failure"], ["sign", "signature"], ["store", "storage"], ["marry", "marriage"], ["perform", "performance"], ["appear", "appearance"]]}, "paper": {"A_vocab": {"instruction_vi": "Chọn từ thích hợp trong khung để điền vào chỗ trống. Mỗi từ dùng một lần, có 2 từ thừa nhé.", "bank": ["performance", "exhibition", "talented", "imagination", "composed", "admire", "rehearse", "inspired"], "items": [{"id": "d13A1", "q": "We went to an ______ of old photographs of Hà Nội at the city museum.", "answer": "exhibition", "tag": "d13v2"}, {"id": "d13A2", "q": "Mozart ______ his first piece of music when he was only five years old.", "answer": "composed", "tag": "d13v5"}, {"id": "d13A3", "q": "My cousin is a very ______ dancer; she has won many competitions.", "answer": "talented", "tag": "d13v3"}, {"id": "d13A4", "q": "The actors have to ______ every evening this week before the big show on Saturday.", "answer": "rehearse", "tag": "d13v7"}, {"id": "d13A5", "q": "The students gave a wonderful ______ of a traditional folk song.", "answer": "performance", "tag": "d13v1"}, {"id": "d13A6", "q": "Many tourists stop to ______ the beautiful paintings on the walls of the old temple.", "answer": "admire", "tag": "d13v6"}]}, "B_grammar": {"instruction_vi": "Viết dạng đúng của động từ trong ngoặc: V-ing hoặc to V. Với stop và remember, em đọc kỹ cả câu để hiểu nghĩa nhé.", "items": [{"id": "d13B1", "q": "My sister enjoys ______ (draw) cartoons in her free time.", "answer": "drawing", "tag": "d13g"}, {"id": "d13B2", "q": "Our class has decided ______ (put) on a play at the end of the school year.", "answer": "to put", "tag": "d13g"}, {"id": "d13B3", "q": "Please remember ______ (bring) your costume to the rehearsal tomorrow.", "answer": "to bring", "tag": "d13g"}, {"id": "d13B4", "q": "Tom stopped ______ (play) the piano because his fingers were tired.", "answer": "playing", "tag": "d13g"}, {"id": "d13B5", "q": "On the way to the theatre, we stopped ______ (buy) some flowers for the singer.", "answer": "to buy", "tag": "d13g"}, {"id": "d13B6", "q": "I remember ______ (see) this cartoon when I was five; it was my favourite.", "answer": "seeing", "tag": "d13g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay các đáp án đều là danh từ đuôi -ure, -age hoặc -ance.", "items": [{"id": "d13C1", "q": "It gives me great ______ to welcome you all to our school concert. (PLEASE)", "answer": "pleasure", "tag": "d13w"}, {"id": "d13C2", "q": "Our first show was a complete ______; only five people came to watch it. (FAIL)", "answer": "failure", "tag": "d13w"}, {"id": "d13C3", "q": "The famous singer's surprise ______ on stage made the audience scream with joy. (APPEAR)", "answer": "appearance", "tag": "d13w"}, {"id": "d13C4", "q": "The theatre needs more ______ space for its old costumes. (STORE)", "answer": "storage", "tag": "d13w"}]}, "D_exam": {"format": "cloze", "instruction_vi": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi chỗ trống. Mẹo: em đọc cả câu trước và sau chỗ trống, vì đáp án có thể phụ thuộc vào từ đứng sau đó.", "text": "Every year, our school (1) ______ a talent show in December. Students who want to take (2) ______ must sign up two months before. This year, my friend Vy decided (3) ______ a song that she wrote herself. She practised (4) ______ it every evening, and on the night of the show, everyone cheered loudly.", "items": [{"id": "d13D1", "q": "(1) Every year, our school ______ a talent show in December.", "options": ["takes off", "puts on", "turns down", "gets over"], "answer": "B", "tag": "fmt:cloze"}, {"id": "d13D2", "q": "(2) Students who want to take ______ must sign up two months before.", "options": ["place", "turn", "care", "part"], "answer": "D", "tag": "fmt:cloze"}, {"id": "d13D3", "q": "(3) This year, my friend Vy decided ______ a song that she wrote herself.", "options": ["to perform", "performing", "perform", "performed"], "answer": "A", "tag": "fmt:cloze"}, {"id": "d13D4", "q": "(4) She practised ______ it every evening.", "options": ["to sing", "sing", "singing", "sang"], "answer": "C", "tag": "fmt:cloze"}]}, "E_reading": {"id": "d13r", "title": "The Paper Puppet Show", "instruction_vi": "Đọc đoạn văn rồi làm bài. Câu 1–2: chọn True (đúng), False (sai) hoặc Not Given (bài không nói đến). Câu 3–4: chọn A, B, C hoặc D.", "text": "Every spring, the students at Hòa Bình Secondary School put on a show for their families. This year, the Year 7 class chose to tell an old folk story using only shadows and paper puppets. Their teacher, Ms Diệp, encouraged them to use their imagination instead of buying expensive costumes. Quân, a talented pianist, composed the music himself, while the others made the puppets from old boxes and newspapers. For six weeks, the class rehearsed every Friday afternoon. At first, things went badly: the puppets kept falling apart, and some students wanted to give up. But Ms Diệp reminded them that every failure teaches us something. On the night of the performance, the hall was completely full. When the lights came back on, the audience stood up and clapped for several minutes. Afterwards, a parent who works at the city museum invited the class to show their puppets in an exhibition next month.", "items": [{"id": "d13E1", "kind": "tfng", "q": "Quân wrote the music for the show.", "answer": "True", "tag": "d13r"}, {"id": "d13E2", "kind": "tfng", "q": "The class rehearsed every day for six weeks.", "answer": "False", "tag": "d13r"}, {"id": "d13E3", "kind": "mcq", "q": "What problem did the class have at first?", "options": ["The hall was too small.", "Quân refused to play the piano.", "Ms Diệp was ill.", "The puppets kept falling apart."], "answer": "D", "tag": "d13r"}, {"id": "d13E4", "kind": "mcq", "q": "What will happen next month?", "options": ["The puppets will be shown in a museum exhibition.", "The class will perform the show again.", "Ms Diệp will leave the school.", "The parents will make new puppets."], "answer": "A", "tag": "d13r"}]}, "F_writing": {"task_en": "Write about a show, concert or exhibition that you took part in or watched. What was it? What did you enjoy about it? How did you feel? Use at least two verbs followed by V-ing or to V (enjoy, decide, hope, remember...).", "task_vi": "Viết về một buổi biểu diễn, buổi hoà nhạc hoặc triển lãm mà em đã tham gia hoặc xem: đó là sự kiện gì, em thích điều gì, cảm xúc của em ra sao. Dùng ít nhất hai động từ đi với V-ing hoặc to V nhé.", "min_words": 50, "model": "Last month, I took part in our school's English Day. My class decided to put on a short play about a lazy king, and I played the king! We rehearsed every lunchtime for two weeks, and I really enjoyed working with my friends. On the day, I was nervous, but I tried not to look at the audience. When the play finished, everyone clapped loudly. I hope to perform again next year because it inspired me to be more confident.", "checklist_vi": ["Em đã nói rõ đó là sự kiện gì và cảm xúc của em chưa?", "Em đã dùng ít nhất 2 động từ + V-ing / to V đúng (enjoy doing, decide to do...) chưa?", "Em đã dùng ít nhất 3 từ mới hôm nay (performance, rehearse, talented, inspire...) chưa?", "Em đã viết đủ 50 từ trở lên chưa?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – em làm 4 câu ôn lại kiến thức của các buổi trước nhé. Chữ cái gợi ý (nếu có) là chữ cái đầu của đáp án.", "items": [{"id": "d13G1", "q": "Last month, our class c______ out a survey about how much time students spend on their phones.", "answer": "carried", "from_day": 12, "tag": "d12p1"}, {"id": "d13G2", "q": "'I am hungry,' said Bình. → Bình said that he ______ hungry.", "answer": "was", "from_day": 12, "tag": "d12g"}, {"id": "d13G3", "q": "The new shopping centre will e______ about two hundred people from our town.", "answer": "employ", "from_day": 10, "tag": "d10v3"}, {"id": "d13G4", "q": "The train to Lào Cai was d______ by forty minutes because of a landslide.", "answer": "delayed", "from_day": 6, "tag": "d6v5"}]}}, "web_check": [{"id": "d13q1", "type": "mcq", "skill": "vocab", "q": "The writer of this book has an amazing ______; she creates magical worlds with dragons and talking trees.", "options": ["exhibition", "imagination", "performance", "ambition"], "answer": 1, "explain_vi": "'imagination' = trí tưởng tượng – khả năng nghĩ ra những điều không có thật.", "tag": "d13v4"}, {"id": "d13q2", "type": "text", "skill": "vocab", "q": "Our school is going to put ______ a concert to raise money for the library.", "answer": "on", "accept": [], "explain_vi": "'put on a concert/show/play' = tổ chức, dàn dựng một buổi biểu diễn.", "tag": "d13p1"}, {"id": "d13q3", "type": "mcq", "skill": "vocab", "q": "Her grandmother's beautiful paintings ______ her to become an artist.", "options": ["admired", "rehearsed", "composed", "inspired"], "answer": 3, "explain_vi": "'inspire sb to do sth' = truyền cảm hứng cho ai làm gì.", "tag": "d13v8"}, {"id": "d13q4", "type": "mcq", "skill": "grammar", "q": "Would you mind ______ the window? It's cold in here.", "options": ["close", "to close", "closing", "closed"], "answer": 2, "explain_vi": "'mind' luôn đi với V-ing: Would you mind closing...?", "tag": "d13g"}, {"id": "d13q5", "type": "mcq", "skill": "grammar", "q": "Please remember ______ the lights when you leave the hall.", "options": ["to switch off", "switching off", "switch off", "switched off"], "answer": 0, "explain_vi": "'remember to do' = nhớ phải làm (việc chưa làm, trong tương lai).", "tag": "d13g"}, {"id": "d13q6", "type": "text", "skill": "grammar", "q": "Lan hopes ______ (become) a famous singer one day.", "answer": "to become", "accept": [], "explain_vi": "'hope' đi với to V: hope to become.", "tag": "d13g"}, {"id": "d13q7", "type": "mcq", "skill": "wordform", "q": "Purple is a ______ of red and blue. (MIX)", "options": ["mixer", "mixed", "mixture", "mixing"], "answer": 2, "explain_vi": "Sau 'a' và trước 'of' cần danh từ chỉ hỗn hợp: mix + -ure → mixture. ('mixer' là máy trộn.)", "tag": "d13w"}, {"id": "d13q8", "type": "text", "skill": "wordform", "q": "After the concert, the pianist wrote her ______ on my programme. (SIGN)", "answer": "signature", "accept": [], "explain_vi": "Sau tính từ sở hữu 'her' cần danh từ: sign + -ature → signature (chữ ký).", "tag": "d13w"}, {"id": "d13q9", "type": "mcq", "skill": "exam", "q": "Choose the best answer for the gap: 'The concert was fantastic. The band played so well that nobody wanted it ______.'", "options": ["ending", "to end", "end", "ended"], "answer": 1, "explain_vi": "Cấu trúc 'want sb/sth to do sth' → wanted it to end.", "tag": "fmt:cloze"}, {"id": "d13q10", "type": "mcq", "skill": "review", "from_day": 12, "q": "Scientists are still looking for ______ that there is life on other planets.", "options": ["theory", "evidence", "laboratory", "experiment"], "answer": 1, "explain_vi": "'evidence' = bằng chứng. Các nhà khoa học đang tìm bằng chứng cho thấy có sự sống.", "tag": "d12v5"}, {"id": "d13q11", "type": "mcq", "skill": "review", "from_day": 10, "q": "If I won the singing contest, I ______ very happy.", "options": ["would be", "will be", "am", "was"], "answer": 0, "explain_vi": "Vế If dùng quá khứ đơn (won) → câu điều kiện loại 2: would + V nguyên mẫu.", "tag": "d10g"}, {"id": "d13q12", "type": "text", "skill": "review", "from_day": 6, "q": "There were so many tourists that the beach was very c______.", "answer": "crowded", "accept": [], "explain_vi": "'crowded' = đông đúc, chật kín người.", "tag": "d6v3"}], "can_do_vi": ["Em có thể nói về âm nhạc, hội hoạ và sân khấu bằng các từ performance, exhibition, talented, rehearse...", "Em có thể chọn đúng V-ing hay to V sau các động từ thường gặp, và hiểu sự khác nhau của stop/remember/try.", "Em có thể tạo danh từ đuôi -ure, -age, -ance và làm bài đọc điền từ (cloze) 4 chỗ trống."]}, {"day": 14, "type": "review", "theme_en": "Review 2", "theme_vi": "Vòng ôn 2 (buổi 8–13, kèm ôn lại buổi 1–6)", "goal_vi": "Chúc mừng em đã đi đến buổi cuối cùng! Hôm nay em sẽ ôn lại từ vựng, ngữ pháp và các dạng bài thi của buổi 8–13, kèm một số câu từ buổi 1–6, để thấy mình đã tiến bộ thế nào.", "minutes": 35, "paper": {"R1_vocab": {"instruction_vi": "Điền một từ thích hợp vào mỗi chỗ trống. Chữ cái đầu của từ đã được cho sẵn. Các từ này em đều đã học trong 13 buổi vừa qua đấy!", "items": [{"id": "d14R1_1", "q": "The a______ clapped and cheered loudly at the end of the concert.", "answer": "audience", "from_day": 8, "tag": "d8v2"}, {"id": "d14R1_2", "q": "Not everything on the Internet is true, so always check that your source is r______.", "answer": "reliable", "from_day": 8, "tag": "d8v5"}, {"id": "d14R1_3", "q": "Which f______ of ice cream do you like best – chocolate, mango or green tea?", "answer": "flavour", "accept": ["flavor"], "from_day": 9, "tag": "d9v5"}, {"id": "d14R1_4", "q": "Working at the summer camp was a great e______ for me. I learnt how to look after younger children.", "answer": "experience", "from_day": 10, "tag": "d10v4"}, {"id": "d14R1_5", "q": "I can't t______ him any more because he has lied to me twice.", "answer": "trust", "from_day": 11, "tag": "d11v6"}, {"id": "d14R1_6", "q": "Scientists have done a lot of r______ on how sleep affects our memory.", "answer": "research", "from_day": 12, "tag": "d12v3"}, {"id": "d14R1_7", "q": "We need to r______ the dance one more time before the show starts.", "answer": "rehearse", "from_day": 13, "tag": "d13v7"}, {"id": "d14R1_8", "q": "My little sister is very e______ about her ballet classes; she talks about them all the time.", "answer": "enthusiastic", "from_day": 2, "tag": "d2v3"}, {"id": "d14R1_9", "q": "Old newspapers can be r______ and turned into new paper.", "answer": "recycled", "from_day": 3, "tag": "d3v4"}, {"id": "d14R1_10", "q": "My dentist told me to a______ fizzy drinks because they contain so much sugar.", "answer": "avoid", "from_day": 5, "tag": "d5v8"}]}, "R2_grammar": {"instruction_vi": "Hoàn thành câu: chia động từ trong ngoặc hoặc chọn từ đúng trong ngoặc. Mỗi câu ôn một chủ điểm ngữ pháp khác nhau – em đọc kỹ dấu hiệu trong câu nhé.", "items": [{"id": "d14R2_1", "q": "Bánh mì ______ (sell) on almost every street corner in Hà Nội.", "answer": "is sold", "from_day": 8, "tag": "d8g"}, {"id": "d14R2_2", "q": "There are only ______ eggs left, so let's buy some more. (a few / a little)", "answer": "a few", "from_day": 9, "tag": "d9g"}, {"id": "d14R2_3", "q": "If you ______ (not water) the plants, they will die.", "answer": "don't water", "accept": ["do not water"], "from_day": 10, "tag": "d10g"}, {"id": "d14R2_4", "q": "If I ______ (know) the answer, I would tell you, but I don't.", "answer": "knew", "from_day": 10, "tag": "d10g"}, {"id": "d14R2_5", "q": "That's the hospital ______ I was born. (which / where)", "answer": "where", "from_day": 11, "tag": "d11g"}, {"id": "d14R2_6", "q": "'I am reading a comic,' said Mai. → Mai said that she ______ a comic.", "answer": "was reading", "from_day": 12, "tag": "d12g"}, {"id": "d14R2_7", "q": "My dad has promised ______ (take) me to the art exhibition on Saturday.", "answer": "to take", "from_day": 13, "tag": "d13g"}, {"id": "d14R2_8", "q": "Listen! Somebody ______ (knock) at the door.", "answer": "is knocking", "accept": ["'s knocking"], "from_day": 1, "tag": "d1g"}, {"id": "d14R2_9", "q": "I ______ (watch) TV when the phone rang.", "answer": "was watching", "from_day": 2, "tag": "d2g"}, {"id": "d14R2_10", "q": "We ______ (live) in this flat since 2020.", "answer": "have lived", "accept": ["'ve lived", "have been living", "'ve been living"], "from_day": 3, "tag": "d3g"}]}, "R3_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Bước 1: xem chỗ trống cần danh từ, tính từ, trạng từ hay động từ. Bước 2: chọn hậu tố phù hợp. Bước 3: kiểm tra nghĩa khẳng định hay phủ định.", "items": [{"id": "d14R3_1", "q": "Thank you for the ______ talk about staying safe online; we learnt a lot. (INFORM)", "answer": "informative", "from_day": 8, "tag": "d8w"}, {"id": "d14R3_2", "q": "The ______ of the villagers surprised us when our car broke down in the countryside. (KIND)", "answer": "kindness", "from_day": 9, "tag": "d9w"}, {"id": "d14R3_3", "q": "The ______ from my house to school is about two kilometres. (DISTANT)", "answer": "distance", "from_day": 11, "tag": "d11w"}, {"id": "d14R3_4", "q": "Our class won first prize for the best dance ______. (PERFORM)", "answer": "performance", "from_day": 13, "tag": "d13w"}, {"id": "d14R3_5", "q": "Be ______ when you cross the road near the market. (CARE)", "answer": "careful", "from_day": 2, "tag": "d2w"}, {"id": "d14R3_6", "q": "It's ______ to finish all this homework in just ten minutes! (POSSIBLE)", "answer": "impossible", "from_day": 5, "tag": "d5w"}]}, "R4_exam": {"instruction_vi": "Đây là 6 câu trắc nghiệm theo các dạng bài thi em đã làm quen. Đọc kỹ yêu cầu ở đầu mỗi câu rồi chọn A, B, C hoặc D.", "items": [{"id": "d14R4_1", "format": "completion", "q": "Choose the best answer: Could you ______ me a favour and hold this bag for a minute?", "options": ["make", "do", "give", "take"], "answer": "B", "from_day": 8, "tag": "fmt:sentence_completion"}, {"id": "d14R4_2", "format": "synonym", "q": "Choose the word CLOSEST in meaning to the word in CAPITALS: The CUSTOM of giving lucky money at Tết makes children very happy.", "options": ["festival", "recipe", "flavour", "tradition"], "answer": "D", "from_day": 9, "tag": "fmt:synonym"}, {"id": "d14R4_3", "format": "dialogue", "q": "Choose the best reply: A: 'I'm going to apply for a summer job at the zoo.' – B: '______'", "options": ["No, thanks.", "Here you are.", "That sounds exciting! Good luck.", "I'm sorry to hear that."], "answer": "C", "from_day": 10, "tag": "fmt:dialogue_completion"}, {"id": "d14R4_4", "format": "antonym", "q": "Choose the word OPPOSITE in meaning to the word in CAPITALS: Mai and her brother often ARGUE about small things.", "options": ["agree", "quarrel", "fight", "disagree"], "answer": "A", "from_day": 11, "tag": "fmt:antonym"}, {"id": "d14R4_5", "format": "transformation", "q": "Choose the sentence CLOSEST in meaning: My sister is taller than me.", "options": ["I am taller than my sister.", "I am as tall as my sister.", "My sister is shorter than me.", "I am not as tall as my sister."], "answer": "D", "from_day": 5, "tag": "fmt:sentence_transformation"}, {"id": "d14R4_6", "format": "cloze", "q": "Choose the best word for the gap: Last summer we went on a long ______ by train from Hà Nội to Huế. It took almost fourteen hours.", "options": ["destination", "souvenir", "journey", "passenger"], "answer": "C", "from_day": 6, "tag": "fmt:cloze"}]}, "E_reading": {"id": "d14r", "title": "A Festival of Ideas", "instruction_vi": "Đọc đoạn văn rồi làm bài. Câu 1–3: chọn True (đúng), False (sai) hoặc Not Given (bài không nói đến). Câu 4–5: chọn A, B, C hoặc D.", "text": "Every year, Lê Lợi Secondary School holds a 'Festival of Ideas', where students show projects which combine science, art and culture. This year, the winning team was a group of four Year 7 students whose project was about street food. First, they carried out a survey of 120 people at a local market to find out which dishes were the most popular. When they analysed the results, they discovered that most people preferred traditional dishes, like phở and bánh cuốn, to fast food. However, many cooks said they were worried that young people were no longer interested in learning the old recipes. So the team came up with a creative solution: they filmed five grandmothers cooking their favourite dishes and put the videos online. In just two months, the videos were watched more than ten thousand times. One of the judges said that the project had inspired her to cook with her own mother again. The team now hope to turn their videos into a short book.", "items": [{"id": "d14E1", "kind": "tfng", "q": "The winning team had five members.", "answer": "False", "tag": "d14r"}, {"id": "d14E2", "kind": "tfng", "q": "The students asked 120 people questions at a market.", "answer": "True", "tag": "d14r"}, {"id": "d14E3", "kind": "tfng", "q": "The grandmothers were paid for appearing in the videos.", "answer": "Not Given", "tag": "d14r"}, {"id": "d14E4", "kind": "mcq", "q": "According to the survey, most people ______.", "options": ["preferred fast food", "never ate street food", "preferred traditional dishes", "wanted to learn new recipes"], "answer": "C", "tag": "d14r"}, {"id": "d14E5", "kind": "mcq", "q": "Why did the team film the grandmothers?", "options": ["to win money for the school", "to help young people learn the old recipes", "because the judges asked them to", "to advertise the market"], "answer": "B", "tag": "d14r"}]}, "F_writing": {"task_en": "Write an email to an English-speaking friend about a festival, show or exhibition you went to recently. Say what it was, what you saw or did there, and why your friend would enjoy it. Use at least one passive sentence, one relative clause and one conditional sentence.", "task_vi": "Viết một email cho một người bạn nói tiếng Anh, kể về một lễ hội, buổi biểu diễn hoặc triển lãm em đã đi gần đây: đó là sự kiện gì, em đã xem/làm gì, và vì sao bạn ấy sẽ thích. Dùng ít nhất một câu bị động, một mệnh đề quan hệ và một câu điều kiện.", "min_words": 80, "model": "Hi Jack,\nHow are you? Last weekend I went to the Mid-Autumn Festival in my neighbourhood with my cousin, who is visiting from Đà Nẵng. The streets were decorated with colourful lanterns, which were made by local children. We watched an amazing lion dance performance and ate mooncakes with lots of different flavours. My favourite was green tea! I also took part in a drawing competition and won second prize. If you visited Vietnam in September, I would take you there. I'm sure you would love it.\nWrite back soon,\nNam", "checklist_vi": ["Email của em có lời chào mở đầu và lời chào kết thúc chưa?", "Em đã có ít nhất 1 câu bị động (was/were + V3), 1 mệnh đề quan hệ (who/which/where...) và 1 câu điều kiện chưa?", "Em đã dùng ít nhất 4 từ đã học trong các buổi 8–13 chưa?", "Em đã viết đủ 80 từ trở lên và kiểm tra lại chính tả chưa?"]}, "self_check_vi": ["Em đã thuộc 48 từ vựng và 12 cụm động từ của buổi 8–13, và nhớ lại được từ của buổi 1–6.", "Em có thể dùng câu bị động thì hiện tại đơn và quá khứ đơn.", "Em có thể dùng đúng câu điều kiện loại 0, 1, 2 và mệnh đề quan hệ who/which/that/whose/where.", "Em có thể chuyển câu trực tiếp sang câu tường thuật và chọn đúng V-ing hay to V.", "Em có thể tạo từ với các hậu tố -able/-ive, -ness/-ity, -ise/-ify/-en, -ence/-ance, -ure/-age.", "Em đã làm quen với 6 dạng bài thi: điền từ, đồng nghĩa, trái nghĩa, hội thoại, câu đồng nghĩa và điền từ vào đoạn văn."]}, "web_check": [{"id": "d14q1", "type": "mcq", "skill": "vocab", "from_day": 8, "q": "Can you ______ what time the museum opens on Sunday?", "options": ["come across", "find out", "carry out", "turn down"], "answer": 1, "explain_vi": "'find out' = tìm ra, tìm hiểu (thông tin). 'come across' = tình cờ gặp/thấy.", "tag": "d8p1"}, {"id": "d14q2", "type": "text", "skill": "vocab", "from_day": 9, "q": "We don't cook on Sundays; we usually eat ______ at a restaurant near our house.", "answer": "out", "accept": [], "explain_vi": "'eat out' = đi ăn ở ngoài (nhà hàng, quán ăn).", "tag": "d9p1"}, {"id": "d14q3", "type": "mcq", "skill": "vocab", "from_day": 10, "q": "Don't stop now! ______ reading – the story is just getting interesting.", "options": ["Turn down", "Look up to", "Carry on", "Put on"], "answer": 2, "explain_vi": "'carry on + V-ing' = tiếp tục làm gì.", "tag": "d10p1"}, {"id": "d14q4", "type": "text", "skill": "vocab", "from_day": 13, "q": "More than two hundred runners took ______ in the charity race.", "answer": "part", "accept": [], "explain_vi": "'take part in' = tham gia (cuộc thi, hoạt động).", "tag": "d13p2"}, {"id": "d14q5", "type": "mcq", "skill": "grammar", "from_day": 8, "q": "Our school ______ in 1998, so it is quite new.", "options": ["built", "is built", "was built", "were built"], "answer": 2, "explain_vi": "Bị động quá khứ đơn (in 1998); chủ ngữ số ít 'Our school' → was built.", "tag": "d8g"}, {"id": "d14q6", "type": "mcq", "skill": "grammar", "from_day": 12, "q": "My mum ______ that she would be home late.", "options": ["told", "talked", "said", "spoke"], "answer": 2, "explain_vi": "Không có người nghe sau chỗ trống → dùng said (say that...). 'told' phải có người nghe: told me that...", "tag": "d12g"}, {"id": "d14q7", "type": "text", "skill": "grammar", "from_day": 13, "q": "Nam finished ______ (paint) the picture just before midnight.", "answer": "painting", "accept": [], "explain_vi": "'finish' luôn đi với V-ing: finish painting.", "tag": "d13g"}, {"id": "d14q8", "type": "mcq", "skill": "grammar", "from_day": 11, "q": "Đà Lạt, ______ is in the mountains, is cool all year round.", "options": ["which", "that", "where", "who"], "answer": 0, "explain_vi": "Sau chỗ trống là động từ 'is' (thiếu chủ ngữ) → dùng which. Không dùng 'that' sau dấu phẩy; 'where' cần cả một câu đầy đủ phía sau.", "tag": "d11g"}, {"id": "d14q9", "type": "mcq", "skill": "wordform", "from_day": 9, "q": "Some villages in the mountains still have no ______. (ELECTRIC)", "options": ["electric", "electrical", "electrically", "electricity"], "answer": 3, "explain_vi": "Sau 'no' cần danh từ: electric → electricity (điện).", "tag": "d9w"}, {"id": "d14q10", "type": "text", "skill": "wordform", "from_day": 10, "q": "Our school website looks very old. We need to ______ it. (MODERN)", "answer": "modernise", "accept": ["modernize"], "explain_vi": "Sau 'need to' cần động từ: modern + -ise → modernise (hiện đại hoá).", "tag": "d10w"}, {"id": "d14q11", "type": "mcq", "skill": "exam", "from_day": 8, "q": "Choose the best answer: I'm sorry, I ______ a mistake when I wrote your name.", "options": ["did", "took", "made", "had"], "answer": 2, "explain_vi": "Kết hợp cố định: make a mistake (mắc lỗi). Không nói 'do a mistake'.", "tag": "fmt:sentence_completion"}, {"id": "d14q12", "type": "mcq", "skill": "vocab", "from_day": 1, "q": "I find it difficult to ______ in class when I haven't had enough sleep.", "options": ["attend", "concentrate", "revise", "encourage"], "answer": 1, "explain_vi": "'concentrate on sth' = tập trung vào việc gì.", "tag": "d1v4"}, {"id": "d14q13", "type": "text", "skill": "grammar", "from_day": 3, "q": "I have never ______ (see) snow in my life.", "answer": "seen", "accept": [], "explain_vi": "Hiện tại hoàn thành: have + V3. see → seen.", "tag": "d3g"}, {"id": "d14q14", "type": "mcq", "skill": "vocab", "from_day": 2, "q": "My cousin ______ chess when she was eight, and now she plays in competitions.", "options": ["gave up", "set off", "worked out", "took up"], "answer": 3, "explain_vi": "'take up' = bắt đầu một sở thích mới (quá khứ: took up). 'give up' = từ bỏ – ngược nghĩa với câu.", "tag": "d2p1"}, {"id": "d14q15", "type": "mcq", "skill": "grammar", "from_day": 6, "q": "You ______ touch the paintings in the museum. It's not allowed.", "options": ["mustn't", "don't have to", "can", "should"], "answer": 0, "explain_vi": "'mustn't' = cấm, không được phép. 'don't have to' = không cần phải (nhưng làm cũng được).", "tag": "d6g"}, {"id": "d14q16", "type": "mcq", "skill": "grammar", "from_day": 5, "q": "The water isn't warm ______ for swimming today.", "options": ["too", "so", "enough", "such"], "answer": 2, "explain_vi": "'enough' đứng SAU tính từ: warm enough (đủ ấm). 'too' đứng trước tính từ.", "tag": "d5g"}], "can_do_v
