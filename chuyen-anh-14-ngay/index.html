<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyên Anh 14 Ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bộ nhận diện dùng chung cho mọi trang. Sửa ở đây rồi chạy build.py; không sửa trực tiếp trong trang đã dựng.
   Ý tưởng: sổ ô li xanh + huy hiệu vàng. Nền giấy kẻ ô, thanh đầu trang màu xanh đặc vụ, nút bấm nổi khối như phím,
   ô tiến độ 3 màu (chưa làm / làm dở / xong) luôn đi kèm chữ hoặc biểu tượng, không dùng màu đơn thuần. */
:root{
  --paper:#F2F5FC; --grid:#E1E7F4; --surface:#FFFFFF; --surface2:#EEF1FA;
  --ink:#151521; --ink-2:#4A4C53; --line:#D6DCEA; --line-strong:#B7BFD5;
  --agent:#2638C4; --agent-deep:#18248A; --agent-tint:#E8ECFF; --on-agent:#FFFFFF;
  --bar:#2638C4; --bar-ink:#FFFFFF; --bar-ink-2:rgba(255,255,255,.8); --bar-on:#FFFFFF; --bar-on-ink:#2638C4;
  --gold:#FCC539; --gold-deep:#C9961A; --gold-tint:#FFF4D1; --gold-ink:#3D2E00;
  --signal:#F8551A; --signal-text:#C8481A; --signal-tint:#FEE9E5;
  --good:#3C6D4A; --good-bg:#E3F7E3; --good-edge:#579F6C;
  --bad:#BE2626; --bad-bg:#FFEBEB;
  --warn:#8A5A00; --warn-bg:#FFF3D1;
  --t-none:#ECEDF1; --t-none-edge:#A3A5AE; --t-part:#FEE7AD; --t-part-edge:#E0A200; --t-done:#BCEBBB; --t-done-edge:#579F6C;
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-card:14px; --r-ctl:10px;
  /* tên cũ, giữ để mã cũ còn chạy */
  --bg:var(--paper); --muted:var(--ink-2); --accent:var(--agent); --accent-soft:var(--agent-tint);
  --hi:var(--gold); --hi-soft:var(--gold-tint); --hi-ink:var(--gold-ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12131F; --grid:#1A1C2C; --surface:#1E2030; --surface2:#272A3E;
  --ink:#EDEDEE; --ink-2:#B5B6C2; --line:#33364D; --line-strong:#4C5070;
  --agent:#8DA2FF; --agent-deep:#4C5BC4; --agent-tint:#25285A; --on-agent:#0E1030;
  --bar:#1B2170; --bar-ink:#FFFFFF; --bar-ink-2:rgba(255,255,255,.78); --bar-on:#EDEDEE; --bar-on-ink:#1B2170;
  --gold-deep:#9C7410; --gold-tint:#3A3015; --gold-ink:#FFE7A6;
  --signal-text:#FF8A5C; --signal-tint:#3A1E14;
  --good:#7CC48C; --good-bg:#17301F; --good-edge:#72BB82;
  --bad:#F98B8B; --bad-bg:#3A1A1C; --warn:#F0B65A; --warn-bg:#3A2C13;
  --t-none:#262939; --t-none-edge:#565A74; --t-part:#4D3D0E; --t-part-edge:#E0A200; --t-done:#1D4429; --t-done-edge:#72BB82;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12131F; --grid:#1A1C2C; --surface:#1E2030; --surface2:#272A3E;
  --ink:#EDEDEE; --ink-2:#B5B6C2; --line:#33364D; --line-strong:#4C5070;
  --agent:#8DA2FF; --agent-deep:#4C5BC4; --agent-tint:#25285A; --on-agent:#0E1030;
  --bar:#1B2170; --bar-ink:#FFFFFF; --bar-ink-2:rgba(255,255,255,.78); --bar-on:#EDEDEE; --bar-on-ink:#1B2170;
  --gold-deep:#9C7410; --gold-tint:#3A3015; --gold-ink:#FFE7A6;
  --signal-text:#FF8A5C; --signal-tint:#3A1E14;
  --good:#7CC48C; --good-bg:#17301F; --good-edge:#72BB82;
  --bad:#F98B8B; --bad-bg:#3A1A1C; --warn:#F0B65A; --warn-bg:#3A2C13;
  --t-none:#262939; --t-none-edge:#565A74; --t-part:#4D3D0E; --t-part-edge:#E0A200; --t-done:#1D4429; --t-done-edge:#72BB82;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-weight:800}
h2{font-size:1.75rem;font-weight:800}
h3{font-size:1.18rem;font-weight:700}
p{margin:0}
a{color:var(--agent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--agent);outline-offset:2px;border-radius:6px}

/* thanh đầu trang */
.hq{background:var(--bar);color:var(--bar-ink)}
.hq a{color:var(--bar-ink)}
.logo{display:inline-flex;flex:none;border-radius:50%;text-decoration:none}
.logo svg{display:block;width:46px;height:46px}

/* nút bấm: nổi khối, ấn xuống khi bấm */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:var(--r-ctl);padding:10px 20px;margin-bottom:4px;
  font-weight:700;cursor:pointer;text-decoration:none;background:var(--agent);color:var(--on-agent);box-shadow:0 4px 0 var(--agent-deep);
  transition:transform .12s ease-out,box-shadow .12s ease-out}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--agent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--agent-deep)}
.btn.hi{background:var(--gold);color:#151521;box-shadow:0 4px 0 var(--gold-deep)}
.btn.hi:hover{box-shadow:0 5px 0 var(--gold-deep)}.btn.hi:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line-strong),0 4px 0 var(--line-strong)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--agent),0 5px 0 var(--agent-deep)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--agent),0 1px 0 var(--agent-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* mặt giấy, nhãn, con dấu */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--ink)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.hi{background:var(--gold-tint);color:var(--gold-ink)}
.stamp{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--good);border:2.5px solid currentColor;border-radius:8px;padding:2px 10px;transform:rotate(-6deg);opacity:.92}
.stamp.part{color:var(--warn)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.mono{font-family:var(--f-mono)}
.notice{background:var(--gold-tint);color:var(--gold-ink);border-radius:var(--r-ctl);padding:12px 14px;font-size:.92rem}

table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.82rem;font-weight:700;color:var(--ink-2);background:var(--surface2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Trang học sinh: thanh xanh dính trên cùng mang các tab; dưới là một cột bài làm; 14 ô buổi học là điểm nhấn duy nhất. */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:1.4rem;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.brand span{font-size:.84rem;color:var(--bar-ink-2)}
.hello{font-size:.9rem;color:var(--bar-ink-2);text-align:right}
.hello strong{color:var(--bar-ink)}
.hq .sync,.hq .sync.ok{color:var(--bar-ink-2)}.hq .sync.bad{color:var(--gold)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-inline:-6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:8px 11px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--bar-ink-2);cursor:pointer;white-space:nowrap;min-height:40px}
nav.tabs button svg{width:18px;height:18px;flex:none}
nav.tabs button:hover{color:var(--bar-ink);background:rgba(255,255,255,.12)}
nav.tabs button[aria-selected="true"]{background:var(--bar-on);color:var(--bar-on-ink);font-weight:700}
nav.tabs button:focus-visible{outline-color:var(--gold)}
@media (max-width:600px){.topbar{padding-block:8px 6px;gap:10px}.brand span{display:none}.brand b{font-size:1.15rem;white-space:nowrap}.hq .sync{display:none}.logo svg{width:36px;height:36px}.hello{font-size:.82rem}nav.tabs{padding-bottom:8px}nav.tabs button{padding:7px 10px;min-height:38px;font-size:.88rem}}
main{padding-block:24px 72px}
#dayBody{display:flex;flex-direction:column;gap:20px}
section.view{display:flex;flex-direction:column;gap:20px}
.lead{font-size:1.05rem;color:var(--ink-2);max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.86rem;font-weight:700;color:var(--agent)}
.steps{display:grid;gap:14px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#151521;border:2px solid #151521;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
input[type=text],input[type=password],textarea{width:100%;border:2px solid var(--line-strong);background:var(--surface);border-radius:var(--r-ctl);padding:10px 12px;min-height:44px}
input[type=text]:focus,textarea:focus{border-color:var(--agent);outline:none;box-shadow:0 0 0 3px var(--agent-tint)}
textarea{min-height:110px;font-family:var(--f-mono);font-size:.82rem}
/* hồ sơ ở trang đầu */
.spiral-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:20px}
.spiral-wrap svg{width:240px;max-width:100%;height:auto;flex:none;margin-inline:auto}
.spiral-legend{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 280px}
.spiral-legend h2{font-size:2rem}
/* câu hỏi */
.q{border-top:2px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:0;padding-top:0}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qnum{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--agent-tint);color:var(--agent);font-family:var(--f-mono);font-size:.82rem;font-weight:700}
.qtext{font-weight:500;font-size:1.04rem;white-space:pre-wrap}
.opts{display:grid;gap:8px;counter-reset:opt}
.opt{counter-increment:opt;position:relative;display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;background:var(--surface);min-height:48px;transition:border-color .12s,background-color .12s}
.opt::before{content:counter(opt,upper-alpha);flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);font-weight:700;font-size:.85rem;color:var(--ink-2)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt:hover{border-color:var(--agent)}
.opt:has(input:focus-visible){outline:3px solid var(--agent);outline-offset:2px}
.opt.sel{border-color:var(--agent);background:var(--agent-tint)}
.opt.sel::before{background:var(--agent);border-color:var(--agent);color:var(--on-agent)}
.opt.right{border-color:var(--good-edge);background:var(--good-bg)}
.opt.right::before{content:"✓";background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong::before{content:"✗";background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:has(input:disabled){cursor:default}
.fb{font-size:.92rem;border-radius:10px;padding:10px 14px;border-left:5px solid currentColor}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.good::before{content:"✓ ";font-weight:800}.fb.bad::before{content:"✗ ";font-weight:800}
.fb .ex{color:var(--ink);display:block;margin-top:2px}
.passage{background:var(--surface2);border-left:5px solid var(--agent);border-radius:10px;padding:14px 16px;white-space:pre-wrap;max-width:68ch;line-height:1.7}
.tagline{font-size:.78rem;color:var(--ink-2)}
.review-mark{background:var(--signal-tint);color:var(--signal-text);border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:700}
/* 14 ô buổi học: điểm nhấn của trang */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 8px;padding-bottom:4px}
.day{position:relative;border:2px solid var(--t-none-edge);border-radius:12px;padding:9px 6px 7px;background:var(--t-none);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;
  box-shadow:0 4px 0 var(--t-none-edge);transition:transform .12s ease-out,box-shadow .12s ease-out}
.day b{font-family:var(--f-display);font-size:1.45rem;font-weight:800;line-height:1}
.day small{font-size:.68rem;color:var(--ink-2);text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.day:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--t-none-edge)}
.day.part{background:var(--t-part);border-color:var(--t-part-edge);box-shadow:0 4px 0 var(--t-part-edge)}
.day.done{background:var(--t-done);border-color:var(--t-done-edge);box-shadow:0 4px 0 var(--t-done-edge)}
.day.done::after{content:"✓";position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--surface);font-size:.72rem;font-weight:800;display:grid;place-items:center}
.day.review::before{content:"★";position:absolute;top:-9px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#151521;border:1.5px solid #151521;font-size:.7rem;display:grid;place-items:center}
.day[aria-pressed="true"]{outline:3px solid var(--agent);outline-offset:3px;transform:translateY(-2px)}
@media (max-width:520px){.days{gap:10px 5px}.day{padding:7px 2px 5px}.day b{font-size:1.2rem}.day small{display:none}}
/* chữa bài giấy */
.key-section{display:flex;flex-direction:column;gap:6px}
.key-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.key-item input{width:22px;height:22px;accent-color:var(--good-edge);margin-top:2px}
.key-ans{font-weight:700;color:var(--good)}
/* tiến bộ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--ink-2)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.bar .fill{height:100%;background:var(--agent);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
td,th{white-space:nowrap}
/* đồng bộ, tin nhắn, chấm ảnh */
.sync{display:inline-block;margin-left:10px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.sync.ok{color:var(--good)}.sync.bad{color:var(--bad)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:2px;border-radius:999px;background:var(--signal);color:#151521;font-size:.74rem;font-weight:800;line-height:20px;text-align:center}
.hi-card{border-color:var(--gold-deep);background:var(--gold-tint)}
.up-box h3{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.thumbs img{width:84px;height:110px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
.ai-res{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ai-res h4{margin:6px 0 0;font-size:1rem;font-family:var(--f-display)}
.ai-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ai-item{border-left:5px solid var(--line-strong);padding:8px 12px;background:var(--surface2);border-radius:8px}
.ai-item.bad{border-left-color:var(--bad)}.ai-item.unk{border-left-color:var(--t-part-edge)}.ai-item.ok{border-left-color:var(--good-edge)}
.linkbtn{background:none;border:0;padding:0;margin-top:4px;color:var(--agent);font:inherit;font-size:.86rem;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.thread{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.msg{max-width:85%;padding:9px 13px;border-radius:14px;background:var(--surface2)}
.msg.from-s{align-self:flex-end;background:var(--agent-tint);border-bottom-right-radius:4px}
.msg.from-t{align-self:flex-start;background:var(--gold-tint);color:var(--gold-ink);border-bottom-left-radius:4px}
.t-note{background:var(--gold-tint);color:var(--gold-ink);border-radius:10px;padding:10px 14px}
.up-row{border-top:2px dashed var(--line);padding:10px 0}.up-row summary{cursor:pointer}
.selfkey{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}.selfkey summary{cursor:pointer;font-weight:700}
textarea{width:100%;font:inherit;padding:10px 12px;color:var(--ink)}
/* chọn trường */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:8px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
.fld input,.fld select{font:inherit;font-weight:500;padding:9px 11px;min-height:44px;border:2px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--agent);box-shadow:0 0 0 3px var(--agent-tint)}
.fld input::placeholder{color:var(--ink-2);opacity:1}
.fld .hint{font-weight:400;font-size:.8rem;color:var(--ink-2)}
.fld .hint.sug{color:var(--gold-ink);background:var(--gold-tint);border-radius:6px;padding:2px 6px}
.langs{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:10px}

rage sb to do sth)", "example": "Our teacher encourages us to ask questions in class.", "family": "encouragement (n), encouraging (adj), discourage (v)"}], "phrasal": [{"id": "d1p1", "phrase": "catch up (with)", "meaning_vi": "bắt kịp, theo kịp (ai đó / bài vở)", "example": "After two weeks off school, Lan had to work hard to catch up with her classmates."}, {"id": "d1p2", "phrase": "drop out (of)", "meaning_vi": "bỏ học, bỏ ngang (khoá học, câu lạc bộ)", "example": "He dropped out of the chess club because he had too much homework."}], "grammar": {"id": "d1g", "title": "Present simple vs present continuous; stative verbs", "rule_vi": ["Hiện tại đơn (S + V / V-s/es): thói quen, sự thật, lịch trình. Dấu hiệu: always, usually, often, sometimes, every day, on Mondays…", "Hiện tại tiếp diễn (S + am/is/are + V-ing): việc đang xảy ra lúc nói hoặc tạm thời quanh thời điểm hiện tại. Dấu hiệu: now, right now, at the moment, Look!, Listen!, this week, these days…", "Động từ trạng thái (stative verbs) thường KHÔNG chia -ing: know, understand, believe, like, love, hate, want, need, prefer, belong, own, seem, mean, remember.", "Một số động từ có 2 nghĩa: think (= cho rằng → hiện tại đơn; = đang suy nghĩ → được chia -ing), have (= có, sở hữu → hiện tại đơn; = ăn, uống, tắm, nghỉ… → được chia -ing)."], "examples": ["Minh usually walks to school, but today he is going by bus.", "Be quiet! The students are doing a test.", "I don't understand this exercise. Can you help me?", "We are having lunch now, so I'll call you back later."], "common_mistake_vi": "Sai: I am knowing the answer. → Đúng: I know the answer. (know là động từ trạng thái, không chia -ing)."}, "wordform": {"id": "d1w", "focus": "-tion/-ation, -ment", "rule_vi": "Thêm -tion/-ation hoặc -ment vào sau động từ để tạo danh từ chỉ hành động hoặc kết quả của hành động. Chú ý thay đổi chính tả: educate → education (bỏ -e), explain → explanation.", "examples": [["educate", "education"], ["inform", "information"], ["explain", "explanation"], ["improve", "improvement"], ["encourage", "encouragement"], ["achieve", "achievement"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần và có 2 từ thừa. Nhớ đổi dạng từ (thêm -s, -ing…) nếu cần nhé!", "bank": ["curriculum", "assignment", "revise", "concentrate", "attend", "knowledge", "catch up", "drop out"], "items": [{"id": "d1A1", "q": "Our school has changed its ______: now all students learn coding from grade 6.", "answer": "curriculum", "tag": "d1v1"}, {"id": "d1A2", "q": "I can't go to the cinema tonight. I have to finish my geography ______ and hand it in tomorrow morning.", "answer": "assignment", "tag": "d1v2"}, {"id": "d1A3", "q": "Before an exam, I always ______ my notes carefully.", "answer": "revise", "tag": "d1v3"}, {"id": "d1A4", "q": "Phong found it hard to ______ during the lesson because the boy behind him kept whispering.", "answer": "concentrate", "tag": "d1v4"}, {"id": "d1A5", "q": "Reading newspapers is a great way to increase your general ______.", "answer": "knowledge", "tag": "d1v6"}, {"id": "d1A6", "q": "Mai was ill for a week, so now she is working extra hard to ______ with the rest of the class.", "answer": "catch up", "tag": "d1p1"}]}, "B_grammar": {"instruction_vi": "Em chia động từ trong ngoặc ở thì hiện tại đơn hoặc hiện tại tiếp diễn. Để ý các từ dấu hiệu và các động từ chỉ trạng thái nhé!", "items": [{"id": "d1B1", "q": "Look! The children ______ (play) football in the rain.", "answer": "are playing", "accept": ["'re playing"], "tag": "d1g"}, {"id": "d1B2", "q": "My brother ______ (go) to the library every Saturday morning.", "answer": "goes", "tag": "d1g"}, {"id": "d1B3", "q": "I ______ (not understand) this grammar rule. Could you explain it again?", "answer": "don't understand", "accept": ["do not understand"], "tag": "d1g"}, {"id": "d1B4", "q": "This week our class ______ (practise) for the school English festival.", "answer": "is practising", "accept": ["is practicing", "'s practising"], "tag": "d1g"}, {"id": "d1B5", "q": "Nam ______ (want) to become a science teacher in the future.", "answer": "wants", "tag": "d1g"}, {"id": "d1B6", "q": "Please speak quietly! Grandma ______ (have) a rest in her room.", "answer": "is having", "accept": ["'s having"], "tag": "d1g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa để hoàn thành câu.", "items": [{"id": "d1C1", "q": "Thank you for the clear ______. Now I understand the exercise. (EXPLAIN)", "answer": "explanation", "tag": "d1w"}, {"id": "d1C2", "q": "There has been a big ______ in her English since she joined the club. (IMPROVE)", "answer": "improvement", "tag": "d1w"}, {"id": "d1C3", "q": "Students can find ______ about the summer courses on the school website. (INFORM)", "answer": "information", "tag": "d1w"}, {"id": "d1C4", "q": "A few words of ______ from her teacher gave Linh more confidence. (ENCOURAGE)", "answer": "encouragement", "tag": "d1w"}]}, "D_exam": {"format": "sentence_completion", "instruction_vi": "Đây là dạng hoàn thành câu trong đề thi chuyên. Em chọn đáp án đúng nhất (A, B, C hoặc D) để hoàn thành mỗi câu.", "items": [{"id": "d1D1", "q": "Students who want to join the school trip must ______ the meeting on Friday afternoon.", "options": ["come", "go", "participate", "attend"], "answer": "D", "tag": "fmt:sentence_completion"}, {"id": "d1D2", "q": "My sister can't talk on the phone right now. She ______ for her history test.", "options": ["revises", "revise", "is revising", "was revising"], "answer": "C", "tag": "fmt:sentence_completion"}, {"id": "d1D3", "q": "Our teacher always ______ us to read English stories in our free time.", "options": ["makes", "encourages", "suggests", "lets"], "answer": "B", "tag": "fmt:sentence_completion"}, {"id": "d1D4", "q": "If you miss too many lessons, it is hard to ______ with your classmates.", "options": ["catch up", "drop out", "keep on", "take up"], "answer": "A", "tag": "fmt:sentence_completion"}]}, "E_reading": {"id": "d1r", "title": "A New Way to Learn", "text": "At Green Hill Secondary School, Monday mornings look different this year. Instead of sitting in rows and listening to the teacher, students in grade 7 work in small groups on projects. The school changed part of its curriculum last summer because teachers wanted students to learn by doing, not only by memorising.\n\nThis month, the students are studying rivers. One group is building a model of a river, while another group is interviewing an engineer online. Each group has to present its project at the end of the month.\n\nMs Hoa, a science teacher, says the new method encourages shy students to share their ideas. 'Some students rarely speak in a normal lesson, but in a small group they feel safer,' she explains.\n\nNot everyone likes the change, however. A few parents worry that projects take too much time and that their children have less time to revise for exams. The school plans to ask parents for their opinions in December.", "items": [{"id": "d1E1", "kind": "tfng", "q": "All the parents are happy with the new way of learning.", "answer": "False", "tag": "d1r"}, {"id": "d1E2", "kind": "tfng", "q": "Students in grade 6 also do group projects at Green Hill.", "answer": "Not Given", "tag": "d1r"}, {"id": "d1E3", "kind": "mcq", "q": "What are the grade 7 students studying this month?", "options": ["engineers", "rivers", "models", "exams"], "answer": "B", "tag": "d1r"}, {"id": "d1E4", "kind": "mcq", "q": "According to Ms Hoa, why do shy students speak more during project work?", "options": ["They get higher marks.", "The teacher asks them more questions.", "They are more interested in rivers.", "They feel safer in a small group."], "answer": "D", "tag": "d1r"}]}, "F_writing": {"task_en": "Write a paragraph (50–70 words) about your school life. Say what you usually do at school and what you are doing or learning this week.", "task_vi": "Viết một đoạn văn (50–70 từ) về cuộc sống ở trường của em: em thường làm gì ở trường, và tuần này em đang làm hoặc đang học gì đặc biệt.", "min_words": 50, "model": "I usually get up at six o'clock and cycle to school with my best friend. My favourite subject is English because our teacher always encourages us to speak a lot. In the afternoon, I often attend the art club. This week, however, I am not going to the club because I am revising for my maths test. I know it is difficult, but I am trying my best to improve.", "checklist_vi": ["Em có dùng ít nhất 2 câu thì hiện tại đơn để nói về thói quen không?", "Em có dùng ít nhất 2 câu thì hiện tại tiếp diễn để nói về việc tuần này / lúc này không?", "Em có dùng ít nhất 3 từ mới hoặc cụm động từ của buổi 1 không?", "Đoạn văn đủ 50 từ; mỗi câu bắt đầu bằng chữ hoa và kết thúc bằng dấu chấm."]}, "G_review": {"instruction_vi": "Khởi động – hôm nay là buổi đầu nên mình ôn lại vài kiến thức cơ bản (A2) trước nhé. Em điền từ hoặc dạng đúng vào chỗ trống.", "items": [{"id": "d1G1", "q": "There ______ (be) thirty-two students in my class.", "answer": "are", "from_day": 0, "tag": "a2:be"}, {"id": "d1G2", "q": "We went to the zoo ______ Sunday morning. (in / on / at)", "answer": "on", "from_day": 0, "tag": "a2:prepositions"}, {"id": "d1G3", "q": "How many ______ (child) are there in your family?", "answer": "children", "from_day": 0, "tag": "a2:plurals"}, {"id": "d1G4", "q": "Lan's bag is red, and ______ (I) is blue.", "answer": "mine", "from_day": 0, "tag": "a2:pronouns"}]}}, "web_check": [{"id": "d1q1", "type": "mcq", "skill": "vocab", "q": "All students must ______ school from Monday to Friday.", "options": ["attend", "arrive", "go", "present"], "answer": 0, "explain_vi": "attend school = đi học (đều đặn). 'arrive' và 'go' cần giới từ (arrive at, go to).", "tag": "d1v5"}, {"id": "d1q2", "type": "mcq", "skill": "vocab", "q": "My handwriting was messy, but it has ______ a lot since I started practising every day.", "options": ["encouraged", "revised", "improved", "concentrated"], "answer": 2, "explain_vi": "improve = tiến bộ, tốt lên. Chữ viết 'đã tiến bộ nhiều'.", "tag": "d1v7"}, {"id": "d1q3", "type": "text", "skill": "vocab", "q": "My parents always e______ me to try new things, even when I am afraid of failing. (Viết cả từ)", "answer": "encourage", "explain_vi": "encourage sb to do sth = khuyến khích ai làm gì. Chủ ngữ 'My parents' số nhiều nên không thêm -s.", "tag": "d1v8"}, {"id": "d1q4", "type": "mcq", "skill": "vocab", "q": "Because of his family's money problems, the boy had to ______ school at the age of 14.", "options": ["catch up with", "look after", "drop out of", "get on with"], "answer": 2, "explain_vi": "drop out of school = bỏ học giữa chừng.", "tag": "d1p2"}, {"id": "d1q5", "type": "mcq", "skill": "grammar", "q": "Listen! Someone ______ the piano in the music room.", "options": ["plays", "is playing", "play", "has played"], "answer": 1, "explain_vi": "'Listen!' cho biết việc đang xảy ra ngay lúc nói → hiện tại tiếp diễn.", "tag": "d1g"}, {"id": "d1q6", "type": "text", "skill": "grammar", "q": "Water ______ (boil) at 100°C.", "answer": "boils", "explain_vi": "Sự thật hiển nhiên → hiện tại đơn; chủ ngữ số ít thêm -s.", "tag": "d1g"}, {"id": "d1q7", "type": "mcq", "skill": "grammar", "q": "I ______ what you mean now. Thanks for explaining!", "options": ["understand", "am understanding", "understanding", "am understand"], "answer": 0, "explain_vi": "understand là động từ trạng thái, không chia -ing dù có 'now'.", "tag": "d1g"}, {"id": "d1q8", "type": "text", "skill": "grammar", "q": "Hurry up! Your friends ______ (wait) for you outside.", "answer": "are waiting", "accept": ["'re waiting"], "explain_vi": "'Hurry up!' → việc đang diễn ra lúc nói → hiện tại tiếp diễn.", "tag": "d1g"}, {"id": "d1q9", "type": "mcq", "skill": "grammar", "q": "Which sentence is correct?", "options": ["This book is belonging to my teacher.", "My dad is owning a small shop.", "I am needing a new pencil.", "She is having a shower at the moment."], "answer": 3, "explain_vi": "belong, own, need là động từ trạng thái. 'have a shower' (tắm) là hành động nên chia -ing được.", "tag": "d1g"}, {"id": "d1q10", "type": "mcq", "skill": "wordform", "q": "Getting the top score in the final test was a great ______ for Hung.", "options": ["achieve", "achievement", "achieving", "achievation"], "answer": 1, "explain_vi": "Sau 'a great' cần danh từ: achieve → achievement.", "tag": "d1w"}, {"id": "d1q11", "type": "text", "skill": "wordform", "q": "Every child has the right to a good ______. (EDUCATE)", "answer": "education", "explain_vi": "Sau 'a good' cần danh từ: educate → education (bỏ -e, thêm -ion).", "tag": "d1w"}, {"id": "d1q12", "type": "mcq", "skill": "exam", "q": "I have a lot of ______ to do tonight, so I can't go out.", "options": ["homeworks", "assignment", "task", "homework"], "answer": 3, "explain_vi": "homework là danh từ không đếm được: a lot of homework, không thêm -s. 'assignment' và 'task' đếm được nên phải ở số nhiều.", "tag": "fmt:sentence_completion"}], "can_do_vi": ["Em có thể dùng đúng 8 từ mới và 2 cụm động từ về chủ đề trường học.", "Em có thể phân biệt thì hiện tại đơn và hiện tại tiếp diễn, và biết động từ nào không chia -ing.", "Em có thể tạo danh từ bằng đuôi -tion/-ation và -ment.", "Em có thể làm dạng bài hoàn thành câu (trắc nghiệm) trong đề thi chuyên."]}, {"day": 2, "type": "normal", "theme_en": "Hobbies & free time", "theme_vi": "Sở thích", "goal_vi": "Hôm nay em sẽ học cách kể về sở thích và thời gian rảnh, đồng thời luyện thì quá khứ đơn, quá khứ tiếp diễn và cấu trúc used to. Em cũng làm quen với dạng bài tìm từ đồng nghĩa trong đề thi chuyên nhé!", "minutes": 30, "vocab": [{"id": "d2v1", "word": "leisure", "pos": "n", "ipa": "/ˈleʒə(r)/", "meaning_vi": "thời gian rảnh rỗi, sự thư giãn", "example": "In her leisure time, my mum enjoys gardening.", "family": "leisurely (adj)"}, {"id": "d2v2", "word": "collect", "pos": "v", "ipa": "/kəˈlekt/", "meaning_vi": "sưu tầm, thu thập", "example": "My cousin collects old coins from different countries.", "family": "collection (n), collector (n)"}, {"id": "d2v3", "word": "enthusiastic", "pos": "adj", "ipa": "/ɪnˌθjuːziˈæstɪk/", "meaning_vi": "nhiệt tình, hăng hái (enthusiastic about sth)", "example": "Tuan is very enthusiastic about photography.", "family": "enthusiasm (n), enthusiastically (adv)"}, {"id": "d2v4", "word": "spare", "pos": "adj", "ipa": "/speə(r)/", "meaning_vi": "rảnh rỗi, dư ra (spare time = thời gian rảnh)", "example": "What do you like doing in your spare time?", "family": "spare (v): dành ra"}, {"id": "d2v5", "word": "challenge", "pos": "n", "ipa": "/ˈtʃælɪndʒ/", "meaning_vi": "thử thách", "example": "Climbing that mountain was a real challenge for me.", "family": "challenge (v), challenging (adj)"}, {"id": "d2v6", "word": "creative", "pos": "adj", "ipa": "/kriˈeɪtɪv/", "meaning_vi": "sáng tạo", "example": "Making comics is a creative hobby.", "family": "create (v), creativity (n), creation (n)"}, {"id": "d2v7", "word": "relax", "pos": "v", "ipa": "/rɪˈlæks/", "meaning_vi": "thư giãn, nghỉ ngơi", "example": "I relax by listening to music after school.", "family": "relaxation (n), relaxed (adj), relaxing (adj)"}, {"id": "d2v8", "word": "membership", "pos": "n", "ipa": "/ˈmembəʃɪp/", "meaning_vi": "tư cách hội viên; thẻ hội viên", "example": "A year's membership of the swimming club costs 500,000 dong.", "family": "member (n)"}], "phrasal": [{"id": "d2p1", "phrase": "take up", "meaning_vi": "bắt đầu một sở thích / hoạt động mới", "example": "Last year my grandpa took up yoga, and now he does it every morning."}, {"id": "d2p2", "phrase": "give up", "meaning_vi": "từ bỏ (một thói quen, hoạt động)", "example": "Don't give up learning the guitar just because it's difficult at first."}], "grammar": {"id": "d2g", "title": "Past simple vs past continuous; used to", "rule_vi": ["Quá khứ đơn (S + V-ed / V2): hành động đã xảy ra và kết thúc trong quá khứ. Dấu hiệu: yesterday, last week, ago, in 2020…", "Quá khứ tiếp diễn (S + was/were + V-ing): hành động đang diễn ra tại một thời điểm trong quá khứ (at 8 p.m. yesterday, at that time).", "Khi một hành động đang diễn ra (quá khứ tiếp diễn) thì một hành động khác xen vào (quá khứ đơn): I was reading when the phone rang. Với while thường dùng quá khứ tiếp diễn.", "used to + V (nguyên mẫu): thói quen / trạng thái trong quá khứ, nay không còn nữa. Phủ định: didn't use to + V; câu hỏi: Did you use to + V?"], "examples": ["I was drawing a picture when the lights went out.", "While my sister was playing the piano, my dad was cooking dinner.", "We used to go fishing every summer, but now we prefer camping.", "Did you use to collect stickers when you were small?"], "common_mistake_vi": "Sai: I didn't used to like vegetables. → Đúng: I didn't use to like vegetables. (sau did / didn't dùng 'use to', không có -d)."}, "wordform": {"id": "d2w", "focus": "-ful, -less", "rule_vi": "Thêm -ful vào danh từ để tạo tính từ mang nghĩa 'có nhiều …' (care → careful), thêm -less để tạo tính từ mang nghĩa 'không có …' (care → careless). Chú ý: beauty → beautiful (y → i).", "examples": [["use", "useful / useless"], ["care", "careful / careless"], ["help", "helpful / helpless"], ["beauty", "beautiful"], ["hope", "hopeful / hopeless"], ["end", "endless"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần và có 2 từ thừa. Nhớ đổi dạng từ (thêm -s, -ed, -ing…) nếu cần nhé!", "bank": ["leisure", "collect", "enthusiastic", "spare", "challenge", "relax", "membership", "take up"], "items": [{"id": "d2A1", "q": "Many people go to the park at the weekend for ______ activities like cycling and kite flying.", "answer": "leisure", "tag": "d2v1"}, {"id": "d2A2", "q": "My little brother loves stamps. He has ______ more than 300 of them!", "answer": "collected", "tag": "d2v2"}, {"id": "d2A3", "q": "The new members of the drama club are really ______ about the show. They want to practise every day.", "answer": "enthusiastic", "tag": "d2v3"}, {"id": "d2A4", "q": "Learning to swim at the age of 40 was a big ______ for my aunt, but she did it.", "answer": "challenge", "tag": "d2v5"}, {"id": "d2A5", "q": "After a long day at school, I usually ______ by reading comics on the sofa.", "answer": "relax", "tag": "d2v7"}, {"id": "d2A6", "q": "Your ______ card lets you borrow up to five books from the library at a time.", "answer": "membership", "tag": "d2v8"}]}, "B_grammar": {"instruction_vi": "Em chia động từ trong ngoặc ở thì quá khứ đơn, quá khứ tiếp diễn, hoặc dùng used to cho đúng nhé.", "items": [{"id": "d2B1", "q": "I ______ (watch) a cartoon when my mum called me for dinner.", "answer": "was watching", "tag": "d2g"}, {"id": "d2B2", "q": "Yesterday Hoa ______ (buy) a new sketchbook for her art class.", "answer": "bought", "tag": "d2g"}, {"id": "d2B3", "q": "At 9 o'clock last night, my brothers ______ (play) chess in the living room.", "answer": "were playing", "tag": "d2g"}, {"id": "d2B4", "q": "While we ______ (walk) home, it started to rain heavily.", "answer": "were walking", "tag": "d2g"}, {"id": "d2B5", "q": "My dad ______ (use to / play) the guitar in a band, but he stopped when I was born.", "answer": "used to play", "tag": "d2g"}, {"id": "d2B6", "q": "Minh ______ (not / use to / like) reading, but now he reads a book every week.", "answer": "didn't use to like", "accept": ["did not use to like"], "tag": "d2g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay mình dùng đuôi -ful hoặc -less.", "items": [{"id": "d2C1", "q": "This website is very ______. It has lots of tips for beginners who want to draw. (USE)", "answer": "useful", "tag": "d2w"}, {"id": "d2C2", "q": "Be ______ with those scissors! They are very sharp. (CARE)", "answer": "careful", "tag": "d2w"}, {"id": "d2C3", "q": "I tried to fix the old kite, but it was ______. It was broken in too many places. (HOPE)", "answer": "hopeless", "tag": "d2w"}, {"id": "d2C4", "q": "We saw a ______ sunset from the top of the hill. (BEAUTY)", "answer": "beautiful", "tag": "d2w"}]}, "D_exam": {"format": "synonym", "instruction_vi": "Dạng bài từ đồng nghĩa: em chọn đáp án (A, B, C hoặc D) có nghĩa GẦN NHẤT với từ / cụm từ VIẾT IN HOA trong câu.", "items": [{"id": "d2D1", "q": "Lan has been KEEN ON painting since she was five.", "options": ["tired of", "interested in", "afraid of", "good at"], "answer": "B", "tag": "fmt:synonym"}, {"id": "d2D2", "q": "My grandmother decided to TAKE UP knitting after she retired.", "options": ["start", "stop", "teach", "sell"], "answer": "A", "tag": "fmt:synonym"}, {"id": "d2D3", "q": "I don't have much SPARE time during the exam season.", "options": ["busy", "school", "free", "short"], "answer": "C", "tag": "fmt:synonym"}, {"id": "d2D4", "q": "The children were very ENTHUSIASTIC about the new robot club.", "options": ["worried", "bored", "careful", "excited"], "answer": "D", "tag": "fmt:synonym"}]}, "E_reading": {"id": "d2r", "title": "Grandpa's Box of Stamps", "text": "When my grandfather was a boy, he didn't have a phone or a computer. In his spare time, he used to collect stamps. Every time a letter arrived at his house, he carefully cut out the stamp and kept it in an old biscuit box.\n\nLast Sunday, I was helping him clean his room when I found the box under his bed. Inside, there were hundreds of stamps from more than forty countries. Some had pictures of birds and flowers, and others showed famous buildings.\n\nGrandpa told me that he gave up his hobby when he started work because he was too busy. 'But I never threw the box away,' he said with a smile.\n\nNow we are sorting the stamps together on Sunday afternoons. It is a slow job, but it is very relaxing. I have even decided to take up stamp collecting myself, and I hope one day my collection will be as big as his.", "items": [{"id": "d2E1", "kind": "tfng", "q": "The writer found the box while cleaning Grandpa's room.", "answer": "True", "tag": "d2r"}, {"id": "d2E2", "kind": "tfng", "q": "Grandpa's favourite stamps are the ones with pictures of birds.", "answer": "Not Given", "tag": "d2r"}, {"id": "d2E3", "kind": "mcq", "q": "Why did Grandpa stop collecting stamps?", "options": ["He lost his biscuit box.", "He had no free time after he started working.", "He didn't like stamps any more.", "His letters stopped arriving."], "answer": "B", "tag": "d2r"}, {"id": "d2E4", "kind": "mcq", "q": "What does the writer plan to do?", "options": ["throw the old box away", "sell Grandpa's stamps", "start his or her own stamp collection", "visit forty countries"], "answer": "C", "tag": "d2r"}]}, "F_writing": {"task_en": "Write a paragraph (50–70 words) about a hobby you used to have or one you took up recently. Say when and how you started it and why you like (or liked) it.", "task_vi": "Viết một đoạn văn (50–70 từ) về một sở thích em từng có trước đây hoặc mới bắt đầu gần đây: em bắt đầu khi nào, như thế nào, và vì sao em thích nó.", "min_words": 50, "model": "When I was in grade 4, I used to collect stickers, but last year I took up drawing comics. It started one rainy afternoon. I was sitting at home and feeling bored when I found an empty notebook. I drew a funny cat, and my sister laughed a lot. Drawing is a creative hobby, and it helps me relax after school. I want to make my own comic book one day.", "checklist_vi": ["Em có dùng thì quá khứ đơn để kể chuyện đã xảy ra không?", "Em có dùng ít nhất 1 câu quá khứ tiếp diễn hoặc 1 câu với used to không?", "Em có dùng ít nhất 3 từ mới hoặc cụm động từ của buổi 2 (ví dụ: spare, creative, relax, take up…) không?", "Đoạn văn đủ 50 từ và có câu nêu lý do (because / so)."]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – mình quay lại kiến thức của buổi 1 (Trường học) để nhớ lâu hơn nhé. Em điền từ thích hợp hoặc chia động từ trong ngoặc.", "items": [{"id": "d2G1", "q": "I can't ______ on my homework when my brother is playing loud music. (Gợi ý: c__________)", "answer": "concentrate", "from_day": 1, "tag": "d1v4"}, {"id": "d2G2", "q": "Be quiet, please! The baby ______ (sleep).", "answer": "is sleeping", "accept": ["'s sleeping"], "from_day": 1, "tag": "d1g"}, {"id": "d2G3", "q": "Our teacher gave us a clear ______ of the new grammar rule. (EXPLAIN)", "answer": "explanation", "from_day": 1, "tag": "d1w"}, {"id": "d2G4", "q": "He ______ out of the football team because he hurt his leg. (Gợi ý: một động từ ở quá khứ)", "answer": "dropped", "from_day": 1, "tag": "d1p2"}]}}, "web_check": [{"id": "d2q1", "type": "mcq", "skill": "vocab", "q": "Mia loves making things with paper and paint. She is a very ______ girl.", "options": ["spare", "creative", "leisure", "enthusiasm"], "answer": 1, "explain_vi": "creative = sáng tạo, là tính từ đứng sau 'a very' và trước danh từ 'girl'.", "tag": "d2v6"}, {"id": "d2q2", "type": "text", "skill": "vocab", "q": "If you have some s______ time this weekend, let's go cycling together. (Viết cả từ)", "answer": "spare", "explain_vi": "spare time = thời gian rảnh.", "tag": "d2v4"}, {"id": "d2q3", "type": "mcq", "skill": "vocab", "q": "Learning a new language is hard, but you shouldn't ______ after only one week.", "options": ["take up", "catch up", "look up", "give up"], "answer": 3, "explain_vi": "give up = bỏ cuộc, từ bỏ.", "tag": "d2p2"}, {"id": "d2q4", "type": "mcq", "skill": "grammar", "q": "Linh ______ her bike when she saw a cat in the middle of the road.", "options": ["rode", "was riding", "rides", "is riding"], "answer": 1, "explain_vi": "Hành động đang diễn ra (was riding) thì có hành động khác xen vào (saw).", "tag": "d2g"}, {"id": "d2q5", "type": "text", "skill": "grammar", "q": "When I was little, I ______ (use to / be) afraid of the dark. (Viết 3 từ)", "answer": "used to be", "explain_vi": "used to + V nguyên mẫu: trạng thái trong quá khứ, nay không còn nữa.", "tag": "d2g"}, {"id": "d2q6", "type": "mcq", "skill": "grammar", "q": "What ______ you doing at 7 p.m. last Saturday?", "options": ["did", "are", "was", "were"], "answer": 3, "explain_vi": "Thời điểm cụ thể trong quá khứ → quá khứ tiếp diễn; chủ ngữ 'you' đi với were.", "tag": "d2g"}, {"id": "d2q7", "type": "mcq", "skill": "wordform", "q": "The boy felt ______ when he saw the big dog because he couldn't run away.", "options": ["helpful", "help", "helpless", "helping"], "answer": 2, "explain_vi": "helpless = bất lực, không tự giúp mình được.", "tag": "d2w"}, {"id": "d2q8", "type": "text", "skill": "wordform", "q": "You made a lot of ______ mistakes because you didn't check your test. (CARE)", "answer": "careless", "explain_vi": "careless = cẩu thả. Không kiểm tra bài → lỗi do cẩu thả.", "tag": "d2w"}, {"id": "d2q9", "type": "mcq", "skill": "exam", "q": "Choose the word CLOSEST in meaning to the word in capitals: Listening to soft music helps me RELAX before bed.", "options": ["rest", "wake", "work", "hurry"], "answer": 0, "explain_vi": "relax ≈ rest (nghỉ ngơi, thư giãn).", "tag": "fmt:synonym"}, {"id": "d2q10", "type": "mcq", "skill": "review", "q": "Ms Lan always ______ her students to read English books in the summer holiday.", "options": ["encourages", "improves", "concentrates", "attends"], "answer": 0, "explain_vi": "encourage sb to do sth = khuyến khích ai làm gì (từ buổi 1).", "from_day": 1, "tag": "d1v8"}, {"id": "d2q11", "type": "text", "skill": "review", "q": "Lan can't come to the phone now. She ______ (have) a bath.", "answer": "is having", "accept": ["'s having"], "explain_vi": "have a bath = tắm (hành động) nên chia -ing được; 'now' → hiện tại tiếp diễn (buổi 1).", "from_day": 1, "tag": "d1g"}, {"id": "d2q12", "type": "mcq", "skill": "review", "q": "I was ill for a week, so I need to ______ with the lessons I missed.", "options": ["drop out", "catch up", "give up", "take up"], "answer": 1, "explain_vi": "catch up with = bắt kịp, theo kịp (buổi 1).", "from_day": 1, "tag": "d1p1"}], "can_do_vi": ["Em có thể nói về sở thích và thời gian rảnh bằng 8 từ mới, cùng take up và give up.", "Em có thể kể chuyện quá khứ bằng quá khứ đơn và quá khứ tiếp diễn, và nói về thói quen cũ với used to.", "Em có thể tạo tính từ với -ful và -less.", "Em có thể làm dạng bài tìm từ đồng nghĩa trong đề thi chuyên."]}, {"day": 3, "type": "normal", "theme_en": "Environment", "theme_vi": "Môi trường", "goal_vi": "Hôm nay em sẽ học các từ quan trọng về môi trường và luyện cách phân biệt thì hiện tại hoàn thành với quá khứ đơn. Em cũng sẽ làm quen với dạng bài tìm từ trái nghĩa – một dạng rất hay gặp trong đề thi chuyên đấy!", "minutes": 30, "vocab": [{"id": "d3v1", "word": "pollution", "pos": "n", "ipa": "/pəˈluːʃn/", "meaning_vi": "sự ô nhiễm", "example": "Air pollution is a serious problem in many big cities.", "family": "pollute (v), polluted (adj)"}, {"id": "d3v2", "word": "protect", "pos": "v", "ipa": "/prəˈtekt/", "meaning_vi": "bảo vệ (protect sb/sth from sth)", "example": "Sunglasses protect your eyes from strong sunlight.", "family": "protection (n), protective (adj)"}, {"id": "d3v3", "word": "waste", "pos": "n, v", "ipa": "/weɪst/", "meaning_vi": "(n) rác thải, sự lãng phí; (v) lãng phí", "example": "Don't waste water when you brush your teeth.", "family": "wasteful (adj)"}, {"id": "d3v4", "word": "recycle", "pos": "v", "ipa": "/ˌriːˈsaɪkl/", "meaning_vi": "tái chế", "example": "Our school recycles paper, cans and plastic bottles.", "family": "recycling (n), recyclable (adj)"}, {"id": "d3v5", "word": "species", "pos": "n", "ipa": "/ˈspiːʃiːz/", "meaning_vi": "loài (sinh vật); số ít và số nhiều giống nhau", "example": "There are many species of birds in Cuc Phuong National Park.", "family": "species (n, số nhiều)"}, {"id": "d3v6", "word": "climate", "pos": "n", "ipa": "/ˈklaɪmət/", "meaning_vi": "khí hậu", "example": "Climate change is making summers hotter.", "family": "climatic (adj)"}, {"id": "d3v7", "word": "reduce", "pos": "v", "ipa": "/rɪˈdjuːs/", "meaning_vi": "giảm, làm giảm", "example": "We can reduce rubbish by using cloth bags.", "family": "reduction (n)"}, {"id": "d3v8", "word": "harmful", "pos": "adj", "ipa": "/ˈhɑːmfl/", "meaning_vi": "có hại (harmful to sb/sth)", "example": "Smoke from cars is harmful to our health.", "family": "harm (n, v), harmless (adj)"}], "phrasal": [{"id": "d3p1", "phrase": "cut down (on)", "meaning_vi": "cắt giảm (lượng dùng cái gì)", "example": "My family is trying to cut down on electricity by switching off unused lights."}, {"id": "d3p2", "phrase": "throw away", "meaning_vi": "vứt đi, vứt bỏ", "example": "Please don't throw away those boxes. We can use them for our art project."}], "grammar": {"id": "d3g", "title": "Present perfect vs past simple (for, since, already, yet, ever, never)", "rule_vi": ["Hiện tại hoàn thành (S + have/has + V3/V-ed): việc đã xảy ra nhưng KHÔNG nói rõ thời gian, hoặc còn liên quan tới hiện tại. Dấu hiệu: already, yet, ever, never, just, so far, recently.", "Hiện tại hoàn thành + for / since: việc bắt đầu trong quá khứ và vẫn còn tiếp diễn. for + khoảng thời gian (for three years); since + mốc thời gian (since 2020, since I was six).", "Quá khứ đơn (S + V2/V-ed): việc đã kết thúc ở thời điểm XÁC ĐỊNH trong quá khứ. Dấu hiệu: yesterday, last…, … ago, in 2019, when I was…", "Vị trí: already / just / ever / never đứng giữa have/has và V3; yet đứng cuối câu phủ định và câu hỏi."], "examples": ["I have already sorted the rubbish, so you don't need to do it.", "We planted these trees in 2021. They have grown very tall since then.", "Have you ever visited a recycling centre?", "The students haven't finished their poster yet."], "common_mistake_vi": "Sai: I have visited Ha Long Bay last summer. → Đúng: I visited Ha Long Bay last summer. (có thời gian xác định 'last summer' thì dùng quá khứ đơn)."}, "wordform": {"id": "d3w", "focus": "-al, -ous", "rule_vi": "Thêm -al hoặc -ous vào sau danh từ để tạo tính từ. Chú ý chính tả: nature → natural (bỏ -e), fame → famous (bỏ -e), mystery → mysterious (y → i).", "examples": [["environment", "environmental"], ["nature", "natural"], ["industry", "industrial"], ["danger", "dangerous"], ["poison", "poisonous"], ["fame", "famous"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần và có 2 từ thừa. Nhớ đổi dạng từ (thêm -s, -ed…) nếu cần nhé!", "bank": ["pollution", "protect", "waste", "recycle", "species", "climate", "reduce", "throw away"], "items": [{"id": "d3A1", "q": "The smoke from factories and motorbikes causes a lot of air ______.", "answer": "pollution", "tag": "d3v1"}, {"id": "d3A2", "q": "We must ______ the forests because thousands of animals live there.", "answer": "protect", "tag": "d3v2"}, {"id": "d3A3", "q": "Glass bottles can be ______ and made into new bottles.", "answer": "recycled", "tag": "d3v4"}, {"id": "d3A4", "q": "The Saola is one of the rarest animal ______ in the world. Very few people have seen one.", "answer": "species", "tag": "d3v5"}, {"id": "d3A5", "q": "Northern Vietnam has a ______ with four seasons: spring, summer, autumn and winter.", "answer": "climate", "tag": "d3v6"}, {"id": "d3A6", "q": "Please don't ______ your old clothes. We can give them to children who need them.", "answer": "throw away", "tag": "d3p2"}]}, "B_grammar": {"instruction_vi": "Em chia động từ trong ngoặc ở thì hiện tại hoàn thành hoặc quá khứ đơn. Hãy tìm từ dấu hiệu trước khi chia nhé!", "items": [{"id": "d3B1", "q": "I ______ (never / see) a real panda in my life.", "answer": "have never seen", "accept": ["'ve never seen"], "tag": "d3g"}, {"id": "d3B2", "q": "Our class ______ (plant) fifty trees in the school garden last spring.", "answer": "planted", "tag": "d3g"}, {"id": "d3B3", "q": "My family ______ (live) in this town since 2018.", "answer": "has lived", "accept": ["'s lived", "has been living", "'s been living"], "tag": "d3g"}, {"id": "d3B4", "q": "Ten years ago, the river near my house ______ (be) very clean.", "answer": "was", "tag": "d3g"}, {"id": "d3B5", "q": "The students ______ (not / start) their recycling project yet.", "answer": "haven't started", "accept": ["have not started"], "tag": "d3g"}, {"id": "d3B6", "q": "Look! I ______ (already / sort) the rubbish into three bins.", "answer": "have already sorted", "accept": ["'ve already sorted"], "tag": "d3g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay mình dùng đuôi -al hoặc -ous.", "items": [{"id": "d3C1", "q": "Plastic in the ocean is a big ______ problem. (ENVIRONMENT)", "answer": "environmental", "tag": "d3w"}, {"id": "d3C2", "q": "Don't eat those mushrooms! Some of them are ______. (POISON)", "answer": "poisonous", "tag": "d3w"}, {"id": "d3C3", "q": "Forests, rivers and minerals are important ______ resources. (NATURE)", "answer": "natural", "tag": "d3w"}, {"id": "d3C4", "q": "Ha Long Bay is ______ for its thousands of limestone islands. (FAME)", "answer": "famous", "tag": "d3w"}]}, "D_exam": {"format": "antonym", "instruction_vi": "Dạng bài từ trái nghĩa: em chọn đáp án (A, B, C hoặc D) có nghĩa NGƯỢC LẠI với từ VIẾT IN HOA. Cẩn thận: thường có một đáp án đồng nghĩa để 'bẫy' em đấy!", "items": [{"id": "d3D1", "q": "The city wants to REDUCE the number of plastic bags used in markets.", "options": ["lower", "cut", "increase", "collect"], "answer": "C", "tag": "fmt:antonym"}, {"id": "d3D2", "q": "Some cleaning products are HARMFUL to fish and other water animals.", "options": ["harmless", "dangerous", "poisonous", "famous"], "answer": "A", "tag": "fmt:antonym"}, {"id": "d3D3", "q": "After the factory opened, the water in the lake became very POLLUTED.", "options": ["dirty", "deep", "cold", "clean"], "answer": "D", "tag": "fmt:antonym"}, {"id": "d3D4", "q": "My mum is always CAREFUL to switch off the lights when she leaves a room.", "options": ["attentive", "careless", "happy", "quick"], "answer": "B", "tag": "fmt:antonym"}]}, "E_reading": {"id": "d3r", "title": "The Green Team", "text": "Two years ago, five students at Sunflower Secondary School started a club called the Green Team. Since then, the club has grown to more than sixty members.\n\nThe Green Team began with a simple idea: reduce the amount of plastic at school. The members put recycling bins in every classroom and asked students to bring their own water bottles. As a result, the school has cut down on plastic waste by almost half.\n\nLast month, the club organised a clean-up day at a lake near the school. Volunteers collected 200 kilograms of rubbish in just three hours.\n\n'We haven't solved every problem yet,' says Khanh, the club leader. 'But we have shown that young people can protect their environment.'\n\nThe club's next plan is to grow vegetables on the school roof. The head teacher has already agreed, and the first seeds arrived last week. Khanh hopes that the school canteen will use the vegetables in students' lunches next year.", "items": [{"id": "d3E1", "kind": "tfng", "q": "The Green Team had five members when it started.", "answer": "True", "tag": "d3r"}, {"id": "d3E2", "kind": "tfng", "q": "The school does not use any plastic now.", "answer": "False", "tag": "d3r"}, {"id": "d3E3", "kind": "mcq", "q": "How long did the volunteers spend collecting rubbish at the lake?", "options": ["three hours", "two years", "one month", "one week"], "answer": "A", "tag": "d3r"}, {"id": "d3E4", "kind": "mcq", "q": "What is the Green Team going to do next?", "options": ["build a new lake", "put bins in every classroom", "find sixty new members", "grow vegetables on the school roof"], "answer": "D", "tag": "d3r"}]}, "F_writing": {"task_en": "Write a paragraph (50–70 words) about what you and your family have done to protect the environment. Give at least one example of something you did recently.", "task_vi": "Viết một đoạn văn (50–70 từ) kể về những việc em và gia đình đã làm để bảo vệ môi trường. Nêu ít nhất một việc cụ thể em đã làm gần đây.", "min_words": 50, "model": "My family has tried hard to protect the environment. We have stopped using plastic bags, and my mum always takes a cloth bag to the market. We have also cut down on electricity by switching off lights we don't need. Last weekend, my brother and I collected old newspapers and took them to a recycling shop. I haven't planted a tree yet, but I want to do it soon.", "checklist_vi": ["Em có dùng thì hiện tại hoàn thành (have/has + V3) ít nhất 2 lần không?", "Em có dùng thì quá khứ đơn với thời gian xác định (last weekend, yesterday…) ít nhất 1 lần không?", "Em có dùng ít nhất 3 từ mới hoặc cụm động từ của buổi 3 không?", "Đoạn văn đủ 50 từ và các V3 được viết đúng chính tả (seen, taken, done…)."]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – em ôn lại từ và ngữ pháp của buổi 2 (Sở thích) và buổi 1 (Trường học) nhé. Điền từ thích hợp hoặc chia động từ trong ngoặc.", "items": [{"id": "d3G1", "q": "My cousin likes to ______ toy cars. He has more than a hundred of them now. (Gợi ý: c______)", "answer": "collect", "from_day": 2, "tag": "d2v2"}, {"id": "d3G2", "q": "While Mum ______ (cook) dinner, I was setting the table.", "answer": "was cooking", "from_day": 2, "tag": "d2g"}, {"id": "d3G3", "q": "My grandpa is 80 years old, but he still ______ (go) jogging every morning.", "answer": "goes", "from_day": 1, "tag": "d1g"}, {"id": "d3G4", "q": "Reading books helps us gain ______ about the world. (KNOW)", "answer": "knowledge", "from_day": 1, "tag": "d1v6"}]}}, "web_check": [{"id": "d3q1", "type": "mcq", "skill": "vocab", "q": "Turn off the tap while you brush your teeth. Don't ______ water!", "options": ["reduce", "recycle", "waste", "protect"], "answer": 2, "explain_vi": "waste = lãng phí. Không để nước chảy là để không lãng phí nước.", "tag": "d3v3"}, {"id": "d3q2", "type": "text", "skill": "vocab", "q": "The doctor told my dad to cut ______ on salt and sugar. (Điền 1 từ)", "answer": "down", "explain_vi": "cut down on sth = cắt giảm lượng dùng cái gì.", "tag": "d3p1"}, {"id": "d3q3", "type": "mcq", "skill": "vocab", "q": "Too much time in the sun without a hat can be ______ to your skin.", "options": ["harmful", "harmless", "helpful", "careful"], "answer": 0, "explain_vi": "harmful to sth = có hại cho cái gì.", "tag": "d3v8"}, {"id": "d3q4", "type": "mcq", "skill": "grammar", "q": "Minh loves Da Lat. He ______ there three times so far.", "options": ["went", "has been", "goes", "was going"], "answer": 1, "explain_vi": "'so far' (cho đến nay) → hiện tại hoàn thành.", "tag": "d3g"}, {"id": "d3q5", "type": "text", "skill": "grammar", "q": "A big tree ______ (fall) down in our street during the storm last night.", "answer": "fell", "explain_vi": "'last night' là thời gian xác định trong quá khứ → quá khứ đơn; fall – fell – fallen.", "tag": "d3g"}, {"id": "d3q6", "type": "mcq", "skill": "grammar", "q": "I have known my best friend ______ we were in grade 1.", "options": ["for", "ago", "yet", "since"], "answer": 3, "explain_vi": "since + mốc thời gian / mệnh đề (since we were in grade 1).", "tag": "d3g"}, {"id": "d3q7", "type": "mcq", "skill": "wordform", "q": "Swimming in this part of the river is ______ because the water moves very fast.", "options": ["danger", "dangerous", "dangerously", "endanger"], "answer": 1, "explain_vi": "Sau 'is' cần tính từ: danger → dangerous.", "tag": "d3w"}, {"id": "d3q8", "type": "text", "skill": "wordform", "q": "Thai Nguyen is an ______ city with many big factories. (INDUSTRY)", "answer": "industrial", "explain_vi": "Trước danh từ 'city' cần tính từ: industry → industrial (y → i, thêm -al).", "tag": "d3w"}, {"id": "d3q9", "type": "mcq", "skill": "exam", "q": "Choose the word OPPOSITE in meaning to the word in capitals: This kind of frog is very RARE in Vietnam.", "options": ["unusual", "small", "common", "special"], "answer": 2, "explain_vi": "rare (hiếm) >< common (phổ biến). 'unusual' gần nghĩa với rare nên là bẫy.", "tag": "fmt:antonym"}, {"id": "d3q10", "type": "mcq", "skill": "review", "q": "My uncle decided to ______ running to get fitter, and now he runs 5 km every day.", "options": ["give up", "take up", "drop out", "throw away"], "answer": 1, "explain_vi": "take up = bắt đầu một sở thích / hoạt động mới (buổi 2).", "from_day": 2, "tag": "d2p1"}, {"id": "d3q11", "type": "text", "skill": "review", "q": "The head teacher made an important ______ about the school trip this morning. (ANNOUNCE)", "answer": "announcement", "explain_vi": "Sau 'an important' cần danh từ: announce → announcement (đuôi -ment, buổi 1).", "from_day": 1, "tag": "d1w"}, {"id": "d3q12", "type": "mcq", "skill": "review", "q": "I ______ the answer to question 5. It's 'recycle'!", "options": ["am knowing", "knows", "know", "knowing"], "answer": 2, "explain_vi": "know là động từ trạng thái, không chia -ing; chủ ngữ 'I' nên dùng 'know' (buổi 1).", "from_day": 1, "tag": "d1g"}], "can_do_vi": ["Em có thể nói về các vấn đề môi trường bằng 8 từ mới và 2 cụm động từ cut down (on), throw away.", "Em có thể chọn đúng thì hiện tại hoàn thành hoặc quá khứ đơn, và dùng đúng for / since / already / yet / ever / never.", "Em có thể tạo tính từ với -al và -ous.", "Em có thể làm dạng bài tìm từ trái nghĩa và tránh được đáp án 'bẫy' đồng nghĩa."]}, {"day": 4, "type": "normal", "theme_en": "Technology", "theme_vi": "Công nghệ", "goal_vi": "Hôm nay em sẽ học các từ về công nghệ và ba cách nói về tương lai: will, be going to và hiện tại tiếp diễn. Em cũng sẽ luyện dạng bài hoàn thành hội thoại, rất gần với cách người ta nói chuyện hằng ngày đấy!", "minutes": 30, "vocab": [{"id": "d4v1", "word": "device", "pos": "n", "ipa": "/dɪˈvaɪs/", "meaning_vi": "thiết bị, dụng cụ", "example": "Phones, tablets and smartwatches are all digital devices.", "family": "devices (n, số nhiều)"}, {"id": "d4v2", "word": "invent", "pos": "v", "ipa": "/ɪnˈvent/", "meaning_vi": "phát minh, sáng chế", "example": "Who invented the first robot?", "family": "invention (n), inventor (n), inventive (adj)"}, {"id": "d4v3", "word": "access", "pos": "n, v", "ipa": "/ˈækses/", "meaning_vi": "(n) quyền / cơ hội sử dụng (access to sth); (v) truy cập", "example": "All students have access to the computer room after school.", "family": "accessible (adj)"}, {"id": "d4v4", "word": "digital", "pos": "adj", "ipa": "/ˈdɪdʒɪtl/", "meaning_vi": "kỹ thuật số", "example": "My dad reads digital books on his tablet.", "family": "digitally (adv)"}, {"id": "d4v5", "word": "rely", "pos": "v", "ipa": "/rɪˈlaɪ/", "meaning_vi": "dựa vào, phụ thuộc vào (rely on sb/sth)", "example": "Many people rely on maps on their phones when they travel.", "family": "reliable (adj), reliance (n)"}, {"id": "d4v6", "word": "screen", "pos": "n", "ipa": "/skriːn/", "meaning_vi": "màn hình", "example": "Don't sit too close to the TV screen.", "family": "screen time (n): thời gian dùng thiết bị điện tử"}, {"id": "d4v7", "word": "update", "pos": "v, n", "ipa": "/ˌʌpˈdeɪt/", "meaning_vi": "(v) cập nhật; (n) bản cập nhật", "example": "You should update your apps to fix problems.", "family": "up-to-date (adj)"}, {"id": "d4v8", "word": "convenient", "pos": "adj", "ipa": "/kənˈviːniənt/", "meaning_vi": "tiện lợi, thuận tiện", "example": "Online shopping is convenient because you don't have to leave home.", "family": "convenience (n), inconvenient (adj)"}], "phrasal": [{"id": "d4p1", "phrase": "switch off", "meaning_vi": "tắt (đèn, máy móc, thiết bị)", "example": "Please switch off your phones before the test begins."}, {"id": "d4p2", "phrase": "keep up with", "meaning_vi": "theo kịp, cập nhật kịp (tin tức, xu hướng, người khác)", "example": "New phones come out so fast that it's hard to keep up with them."}], "grammar": {"id": "d4g", "title": "Future: will, be going to, present continuous for arrangements", "rule_vi": ["will + V: quyết định ngay lúc nói, lời hứa, lời đề nghị giúp đỡ, và dự đoán theo ý kiến cá nhân (I think, I'm sure, probably). Phủ định: won't + V.", "be going to + V: dự định đã có từ TRƯỚC lúc nói; hoặc dự đoán có căn cứ nhìn thấy ở hiện tại (Look at those clouds! It's going to rain.).", "Hiện tại tiếp diễn (am/is/are + V-ing): kế hoạch đã sắp xếp cụ thể (đã mua vé, đã hẹn người, đã đặt lịch), thường có thời gian trong tương lai đi kèm.", "Mẹo nhớ: will = quyết định / dự đoán 'trong đầu'; going to = dự định / dấu hiệu 'trước mắt'; hiện tại tiếp diễn = lịch hẹn 'trong sổ'."], "examples": ["A: My laptop isn't working. B: Don't worry, I'll help you.", "I've saved enough money. I'm going to buy a new pair of headphones.", "We're visiting the science museum on Sunday. Dad has booked the tickets.", "I think people will travel in flying cars one day."], "common_mistake_vi": "Sai: I've saved enough money, so I will buy a new bike next week. → Đúng: … so I'm going to buy a new bike next week. (dự định đã có từ trước nên dùng be going to)."}, "wordform": {"id": "d4w", "focus": "-ly (adverbs)", "rule_vi": "Thêm -ly vào tính từ để tạo trạng từ chỉ cách thức (làm việc gì NHƯ THẾ NÀO). Chú ý chính tả: easy → easily (y → i), gentle → gently (-le → -ly), automatic → automatically (-ic → -ically). Ngoại lệ: good → well, fast → fast, hard → hard.", "examples": [["quick", "quickly"], ["easy", "easily"], ["careful", "carefully"], ["gentle", "gently"], ["automatic", "automatically"], ["regular", "regularly"]]}, "paper": {"A_vocab": {"instruction_vi": "Em chọn từ hoặc cụm từ trong khung để điền vào chỗ trống. Mỗi từ chỉ dùng một lần và có 2 từ thừa. Nhớ đổi dạng từ (thêm -s, -ed…) nếu cần nhé!", "bank": ["device", "invent", "access", "digital", "rely", "screen", "update", "switch off"], "items": [{"id": "d4A1", "q": "Smartwatches, tablets and laptops are all electronic ______.", "answer": "devices", "tag": "d4v1"}, {"id": "d4A2", "q": "Nobody knows exactly who ______ the first kite, but it was more than 2,000 years ago.", "answer": "invented", "tag": "d4v2"}, {"id": "d4A3", "q": "In some mountain villages, children still don't have ______ to the Internet.", "answer": "access", "tag": "d4v3"}, {"id": "d4A4", "q": "Some students ______ on calculators too much and forget how to do simple maths in their heads.", "answer": "rely", "tag": "d4v5"}, {"id": "d4A5", "q": "My eyes hurt after I looked at the computer ______ for three hours.", "answer": "screen", "tag": "d4v6"}, {"id": "d4A6", "q": "Please ______ the fans when you leave the classroom to save electricity.", "answer": "switch off", "tag": "d4p1"}]}, "B_grammar": {"instruction_vi": "Em chia động từ trong ngoặc ở dạng tương lai phù hợp: will, be going to, hoặc hiện tại tiếp diễn. Đọc kỹ ngữ cảnh để biết đó là quyết định tức thì, dự định, dấu hiệu hay lịch hẹn nhé!", "items": [{"id": "d4B1", "q": "Look at those black clouds! It ______ (rain).", "answer": "is going to rain", "accept": ["'s going to rain"], "tag": "d4g"}, {"id": "d4B2", "q": "I've already bought the tickets. We ______ (watch) the new robot film at the cinema at 7 p.m. on Saturday.", "answer": "are watching", "accept": ["'re watching", "are going to watch", "'re going to watch"], "tag": "d4g"}, {"id": "d4B3", "q": "A: The phone's ringing. B: Don't get up. I ______ (answer) it.", "answer": "will answer", "accept": ["'ll answer"], "tag": "d4g"}, {"id": "d4B4", "q": "I think robots ______ (do) most of our housework in the future.", "answer": "will do", "accept": ["'ll do", "are going to do", "'re going to do"], "tag": "d4g"}, {"id": "d4B5", "q": "I decided last week what to do in the holidays. I ______ (learn) to code this summer.", "answer": "am going to learn", "accept": ["'m going to learn"], "tag": "d4g"}, {"id": "d4B6", "q": "Sorry, Mum. I promise I ______ (not / be) late again.", "answer": "won't be", "accept": ["will not be"], "tag": "d4g"}]}, "C_wordform": {"instruction_vi": "Viết dạng đúng của từ in hoa. Gợi ý: hôm nay mình biến tính từ thành trạng từ với đuôi -ly.", "items": [{"id": "d4C1", "q": "This app helps you find information ______. (QUICK)", "answer": "quickly", "tag": "d4w"}, {"id": "d4C2", "q": "My grandma learned to use a smartphone quite ______. (EASY)", "answer": "easily", "tag": "d4w"}, {"id": "d4C3", "q": "The lights in this building switch off ______ when nobody is in the room. (AUTOMATIC)", "answer": "automatically", "tag": "d4w"}, {"id": "d4C4", "q": "You should update your apps ______ to keep your phone safe. (REGULAR)", "answer": "regularly", "tag": "d4w"}]}, "D_exam": {"format": "dialogue_completion", "instruction_vi": "Dạng bài hoàn thành hội thoại: em chọn câu trả lời (A, B, C hoặc D) phù hợp nhất để hoàn thành mỗi đoạn hội thoại. Hãy nghĩ xem người thật sẽ đáp lại như thế nào nhé!", "items": [{"id": "d4D1", "q": "Nam: 'Why do you always use this e-dictionary?' – Lan: '______'", "options": ["Yes, I like it very much.", "I bought it last year.", "Because it's quick and convenient.", "It's on my desk."], "answer": "C", "tag": "fmt:dialogue_completion"}, {"id": "d4D2", "q": "Mai: 'Thanks so much for helping me update my phone.' – Hung: '______'", "options": ["It's my pleasure.", "Yes, I do.", "That's a good idea.", "I'm afraid not."], "answer": "A", "tag": "fmt:dialogue_completion"}, {"id": "d4D3", "q": "Tuan: 'What are you doing this weekend?' – Linh: '______'", "options": ["I usually play tennis.", "I did my homework.", "Yes, I'm free.", "I'm visiting my cousins in Hai Phong."], "answer": "D", "tag": "fmt:dialogue_completion"}, {"id": "d4D4", "q": "Phong: 'I think tablets will replace paper books in schools one day.' – Ha: '______ Paper books are still very useful.'", "options": ["Me too!", "I'm not so sure about that.", "That's right, I agree.", "Congratulations!"], "answer": "B", "tag": "fmt:dialogue_completion"}]}, "E_reading": {"id": "d4r", "title": "A Week Without Screens", "text": "Next Monday, the students of class 7A are starting an unusual challenge: a week without screens. For seven days, they won't use phones, tablets or computers in their free time. They can still use digital devices for homework, but only for one hour a day.\n\nThe idea came from their form teacher, Mr Quang. Last month, he asked the class how much time they spent in front of a screen. The answer surprised everyone: on average, more than five hours a day.\n\n'Technology is convenient, but many of us rely on it too much,' Mr Quang says. 'I want my students to discover what else they can do.'\n\nThe students have already made plans. Ha is going to teach her little brother to play chess, and Duc is going to cycle to his grandparents' farm. Some students are nervous. 'I'm sure I'll miss my games,' says Long. 'But it's only a week. I think I'll survive!'\n\nAt the end of the challenge, each student will write about how they felt.", "items": [{"id": "d4E1", "kind": "tfng", "q": "During the challenge, students cannot use any devices at all, even for homework.", "answer": "False", "tag": "d4r"}, {"id": "d4E2", "kind": "tfng", "q": "Mr Quang got the idea for the challenge from another school.", "answer": "Not Given", "tag": "d4r"}, {"id": "d4E3", "kind": "mcq", "q": "On average, how much time did the students spend in front of a screen each day?", "options": ["more than five hours", "one hour", "about three hours", "seven hours"], "answer": "A", "tag": "d4r"}, {"id": "d4E4", "kind": "mcq", "q": "How does Long feel about the challenge?", "options": ["It will be easy because he doesn't like games.", "It will be difficult, but he can do it.", "It is a bad idea and he won't take part.", "It should last longer than a week."], "answer": "B", "tag": "d4r"}]}, "F_writing": {"task_en": "Imagine your class is having a 'Day Without Screens' next Saturday. Write a paragraph (50–70 words) about what you are going to do that day and how you think you will feel.", "task_vi": "Hãy tưởng tượng lớp em tổ chức 'Ngày không màn hình' vào thứ Bảy tới. Viết một đoạn văn (50–70 từ) kể em định làm gì vào ngày đó và em nghĩ mình sẽ cảm thấy thế nào.", "min_words": 50, "model": "Next Saturday, my class is having a 'Day Without Screens', so I'm going to switch off my phone in the morning. First, I'm going to help my mum in the garden. Then I will read the comic book my friend lent me. In the afternoon, I'm meeting Tuan at the park to play badminton. I think I'll miss my games a little, but I'm sure it will be a fun day.", "checklist_vi": ["Em có dùng be going to để nói về dự định không?", "Em có dùng hiện tại tiếp diễn cho một lịch hẹn cụ thể (có giờ / có người hẹn) không?", "Em có dùng will (I think / I'm sure … will) để dự đoán cảm xúc của mình không?", "Em có dùng ít nhất 3 từ mới hoặc cụm động từ của buổi 4, và đoạn văn đủ 50 từ không?"]}, "G_review": {"instruction_vi": "Ôn xoắn ốc – em ôn lại buổi 3 (Môi trường) và buổi 1 (Trường học) nhé. Điền từ thích hợp hoặc chia động từ trong ngoặc.", "items": [{"id": "d4G1", "q": "Instead of throwing old newspapers away, we should ______ them. (Gợi ý: r______)", "answer": "recycle", "from_day": 3, "tag": "d3v4"}, {"id": "d4G2", "q": "I ______ (not / see) my uncle since last Tết.", "answer": "haven't seen", "accept": ["have not seen"], "from_day": 3, "tag": "d3g"}, {"id": "d4G3", "q": "More than 500 people ______ the school concert last night. (Gợi ý: a______, chia ở quá khứ)", "answer": "attended", "from_day": 1, "tag": "d1v5"}, {"id": "d4G4", "q": "Lan usually takes the bus, but today she ______ (walk) to school because the weather is so nice.", "answer": "is walking", "accept": ["'s walking"], "from_day": 1, "tag": "d1g"}]}}, "web_check": [{"id": "d4q1", "type": "mcq", "skill": "vocab", "q": "Most people now take ______ photos with their phones instead of using old film cameras.", "options": ["convenient", "screen", "digital", "electric"], "answer": 2, "explain_vi": "digital photos = ảnh kỹ thuật số.", "tag": "d4v4"}, {"id": "d4q2", "type": "text", "skill": "vocab", "q": "My phone asks me to u______ my apps almost every week. (Viết cả từ)", "answer": "update", "explain_vi": "update = cập nhật (ứng dụng, phần mềm, thông tin).", "tag": "d4v7"}, {"id": "d4q3", "type": "mcq", "skill": "vocab", "q": "Grandpa reads the news online every morning because he wants to ______ what is happening in the world.", "options": ["switch off", "keep up with", "take up", "throw away"], "answer": 1, "explain_vi": "keep up with = theo kịp, cập nhật kịp (tin tức).", "tag": "d4p2"}, {"id": "d4q4", "type": "mcq", "skill": "grammar", "q": "A: I'm so thirsty. B: Wait here. I ______ you some water.", "options": ["'ll get", "get", "am got", "getting"], "answer": 0, "explain_vi": "Quyết định / lời đề nghị ngay lúc nói → will ('ll) + V.", "tag": "d4g"}, {"id": "d4q5", "type": "text", "skill": "grammar", "q": "My cousins ______ (come) to stay with us next weekend. Mum has already prepared their room.", "answer": "are coming", "accept": ["'re coming", "are going to come", "'re going to come"], "explain_vi": "Kế hoạch đã sắp xếp (đã chuẩn bị phòng) → hiện tại tiếp diễn.", "tag": "d4g"}, {"id": "d4q6", "type": "mcq", "skill": "grammar", "q": "My sister has bought her plane ticket. She ______ to Da Nang tomorrow morning.", "options": ["flew", "fly", "has flown", "is flying"], "answer": 3, "explain_vi": "Đã mua vé = kế hoạch đã sắp xếp → hiện tại tiếp diễn.", "tag": "d4g"}, {"id": "d4q7", "type": "mcq", "skill": "wordform", "q": "Please speak ______. The baby is sleeping.", "options": ["quiet", "quietly", "quietness", "quieter"], "answer": 1, "explain_vi": "Bổ nghĩa cho động từ 'speak' cần trạng từ: quiet → quietly.", "tag": "d4w"}, {"id": "d4q8", "type": "text", "skill": "wordform", "q": "Hold the baby bird ______. It's very small. (GENTLE)", "answer": "gently", "explain_vi": "gentle → gently (-le → -ly). Trạng từ bổ nghĩa cho 'hold'.", "tag": "d4w"}, {"id": "d4q9", "type": "mcq", "skill": "exam", "q": "A: 'Would you like me to show you how to use this app?' B: '______'", "options": ["No, I wouldn't like.", "Yes, I like apps.", "Yes, I'd love that. Thanks!", "You're welcome."], "answer": 2, "explain_vi": "Đáp lại lời đề nghị giúp đỡ: 'Yes, I'd love that. Thanks!' / 'Yes, please.'", "tag": "fmt:dialogue_completion"}, {"id": "d4q10", "type": "mcq", "skill": "review", "q": "We ______ this washing machine for ten years, and it still works well.", "options": ["had", "are having", "have had", "have"], "answer": 2, "explain_vi": "Bắt đầu trong quá khứ, vẫn còn đến nay (for ten years, still works) → hiện tại hoàn thành (buổi 3).", "from_day": 3, "tag": "d3g"}, {"id": "d4q11", "type": "text", "skill": "review", "q": "I need to r______ for my English test tomorrow, so I can't go out tonight. (Viết cả từ)", "answer": "revise", "explain_vi": "revise = ôn bài (buổi 1).", "from_day": 1, "tag": "d1v3"}, {"id": "d4q12", "type": "mcq", "skill": "review", "q": "Thanks for your ______. Your kind words helped me finish the race.", "options": ["encourage", "encouraging", "encouraged", "encouragement"], "answer": 3, "explain_vi": "Sau 'your' cần danh từ: encourage → encouragement (đuôi -ment, buổi 1).", "from_day": 1, "tag": "d1w"}], "can_do_vi": ["Em có thể nói về công nghệ bằng 8 từ mới và 2 cụm động từ switch off, keep up with.", "Em có thể chọn đúng will, be going to hoặc hiện tại tiếp diễn khi nói về tương lai.", "Em có thể biến tính từ thành trạng từ với đuôi -ly và viết đúng chính tả.", "Em có thể chọn câu đáp lại phù hợp trong dạng bài hoàn thành hội thoại."]}, {"day": 5, "type": "normal", "theme_en": "Health & fitness", "theme_vi": "Sức khoẻ", "goal_vi": "Hôm nay em sẽ học các từ về sức khoẻ và luyện so sánh hơn, so sánh nhất, cùng các cấu trúc too / enough / so / such. Em cũng làm quen với dạng bài chọn câu gần nghĩa nhất – dạng bài 'khó nhằn' nhưng rất hay gặp trong đề thi chuyên đấy!", "minutes": 30, "vocab": [{"id": "d5v1", "word": "diet", "pos": "n", "ipa": "/ˈdaɪət/", "meaning_vi": "chế độ ăn uống", "example": "A healthy diet includes lots of fruit and vegetables.", "family": "diet (v): ăn kiêng"}, {"id": "d5v2", "word": "exercise", "pos": "n, v", "ipa": "/ˈeksəsaɪz/", "meaning_vi": "(n) sự tập thể dục, bài tập; (v) tập thể dục", "example": "Doctors say children need at least an hour of exercise every day.", "family": "exercise (v)"}, {"id": "d5v3", "word": "habit", "pos": "n", "ipa": "/ˈhæbɪt/",
