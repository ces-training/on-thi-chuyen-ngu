<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi học sinh</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bộ nhận diện dùng chung cho mọi trang. Sửa ở đây rồi chạy build.py; không sửa trực tiếp trong trang đã dựng.
   Ý tưởng: sổ ô li xanh + huy hiệu vàng. Nền giấy kẻ ô, thanh đầu trang màu xanh đặc vụ, nút bấm nổi khối như phím,
   ô tiến độ 3 màu (chưa làm / làm dở / xong) luôn đi kèm chữ hoặc biểu tượng, không dùng màu đơn thuần. */
:root{
  --paper:#F2F5FC; --grid:#E1E7F4; --surface:#FFFFFF; --surface2:#EEF1FA;
  --ink:#151521; --ink-2:#4A4C53; --line:#D6DCEA; --line-strong:#B7BFD5;
  --agent:#2638C4; --agent-deep:#18248A; --agent-tint:#E8ECFF; --on-agent:#FFFFFF;
  --bar:#2638C4; --bar-ink:#FFFFFF; --bar-ink-2:rgba(255,255,255,.8); --bar-on:#FFFFFF; --bar-on-ink:#2638C4;
  --gold:#FCC539; --gold-deep:#C9961A; --gold-tint:#FFF4D1; --gold-ink:#3D2E00;
  --signal:#F8551A; --signal-text:#C8481A; --signal-tint:#FEE9E5;
  --good:#3C6D4A; --good-bg:#E3F7E3; --good-edge:#579F6C;
  --bad:#BE2626; --bad-bg:#FFEBEB;
  --warn:#8A5A00; --warn-bg:#FFF3D1;
  --t-none:#ECEDF1; --t-none-edge:#A3A5AE; --t-part:#FEE7AD; --t-part-edge:#E0A200; --t-done:#BCEBBB; --t-done-edge:#579F6C;
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-card:14px; --r-ctl:10px;
  /* tên cũ, giữ để mã cũ còn chạy */
  --bg:var(--paper); --muted:var(--ink-2); --accent:var(--agent); --accent-soft:var(--agent-tint);
  --hi:var(--gold); --hi-soft:var(--gold-tint); --hi-ink:var(--gold-ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12131F; --grid:#1A1C2C; --surface:#1E2030; --surface2:#272A3E;
  --ink:#EDEDEE; --ink-2:#B5B6C2; --line:#33364D; --line-strong:#4C5070;
  --agent:#8DA2FF; --agent-deep:#4C5BC4; --agent-tint:#25285A; --on-agent:#0E1030;
  --bar:#1B2170; --bar-ink:#FFFFFF; --bar-ink-2:rgba(255,255,255,.78); --bar-on:#EDEDEE; --bar-on-ink:#1B2170;
  --gold-deep:#9C7410; --gold-tint:#3A3015; --gold-ink:#FFE7A6;
  --signal-text:#FF8A5C; --signal-tint:#3A1E14;
  --good:#7CC48C; --good-bg:#17301F; --good-edge:#72BB82;
  --bad:#F98B8B; --bad-bg:#3A1A1C; --warn:#F0B65A; --warn-bg:#3A2C13;
  --t-none:#262939; --t-none-edge:#565A74; --t-part:#4D3D0E; --t-part-edge:#E0A200; --t-done:#1D4429; --t-done-edge:#72BB82;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12131F; --grid:#1A1C2C; --surface:#1E2030; --surface2:#272A3E;
  --ink:#EDEDEE; --ink-2:#B5B6C2; --line:#33364D; --line-strong:#4C5070;
  --agent:#8DA2FF; --agent-deep:#4C5BC4; --agent-tint:#25285A; --on-agent:#0E1030;
  --bar:#1B2170; --bar-ink:#FFFFFF; --bar-ink-2:rgba(255,255,255,.78); --bar-on:#EDEDEE; --bar-on-ink:#1B2170;
  --gold-deep:#9C7410; --gold-tint:#3A3015; --gold-ink:#FFE7A6;
  --signal-text:#FF8A5C; --signal-tint:#3A1E14;
  --good:#7CC48C; --good-bg:#17301F; --good-edge:#72BB82;
  --bad:#F98B8B; --bad-bg:#3A1A1C; --warn:#F0B65A; --warn-bg:#3A2C13;
  --t-none:#262939; --t-none-edge:#565A74; --t-part:#4D3D0E; --t-part-edge:#E0A200; --t-done:#1D4429; --t-done-edge:#72BB82;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-weight:800}
h2{font-size:1.75rem;font-weight:800}
h3{font-size:1.18rem;font-weight:700}
p{margin:0}
a{color:var(--agent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--agent);outline-offset:2px;border-radius:6px}

/* thanh đầu trang */
.hq{background:var(--bar);color:var(--bar-ink)}
.hq a{color:var(--bar-ink)}
.logo{display:inline-flex;flex:none;border-radius:50%;text-decoration:none}
.logo svg{display:block;width:46px;height:46px}

/* nút bấm: nổi khối, ấn xuống khi bấm */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:var(--r-ctl);padding:10px 20px;margin-bottom:4px;
  font-weight:700;cursor:pointer;text-decoration:none;background:var(--agent);color:var(--on-agent);box-shadow:0 4px 0 var(--agent-deep);
  transition:transform .12s ease-out,box-shadow .12s ease-out}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--agent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--agent-deep)}
.btn.hi{background:var(--gold);color:#151521;box-shadow:0 4px 0 var(--gold-deep)}
.btn.hi:hover{box-shadow:0 5px 0 var(--gold-deep)}.btn.hi:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line-strong),0 4px 0 var(--line-strong)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--agent),0 5px 0 var(--agent-deep)}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--agent),0 1px 0 var(--agent-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* mặt giấy, nhãn, con dấu */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--ink)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.hi{background:var(--gold-tint);color:var(--gold-ink)}
.stamp{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--good);border:2.5px solid currentColor;border-radius:8px;padding:2px 10px;transform:rotate(-6deg);opacity:.92}
.stamp.part{color:var(--warn)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.mono{font-family:var(--f-mono)}
.notice{background:var(--gold-tint);color:var(--gold-ink);border-radius:var(--r-ctl);padding:12px 14px;font-size:.92rem}

table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.82rem;font-weight:700;color:var(--ink-2);background:var(--surface2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Trang của cô: cùng bộ nhận diện nhưng tiết chế hơn; nền trơn, bảng rộng, màu chỉ dùng cho trạng thái. */
body{font-size:15px;background-image:none}
.hq .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hq .in b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;line-height:1.1}
.hq .in span{display:block;font-size:.84rem;color:var(--bar-ink-2)}
.hq .in .back.pv2{margin-left:14px}.hq .in .back{margin-left:auto;font-size:.88rem;font-weight:600;color:var(--bar-ink-2)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 64px}
h2{font-size:1.3rem;margin:0 0 8px}h3{font-size:1.05rem;margin:14px 0 6px}
.card{display:block;margin:14px 0;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line-strong);border-radius:var(--r-ctl);padding:8px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--agent);box-shadow:0 0 0 3px var(--agent-tint)}
textarea{width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:var(--r-ctl);padding:8px 16px;min-height:40px;margin-bottom:3px;background:var(--agent);color:var(--on-agent);cursor:pointer;box-shadow:0 3px 0 var(--agent-deep);transition:transform .12s ease-out,box-shadow .12s ease-out}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--agent-deep)}
button.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line-strong),0 3px 0 var(--line-strong)}
button.mini{padding:3px 10px;min-height:30px;font-size:.8rem}
button:disabled{opacity:.5;cursor:default;transform:none}
.tw{overflow-x:auto}
th,td{padding:9px 8px;vertical-align:top}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--agent-tint)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.item{border-left:5px solid var(--line-strong);padding:7px 11px;margin:6px 0;background:var(--surface2);border-radius:8px}
.item.bad{border-left-color:var(--bad)}.item.unk{border-left-color:var(--t-part-edge)}.item.ok{border-left-color:var(--good-edge)}
.imgs{display:flex;flex-wrap:wrap;gap:8px}.imgs img{max-width:100%;width:340px;border-radius:8px;border:2px solid var(--line)}
.msg{padding:9px 13px;border-radius:14px;background:var(--surface2);margin:6px 0;max-width:80%}
.msg.t{margin-left:auto;background:var(--gold-tint);color:var(--gold-ink)}
.err{color:var(--bad)}
.code{font-family:var(--f-mono);font-size:1.3rem;font-weight:700;letter-spacing:.08em;background:var(--gold-tint);color:var(--gold-ink);padding:2px 10px;border-radius:8px}
details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header class="hq"><div class="in">
<a class="logo" href="../" aria-label="Về trang Ôn thi chuyên ngữ"><img src="../assets/emoji/woman-teacher.webp" alt="" width="52" height="52"></a>
<div><b>Theo dõi học sinh</b><span>Kết quả web, bài giấy máy chấm và tin nhắn của các con</span></div>
<a class="back" href="../chuyen-anh-14-ngay/xem-truoc.html">Xem trước nội dung trang</a>
<a class="back pv2" href="../">Ôn thi chuyên ngữ</a>
</div></header>
<main>
<div id="app"></div>
</main>
<script>
(function(){
"use strict";
const API="";
const THEMES=[{"day": 1, "theme": "Trường học và việc học"}, {"day": 2, "theme": "Sở thích"}, {"day": 3, "theme": "Môi trường"}, {"day": 4, "theme": "Công nghệ"}, {"day": 5, "theme": "Sức khoẻ"}, {"day": 6, "theme": "Du lịch và đi lại"}, {"day": 7, "theme": "Vòng ôn 1 (buổi 1–6)"}, {"day": 8, "theme": "Truyền thông"}, {"day": 9, "theme": "Ẩm thực và văn hoá"}, {"day": 10, "theme": "Công việc và nghề nghiệp"}, {"day": 11, "theme": "Con người và các mối quan hệ"}, {"day": 12, "theme": "Khoa học và phát minh"}, {"day": 13, "theme": "Nghệ thuật và giải trí"}, {"day": 14, "theme": "Vòng ôn 2 (buổi 8–13, kèm ôn lại buổi 1–6)"}];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PIN='';try{PIN=sessionStorage.getItem('coPin')||''}catch(e){}
async function api(action,data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,pin:PIN},data||{}))});const j=await r.json();if(!j.ok){const e=new Error(j.error||'error');e.code=j.error;throw e}return j}
const pct=x=>x===''||x==null?'—':Math.round(Number(x)*100)+'%';
const when=t=>t?new Date(t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'—';
const LV={preA2:'Dưới A2'};const lv=k=>k?(LV[k]||k):'—';
const theme=d=>(THEMES.find(t=>t.day===Number(d))||{}).theme||'';

function vLogin(msg){
  if(!API){$('#app').innerHTML='<div class="card"><b>Chưa kết nối máy chủ.</b> Trang này cần địa chỉ Ứng dụng web của Google Apps Script (xem hướng dẫn cài đặt trong README của repo).</div>';return}
  $('#app').innerHTML=`<div class="card"><h2>Đăng nhập</h2><div class="row"><input type="password" id="pin" placeholder="Mã PIN của cô" autocomplete="current-password"><button id="go">Vào</button><span class="err small">${esc(msg||'')}</span></div></div>`;
  $('#go').onclick=async()=>{PIN=$('#pin').value.trim();try{await api('t_list');try{sessionStorage.setItem('coPin',PIN)}catch(e){}vList()}catch(e){vLogin(e.code==='bad_pin'?'Sai mã PIN.':'Chưa kết nối được máy chủ.')}};
  $('#pin').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
}

async function vList(){
  $('#app').innerHTML='<p class="muted">Đang tải…</p>';
  let r;try{r=await api('t_list')}catch(e){return vLogin(e.code==='bad_pin'?'Sai mã PIN.':'Chưa kết nối được máy chủ.')}
  const st=r.students.slice().sort((a,b)=>(b.unread+b.errors)-(a.unread+a.errors)||String(b.lastSeen).localeCompare(String(a.lastSeen)));
  $('#app').innerHTML=`<div class="card"><h2>Thêm học sinh</h2><div class="row"><input id="nm" placeholder="Họ tên học sinh" style="min-width:220px"><select id="gr">${[6,7,8,9].map(g=>`<option value="${g}" ${g===7?'selected':''}>Lớp ${g}</option>`).join('')}</select><button id="add">Cấp mã</button><span id="addMsg"></span></div><p class="small muted">Gửi mã cho học sinh; con nhập mã ở trang Bắt đầu.</p></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Học sinh (${st.length})</h2><button class="ghost" id="rf">Tải lại</button></div>
  <div class="tw"><table><thead><tr><th>Học sinh</th><th>Mã</th><th>Đầu vào → đầu ra</th><th class="n">Buổi web / giấy</th><th class="n">Đúng web</th><th class="n">Nhớ lại</th><th class="n">Bài giấy</th><th class="n">Hệ số</th><th>Học gần nhất</th><th>Cần xem</th></tr></thead>
  <tbody>${st.map(s=>`<tr class="click" data-code="${esc(s.code)}"><td><b>${esc(s.name)}</b><br><span class="small muted">Lớp ${esc(s.grade)}</span></td><td class="n">${esc(s.code)}</td><td>${lv(s.entryLevel)} → ${lv(s.finalLevel)}</td><td class="n">${s.daysWeb||0} / ${s.daysPaper||0}</td><td class="n">${pct(s.webAcc)}</td><td class="n">${pct(s.retryAcc)}</td><td class="n">${pct(s.paperAvg)}</td><td class="n">${s.eff||'—'}</td><td class="small">${when(s.lastSeen)}</td><td>${s.unread?`<span class="pill warn">${s.unread} tin nhắn</span> `:''}${s.errors?`<span class="pill bad">${s.errors} bài chưa chấm</span>`:''}</td></tr>`).join('')||'<tr><td colspan="10" class="muted">Chưa có học sinh. Thêm học sinh ở trên.</td></tr>'}</tbody></table></div></div>`;
  $('#rf').onclick=vList;
  document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>vStudent(tr.dataset.code));
  $('#add').onclick=async()=>{const name=$('#nm').value.trim();if(!name)return;$('#add').disabled=true;try{const a=await api('t_add',{name,grade:+$('#gr').value});$('#addMsg').innerHTML=`Mã của ${esc(name)}: <span class="code">${esc(a.code)}</span>`;setTimeout(vList,4000)}catch(e){$('#addMsg').textContent='Chưa thêm được.'}$('#add').disabled=false};
}

async function vStudent(code){
  $('#app').innerHTML='<p class="muted">Đang tải…</p>';
  let r;try{r=await api('t_student',{code})}catch(e){return vList()}
  const s=r.student,sum=r.summary||{},ups=r.uploads.slice().sort((a,b)=>a.day-b.day||(a.ts<b.ts?1:-1)),msgs=r.messages;
  const days=sum.days||{};
  const sk=sum.sk||{};const SK={vocab:'Từ vựng',grammar:'Ngữ pháp',wordform:'Cấu tạo từ',exam:'Dạng bài thi',reading:'Đọc hiểu',review:'Ôn xoắn ốc',retry:'Câu từng sai'};
  $('#app').innerHTML=`<p><button class="ghost" id="back">← Danh sách</button></p>
  <div class="card"><h2>${esc(s.name)} <span class="small muted">· Lớp ${esc(s.grade)} · mã ${esc(s.code)}</span></h2>
   <p>${sum.d?`<a class="btn" target="_blank" rel="noopener" href="../chuyen-anh-14-ngay/xem-truoc.html#bc=${encodeURIComponent('J'+btoa(unescape(encodeURIComponent(JSON.stringify(sum)))))}">Mở báo cáo thử 14 buổi (để tư vấn gia đình)</a>`:'<span class="small muted">Báo cáo thử 14 buổi mở khi con đã làm bài đầu vào.</span>'}</p>
   <div class="kpis"><div class="kpi"><span class="small muted">Đầu vào</span><b>${sum.d?esc(lv(sum.d.l))+' · '+sum.d.t+'/'+sum.d.o:'—'}</b></div><div class="kpi"><span class="small muted">Đầu ra</span><b>${sum.f?esc(lv(sum.f.l))+' · '+sum.f.t+'/'+sum.f.o:'—'}</b></div>
   <div class="kpi"><span class="small muted">Ngày học / số ngày</span><b>${sum.sd||0} / ${sum.sp||0}</b></div><div class="kpi"><span class="small muted">Câu từng sai làm lại đúng</span><b>${sum.rt&&sum.rt[1]?Math.round(100*sum.rt[0]/sum.rt[1])+'%':'—'}</b></div>
   <div class="kpi"><span class="small muted">Đã nhớ chắc</span><b>${sum.mq||0} câu</b></div><div class="kpi"><span class="small muted">Hệ số tốc độ</span><b>${sum.e||'—'}</b></div><div class="kpi"><span class="small muted">Mức học trên web</span><b>${({nen:'Nền tảng',chuan:'Chuẩn',nang:'Nâng cao'})[sum.tr]||'—'}</b></div><div class="kpi"><span class="small muted">Lịch đang chọn</span><b>${sum.p?sum.p.min+'′ × '+sum.p.dpw:'—'}</b></div><div class="kpi"><span class="small muted">Bài giấy (máy chấm)</span><b>${pct(s.paperAvg)}</b></div></div>
   <h3>Kỹ năng trên web</h3><div class="tw"><table><tbody>${Object.entries(sk).map(([k,v])=>`<tr><td>${esc(SK[k]||k)}</td><td class="n">${v[0]}/${v[1]}</td><td class="n">${v[1]?Math.round(100*v[0]/v[1])+'%':'—'}</td></tr>`).join('')||'<tr><td class="muted">Chưa có dữ liệu.</td></tr>'}</tbody></table></div>
   <h3>Từng buổi</h3><div class="tw"><table><thead><tr><th>Buổi</th><th>Chủ đề</th><th class="n">Game</th><th class="n">Dạng thi</th><th class="n">Nghe</th><th class="n">Kiểm tra cuối buổi</th><th class="n">Giấy</th><th>Ngày</th></tr></thead><tbody>${Object.entries(days).map(([d,v])=>`<tr><td>${d}</td><td>${esc(theme(d))}</td><td class="n">${v[6]?v[6]+' game · '+v[5]+'★':'—'}</td><td class="n">${v[7]!=null?v[7]+'/'+v[8]:'—'}</td><td class="n">${v[9]!=null?v[9]+'/'+v[10]:'—'}</td><td class="n">${v[0]!=null?v[0]+'/'+v[1]:'—'}</td><td class="n">${v[2]!=null?v[2]+'/'+v[3]:'—'}</td><td class="small">${when(v[4])}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Chưa có buổi nào.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h2>Bài giấy</h2>${ups.length?ups.map(upHTML).join(''):'<p class="muted">Chưa có bài giấy nào được gửi.</p>'}</div>
  <div class="card"><h2>Tin nhắn chung</h2><div id="gen">${msgs.filter(m=>!m.uploadId).map(mHTML).join('')||'<p class="small muted">Chưa có.</p>'}</div>
   <textarea id="rep" rows="3" placeholder="Nhắn cho ${esc(s.name)}…"></textarea><div class="row"><button id="send">Gửi</button><span id="sm" class="small"></span></div></div>`;
  $('#back').onclick=vList;
  $('#send').onclick=async()=>{const t=$('#rep').value.trim();if(!t)return;try{await api('t_reply',{code,text:t});vStudent(code)}catch(e){$('#sm').textContent='Chưa gửi được.'}};
  function upHTML(u){
    const R=u.result||{};const items=R.items||[];const th=msgs.filter(m=>m.uploadId===u.id);
    const st=u.status==='graded'?`<span class="pill good">${u.score}/${u.total}${R.writing?' · viết '+R.writing.score+'/10':''}</span>`:u.status==='error'?`<span class="pill bad">lỗi: ${esc(u.error)}</span>`:'<span class="pill warn">đang chấm</span>';
    const open=th.some(m=>m.from==='student')?' open':'';
    return `<details class="card" data-up="${esc(u.id)}"${open}><summary>Buổi ${u.day} · ${esc(theme(u.day))} · ${when(u.ts)} · ${st}${th.length?` · ${th.length} tin nhắn`:''}</summary>
     <div class="row" style="margin:10px 0"><button class="ghost mini" data-imgs="${esc((u.fileIds||[]).join(','))}">Xem ảnh bài làm (${(u.fileIds||[]).length})</button><button class="ghost mini" data-regrade="${esc(u.id)}">Chấm lại bằng máy</button></div><div class="imgs"></div>
     ${R.overall?`<p><b>Máy nhận xét:</b> ${esc(R.overall)}</p>`:''}
     ${items.map(it=>`<div class="item ${it.correct===true?'ok':it.correct===false?'bad':'unk'}"><b>${esc(it.label)}</b> ${esc(it.q)}<br><span class="small">Con viết: <b>${esc(it.read||'—')}</b> · Đáp án: <b>${esc(it.answer)}</b>${it.note?' · '+esc(it.note):''}${it.teacher?' · <i>cô đã sửa</i>':''}</span>
       <div class="row" style="margin-top:4px"><button class="mini ${it.correct===true?'':'ghost'}" data-ov="${esc(it.id)}" data-v="1">Đúng</button><button class="mini ${it.correct===false?'':'ghost'}" data-ov="${esc(it.id)}" data-v="0">Sai</button></div></div>`).join('')}
     ${R.writing?`<h3>Bài viết · ${R.writing.words} từ</h3><p class="small" style="white-space:pre-wrap">${esc(R.writing.read)}</p><p class="small"><b>Điểm tốt:</b> ${esc((R.writing.strengths||[]).join(' · '))}<br><b>Cần sửa:</b> ${esc((R.writing.improve||[]).join(' · '))}</p><div class="row">Điểm viết <input type="number" min="0" max="10" step="0.5" value="${R.writing.score}" data-ws style="width:80px"><button class="mini" data-wsave>Lưu</button></div>`:''}
     <h3>Nhận xét của cô</h3><textarea rows="2" data-tnote>${esc(u.teacherNote)}</textarea><div class="row"><button class="mini" data-nsave>Lưu nhận xét</button></div>
     <h3>Trao đổi về bài này</h3>${th.map(mHTML).join('')||'<p class="small muted">Chưa có.</p>'}
     <textarea rows="2" data-reply placeholder="Trả lời con…"></textarea><div class="row"><button class="mini" data-rsend>Gửi</button><span class="small" data-info></span></div></details>`;
  }
  document.querySelectorAll('details[data-up]').forEach(box=>{
    const id=box.dataset.up,info=box.querySelector('[data-info]');
    const run=async(fn)=>{info.textContent='Đang lưu…';try{await fn();vStudent(code)}catch(e){info.textContent='Chưa lưu được.'}};
    box.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>run(()=>api('t_override',{uploadId:id,itemId:b.dataset.ov,correct:b.dataset.v==='1'})));
    const ws=box.querySelector('[data-wsave]');if(ws)ws.onclick=()=>run(()=>api('t_override',{uploadId:id,writingScore:+box.querySelector('[data-ws]').value}));
    box.querySelector('[data-nsave]').onclick=()=>run(()=>api('t_override',{uploadId:id,teacherNote:box.querySelector('[data-tnote]').value}));
    box.querySelector('[data-rsend]').onclick=()=>{const t=box.querySelector('[data-reply]').value.trim();if(t)run(()=>api('t_reply',{code,uploadId:id,text:t}))};
    box.querySelector('[data-regrade]').onclick=()=>run(()=>api('t_regrade',{uploadId:id}));
    const ib=box.querySelector('[data-imgs]');ib.onclick=async()=>{ib.disabled=true;const ids=ib.dataset.imgs.split(',').filter(Boolean);const wrap=box.querySelector('.imgs');wrap.innerHTML='<span class="small muted">Đang tải ảnh…</span>';
      const imgs=[];for(const f of ids){try{const r=await api('t_image',{fileId:f});imgs.push(`<img src="data:${esc(r.mime)};base64,${r.data}" alt="Ảnh bài làm">`)}catch(e){imgs.push('<span class="err small">Không tải được ảnh.</span>')}}wrap.innerHTML=imgs.join('')};
  });
}
function mHTML(m){return `<div class="msg ${m.from==='teacher'?'t':''}"><span class="small muted">${m.from==='teacher'?'Cô':'Con'} · ${when(m.ts)}${m.itemId?' · câu '+esc(String(m.itemId).replace(/^d\d+/,'').replace(/^([A-Z]\d?)_?(\d+)$/,'$1.$2')):''}</span><div>${esc(m.text)}</div></div>`}

PIN?vList():vLogin();
})();
</script>
</body>
</html>
